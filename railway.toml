[build]
# ★2026-09-25 — DOCKERFILE, for dchub-backend (web) AND dchub-worker (both read
# this file). Under Railpack the venv was built against mise's python in the
# build image while the runtime image shipped its own; when their patch
# versions drifted the worker crashlooped (#3222 on 08-26, #5544 on 09-24).
# Dockerfile.web uses one image for both stages, so that cannot happen.
#
# The file is deliberately NOT named `Dockerfile` (Railway would auto-detect it
# for every root service); dockerfilePath is what selects it.
#
# ★ ROLLBACK: delete these two lines and restore
#   [build.variables]
#   MISE_PYTHON_GITHUB_ATTESTATIONS = "false"
# (a Railpack/mise-only setting, dropped here because Docker never runs mise).
# The next deploy is Railpack again; start_web.sh runs under either builder.
#
# VERIFY BY THE BUILD LOG, not get-service-config: the dashboard keeps saying
# RAILPACK (config-as-code never writes back; see railway-extractor.toml). A
# Docker build shows `FROM python:3.13.15-slim` stages, not `mise python@...`.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"

[deploy]
numReplicas = 2  # r-2026-07-15: web tier MUST run >=2 replicas (single-replica outage). Config-as-code overrides the dashboard so this can't silently drift to 1.
startCommand = "bash start_web.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 900
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
