# Railway Nixpacks build config for DC Hub backend.
#
# Why this file exists:
#   The Market Brief PDF export uses WeasyPrint (2026-06-06 ship), which
#   needs native C libraries (Pango/Cairo) at runtime. Nixpacks doesn't
#   auto-detect these from requirements.txt alone — we have to declare them
#   explicitly via aptPkgs. Without this, /markets/<slug>/brief.pdf returns
#   500 with "cannot import 'gi' / 'cairo' / 'pango'".
#
# Affected endpoint:
#   GET /markets/<slug>/brief.pdf  (PRO+ gated)

[phases.setup]
# WeasyPrint native stack (Pango/Cairo/GLib) for the PDF exports
# (/markets/<slug>/brief.pdf and /api/v1/site-report?...&format=pdf).
#
# FINDING (2026-06-07): the runtime container exposes NEITHER /nix/store NOR
# these libs under /usr/lib/x86_64-linux-gnu (confirmed by the site-report PDF
# 503 _diag: nix_store=absent, libgobject_paths=[]). i.e. nixpacks is not
# carrying the native libs into the slim runtime image. start_web.sh prepends
# every /nix/store lib dir AND /usr/lib/x86_64-linux-gnu to LD_LIBRARY_PATH, so
# the moment the libs DO land in the image (next clean rebuild, or a Dockerfile
# builder) PDF starts working with no further code change. We declare them both
# ways below so whichever runtime nixpacks produces has the libs available.
# If PDF must work reliably, the durable fix is a Dockerfile builder (full
# control of the runtime image) — tracked as a follow-up.
nixPkgs = [
  "glib", "pango", "cairo", "harfbuzz", "fontconfig", "libffi",
]
aptPkgs = [
  "libpango-1.0-0", "libpangocairo-1.0-0", "libpangoft2-1.0-0",
  "libcairo2", "libgdk-pixbuf-2.0-0", "libglib2.0-0", "libffi8",
  "shared-mime-info", "fonts-liberation",
]
