# Railway Nixpacks build config for DC Hub backend.
#
# Why this file exists:
#   The Market Brief PDF export uses WeasyPrint (2026-06-06 ship), which
#   needs native C libraries (Pango/Cairo) at runtime. Nixpacks doesn't
#   auto-detect these from requirements.txt alone — we have to declare them
#   explicitly via aptPkgs. Without this, /markets/<slug>/brief.pdf returns
#   500 with "cannot import 'gi' / 'cairo' / 'pango'".
#
# Affected endpoint:
#   GET /markets/<slug>/brief.pdf  (PRO+ gated)

[phases.setup]
# WeasyPrint's native stack must come from NIX packages, not apt. Nixpacks
# builds on a Nix base whose dynamic loader searches the Nix store — it does
# NOT search /usr/lib/x86_64-linux-gnu where apt installs, so apt-provided
# libpango/cairo/glib are present-but-unloadable (ctypes:
# "cannot load library 'libgobject-2.0-0'"). nixPkgs land in /nix/store and
# nixpacks wires their lib dirs into the runtime env, so the loader finds them.
nixPkgs = [
  "glib",        # libgobject-2.0 / libglib-2.0 / libgio-2.0  (the missing one)
  "pango",       # libpango-1.0 / libpangocairo-1.0 / libpangoft2-1.0
  "cairo",       # libcairo
  "harfbuzz",    # libharfbuzz (text shaping)
  "fontconfig",  # libfontconfig (font discovery)
  "libffi",      # libffi (cffi/ctypes bridge weasyprint uses)
]
aptPkgs = [
  # Fonts + MIME data only (no native .so that would ABI-clash with the Nix
  # libs above). fonts-liberation gives a sane serif/sans fallback in the PDF.
  "shared-mime-info",
  "fonts-liberation",
]
