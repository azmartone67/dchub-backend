[build]
# ★2026-09-08 — DOCKERFILE, to delete the failure class rather than survive it.
#
# Under RAILPACK the interpreter is materialised by mise at CONTAINER START, and
# twice (8c643bec 09-06, 7dfd3fe1 09-08) a container started mid-reinstall and
# ran the job against a bare interpreter. The startCommand below now survives
# that; this makes it unreachable — Dockerfile.extractor bakes the interpreter
# and every package into image layers, so there is nothing to install at start.
#
# ★ dockerfilePath is REQUIRED here, and the file is deliberately NOT named
# `Dockerfile`. Railway: "Railway will always build with a Dockerfile if it
# finds one." dchub-backend (web) and dchub-worker both build from the ROOT of
# this repo on RAILPACK, so a root-level `Dockerfile` would switch their builder
# too. The suffixed name is not auto-detected, which scopes this to one service.
#
# ★ ROLLBACK is this block alone: delete it and the next deploy is Railpack
# again, with the startCommand unchanged and still correct under either builder.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.extractor"

[deploy]
# ★2026-09-08 — SECOND occurrence of the same start-time crash, and the guard
# written for the FIRST one was live when it happened.
#
# THE FLAKE. Railpack builds this service as `python -m venv /app/.venv` ->
# `pip install -r requirements.txt` -> copy `/app/.venv` into the runtime
# image, so every third-party package lives in that venv and nowhere else.
# Occasionally a container starts with mise re-installing the interpreter from
# scratch — `mise python@3.13.14 [1/3] install / download / verify GitHub
# artifact attestations / extract` — and the job then runs against that bare
# interpreter, which has never seen a `pip install`.
#
#   2026-09-06  deployment 8c643bec   ModuleNotFoundError: No module named 'flask'
#   2026-09-08  deployment 7dfd3fe1   ModuleNotFoundError: No module named 'flask'
#
# Measured on 7dfd3fe1: container start 17:45:19.292Z, mise install 17:45:19.957
# -> 17:45:22.607 (3.3s, of which ~2.3s was attestation verification), traceback
# 17:45:22.902. The SAME commit (ddd763bf) redeployed 9 minutes later as
# a2cf5c94 and has run clean every 5 minutes since; healthy containers show NO
# mise lines between "Starting Container" and "INFO Starting | model=...".
# The mise-install-at-start IS the differentiator, confirmed on both dates.
#
# ★ WHY #4046/#4050's GUARD DID NOT FIRE. It shipped
#     P="${VIRTUAL_ENV:-/app/.venv}/bin/python"; [ -x "$P" ] || P=python3
# and `get-service-config` confirms that exact string was LIVE on 09-08 — so
# the open question in the previous version of this comment ("it is not
# established that this file's startCommand reaches the container at all") is
# now answered: it does. The guard is simply inverted for the one failure it
# exists for. `/app/.venv/bin/python` is a symlink into the mise-managed
# interpreter tree and `test -x` FOLLOWS symlinks, so in the exact scenario
# where mise has not yet materialised that tree the symlink dangles, the test
# goes false, and the fallback selects `python3` — precisely the bare
# interpreter with no site-packages. Whichever branch ran on 09-08, the
# command could not have survived: the venv branch crashes because the
# interpreter is broken, and the fallback branch crashes because it is bare.
# It also printed nothing about which branch it took, so the crash log cannot
# distinguish them. That is why the replacement is loud.
#
# ★ THE REPLACEMENT. Probe the PROPERTY that has to hold — "this interpreter
# can import our third-party deps" — instead of `-x`, which is a proxy for it
# and, as above, the wrong proxy. Retry across the ~3.3s mise window; on
# 7dfd3fe1 the interpreter became usable 0.3s BEFORE the traceback, so one
# 3s retry would have turned that crash into a completed run. Then fail loudly
# rather than falling back: there is no second interpreter on this container
# that has the packages, so a fallback can only reproduce the crash with a
# worse error. `psycopg2, anthropic` are the probe because they are what the
# cron actually needs — flask is no longer in its import graph at all as of
# this PR, and was only ever the first non-stdlib name the chain reached.
#
# VERIFIED LOCALLY, all four branches, against this exact string:
#   healthy venv                 -> runs immediately, exec passes args through
#   venv path missing            -> 5 tries, FATAL, exit 1, NO python3 fallback
#   interpreter present but bare -> 5 tries, FATAL, exit 1, NO python3 fallback
#   deps land on try 3           -> recovers and runs   <- the flake case
#
# ★★★ HOW TO VERIFY — AND THE CRITERION THAT IS A TRAP.
#
# `get-service-config` DOES NOT and WILL NOT report this string, and that is not
# a lag or a bug. Railway's config-as-code docs: "Configuration defined in code
# will always override values from the dashboard", but "The settings in the
# dashboard will not be updated with the settings defined in code" — the file
# wins per-deployment and never writes back. get-service-config reads the
# DASHBOARD settings, so it shows a startCommand this service has not run for
# some time. Measured 2026-09-08: 45+ minutes after deployment 3cea948b went
# SUCCESS on the new command, that API still returned the previous one while the
# container was demonstrably running the new one. The same is true of `builder`,
# which will keep saying RAILPACK after the Dockerfile switch above.
#
# An earlier version of this comment said the opposite, and #4046/#4050 reasoned
# FROM that mistake: seeing a stale value, its author concluded "it is not
# established that this file's startCommand reaches the container at all" and
# wrote a `|| P=python3` fallback to be safe under either reading — a fallback
# that then selected the exact bare interpreter that crashes. A misread control
# plane produced a defensive design that reproduced the bug.
#
# VERIFY BY WHAT THE RUNNING CODE EMITS:
#   start command — a firing logs "[extractor] interpreter=/app/.venv/bin/python"
#                   (confirmed live 2026-09-08 20:15:19Z on deployment 3cea948b)
#   builder       — the BUILD log shows Docker stages, not `mise python@... install`
#
# And note the flake itself stays unproven either way: at ~1 crash per 40
# firings no green deploy is evidence. The next crash, if the class survives,
# will at least say which interpreter it chose and why it refused.
#
# ★ EXPIRY: this whole file is legacy. Railway has deprecated config-as-code in
# favour of Infrastructure as Code and keeps these files working for existing
# services only until 2026-12-01. Migrate before then or these settings — cron
# schedule, restart policy, builder and start command alike — silently revert to
# whatever the dashboard holds, which is the stale command described above.
startCommand = "sh -c 'P=\"${VIRTUAL_ENV:-/app/.venv}/bin/python\"; i=0; until \"$P\" -c \"import psycopg2, anthropic\" 2>/dev/null; do i=$((i+1)); if [ \"$i\" -ge 5 ]; then echo \"[extractor] FATAL: psycopg2/anthropic still unimportable via $P after ${i} tries; refusing to fall back to a bare interpreter\"; exit 1; fi; echo \"[extractor] deps unimportable via $P (try $i) - waiting for the runtime to settle\"; sleep 3; done; echo \"[extractor] interpreter=$P\"; exec \"$P\" extractor_cron.py --limit 50'"
restartPolicyType = "NEVER"

# No healthcheck for cron jobs — they run, exit, done.
# No restartPolicyMaxRetries — cron failures should just wait for next scheduled run.
