[deploy]
# ★2026-09-06: run the venv interpreter by PATH-independent absolute path, not
# `python3`. Railpack builds this service as `python -m venv /app/.venv` →
# `pip install -r requirements.txt` → `copy /app/.venv` into the runtime image,
# so EVERY third-party package lives in that venv and nowhere else.
#
# On deployment 8c643bec (2026-09-06T23:05Z) the container ran
# `mise python@3.13.14 [1/3] install / download / verify GitHub artifact
# attestations` at START and the cron then executed against that freshly
# installed bare interpreter instead of /app/.venv. Nothing third-party was
# importable, and the run died at extractor_cron.py:14 with
# `ModuleNotFoundError: No module named 'flask'` — flask only because lines
# 1-13 are pure stdlib and line 14 is the first import that leaves it. The next
# one would have been `import psycopg2` at line 159. The dependency set was
# never the problem: requirements.txt:5 pins Flask==3.0.0 and that same
# deployment's build log says "Successfully installed ... Flask-3.0.0 ...".
#
# Rate: 1 crash in 41 firings over 20:01-23:25 that day, and it was the ONLY
# container of 7 deployments sampled that ran mise-install-at-start. The other
# 40 firings succeeded, including real work at 21:35:32
# ("read=7 | capacity=1 | deals=3"), so this is a start-time flake, not a
# broken service.
#
# ★ FALLBACK, NOT A BARE PIN. #4046 shipped a bare `/app/.venv/bin/python`.
# After it deployed SUCCESS (582c0ba4) `get-service-config` still reported the
# OLD `python3 extractor_cron.py --limit 50`, so it is not established that this
# file's startCommand reaches the container at all — the service may carry a
# dashboard-level override that wins. Until both agree, this form is written so
# it CANNOT be worse than the status quo under either reading: it prefers the
# venv interpreter and falls back to exactly the old `python3` when that path is
# missing or not executable.
#
# Verified locally, all four branches: VIRTUAL_ENV set+executable -> venv python;
# unset with no /app/.venv -> python3; set but not executable -> python3; and
# `exec` replaces the shell (a trailing echo after the command does not run).
#
# NOT VERIFIED IN PRODUCTION: at 1-in-41, no green deploy can demonstrate the
# flake is gone. Confirm the switch instead — `get-service-config` must report
# THIS string, and a firing must log its "Done |" line.
startCommand = "sh -c 'P=\"${VIRTUAL_ENV:-/app/.venv}/bin/python\"; [ -x \"$P\" ] || P=python3; exec \"$P\" extractor_cron.py --limit 50'"
restartPolicyType = "NEVER"

# No healthcheck for cron jobs — they run, exit, done.
# No restartPolicyMaxRetries — cron failures should just wait for next scheduled run.
