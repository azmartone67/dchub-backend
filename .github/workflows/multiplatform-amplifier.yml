name: Substack mirror (sweep after each LinkedIn slot)

# 2026-09-20. Fires routes/multiplatform_amplifier auto-sweep so every
# LinkedIn post reaches https://dchubcloud.substack.com.
#
# ★ WHY A WORKFLOW AND NOT THE IN-PROCESS SCHEDULER.
# Measured on prod 2026-09-20: multiplatform_amplifier_log held ZERO rows
# ALL TIME — the lane has never once produced an amplification since it was
# built on 2026-06-07, while linkedin_posts took 36 successful posts in the
# preceding 14 days. Everything downstream was healthy when checked:
# the blueprint is registered (GET /api/v1/admin/multiplatform/log -> 200
# {"count":0,"rows":[]}), admin auth works, the kill switch and dry-run are
# unset, and the Bluesky/Mastodon credentials are present. The cron leg
# simply never reaches the endpoint. Same conclusion, same remedy as
# linkedin-quad-daily.yml, whose own header records that
# routes/linkedin_quad_daily.py "shipped in r40 with full posting logic" and
# then sat dormant because "no cron ever fired it".
#
# ★ WHY FOUR SLOTS AND NOT ONE.
# Production runs CRAWLER_SCHEDULE=once, and crawler_scheduler._should_run_now
# then evaluates `target_hours = [hour1]` — hour2 is dropped outright. The
# amplifier's SCHEDULE entry is (15, 3), so only 15 UTC was ever a target and
# the 03 UTC leg could not fire. PR #4327 sized the 13h lookback as "the 12h
# gap between the 15 and 03 slots plus an hour of margin", which is false on
# the deployed config where the real gap is 24h. Measured posted_at hours over
# 14 days: 16 of 36 posts (44%) landed in the resulting 16:00-02:00 blind
# spot, including the 16 and 20 UTC quad slots. Sweeping right after each
# LinkedIn slot makes the lookback a recovery margin rather than the
# mechanism, so no future retune of that number can reopen the gap.
#
# ★ SCOPED TO SUBSTACK ON PURPOSE (owner decision, 2026-09-20).
# `platforms=substack` — Bluesky, Mastodon and HN have been dark for 3.5
# months and restarting two public accounts is its own decision, not a side
# effect of turning the Substack mirror on. Drop the parameter to fan out to
# all five.
#
# Idempotent: multiplatform_amplifier_log carries
# UNIQUE(source_post_id, target_platform) and _already_amplified() skips
# anything already posted, so a re-run or an overlapping slot no-ops.
# Bounded: LIMIT 10 per sweep and MULTIPLATFORM_AMPLIFIER_DAILY_CAP (8).
#
# Inert until SUBSTACK_SID is set on Railway — post_to_substack returns
# no_substack_session and the sweep records nothing.

on:
  schedule:
    # LinkedIn publishes at :05 of 08/12/16/20 UTC (linkedin-quad-daily.yml).
    # :21 leaves 16 minutes for that post to land and write its linkedin_posts
    # row before we look for it.
    # ★ The minute is :21, not :20, because '20 8 * * *' already belongs to
    # brain-stuck-drain.yml and tests/test_ops_cron_stagger_0902.py refuses two
    # backend workflows sharing one cron expression. :21 is free at all four
    # hours (checked against all 197 cron expressions in .github/workflows).
    - cron: '21 8 * * *'
    - cron: '21 12 * * *'
    - cron: '21 16 * * *'
    - cron: '21 20 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'comma-separated targets (default substack; empty string = all five)'
        required: false
        default: 'substack'

permissions:
  contents: read

env:
  BASE: https://dchub-backend-production.up.railway.app

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sweep recent LinkedIn posts to Substack
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          PLATFORMS: ${{ github.event.inputs.platforms == null && 'substack' || github.event.inputs.platforms }}
        run: |
          set -euo pipefail
          url="$BASE/api/v1/admin/multiplatform/auto-sweep"
          if [ -n "${PLATFORMS:-}" ]; then
            url="$url?platforms=$PLATFORMS"
          fi
          echo "sweep -> $url (hour: $(date -u +%H) UTC)"
          http=$(curl -sS --max-time 180 -X POST \
            -H "X-Admin-Key: ${ADMIN_KEY:-anon}" \
            -o /tmp/sweep.json -w "%{http_code}" "$url" || echo "000")
          body=$(cat /tmp/sweep.json 2>/dev/null || echo '{}')
          echo "HTTP $http"
          echo "$body" | python3 -m json.tool 2>/dev/null || echo "$body"

          # A non-2xx is a real failure: the endpoint is admin-gated and always
          # returns JSON, so 401/404/5xx means the trigger is broken, which is
          # exactly the silence this workflow exists to end.
          case "$http" in
            2*) ;;
            *) echo "::error::auto-sweep returned HTTP $http"; exit 1 ;;
          esac

          # swept=0 is legitimate (nothing new in the window) — do NOT fail on
          # it. But surface it, because a run of zeroes across every slot is
          # the signature of the defect this replaced.
          python3 - "$body" <<'PY'
          import json, os, sys
          try:
              d = json.loads(sys.argv[1] or "{}")
          except Exception:
              print("::warning::auto-sweep response was not JSON")
              sys.exit(0)
          swept = d.get("swept", 0)
          amplified = d.get("amplified", 0)
          errors = d.get("errors") or []
          print(f"swept={swept} amplified={amplified} platforms={d.get('platforms')}")
          for r in (d.get("results") or []):
              sub = ((r.get("result") or {}).get("results") or {}).get("substack") or {}
              if sub:
                  print(f"  post {r.get('source_post_id')}: "
                        f"{sub.get('status')} {sub.get('url') or sub.get('error')}")
          if errors:
              print(f"::warning::auto-sweep errors: {errors}")
          if swept == 0:
              print("::notice::swept=0 — no unamplified LinkedIn post in the window")
          PY
