# Daily Stripe usage reporting for usage-based (metered) customers.
# Owner-approved 2026-06-12. Bills ONLY keys in metered_keys (customers who
# explicitly purchased the $1/100-calls product) — flat-tier keys are never
# touched by this job. The endpoint is delta-based (mcp_call_log since
# last_reported_at per key), idempotent, and a safe no-op with no metered
# keys or no new usage.
name: metered-usage-report

on:
  schedule:
    - cron: '19 6 * * *'   # daily 06:17 UTC
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report metered usage to Stripe
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping"
            exit 0
          fi
          http=$(curl -sS --max-time 120 -X POST \
            "https://dchub-backend-production.up.railway.app/api/v1/billing/report-to-stripe?dry_run=0" \
            -H "X-Admin-Key: ${ADMIN_KEY}" \
            -o /tmp/report.json -w '%{http_code}')
          echo "HTTP ${http}"
          cat /tmp/report.json
          if [ "${http}" != "200" ]; then
            echo "::error::report-to-stripe returned ${http}"
            exit 1
          fi
