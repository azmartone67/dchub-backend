name: DC Hub Data Sync

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
    - cron: '30 */3 * * *'
  workflow_dispatch:

# ★ 2026-08-10: both "Notify on workflow failure" steps below died with
#   GraphQL: Resource not accessible by integration (createIssue)
# on every failure — observed on run 31387608093. The repo's
# default_workflow_permissions is "read", and `|| true` on the gh call
# swallowed the refusal, so a workflow that failed 23 of its last 40 runs filed
# exactly ZERO issues. The alarm looked wired and was not.
# Declaring ANY permission resets the rest to none, so the read scopes these
# jobs actually use (checkout, `gh run`/`gh api` against Actions) are listed
# explicitly rather than inherited.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  keep-alive-and-news:
    runs-on: ubuntu-latest
    # 5 was sized for one POST that could not outlive --max-time 180. The
    # news-refresh step can now spend up to 300s on the POST plus 5 min
    # polling the worker watermark — 5 would cancel the job mid-poll.
    timeout-minutes: 20
    steps:
      # ★ 2026-08-06 — this step reported SUCCESS for 147 hours while the news
      # refresh 401'd on every single run, and the news feed went 49h stale
      # against a 24h SLA. Three separate things conspired:
      #
      #   1. NO AUTH. /api/jobs/news-refresh requires the admin key
      #      (routes/jobs_routes.py::_require_admin_key — X-Admin-Key,
      #      X-API-Key or ?admin_key=). This call sent none and got
      #      {"error": "authentication failed. Check DCHUB_ADMIN_KEY"}.
      #   2. `|| echo "News refresh timed out"` SWALLOWED IT. curl -f exits
      #      non-zero on 401, the `||` branch ran, the step exited 0, the
      #      workflow went green. The message is also a LIE: it printed
      #      0.7s into a call with --max-time 60. It never timed out; it was
      #      rejected instantly.
      #   3. NOBODY WAS LOOKING, because the workflow was green.
      #
      # ★ THIS EXACT BUG WAS ALREADY FIXED ONCE IN THIS FILE. See the r80
      #   comment on the "Evolution and auto-approve" step below, 2026-06-04:
      #   "this step was firing bare curls -> 401 every run while the workflow
      #   stayed green, so the evolution engine + staged-facility auto-approval
      #   never ran." The same defect was left in place two steps above it.
      #   That is why this step now FAILS LOUDLY instead of echoing a reassuring
      #   sentence — the `if: failure()` step below files a GitHub issue, so a
      #   red run reaches a human the way 147h of green did not.
      #
      # keep-alive stays unauthenticated on purpose: jobs_routes.py exempts
      # 'status' and 'keep-alive' from the admin gate.
      - name: Keep alive and News refresh
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          set -uo pipefail
          # ★ HOST MATTERS AS MUCH AS THE HEADER. This was
          # dchub-api-production.up.railway.app — a DIFFERENT Railway service
          # whose DCHUB_ADMIN_KEY does not match this repo's secret. Proven with
          # one key against both hosts: dchub-backend-production -> 200,
          # dchub-api-production -> 401. So even after the header was added the
          # call still 401'd. RAILWAY_BACKEND_URL is the secret dchub-jobs.yml
          # uses for the same endpoints, and those calls return 200.
          RAILWAY="${BACKEND_URL:-https://dchub-backend-production.up.railway.app}"
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY secret not set — news-refresh would 401 silently"; exit 1
          fi
          echo "Keep-alive ping..."
          curl -sf "$RAILWAY/api/jobs/keep-alive" | head -1 || echo "::warning::Keep-alive failed"
          echo ""
          echo "News/deals refresh..."
          # ★ 2026-08-19: --max-time was 180 — EXACTLY the relay read budget.
          # /api/jobs/news-refresh is in main.py's _WORKER_PROXY_SYNC_PATHS, so
          # web relays it to dchub-worker on a 180s budget
          # (`_read_budget = 180 if request.path in _WORKER_PROXY_SYNC_PATHS
          # else 15`) and answers honestly when the sync outlives it:
          #
          #   {"success": true, "delegated_to": "worker",
          #    "completed": false, "note": "job still running on dchub-worker"}
          #
          # With curl capped at the same 180s the 202 arrived only AFTER curl
          # had already given up: this step could not observe the very status
          # it needed. It saw 000 instead and reported "the loop did NOT run"
          # about a sync running normally on the worker — the same false RED
          # that flipped brain-autonomy on the public board (#2929). The
          # handler's own comment puts this sync at 90-150s, so it sits right
          # on the edge of that budget. Same defect L16 and layer5 had.
          #
          # 300 exceeds the budget, so the 202 can always arrive. And a 202 is
          # now polled rather than failed: it means delegated-and-running.
          #
          # The watermark is cron_last_run.last_completed_at, via
          # /api/jobs/last-run. NOT /api/jobs/status — that one reports
          # _scheduler_registry, a module-level dict with one copy per
          # service, and the sync advances the WORKER's copy. last_completed_at
          # is stamped by jobs_bp's after_request ONLY for a request that
          # actually ran a handler (g._jobs_admin_authed), so a 202 relay —
          # which short-circuits in before_request — leaves no trace, and the
          # value therefore means "the worker FINISHED", not "web handed it
          # off". Origin-direct on purpose: CF Rule #3 caches /api/v1/* and
          # a cached watermark could never move.
          read_news_watermark() {
            local code
            code=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
              -o /tmp/news-wm.json -w '%{http_code}' \
              "$RAILWAY/api/jobs/last-run?job=news-refresh") || code="000"
            if [ "$code" != "200" ]; then
              echo "::warning::/api/jobs/last-run returned HTTP $code — watermark UNKNOWN for this read" >&2
              return 0
            fi
            python3 -c "import sys,json;print(((json.load(sys.stdin).get('jobs') or {}).get('news-refresh') or {}).get('last_completed_at') or '')" \
              < /tmp/news-wm.json 2>/dev/null || true
          }
          BEFORE=$(read_news_watermark)
          echo "pre-run news-refresh last_completed_at=${BEFORE:-<none>}"
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          echo "post sent at $START"
          CODE=$(curl -sS --max-time 300 -o /tmp/news.json -w '%{http_code}' \
            -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            "$RAILWAY/api/jobs/news-refresh" || echo 000)
          echo "HTTP $CODE"
          head -c 600 /tmp/news.json; echo
          if [ "$CODE" = "202" ]; then
            echo "::notice::news-refresh delegated to dchub-worker (202) — polling /api/jobs/last-run for the completion watermark"
            ADVANCED=0
            for i in $(seq 1 10); do
              sleep 30
              AFTER=$(read_news_watermark)
              echo "poll $i/10 last_completed_at=${AFTER:-<none>}"
              # A moved watermark is the signal. With no BEFORE (the pre-run
              # read failed) "moved" is unknowable, so fall back to "stamped
              # after we sent the POST" — otherwise the PREVIOUS sync's
              # timestamp, hours old, would pass as this one's completion.
              ADV_THIS=0
              if [ -n "$AFTER" ]; then
                if [ -n "$BEFORE" ]; then
                  if [ "$AFTER" != "$BEFORE" ]; then ADV_THIS=1; fi
                elif [ "$AFTER" \> "$START" ]; then
                  ADV_THIS=1
                else
                  echo "poll $i/10 last_completed_at predates this run — stale, not this sync"
                fi
              fi
              if [ "$ADV_THIS" = "1" ]; then
                ADVANCED=1
                echo "::notice::news-refresh completed on the worker (last_completed_at ${BEFORE:-<none>} -> $AFTER)"
                break
              fi
            done
            if [ "$ADVANCED" != "1" ]; then
              echo "::error::news-refresh was delegated (202) but cron_last_run.last_completed_at never advanced in 5 min — the sync did NOT complete"
              exit 1
            fi
            # The 202 carries no new_articles and none is invented here.
            # Absence of a counter is UNKNOWN, never zero.
            echo "::notice::news-refresh: new_articles UNKNOWN (a relayed 202 carries none) — completion judged by the cron_last_run watermark"
            exit 0
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::news-refresh returned HTTP $CODE — the news feed is the lead supply for /press and the media desk. NOT a timeout; read the body above."
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/news.json'));print('success=',d.get('success'),'new_articles=',d.get('new_articles'),'result=',str(d.get('result',''))[:200])"

      - name: Notify on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R azmartone67/dchub-backend \
            --title "[workflow-failed] ${{ github.workflow }} on $(date -u +%Y-%m-%d_%H:%M)" \
            --body "Workflow run ${{ github.run_id }} failed. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label workflow-failure || true
  sync-infrastructure:
    if: github.event.schedule == '0 0,6,12,18 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 15 was already tight (step 0 sleeps 90s, the energy-discovery loop walks
    # 23 markets with a 3s pause each). The KMZ and evolution steps can now
    # each spend up to 5 min polling the worker watermark on top of that.
    timeout-minutes: 30
    steps:
      - name: Fire async loaders (phase 12g — non-blocking)
        run: |
          RAILWAY="https://dchub-backend-production.up.railway.app"
          INTERNAL_KEY="${{ secrets.DCHUB_INTERNAL_KEY }}"
          if [ -z "$INTERNAL_KEY" ]; then
            echo "::error::DCHUB_INTERNAL_KEY secret not set — refusing public fallback"; exit 1
          fi
          echo "Step 0/4: Firing async loaders..."
          for endpoint in load-substations-live load-power-plants-live load-pipelines-live load-facilities-live load-energy-discovery-live; do
            echo "  → $endpoint"
            curl -sS --max-time 15 -X POST "$RAILWAY/api/admin/$endpoint" \
              -H "X-Internal-Key: $INTERNAL_KEY" \
              -H "Content-Type: application/json" \
              | python3 -m json.tool || echo "    (non-JSON response — see Railway logs)"
            echo ""
          done
          echo "Sleeping 90s while loaders run in background..."
          sleep 90
          echo ""
          echo "Final loader status:"
          curl -sS --max-time 10 "$RAILWAY/api/admin/loader-status" \
            -H "X-Internal-Key: $INTERNAL_KEY" \
            | python3 -m json.tool || echo "(status endpoint unreachable)"

      - name: Infrastructure discovery
        env:
          INTERNAL_KEY: ${{ secrets.DCHUB_INTERNAL_KEY }}
        run: |
          RAILWAY="https://dchub-backend-production.up.railway.app"
          echo "Starting infrastructure sync at $(date -u)"
          echo ""
          echo "Step 1/4: Infrastructure discovery (fiber, substations, gas)..."
          curl -sf --max-time 90 -X POST -H "X-Internal-Key: $INTERNAL_KEY" "$RAILWAY/api/infrastructure/sync" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print('Success:', d.get('success','?'))" 2>/dev/null || echo "Infrastructure sync timed out"
          sleep 5

      # SH52-051 (2026-08-08): this step killed the whole job on market #1 and
      # had done so on EVERY run — steps 3/4 below have not executed since.
      #
      # Three defects, all in the six lines it used to be:
      #   1. NO AUTH. The bare curl hits the tier gate in before_request and
      #      gets 402 "claim_free_key" — our own ingestion workflow bounced off
      #      our own paywall. Same class as the 2026-07-31 radar incident where
      #      the gate 402'd its own loopback, and as r86f above.
      #   2. `curl -sf` exits 22 on that 402, and the job shell is `bash -e`,
      #      so the step DIED on the first market. The `if [ $? -eq 0 ]` /
      #      `else FAIL` handling below it was unreachable dead code — it can
      #      never run, because -e aborts before $? is ever read. The log shows
      #      "Energy discovery (23 markets)..." then exit 22: 0 of 23 ran.
      #   3. No `|| true`. Every other step in this job has one, which is why
      #      this was the only step that could take the job down with it.
      #
      # This step is a pure READ (SELECT ... FROM power_plants_eia) — it
      # verifies, it does not ingest. The ingestion is step 0's async loaders.
      # So it must NEVER be able to fail the job: a verification step that
      # blocks the work it verifies is strictly worse than no verification.
      # `set +e` + explicit exit 0 make that structural, not incidental.
      - name: Energy discovery per market
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set +e
          RAILWAY="https://dchub-backend-production.up.railway.app"
          echo "Step 2/4: Energy discovery (23 markets)..."
          # Canonical MONITORED_MARKETS keys (routes/energy_discovery_routes.py).
          # Four names here used to be non-canonical — salt_lake_city, new_york,
          # seattle, portland. They never matched a market key; nothing noticed,
          # because the endpoint ignored ?market= entirely. The API now aliases
          # them AND 400s a genuinely unknown key, so use the real keys.
          MARKETS="phoenix dallas northern_virginia atlanta las_vegas salt_lake columbus des_moines chicago silicon_valley new_york_nj seattle_quincy portland_hillsboro denver san_antonio houston miami reno sacramento minneapolis kansas_city richmond nashville"
          TOTAL=0
          ERRORS=0
          GATED=0
          # Fingerprint each market's payload. 23 markets returning ONE distinct
          # fingerprint is the vacuous-green signature this step shipped with
          # for months: "23 OK / 11,500 plants" was 23 copies of the same
          # national top-500 list, because ?market= never reached the SQL.
          : > /tmp/ed_fingerprints.txt
          for MARKET in $MARKETS; do
            CODE=$(curl -s -o /tmp/ed.json -w '%{http_code}' --max-time 60 \
              -H "X-Admin-Key: $ADMIN_KEY" \
              "$RAILWAY/api/energy-discovery/power-plants?market=$MARKET&limit=500")
            if [ "$CODE" = "200" ]; then
              COUNT=$(python3 -c "import json;print(json.load(open('/tmp/ed.json')).get('count',0))" 2>/dev/null || echo 0)
              FILTERED=$(python3 -c "import json;print(json.load(open('/tmp/ed.json')).get('market_filtered',False))" 2>/dev/null || echo "?")
              shasum -a 1 /tmp/ed.json 2>/dev/null | cut -c1-10 >> /tmp/ed_fingerprints.txt \
                || sha1sum /tmp/ed.json | cut -c1-10 >> /tmp/ed_fingerprints.txt
              echo "  OK $MARKET: $COUNT plants (market_filtered=$FILTERED)"
              TOTAL=$((TOTAL + COUNT))
            else
              echo "  FAIL $MARKET (http=$CODE)"
              ERRORS=$((ERRORS + 1))
              [ "$CODE" = "402" ] && GATED=$((GATED + 1))
            fi
            sleep 3
          done
          DISTINCT=$(sort -u /tmp/ed_fingerprints.txt 2>/dev/null | wc -l | tr -d ' ')
          echo "Energy sync done: $TOTAL plants, $ERRORS errors, $DISTINCT distinct payloads"
          if [ "$GATED" -gt 0 ]; then
            echo "::warning::SH52-051 — $GATED/23 markets returned 402. The"\
              "ingestion workflow is being refused by our own tier gate; the"\
              "admin key is not clearing before_request on this path."
          fi
          if [ "$DISTINCT" -le 1 ] && [ "$ERRORS" -lt 23 ]; then
            echo "::warning::SH52-051b — every market returned the SAME payload"\
              "($DISTINCT distinct across 23 markets). ?market= is not reaching"\
              "the live SQL again; this step is verifying nothing."
          fi
          # Verification never fails the job. Steps 3/4 must run regardless.
          exit 0

      # `if: always()` so a red step above cannot cancel this one. Before this
      # change the KMZ step could not fail at all (`|| echo`), so nothing
      # downstream had to survive it; now it can.
      - name: KMZ fiber processing
        if: always()
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          RAILWAY="https://dchub-backend-production.up.railway.app"
          echo "Step 3/4: KMZ fiber source processing..."
          # ★ 2026-08-19: `curl -sf ... | python3 ... || echo "KMZ processing
          # timed out"` could not tell ANY outcome apart. /api/kmz-discovery/run
          # is in main.py's _WORKER_PROXY_POST_PATHS but NOT
          # _WORKER_PROXY_SYNC_PATHS, so web relays it to dchub-worker on a 15s
          # read budget and answers:
          #
          #   {"success": true, "delegated_to": "worker",
          #    "completed": false, "note": "job still running on dchub-worker"}
          #
          # `success: true` is in that body, so the old one-liner printed
          # "Success: True" — for a job that had not started producing yet.
          # And the handler was OBSERVED AT 1061.2s (17.7 minutes) in the
          # 2026-07-11 pool audit, which is why it is deliberately kept OUT of
          # the 180s sync set: the 202 is the NORMAL answer here, not the
          # exception. Every run has been reporting a success it never saw.
          #
          # The watermark is /api/kmz-discovery/status last_cycle_at — the
          # MAX(discovered_at) over kmz_discovery_log, the row _log_cycle()
          # writes at the end of EVERY completed cycle whether or not it found
          # routes. NOT `last_cycle` in the same payload: that one comes from
          # the _kmz_instance singleton's in-memory cache, one copy per
          # service, and the cycle runs on the worker — web's copy has read
          # null since delegation landed. Same trap as #2929's
          # /autonomy/status.
          read_kmz_watermark() {
            local code
            code=$(curl -sS --max-time 30 -o /tmp/kmz-wm.json -w '%{http_code}' \
              "$RAILWAY/api/kmz-discovery/status") || code="000"
            if [ "$code" != "200" ]; then
              echo "::warning::/api/kmz-discovery/status returned HTTP $code — watermark UNKNOWN for this read" >&2
              return 0
            fi
            python3 -c "import sys,json;print(json.load(sys.stdin).get('last_cycle_at') or '')" \
              < /tmp/kmz-wm.json 2>/dev/null || true
          }
          BEFORE=$(read_kmz_watermark)
          echo "pre-run last_cycle_at=${BEFORE:-<none>}"
          # ★ THE STALENESS GATE — this is where a KMZ cycle that never lands
          # actually FAILS, and it has to be here rather than after the poll.
          # The cycle was measured at 17.7 minutes; a runner poll that waited
          # long enough to confirm one would burn ~20 min of runner time on
          # EVERY run, 4x a day, and still red on ordinary variance. So
          # completion is judged the way the deadman board judges every other
          # feed: the PREVIOUS cycle must have landed within 2x this job's
          # cadence. This job runs on the '0 0,6,12,18' schedule, so 12h.
          # A cycle that stops completing is caught on the next run — one
          # cycle later, which is the soonest anything can honestly tell.
          STALE=0
          if [ -n "$BEFORE" ]; then
            AGE_H=$(BEFORE="$BEFORE" python3 -c "
          import datetime, os
          t = datetime.datetime.fromisoformat(os.environ['BEFORE'])
          if t.tzinfo is None:
              t = t.replace(tzinfo=datetime.timezone.utc)
          now = datetime.datetime.now(datetime.timezone.utc)
          print(round((now - t).total_seconds() / 3600.0, 1))
          " 2>/dev/null || echo "")
            echo "previous cycle landed ${AGE_H:-?}h ago"
            if [ -n "$AGE_H" ] && python3 -c "import sys; sys.exit(0 if float('$AGE_H') > 12 else 1)"; then
              STALE=1
            fi
          fi
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          echo "post sent at $START"
          # 120 is 8x the 15s relay budget. It is NOT enough to outlast the
          # cycle itself, and deliberately so: nothing can synchronously
          # observe a 17-minute handler. If delegation is ever off, this call
          # runs IN-PROCESS on web and curl gives up at 120s with 000 — which
          # is reported as an error below rather than guessed at, because a
          # curl timeout here is indistinguishable from an unreachable origin.
          CODE=$(curl -sS --max-time 120 -o /tmp/kmz.json -w '%{http_code}' \
            -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            "$RAILWAY/api/kmz-discovery/run") || CODE="000"
          echo "HTTP $CODE"
          head -c 600 /tmp/kmz.json || true
          echo
          if [ "$CODE" = "202" ]; then
            echo "::notice::kmz-discovery delegated to dchub-worker (202) — polling /api/kmz-discovery/status for the cycle watermark"
            ADVANCED=0
            for i in $(seq 1 10); do
              sleep 30
              AFTER=$(read_kmz_watermark)
              echo "poll $i/10 last_cycle_at=${AFTER:-<none>}"
              ADV_THIS=0
              if [ -n "$AFTER" ]; then
                if [ -n "$BEFORE" ]; then
                  if [ "$AFTER" != "$BEFORE" ]; then ADV_THIS=1; fi
                elif [ "$AFTER" \> "$START" ]; then
                  ADV_THIS=1
                else
                  echo "poll $i/10 last_cycle_at predates this run — stale, not this cycle"
                fi
              fi
              if [ "$ADV_THIS" = "1" ]; then
                ADVANCED=1
                echo "::notice::kmz-discovery cycle completed on the worker (last_cycle_at ${BEFORE:-<none>} -> $AFTER)"
                break
              fi
            done
            if [ "$ADVANCED" != "1" ]; then
              # Not confirmed within the poll. Whether that is normal or a
              # genuine failure is decided by evidence we ALREADY have, not by
              # guessing:
              #
              #  · no cycle has EVER been recorded (BEFORE empty) — nothing
              #    here has ever completed, so there is no "still running"
              #    reading to fall back on. Fail.
              #  · the PREVIOUS cycle is itself older than 2x cadence (STALE)
              #    — this is at least the second run in a row that has not
              #    landed. Fail.
              #  · otherwise — the last cycle landed on schedule and this one
              #    was accepted and delegated. A ~17.7-minute job simply has
              #    not finished inside a 5-minute poll. UNKNOWN, which is
              #    neither zero nor failure; the next run's staleness gate
              #    catches it if it never lands.
              if [ -z "$BEFORE" ]; then
                echo "::error::kmz-discovery was delegated (202) and no cycle has EVER been recorded in kmz_discovery_log — the cycle is not completing"
                exit 1
              fi
              if [ "$STALE" = "1" ]; then
                echo "::error::kmz-discovery was delegated (202), did not land inside the poll, AND the previous cycle is ${AGE_H}h old (>12h = 2x cadence) — the cycle has stopped completing"
                exit 1
              fi
              echo "::notice::kmz-discovery still running on the worker after 5 min of polling — expected for a cycle measured at ~17.7 min. Counters UNKNOWN for this run, not zero and not failed; the staleness gate above fails the NEXT run if it never lands."
            fi
            exit 0
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::HTTP $CODE from $RAILWAY/api/kmz-discovery/run — the KMZ cycle did NOT start. 000 here means the request timed out at 120s: either the origin is unreachable, or worker delegation is off and the 17-minute cycle is running in-process on web (with delegation on this path answers 202 in ~15s)."
            exit 1
          fi
          python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          r = d.get('results') or {}
          if r.get('skipped'):
              print(f\"::warning::kmz-discovery skipped: {r.get('reason')}\")
          elif 'total_new_routes' in r:
              print(f\"::notice::kmz-discovery: new_routes={r.get('total_new_routes')} new_km={r.get('total_new_km')} duration={r.get('cycle_duration_seconds')}s\")
          else:
              print(f'::warning::kmz-discovery returned 200 in an UNRECOGNISED shape: {sorted(d)}')
          " < /tmp/kmz.json

      # `if: always()` so a red KMZ step cannot cancel the evolution engine —
      # they are unrelated jobs sharing a cron.
      - name: Evolution and auto-approve
        if: always()
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -uo pipefail
          RAILWAY="https://dchub-backend-production.up.railway.app"
          echo "Step 4/4: Evolution engine + auto-approve..."
          # r80 (2026-06-04): these endpoints require X-Admin-Key; this step was
          # firing bare curls -> 401 every run while the workflow stayed green,
          # so the evolution engine + staged-facility auto-approval never ran.
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::warning::DCHUB_ADMIN_KEY not set — evolution/auto-approve will 401"; fi
          # ★ 2026-08-19: the evolution curl read no status code and capped at
          # 60s. /api/jobs/evolution is in main.py's _WORKER_PROXY_SYNC_PATHS,
          # so web relays it to dchub-worker on a 180s read budget — THREE
          # TIMES the old --max-time. Every relayed run therefore hit curl's
          # timeout, `-sf` exited non-zero, and `|| echo "Evolution timed out"`
          # printed a reassuring sentence and exited 0. The workflow stayed
          # green, and tools/deadman/watch.py beats data-sync off the run
          # CONCLUSION. 300 exceeds the relay budget so the 202 can arrive; a
          # 202 is then polled, not failed.
          #
          # Watermark: cron_last_run.last_completed_at via /api/jobs/last-run,
          # stamped by the process that RAN the handler — see the news-refresh
          # step above for why /api/jobs/status cannot be used (module-level
          # _scheduler_registry, one copy per service).
          read_evo_watermark() {
            local code
            code=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
              -o /tmp/evo-wm.json -w '%{http_code}' \
              "$RAILWAY/api/jobs/last-run?job=evolution") || code="000"
            if [ "$code" != "200" ]; then
              echo "::warning::/api/jobs/last-run returned HTTP $code — watermark UNKNOWN for this read" >&2
              return 0
            fi
            python3 -c "import sys,json;print(((json.load(sys.stdin).get('jobs') or {}).get('evolution') or {}).get('last_completed_at') or '')" \
              < /tmp/evo-wm.json 2>/dev/null || true
          }
          BEFORE=$(read_evo_watermark)
          echo "pre-run evolution last_completed_at=${BEFORE:-<none>}"
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          CODE=$(curl -sS --max-time 300 -o /tmp/evo.json -w '%{http_code}' \
            -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            "$RAILWAY/api/jobs/evolution") || CODE="000"
          echo "evolution HTTP $CODE"
          head -c 400 /tmp/evo.json || true
          echo
          EVO_FAILED=0
          if [ "$CODE" = "202" ]; then
            echo "::notice::evolution delegated to dchub-worker (202) — polling /api/jobs/last-run for the completion watermark"
            ADVANCED=0
            for i in $(seq 1 10); do
              sleep 30
              AFTER=$(read_evo_watermark)
              echo "poll $i/10 last_completed_at=${AFTER:-<none>}"
              ADV_THIS=0
              if [ -n "$AFTER" ]; then
                if [ -n "$BEFORE" ]; then
                  if [ "$AFTER" != "$BEFORE" ]; then ADV_THIS=1; fi
                elif [ "$AFTER" \> "$START" ]; then
                  ADV_THIS=1
                else
                  echo "poll $i/10 last_completed_at predates this run — stale, not this cycle"
                fi
              fi
              if [ "$ADV_THIS" = "1" ]; then
                ADVANCED=1
                echo "::notice::evolution completed on the worker (last_completed_at ${BEFORE:-<none>} -> $AFTER)"
                break
              fi
            done
            if [ "$ADVANCED" != "1" ]; then
              echo "::error::evolution was delegated (202) but cron_last_run.last_completed_at never advanced in 5 min — the cycle did NOT complete"
              EVO_FAILED=1
            else
              # No result came back with the 202 and none is invented here.
              echo "::notice::evolution: result UNKNOWN (a relayed 202 carries none) — completion judged by the cron_last_run watermark"
            fi
          elif [ "$CODE" != "200" ]; then
            echo "::error::evolution returned HTTP $CODE — the engine did NOT run (this step printed 'Evolution timed out' and exited 0 before this gate)"
            EVO_FAILED=1
          else
            python3 -c "import json,sys; d=json.load(sys.stdin); print('Evolution:', d.get('success','?'), d.get('skipped') or str(d.get('result',''))[:200])" < /tmp/evo.json \
              || echo "::warning::evolution returned 200 in an UNRECOGNISED shape"
          fi
          sleep 3
          # auto-approve is NOT worker-delegated (absent from every
          # _WORKER_PROXY_*_PATHS set), so it cannot answer 202 and is out of
          # scope for this change. Left exactly as it was.
          curl -sf --max-time 30 -X POST -H "X-Admin-Key: $ADMIN_KEY" "$RAILWAY/api/jobs/auto-approve" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print('Auto-approve:', d.get('success','?'))" 2>/dev/null || echo "Auto-approve timed out"
          if [ "$EVO_FAILED" = "1" ]; then exit 1; fi
          exit 0

      # ★ 2026-08-07 — SUBSEA HAD NO WORKING DRIVER FOR 133 DAYS.
      # subsea_cables / subsea_landing_points were last written 2026-03-27.
      # The sync itself was never broken: triggered by hand on 2026-08-07 it
      # ran clean and moved 691 -> 699 cables and 1,908 -> 1,927 landing
      # points. Nothing was calling it.
      #
      # Its only registration was dchub-scheduler.py's JOBS dict (Wednesday
      # 03:30, "ACTIVATED" out of DISABLED_JOBS on 2026-07-29). Two problems:
      # that dict's day_of_week was ignored by is_job_in_window until this same
      # change, and no start command in this repo launches dchub-scheduler.py
      # at all — Procfile and railway.json both run start_web.sh (gunicorn).
      # This workflow is the driver that demonstrably works.
      #
      # /api/jobs/subsea-sync is INTERNAL-key gated (fiber_integration.py
      # @require_internal_key), NOT admin-key like the steps above, and it is
      # worker-delegated: the backend relays to dchub-worker and answers 202
      # after ~15s while the job continues there. So 202 is SUCCESS here, and
      # a non-2xx FAILS the step loudly rather than echoing a reassuring line
      # — the #2318 lesson, which cost 147 hours of green.
      - name: Subsea cable sync
        env:
          INTERNAL_KEY: ${{ secrets.DCHUB_INTERNAL_KEY }}
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          set -uo pipefail
          # 2026-08-08: this step failed with `curl: (43) Failed sending HTTP
          # request` and printed `HTTP 000000` — curl REFUSED TO SEND, so the
          # backend was never reached and 000 is not a server verdict.
          #
          # Exit 43 means a malformed request line or header, and the usual
          # cause is a secret stored with a trailing newline: a CR/LF inside
          # `-H "X-Internal-Key: ..."` or inside the URL makes curl reject the
          # request before any socket is opened. Strip control characters and
          # surrounding whitespace from BOTH before use — harmless when the
          # secrets are already clean, and the whole failure when they are not.
          RAILWAY=$(printf '%s' "${BACKEND_URL:-https://dchub-backend-production.up.railway.app}" | tr -d '\r\n[:space:]')
          INTERNAL_KEY=$(printf '%s' "${INTERNAL_KEY:-}" | tr -d '\r\n[:space:]')
          if [ -z "${INTERNAL_KEY:-}" ]; then
            echo "::error::DCHUB_INTERNAL_KEY secret not set — subsea-sync would 401 silently"; exit 1
          fi
          case "$RAILWAY" in
            https://*) ;;
            *) echo "::error::RAILWAY_BACKEND_URL is not an https URL after sanitising — curl would fail to send"; exit 1;;
          esac
          # 2026-08-08 follow-on: with the send fixed, the call reached the
          # backend and returned 401 with an _upgrade_hint/claim_key body --
          # that is the API-KEY gate in before_request, not _require_admin_key
          # (which answers "Check DCHUB_ADMIN_KEY"). X-Internal-Key clears the
          # rate limiter but NOT that gate. One step earlier in this same job,
          # X-Admin-Key on the same gate returned 200 for 23/23 markets, so it
          # is sent here too. X-Internal-Key stays: it is what the worker-proxy
          # relay checks, and dropping it would trade this 401 for another.
          CODE=$(curl -sS --max-time 300 -o /tmp/subsea.json -w '%{http_code}' \
            -X POST -H "X-Internal-Key: $INTERNAL_KEY" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "$RAILWAY/api/jobs/subsea-sync" || echo 000)
          echo "HTTP $CODE"
          head -c 500 /tmp/subsea.json || true
          echo ""
          case "$CODE" in
            200|202) echo "subsea-sync accepted (202 = running on dchub-worker)";;
            *) echo "::error::subsea-sync returned $CODE"; exit 1;;
          esac

      # 2026-08-08: `if: always()` so an earlier RED step cannot silently
      # cancel this one. Subsea cable sync failed with curl exit 43 and
      # took Warm caches / Re-baseline infra-growth snapshot / Health check
      # down with it -- which is why several /whats-new layers report
      # "growth not measured yet: no count snapshot old enough to difference
      # against". The snapshot step had not run. The failing step still goes
      # red and still fails the job; it just no longer decides whether the
      # baseline gets written.
      - name: Warm caches
        if: always()
        run: |
          RAILWAY="https://dchub-backend-production.up.railway.app"
          echo "Warming PeeringDB and H3 caches..."
          curl -sf "$RAILWAY/api/v2/connectivity/summary?lat=39.0&lng=-77.4" > /dev/null && echo "  NoVA cached"
          sleep 2
          curl -sf "$RAILWAY/api/v2/connectivity/summary?lat=32.8&lng=-96.8" > /dev/null && echo "  Dallas cached"
          sleep 2
          curl -sf "$RAILWAY/api/v2/connectivity/summary?lat=33.4&lng=-112.0" > /dev/null && echo "  Phoenix cached"
          sleep 2
          curl -sf "$RAILWAY/api/v2/connectivity/summary?lat=37.4&lng=-122.0" > /dev/null && echo "  Silicon Valley cached"
          sleep 2
          curl -sf "$RAILWAY/api/v2/connectivity/summary?lat=41.9&lng=-87.6" > /dev/null && echo "  Chicago cached"
          echo "Caches warmed"

      # ★ RE-BASELINE THE GROWTH SNAPSHOT — LAST, after every loader above has
      # finished. This job rewrites most of the tables the public /whats-new
      # board reports on (substations, facilities, gas, fiber, transmission,
      # subsea), and that board reads infra_growth_snapshot rather than doing a
      # live COUNT(*). Without this step the page shows a table's PRE-SYNC count
      # until the next daily snapshot.
      #
      # It also fixes a collision the daily snapshot has today: infra-growth-
      # tracker.yml fires at 06:09 UTC, nine minutes into this job's 06:00 run,
      # i.e. while the loaders are mid-flight. The gas loader deletes its own
      # source tag before rewriting it, so a snapshot landing in that gap
      # records a torn count and invents a dip-then-spike in the published
      # deltas. Baselining at the END of the sync is the read that is actually
      # meaningful, and running it 4x/day makes the daily cron a backstop
      # rather than the only measurement.
      #
      # Railway origin, not dchub.cloud: admin POSTs through the edge die at the
      # 15s ROUTE_TIMEOUTS default and this COUNT(*)s tables up to 2.6M rows.
      # 2026-08-08: `if: always()` so an earlier RED step cannot silently
      # cancel this one. Subsea cable sync failed with curl exit 43 and
      # took Warm caches / Re-baseline infra-growth snapshot / Health check
      # down with it -- which is why several /whats-new layers report
      # "growth not measured yet: no count snapshot old enough to difference
      # against". The snapshot step had not run. The failing step still goes
      # red and still fails the job; it just no longer decides whether the
      # baseline gets written.
      - name: Re-baseline infra-growth snapshot
        if: always()
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY not set — /whats-new would keep serving pre-sync counts"
            exit 1
          fi
          CODE=$(curl -sS --max-time 180 -o /tmp/snap.json -w '%{http_code}' \
            -X POST "https://dchub-backend-production.up.railway.app/api/v1/admin/infra-growth/snapshot" \
            -H "X-Admin-Key: ${ADMIN_KEY}" || echo 000)
          echo "HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::error::infra-growth snapshot returned ${CODE} — /whats-new keeps publishing pre-sync counts"
            head -c 400 /tmp/snap.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/snap.json'))
          print(f"{'LAYER':<24}{'COUNT':>12}  {'STATUS':<12}WHY")
          for l in sorted(d.get('layers', []), key=lambda x: x['layer']):
              print(f"{l['layer']:<24}{l['count']:>12,}  {(l.get('status') or '?'):<12}"
                    f"{(l.get('status_reason') or '')[:88]}")
          flat = d.get('flatlines') or []
          print("FLATLINES: " + ("; ".join(flat) if flat else "none"))
          PY

      # 2026-08-08: `if: always()` so an earlier RED step cannot silently
      # cancel this one. Subsea cable sync failed with curl exit 43 and
      # took Warm caches / Re-baseline infra-growth snapshot / Health check
      # down with it -- which is why several /whats-new layers report
      # "growth not measured yet: no count snapshot old enough to difference
      # against". The snapshot step had not run. The failing step still goes
      # red and still fails the job; it just no longer decides whether the
      # baseline gets written.
      - name: Health check
        if: always()
        run: |
          RAILWAY="https://dchub-backend-production.up.railway.app"
          echo "Final health check..."
          curl -sf "$RAILWAY/api/health" | python3 -m json.tool | head -10
          echo ""
          # ★ 2026-08-10: TX Lines printed 0 on every run for as long as this
          # line has existed. The payload key is `total_transmissions`, not
          # `total_transmission_lines`, so .get() fell through to its default —
          # a hardcoded 0 rendered as a measurement. The table held 94,626 the
          # whole time (verified against /api/v1/ops/deadman, which shows the
          # loader inserting 94,619 rows the same morning). A false zero next to
          # three true counts is worse than no line at all: it is the first
          # thing you chase when a layer looks flat.
          #
          # No .get() defaults here on purpose. A renamed key must render
          # MISSING and be obvious, not silently become another zero.
          curl -sf "$RAILWAY/api/energy-discovery/status" | python3 -c "
          import json, sys
          d = json.load(sys.stdin).get('data', {})
          def f(k):
              return d[k] if k in d else 'MISSING(%s)' % k
          print('Plants:', f('total_power_plants'),
                '| Pipelines:', f('total_pipelines'),
                '| TX Lines:', f('total_transmissions'),
                '| Markets:', f('markets_monitored'))" 2>/dev/null || echo "Status check failed"



































      - name: Notify on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R azmartone67/dchub-backend \
            --title "[workflow-failed] ${{ github.workflow }} on $(date -u +%Y-%m-%d_%H:%M)" \
            --body "Workflow run ${{ github.run_id }} failed. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label workflow-failure || true
