name: brain autonomy loop

# THE AUTONOMY LOOP cron (2026-06-18). Every 30 min, drives the brain's
# self-fix orchestrator + (if armed) the Phase-3 auto-merge + canary passes.
#
# All THREE steps are HARMLESS while the flags are off:
#   · /autonomy/tick   no-ops unless BRAIN_AUTONOMY_ENABLED=1 (returns
#                      {disabled:true, preview} — zero DB/GitHub writes).
#   · /automerge/run   no-ops unless BRAIN_AUTOMERGE_ENABLED=1.
#   · /automerge/canary no-ops unless BRAIN_AUTOMERGE_ENABLED=1.
#
# LAYERING:
#   · AUTONOMY on  → tick auto-detects + auto-opens DRAFT PRs (human merges).
#   · AUTOMERGE on → the run/canary steps also auto-merge + auto-revert.
# Each flag is an independent Railway env var; flip them on the operator side.
#
# Auth mirrors brain-layer5.yml: the DCHUB_ADMIN_KEY repo secret sent as the
# X-Admin-Key header (the same gate brain_mechanical_classifier._admin_ok and
# every brain admin endpoint accept), against the Railway origin directly
# (CF edge-cache + the 15s edge timeout don't apply to the origin).

on:
  schedule:
    - cron: '2,32 * * * *'   # every 30 minutes at :02/:32 — staggered off main-branch-health's `*/30` (D15, 2026-09-02)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BASE: https://dchub-backend-production.up.railway.app

jobs:
  autonomy:
    runs-on: ubuntu-latest
    # 8 was sized for four fast POSTs. The tick step can now spend up to 5 min
    # polling the worker watermark before deciding, and the three steps after
    # it allow 120+150+120s — 8 would cancel the job mid-poll and re-red the
    # board with a timeout instead of the 202.
    timeout-minutes: 20
    steps:
      - name: Autonomy — tick (reactive + proactive; opens DRAFT PRs when armed)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping autonomy tick"
            exit 0
          fi
          # curl -sS (no -f) exits 0 on 401/500, so the old `|| echo curl_fail`
          # fallback NEVER fired: an auth or origin failure produced a green run
          # with a parsed-zeros summary, while deadman-watch beats this feed off
          # the run CONCLUSION. Capture the status and fail loudly instead.
          #
          # ★ 2026-08-19: that gate then failed on a 202, which is the OTHER
          # false reading. /api/v1/brain/autonomy/tick is in main.py's
          # _WORKER_PROXY_POST_PATHS but NOT _WORKER_PROXY_SYNC_PATHS, so web
          # relays it to dchub-worker on a 15s read budget (not 180s) and
          # answers honestly when the tick outlives it:
          #
          #   {"success": true, "delegated_to": "worker",
          #    "completed": false, "note": "job still running on dchub-worker"}
          #
          # measured on run 32210235319: POST at 02:54:39.9, 202 at 02:54:55.2
          # — 15.3s, the relay budget exactly. --max-time 180 was never the
          # problem here; the 202 was observable and WAS observed. Treating it
          # as "the loop did NOT run" exited 1, and deadman-watch reads this
          # workflow's CONCLUSION, so the board flipped brain-autonomy to
          # latest-run-failed while the tick ran normally on the worker.
          #
          # A 202 means "delegated and still running" — not run, not zero, not
          # failed. UNKNOWN. So: spawn and poll (the #2886 news-ner pattern).
          # The watermark is /autonomy/status last_tick, which _record_tick()
          # stamps at the end of EVERY tick including the dormant one — the
          # normal production state — so it advances whether or not
          # BRAIN_AUTONOMY_ENABLED=1. That status GET is delegated to the
          # worker too (main.py, same commit); before that it served web's
          # never-written copy and would have read null forever.
          #
          # A tick that genuinely never runs still fails: the watermark does
          # not move, and the poll below exits 1 on that.
          # /autonomy/status is delegated as well, so IT can answer with the
          # same 202 envelope when the worker is slow — and that body has no
          # last_tick, which would read as "no progress" and be
          # indistinguishable from a tick that never ran. Capture the status
          # code on the watermark reads too and say which one happened. Either
          # way the watermark is UNKNOWN and the poll keeps going: this fails
          # closed, it just no longer lies about why.
          read_watermark() {
            local code
            code=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
              -o watermark.json -w '%{http_code}' \
              "$RAILWAY_BASE/api/v1/brain/autonomy/status") || code="000"
            if [ "$code" != "200" ]; then
              echo "::warning::/autonomy/status returned HTTP $code — watermark UNKNOWN for this read" >&2
              return 0
            fi
            python3 -c "import sys,json;print(json.load(sys.stdin).get('last_tick') or '')" \
              < watermark.json 2>/dev/null || true
          }

          BEFORE=$(read_watermark)
          echo "pre-run last_tick=${BEFORE:-<none>}"

          # Sent-at, in the same ISO-8601 UTC shape _record_tick() stamps, so
          # the two compare lexicographically. Only used when BEFORE is
          # unknown — see the poll below.
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          echo "post sent at $START"

          # --max-time 300 exceeds BOTH relay budgets (15s here, 180s if this
          # path is ever promoted to _WORKER_PROXY_SYNC_PATHS), so the 202 can
          # always arrive before curl gives up.
          http=$(curl -sS --max-time 300 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -o response.json -w '%{http_code}' \
            "$RAILWAY_BASE/api/v1/brain/autonomy/tick") || http="000"
          response=$(cat response.json 2>/dev/null || echo '{}')
          echo "$response" | head -c 4000
          echo
          if [ "$http" = "202" ]; then
            echo "::notice::autonomy tick delegated to dchub-worker (202) — polling /autonomy/status for the tick watermark"
            ADVANCED=0
            for i in $(seq 1 10); do
              sleep 30
              AFTER=$(read_watermark)
              echo "poll $i/10 last_tick=${AFTER:-<none>}"
              # A moved watermark is the signal. When the pre-run read failed
              # BEFORE is empty and "moved" is unknowable, so fall back to
              # "stamped after we sent the POST" — otherwise the PREVIOUS
              # tick's timestamp, 30 min old, would pass as this tick's
              # completion. Comparing to BEFORE stays primary because it is
              # immune to runner/worker clock skew; the START comparison is
              # only reached when there is nothing better.
              ADV_THIS=0
              if [ -n "$AFTER" ]; then
                if [ -n "$BEFORE" ]; then
                  if [ "$AFTER" != "$BEFORE" ]; then ADV_THIS=1; fi
                elif [ "$AFTER" \> "$START" ]; then
                  ADV_THIS=1
                else
                  echo "poll $i/10 last_tick predates this run — stale, not this tick"
                fi
              fi
              if [ "$ADV_THIS" = "1" ]; then
                ADVANCED=1
                echo "::notice::autonomy tick completed on the worker (last_tick ${BEFORE:-<none>} -> $AFTER)"
                break
              fi
            done
            if [ "$ADVANCED" != "1" ]; then
              echo "::error::autonomy tick was delegated (202) but /autonomy/status last_tick never advanced in 5 min — the loop did NOT complete"
              exit 1
            fi
            # No counters came back with the 202 and none are invented here.
            # Absence of a counter is UNKNOWN, never zero.
            echo "::notice::autonomy tick: counters UNKNOWN (a relayed 202 carries none) — completion judged by the /autonomy/status watermark"
            exit 0
          fi
          if [ "$http" != "200" ]; then
            echo "::error::HTTP $http from $RAILWAY_BASE — the loop did NOT run (was silently green before this gate)"
            exit 1
          fi
          echo "$response" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              r = d.get('result') or {}
              if r.get('disabled'):
                  print('::notice::autonomy tick: DORMANT (BRAIN_AUTONOMY_ENABLED != 1) — no writes')
              else:
                  print('::notice::autonomy tick: '
                        f\"findings_filed={r.get('findings_filed',0)} \"
                        f\"proposals_created={r.get('proposals_created',0)} \"
                        f\"draft_prs_opened={r.get('draft_prs_opened',0)} \"
                        f\"reconciled={r.get('reconciled',0)}\")
          except Exception as e:
              print(f'::warning::autonomy tick parse failed: {e}')
          "

      - name: Auto-merge — run (no-op unless BRAIN_AUTOMERGE_ENABLED=1)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping automerge run"
            exit 0
          fi
          # curl -sS (no -f) exits 0 on 401/500, so the old `|| echo curl_fail`
          # fallback NEVER fired: an auth or origin failure produced a green run
          # with a parsed-zeros summary, while deadman-watch beats this feed off
          # the run CONCLUSION. Capture the status and fail loudly instead.
          http=$(curl -sS --max-time 120 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -o response.json -w '%{http_code}' \
            "$RAILWAY_BASE/api/v1/brain/automerge/run") || http="000"
          response=$(cat response.json 2>/dev/null || echo '{}')
          echo "$response" | head -c 4000
          echo
          if [ "$http" != "200" ]; then
            echo "::error::HTTP $http from $RAILWAY_BASE — the loop did NOT run (was silently green before this gate)"
            exit 1
          fi
          echo "$response" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              if d.get('disabled') or d.get('enabled') is False:
                  print('::notice::automerge run: DORMANT (BRAIN_AUTOMERGE_ENABLED != 1)')
              else:
                  r = d.get('result') or {}
                  print(f'::notice::automerge run: merged={len(r.get(\"merged\",[]) or [])} '
                        f'skipped={len(r.get(\"skipped\",[]) or [])}')
          except Exception as e:
              print(f'::warning::automerge run parse failed: {e}')
          "

      - name: "Smoke-regression recipe — tick (kill switch SMOKE_REGRESSION_DISABLE=1)"
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping smoke-regression tick"
            exit 0
          fi
          # curl -sS (no -f) exits 0 on 401/500, so the old `|| echo curl_fail`
          # fallback NEVER fired: an auth or origin failure produced a green run
          # with a parsed-zeros summary, while deadman-watch beats this feed off
          # the run CONCLUSION. Capture the status and fail loudly instead.
          http=$(curl -sS --max-time 150 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -o response.json -w '%{http_code}' \
            "$RAILWAY_BASE/api/v1/brain/smoke-regression/tick") || http="000"
          response=$(cat response.json 2>/dev/null || echo '{}')
          echo "$response" | head -c 4000
          echo
          if [ "$http" != "200" ]; then
            echo "::error::HTTP $http from $RAILWAY_BASE — the loop did NOT run (was silently green before this gate)"
            exit 1
          fi
          echo "$response" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              r = d.get('result') or {}
              if r.get('disabled'):
                  print('::notice::smoke-regression tick: DISABLED (kill switch)')
              else:
                  det = r.get('detection') or {}
                  adv = r.get('advanced') or []
                  print(f'::notice::smoke-regression tick: detected={det.get(\"detected\")} '
                        f'advanced={[a.get(\"action\") for a in adv]}')
          except Exception as e:
              print(f'::warning::smoke-regression tick parse failed: {e}')
          "

      - name: Auto-merge — canary (no-op unless BRAIN_AUTOMERGE_ENABLED=1)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping automerge canary"
            exit 0
          fi
          # curl -sS (no -f) exits 0 on 401/500, so the old `|| echo curl_fail`
          # fallback NEVER fired: an auth or origin failure produced a green run
          # with a parsed-zeros summary, while deadman-watch beats this feed off
          # the run CONCLUSION. Capture the status and fail loudly instead.
          http=$(curl -sS --max-time 120 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -o response.json -w '%{http_code}' \
            "$RAILWAY_BASE/api/v1/brain/automerge/canary") || http="000"
          response=$(cat response.json 2>/dev/null || echo '{}')
          echo "$response" | head -c 4000
          echo
          if [ "$http" != "200" ]; then
            echo "::error::HTTP $http from $RAILWAY_BASE — the loop did NOT run (was silently green before this gate)"
            exit 1
          fi
          echo "$response" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              if d.get('disabled') or d.get('enabled') is False:
                  print('::notice::automerge canary: DORMANT (BRAIN_AUTOMERGE_ENABLED != 1)')
              else:
                  r = d.get('result') or {}
                  print(f'::notice::automerge canary: evaluated={len(r.get(\"evaluated\",[]) or [])}')
          except Exception as e:
              print(f'::warning::automerge canary parse failed: {e}')
          "
