name: Deploy Integrity

# 2026-06-06: catches the recurring "why isn't my change live" toil —
#   (a) dual-repo divergence: the standalone ~/dchub-frontend (wins the CF Pages
#       race) vs the backend's mirror subdir drifting apart (the dc-hub-media
#       stale-copy class), and
#   (b) live route breakage: a key page serving non-200 or a near-blank body
#       (the dc-hub-media 0-byte class) via /api/v1/admin/deploy-integrity.

on:
  schedule:
    - cron: '41 */4 * * *'   # every 4 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out backend (this repo)
        uses: actions/checkout@v5
        with:
          path: dchub-backend
      # ── Dual-repo divergence check RETIRED 2026-09-05 ──────────────────
      # It diffed dchub-frontend/<f> (fresh sibling checkout) against
      # dchub-backend/dchub-frontend/<f> (a vendored 2,426-file mirror). That
      # mirror is now deleted — the canonical frontend is the standalone repo
      # and nothing serves from a copy in here — so there is no second copy
      # left to diverge FROM. With the mirror gone the loop's own
      # "exists only in standalone frontend (backend mirror missing)" branch
      # would warn on every file, every run, forever: a check reporting on a
      # subject that no longer exists.
      #
      # The frontend checkout went with it: this job used it for nothing else.
      # A note in the original retirement said the checkout "had also been
      # FAILING since 2026-08-19 (DCHUB_FRONTEND_RO_TOKEN lost access)". That
      # was quoted from a stale comment, not measured: the secret was rotated
      # 2026-09-02 and works — see bug-squash-nightly.yml for the evidence.
      # The retirement stands on its own reason (there is no second copy left
      # to diverge from); the token was never part of it. The guard added on
      # 2026-08-19 — say "could not check", never "in sync" — is what kept the
      # failing period honest, and that lesson is why the surviving cross-repo
      # jobs still gate on the checkout rather than trusting it.
      #
      # Divergence between the two repos is now structurally impossible for
      # the files it watched, and tests/test_no_vendored_frontend_mirror.py
      # fails if a mirror is ever committed back.

      - name: Live route smoke (200 + non-blank)
        run: |
          code=$(curl -sS -m 30 -o integrity.json -w "%{http_code}" \
            https://api.dchub.cloud/api/v1/admin/deploy-integrity || echo 000)
          echo "endpoint HTTP $code"; cat integrity.json || true
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open("integrity.json"))
          except Exception as e:
              print("::warning::could not read integrity result:", e); sys.exit(0)
          broken = d.get("broken_count", 0)
          for b in (d.get("broken") or []):
              print(f"::error title=Route broken::{b.get('path')} → {b.get('status') or b.get('error')} ({b.get('bytes')} bytes)")
          print(f"broken routes: {broken}/{d.get('checked')}")
          sys.exit(1 if broken else 0)
          PY
