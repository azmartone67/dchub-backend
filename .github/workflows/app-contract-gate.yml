name: app-contract-gate
#
# THE BEHAVIOR GATE — the one check that boots the real application.
#
# Why it is separate from pre-merge-gauntlet: this job installs the FULL
# requirements.txt, because importing main.py pulls all ~200 blueprints. The
# other jobs deliberately install a light dep set to stay fast. Mixing the two
# would slow every check down to this one's install time, and a slow gate is a
# gate people route around.
#
# Why it exists at all: on 2026-08-20 an audit found 290 of 571 backend test
# files assert that source contains certain STRINGS (1,021 such assertions),
# 240 AST-extract functions and run them against stubs, and only 64 exercise
# the real app. CI ran 351/354 green over the preceding week while 104 "fix"
# PRs landed. Nothing in CI booted the application, so nothing in CI could tell
# whether it still worked.
#
# It is fast (~2s boot, well under a minute total) because the DB is stubbed at
# the psycopg2 boundary. No network, no database, no secrets: the JWT_SECRET
# and admin key below are inert placeholders that exist only to satisfy
# import-time assertions.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # ★2026-09-06 — a post-merge gate reachable only by `push` is one bot
    # merge away from silence: GitHub creates NO workflow run for a push made
    # with GITHUB_TOKEN, and 17 of 24 commits landed that way in the 6h after
    # auto-enable-automerge shipped. The token is fixed; this is the belt, and
    # it holds for any future bot push too.
    - cron: '49 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: app-contract-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  app-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install full runtime deps
        # Full requirements: the gate's whole value is that it imports the real
        # app. A partial install would turn a genuine registration failure into
        # a missing-module error and teach everyone to ignore this job.
        run: |
          python3 -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          # pytest is NOT in requirements.txt (it is not a runtime dep). This
          # job now also runs the one test file whose checks need a real boot,
          # so it needs the runner.
          pip install -q pytest
      - name: Boot the app and check what it actually serves
        env:
          # Inert placeholders. The gate never reaches a real service — the DB
          # is stubbed in-process and no outbound call is made.
          JWT_SECRET: contract-gate-placeholder-not-a-secret
          DCHUB_ADMIN_KEY: contract-gate-placeholder
          # THIS is the job with requirements.txt fully installed, so here a
          # ModuleNotFoundError is a real defect, not a thin environment.
          # tests/test_app_contract_gate.py skips on that error elsewhere;
          # strict mode makes it a hard failure here, so the skip can never
          # hide a missing dependency in the job that enforces the gate.
          DCHUB_CONTRACT_GATE_STRICT: "1"
        # tee'd so the ledger beat can read the "booted in Xs — N routes" line.
        # pipefail keeps the gate's own exit code authoritative through the pipe.
        run: |
          set -o pipefail
          python3 scripts/app_contract_gate.py 2>&1 | tee /tmp/acg.log

      # ── the boot-only tests, in the only job that CAN boot ────────────────
      #
      # ★ WHY THIS STEP EXISTS. tests/test_agentic_loop_inspect.py carries the
      # two checks the agentic-loop brief names verbatim — "every fetch URL in
      # the page resolves to a registered route" and "every forward target is
      # registered or pinned expected-later". Both boot main.py in a
      # subprocess, and both pytest.skip on ModuleNotFoundError unless
      # DCHUB_CONTRACT_GATE_STRICT=1. The ONLY job that runs pytest is
      # `unit-tests`, which installs a light dep set and does not set that env,
      # so from the day they shipped they reported green by not running: CI run
      # 32604169976 / job 97106689232 logged both as SKIPPED, and a
      # one-character typo in a READS path left the file at 48 passed.
      #
      # This job installs requirements.txt and already exports STRICT=1, so
      # here the skip cannot fire — a missing dep or a missing route is a hard
      # failure. Scoped to the one file on purpose: this job's value is that it
      # boots the app, and running the whole ~9,000-test suite twice would make
      # it slow enough to route around.
      - name: Boot-only tests (the checks that cannot run in unit-tests)
        env:
          JWT_SECRET: contract-gate-placeholder-not-a-secret
          DCHUB_ADMIN_KEY: contract-gate-placeholder
          DCHUB_CONTRACT_GATE_STRICT: "1"
        run: python3 -m pytest tests/test_agentic_loop_inspect.py -v --tb=short

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # N = routes the booted app actually served, from the gate's own
          # "booted in Xs — N routes" line. Derived from what booted, not from a
          # static count of route files: a module that fails to import is
          # precisely what this gate exists to catch, and must lower N.
          # No "booted in" line means the app did not boot at all — that is
          # zero routes served, not an unknown count. Empty would leave the
          # vacuous counter untouched and this gate's whole point is that an
          # import error must lower N.
          if [ -f /tmp/acg.log ]; then
            N=$(grep -oE 'booted in [0-9.]+s . [0-9]+ routes' /tmp/acg.log \
                | grep -oE '[0-9]+ routes' | grep -oE '^[0-9]+' | head -1)
            N="${N:-0}"
          else
            N=""
          fi
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          bash scripts/gate_beat.sh "app-contract-gate:app-contract-gate" "$V" "$N" absent \
            "N = routes the booted app served"
