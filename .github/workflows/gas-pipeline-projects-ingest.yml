name: Gas Pipeline Projects Ingest (EIA → gas_pipeline_projects)

# NEW gas build-out, not the as-built network. The EIA gas-pipeline asset
# service is frozen upstream (last edited 2025-07-01), so new gas information
# arrives as PROJECTS: EIA's "U.S. natural gas pipeline projects" workbook —
# announced / applied / approved / under-construction interstate + intrastate
# projects with capacity (MMcf/d), miles, cost, states and FERC docket.
# EIA releases it quarterly; checking weekly lands a release within 7 days.
#
# Fetched + parsed HERE on the runner (openpyxl), POSTed as rows to the
# admin-gated ingest (Railway only writes). The ingest UPSERTS on a stable
# project key and keeps first_seen_at, so "+N new" on /whats-new counts
# projects first seen after the initial load — never the initial load itself.
# Logic: tools/infra_fetch.py (layer 'gas-pipeline-projects'),
#        routes/infra_projects_ingest.py.

on:
  schedule:
    - cron: '41 7 * * 2'     # Tuesdays 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-pipeline-projects-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
      DCHUB_ORIGIN: https://dchub-backend-production.up.railway.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install openpyxl
        run: pip install --quiet openpyxl
      - name: Fetch EIA pipeline projects + ingest
        run: |
          set -uo pipefail
          if [ -z "${DCHUB_ADMIN_KEY:-}" ]; then
            # A missing secret must not read as a completed refresh (SH52-120).
            echo "::error::DCHUB_ADMIN_KEY not set — gas-pipeline-projects ingest cannot run; failing loudly instead of a silent green no-op"
            exit 1
          fi
          python tools/infra_fetch.py gas-pipeline-projects

      - name: Re-baseline infra-growth snapshot
        run: |
          set -uo pipefail
          CODE=$(curl -sS --max-time 180 -o /tmp/snap.json -w '%{http_code}' \
            -X POST "${DCHUB_ORIGIN}/api/v1/admin/infra-growth/snapshot" \
            -H "X-Admin-Key: ${DCHUB_ADMIN_KEY}" || echo 000)
          echo "HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::error::infra-growth snapshot returned ${CODE} — /whats-new keeps publishing the pre-ingest count"
            head -c 400 /tmp/snap.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/snap.json'))
          for l in d.get('layers', []):
              if l['layer'] in ('gas_pipeline_projects', 'transmission_projects'):
                  print(f"{l['layer']:<24}{l['count']:>8,}  {(l.get('status') or '?'):<12}"
                        f"{(l.get('status_reason') or '')[:100]}")
          PY
