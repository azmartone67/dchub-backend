# GitHub Actions failover canary for dchub.cloud
#
# Runs the current-contract failover check (dchub-failover-check.sh v3.0):
#   - dchub.cloud serves 200 through the failover-aware edge worker
#     (x-dc-hub-served-by present; primary = railway-primary)
#
# The dead-man watcher tracks this workflow's last SUCCESS as the `failover-canary`
# feed on /api/v1/ops/deadman. A failing/absent run => the feed goes overdue.
#
# Runs every 6 hours (was weekly — a weekly canary let a real break hide for 92 days)
# and on manual dispatch. On failure it opens a workflow-failure issue.
#
# NOTE: the DEEP forced-origin-failover-to-Render drill is a follow-up — it needs the
# current force mechanism + Render's x-dc-hub-served-by value confirmed. CANARY_SECRET
# is now OPTIONAL (used only for an informational, non-fatal forced probe).

name: Failover canary

on:
  schedule:
    - cron: '6 */6 * * *'   # every 6 hours — :06, staggered off brain-inspector's `7 */6` (D15, 2026-09-02)
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: read
  issues: write             # the notify step opens an issue on failure (previously failed: no issues:write)

jobs:
  drill:
    name: dchub.cloud failover drill
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # v3.1's commit-drift check asks whether Render's deployed commit is an
          # ANCESTOR of HEAD. The default shallow clone (depth 1) cannot answer that
          # — the object is simply absent — so the drill would report UNKNOWN every
          # run. Full history is what makes the assertion possible at all.
          fetch-depth: 0

      - name: Make script executable
        run: chmod +x ./dchub-failover-check.sh

      - name: Run failover canary
        env:
          # ★2026-08-30 ARMED. It shipped =0 on 2026-07-30 with "arming after one
          # clean week is a REQUIRED follow-up" and sat unarmed for 31 days — a
          # fence that cannot fail, which is the defect class this repo keeps
          # paying for. The pre-existing assertions were verified passing before
          # arming (run 33297123827: "all checks passed"), so arming does not by
          # itself change their verdict.
          #
          # ★ It DOES go red immediately on the new served-artifact assertion, and
          # that is correct rather than regrettable: the mirror really is serving a
          # 31-day-old public surface. The remediation is named in the failure text
          # and is a Render setting, not a code change. Do NOT re-disarm this or
          # raise FAILOVER_ARTIFACT_MAX_AGE_H to get green — that converts a true
          # alarm back into the silence it just came out of.
          FAILOVER_DEEP_DRILL_ENFORCE: '1'
        run: ./dchub-failover-check.sh drill

      - name: Notify on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ★ ONE issue, reused. The old form put a timestamp in the title, so an
          # armed drill against a genuinely broken mirror would file 4 NEW issues a
          # day forever. A tracker with a hundred identical issues is how a real
          # alarm becomes background noise — this repo has already paid that once,
          # with 17 days of daily red on mcp-facts-export read as cosmetic and
          # ignored. The issue stays open until someone fixes the CAUSE; it is not
          # reopened per run and not closed by the next green.
          TITLE="[failover-canary] the failover drill is failing"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list -R azmartone67/dchub-backend --state open \
            --search "failover drill is failing in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            echo "issue #$EXISTING already open for this failure — not filing a duplicate ($RUN)"
          else
            gh issue create -R azmartone67/dchub-backend \
              --title "$TITLE" \
              --body "The failover drill is failing. Latest run: $RUN

          This issue is REUSED by later failures rather than duplicated, so it staying open means the cause is still unfixed. Close it when the cause is fixed, not when one run passes." \
              --label workflow-failure || true
          fi
