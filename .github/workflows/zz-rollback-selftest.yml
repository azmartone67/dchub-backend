name: zz-rollback-selftest
# TEMPORARY. Proves, in real GitHub Actions, the two behaviours the rollback
# fix depends on and that cannot be checked by parsing YAML:
#
#   1. a `continue-on-error: true` step that exits non-zero still lets LATER
#      steps read its `outputs`, and
#   2. the alert step's `if:` expression evaluates TRUE in exactly that case —
#      i.e. the alert can no longer be skipped when the rollback fails.
#
# The old auto-rollback.yml died at the failing push and skipped its "Open
# issue" step, producing no rollback and no alert. This asserts that is fixed.
# Deleted before merge.
on:
  push:
    branches: ['fix/rollback-not-git-push']

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Decide (stand-in for the SLO verdict)
        id: decide
        run: echo "rollback=true" >> $GITHUB_OUTPUT

      - name: Rollback step that FAILS (stand-in for a rejected push / dead Railway)
        id: railway
        continue-on-error: true
        run: |
          echo "outcome=no-token" >> $GITHUB_OUTPUT
          echo "target=deadbeef" >> $GITHUB_OUTPUT
          echo "simulating the rollback failing"
          exit 1

      # EXACT condition from auto-rollback.yml's "Open issue" step.
      - name: ALERT (must run)
        id: alert
        if: ${{ !cancelled() && (steps.decide.outputs.rollback == 'true' || failure()) }}
        run: |
          echo "ALERT_RAN=yes"
          echo "railway step outcome  : ${{ steps.railway.outcome }}"
          echo "railway step output   : ${{ steps.railway.outputs.outcome }}"
          echo "railway target output : ${{ steps.railway.outputs.target }}"
          test "${{ steps.railway.outcome }}" = "failure" \
            || { echo "::error::expected steps.railway.outcome=failure"; exit 1; }
          test "${{ steps.railway.outputs.outcome }}" = "no-token" \
            || { echo "::error::outputs of a failed continue-on-error step were NOT readable — the alert would report '(step did not run)'"; exit 1; }
          echo "::notice::alert fired AND could read the failed step's outputs"

      - name: Assert the alert was not skipped
        if: ${{ always() }}
        run: |
          echo "alert step outcome: ${{ steps.alert.outcome }}"
          test "${{ steps.alert.outcome }}" = "success" \
            || { echo "::error::ALERT WAS SKIPPED OR FAILED — this is the exact silent-failure bug being fixed"; exit 1; }
          echo "::notice::PASS — a failed rollback still produces an alert"

      # EXACT condition from auto-rollback.yml's "Fail if production was left
      # broken" step: it must fire when the rollback did not succeed.
      - name: Assert the run is marked red when rollback failed
        id: redcheck
        if: ${{ steps.decide.outputs.rollback == 'true' && steps.railway.outputs.outcome != 'rolled-back' }}
        run: echo "::notice::PASS — job would be failed, so a broken rollback cannot look green"

      - name: Assert redcheck actually ran
        if: ${{ always() }}
        run: |
          test "${{ steps.redcheck.outcome }}" = "success" \
            || { echo "::error::the 'fail the run' guard did not fire; a failed rollback would look green"; exit 1; }
          echo "::notice::ALL SELFTESTS PASSED"
