name: Restore test — verify Neon→R2 backup is restorable

# Hardening tier (2026-06-10): backup-neon-r2.yml proves we CAN make a dump.
# This proves the dump can be RESTORED: download the latest R2 backup, restore
# it into a throwaway Postgres 18, and verify table count + row counts
# (restore_verify.py). An untested backup is not a backup.
# Never mutates prod — the only prod touch is a read-only table-presence compare.
#
# 2026-07-13: the throwaway DB must have the SAME extensions prod uses. A plain-SQL
# restore into a vanilla postgres:18 desyncs: CREATE TABLE(...geometry/vector/
# h3index) fails (type missing) -> its COPY fails -> psql loses stream sync and
# SILENTLY drops LATER tables' data (users/deals/facilities came back empty with no
# error of their own). So we now build a Postgres image WITH postgis + pgvector
# (+ h3) — every CREATE+COPY succeeds, the WHOLE dump restores, and every table is
# data-verified. Regressed in late June when the first pgvector/postgis-typed
# tables landed in prod; that is exactly when this test started going red.
#
# Reuses the same repo secrets as the backup job: DATABASE_URL, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_ENDPOINT_URL.

on:
  schedule:
    - cron: "0 11 * * 1"        # Mondays 11:00 UTC (after the daily 09:31 dumps land)
  workflow_dispatch: {}          # manual run button

concurrency:
  group: restore-test
  cancel-in-progress: false

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40          # full ~17GB restore is heavier than the old ext-skipping one
    env:
      RESTORE_TARGET_URL: postgres://postgres:postgres@localhost:5432/restore_test
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk (a full restore of the grown DB needs headroom)
        # The restore now loads EVERY table (incl. fiber_kmz_routes ~8GB), so the
        # throwaway DB is ~prod size. Reclaim space the job doesn't need. Do NOT
        # remove all of /opt/hostedtoolcache — the `python` used below lives there.
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /usr/local/graalvm \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "after:";  df -h / | tail -1

      - name: Build Postgres 18 image with prod extensions (postgis / pgvector / h3)
        run: |
          cat > Dockerfile.restoretest <<'EOF'
          FROM postgres:18
          RUN apt-get update \
           && apt-get install -y --no-install-recommends postgresql-18-postgis-3 \
           && apt-get install -y --no-install-recommends postgresql-18-pgvector \
           && ( apt-get install -y --no-install-recommends postgresql-18-h3 \
                || echo "WARN: postgresql-18-h3 unavailable — h3-typed tables (e.g. fcc_fiber_hex) stay WARN-listed" ) \
           && rm -rf /var/lib/apt/lists/*
          EOF
          docker build -t pg-restoretest:18 -f Dockerfile.restoretest .

      - name: Start throwaway Postgres (durability off = faster restore, less WAL)
        run: |
          # ★2026-08-31 --shm-size: Docker defaults /dev/shm to 64MB. Postgres puts
          # parallel-worker DSM segments there, so building the pgvector HNSW index
          # on brain_corpus_embeddings asked for 64,000,128 bytes and died with
          #   could not resize shared memory segment ... No space left on device
          # The runner had 72GB of DISK free — this was never a disk problem, and
          # reading it as one would have sent the next person to the wrong place.
          # A restore missing an index is not a faithful restore.
          docker run -d --name pgrt --shm-size=1g \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=restore_test \
            -p 5432:5432 pg-restoretest:18 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_wal_size=6GB
          echo "waiting for postgres to accept connections..."
          for i in $(seq 1 45); do docker exec pgrt pg_isready -U postgres -q && break; sleep 2; done
          docker exec pgrt pg_isready -U postgres
          echo "extensions available in the throwaway DB:"
          docker exec pgrt psql -U postgres -d restore_test -tAc \
            "select name from pg_available_extensions where name in ('postgis','vector','h3','h3_postgis') order by 1" || true

      - name: Install pg client 18 + python deps
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18 || sudo apt-get install -y postgresql-client
          python -m pip install --quiet boto3 psycopg2-binary

      - name: Download latest backup from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: dchub-backups
        run: |
          python - <<'PY'
          import os, boto3
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          objs = s3.list_objects_v2(Bucket=os.environ["R2_BUCKET_NAME"],
                                    Prefix="neon_backup_").get("Contents", [])
          # ★ .sql.gz ONLY. The dump now ships a `.manifest.json` sidecar under the
          # same prefix, uploaded AFTER the dump — so a plain max(LastModified)
          # would pick the manifest and hand a JSON file to gunzip.
          dumps = [o for o in objs if o["Key"].endswith(".sql.gz")]
          if not dumps:
              raise SystemExit("no neon_backup_*.sql.gz objects in R2 — nothing to restore")
          latest = max(dumps, key=lambda o: o["LastModified"])
          print(f"latest backup: {latest['Key']}  {latest['Size']/1048576:.1f} MB  {latest['LastModified']}")
          s3.download_file(os.environ["R2_BUCKET_NAME"], latest["Key"], "backup.sql.gz")
          open("BACKUP_KEY.txt", "w").write(latest["Key"])
          # ★ The dump's own timestamp. restore_verify compares a LIVE source
          # against this OLDER dump, so without it a table created after the
          # backup was taken reads as data loss — which failed this gate on
          # 2026-08-31 for gsc_daily_performance, created hours after the dump.
          open("BACKUP_TAKEN_AT.txt", "w").write(
              latest["LastModified"].isoformat())

          # The sidecar records which tables existed WHEN THE DUMP RAN. Without it
          # the verifier compares against a prod that has moved on since, and any
          # table created in between reads as data loss. Absent on dumps taken
          # before 2026-08-31 — the verifier says so rather than assuming.
          mkey = latest["Key"][:-len(".sql.gz")] + ".manifest.json"
          try:
              s3.download_file(os.environ["R2_BUCKET_NAME"], mkey, "backup_manifest.json")
              print(f"manifest: {mkey}")
          except Exception as e:
              print(f"no manifest for this dump ({mkey}): {str(e)[:120]}")
          PY

      - name: Restore into throwaway Postgres
        run: |
          set +e   # a failing pipeline must not abort the step (bash -e); we inspect it below
          echo "Restoring $(cat BACKUP_KEY.txt) ..."
          echo "disk before:"; df -h / | tail -1
          # ON_ERROR_STOP=0: continue past benign per-statement noise (pg_session_jwt
          # is Neon-only and unavailable anywhere — its CREATE EXTENSION fails, but no
          # table has a pg_session_jwt column TYPE, so it can't desync the stream).
          # restore_verify.py is the real data gate.
          gunzip -c backup.sql.gz | psql "$RESTORE_TARGET_URL" -v ON_ERROR_STOP=0 > restore.out 2> restore.err
          rc=("${PIPESTATUS[@]}")   # capture the WHOLE array in one statement (a later assignment resets PIPESTATUS)
          gz_rc=${rc[0]}; psql_rc=${rc[1]}
          echo "pipeline rc: gunzip=$gz_rc  psql=$psql_rc"
          echo "disk after:";  df -h / | tail -1
          echo "--- last 12 lines of restore.out (where psql stopped) ---"
          tail -12 restore.out || true
          echo "--- restore ERROR/FATAL / space / disconnect lines (deduped, top 40) ---"
          grep -aiE "^psql:|ERROR|FATAL|No space|could not extend|server closed|connection to server|out of memory" restore.err \
            | sed -E 's/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -40 || echo "(none)"
          echo "--- non-data CREATE/dependency failures (diagnose missing app tables) ---"
          # 'syntax error at or near' lines are COPY data mis-parsed after an earlier
          # failure — drop them; the real cause is the missing type/extension/relation.
          grep -aiE "does not exist|is not available|cannot|violates|invalid input|no such" restore.err \
            | grep -aviE "syntax error at or near" | sort -u | head -30 || echo "(none)"
          if [ "$gz_rc" != "0" ] || [ "$psql_rc" != "0" ]; then
            echo "::warning::restore pipeline non-zero (gunzip=$gz_rc psql=$psql_rc) — restore may be TRUNCATED; the verify step will fail if rows are missing"
          fi
          exit 0   # verify step is the gate; diagnostics above explain any shortfall

      # 2026-07-30: the verify step failed with "Consistent recovery state has not
      # been yet reached" — the throwaway server had RESTARTED since the boot
      # readiness gate above. Catch that HERE, where we can still say why, rather
      # than as a confusing connection error inside restore_verify.py.
      - name: Throwaway Postgres health gate (pre-verify)
        run: |
          set -uo pipefail
          echo "disk:"; df -h / | tail -1
          restarts=$(docker inspect -f '{{.RestartCount}}' pgrt 2>/dev/null || echo "?")
          state=$(docker inspect -f '{{.State.Status}}' pgrt 2>/dev/null || echo "?")
          oom=$(docker inspect -f '{{.State.OOMKilled}}' pgrt 2>/dev/null || echo "?")
          echo "container: state=$state restarts=$restarts oom_killed=$oom"
          if [ "$restarts" != "0" ] || [ "$oom" = "true" ]; then
            echo "::warning::throwaway Postgres restarted mid-job (restarts=$restarts oom=$oom) — the restore environment failed even if verify passes"
            echo "--- postgres log (last 60) ---"
            docker logs --tail 60 pgrt 2>&1 || true
          fi
          # pg_isready returns non-zero while the server rejects connections during
          # recovery, so this genuinely waits it out. Unlike the boot gate it runs
          # AFTER the restore — which is when the crash happens.
          echo "waiting for the server to finish any recovery (max 10m)..."
          for i in $(seq 1 60); do
            docker exec pgrt pg_isready -U postgres -q && break
            sleep 10
          done
          docker exec pgrt pg_isready -U postgres

      - name: Verify restore
        env:
          SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Hand the verifier the dump's age so it can tell "created after the
          # backup" from "lost by the backup". Absent -> it fails closed and
          # keeps treating every absence as loss.
          export BACKUP_TAKEN_AT="$(cat BACKUP_TAKEN_AT.txt 2>/dev/null || true)"
          echo "dump taken at: ${BACKUP_TAKEN_AT:-unknown}"
          python restore_verify.py

      # Converts "it failed again" into an attributable cause. If the next red is
      # disk or OOM we learn it on the first look instead of the fourth day.
      - name: Post-mortem (only when verify failed)
        if: failure()
        run: |
          echo "disk:"; df -h / | tail -1
          docker inspect -f 'state={{.State.Status}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' pgrt || true
          echo "--- postgres log (last 200) ---"
          docker logs --tail 200 pgrt 2>&1 || true
          echo "--- restore.err space/crash lines ---"
          grep -aiE "No space|could not extend|server closed|out of memory|terminating connection" restore.err | tail -30 || echo "(none)"
