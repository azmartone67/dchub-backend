name: MCP Registry Watch

# Weekly probe of major MCP registries to verify DC Hub presence.
# When DC Hub is missing from a registry, the scan endpoint files a
# brain finding so autopilot / human can ship a submission PR.
#
# Phase HJ-2 (2026-06-05) — companion to routes/mcp_registry_watch.py.
# Runs Mondays 14:00 UTC = US-morning. Manually triggerable via
# workflow_dispatch.

on:
  schedule:
    # Mondays 14:00 UTC — Pacific 7AM, Eastern 10AM, EU afternoon.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # so we can open a GitHub issue if a registry drops us

concurrency:
  group: mcp-registry-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger registry presence scan
        id: scan
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning ::DCHUB_ADMIN_KEY secret not set — falling back to public read endpoint"
            BODY=$(curl -sS "https://dchub.cloud/api/v1/brain/mcp-registries" \
                        --max-time 30)
          else
            BODY=$(curl -sS -X POST \
                        -H "X-Admin-Key: $ADMIN_KEY" \
                        "https://dchub.cloud/api/v1/admin/brain/mcp-registries/scan" \
                        --max-time 30)
          fi
          echo "$BODY" | jq -r '.results | to_entries[] | "  \(.value.verdict)\t\(.key)\t\(.value.registry)"' || true
          PRESENT=$(echo "$BODY" | jq -r '.present // 0')
          MISSING=$(echo "$BODY" | jq -r '.missing // 0')
          TOTAL=$(echo "$BODY"   | jq -r '.total   // 0')
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"     >> "$GITHUB_OUTPUT"
          {
            echo "## MCP Registry Watch — $(date -u +%Y-%m-%d)"
            echo ""
            echo "**Present in:** $PRESENT / $TOTAL registries"
            echo "**Missing from:** $MISSING"
            echo ""
            echo '```'
            echo "$BODY" | jq -r '.results | to_entries[] | "\(.value.verdict | ascii_upcase)\t\(.key)"'
            echo '```'
            echo ""
            if [ "$MISSING" -gt 0 ]; then
              echo "### Missing registries — submission URLs"
              echo "$BODY" | jq -r '.results | to_entries[] | select(.value.verdict != "present") | "- **\(.value.registry)** → \(.value.submission_url)"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open GitHub issue if DC Hub missing from any registry
        if: steps.scan.outputs.missing != '0' && steps.scan.outputs.missing != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const present = '${{ steps.scan.outputs.present }}';
            const missing = '${{ steps.scan.outputs.missing }}';
            const total   = '${{ steps.scan.outputs.total }}';
            const title   = `MCP Registry Watch — DC Hub missing from ${missing}/${total} registries`;
            // De-dupe: don't open a new issue if one with this exact
            // title is already open. Closes a feedback loop.
            const existing = await github.rest.issues.listForRepo({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              state:  'open',
              labels: ['mcp-registry-watch'],
            });
            if (existing.data.some(i => i.title === title)) {
              console.log('Issue already open — skipping create.');
              return;
            }
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  title,
              labels: ['mcp-registry-watch', 'seo'],
              body:   `Weekly MCP registry probe found DC Hub missing from ${missing} of ${total} registries.\n\nFor full per-registry status with submission URLs, see https://dchub.cloud/api/v1/brain/mcp-registries.\n\nAuto-filed by .github/workflows/mcp-registry-watch.yml.`,
            });

      # ── the manual queue (2026-08-05) ────────────────────────────────
      # Eight registry targets cannot be submitted by any program — a web
      # form, a GitHub PR, a GitHub issue, a sales contact. The nightly
      # mcp-outreach cron has logged `manual_submit_queued` for them every
      # night since 2026-05-21 and nothing ever showed a person the list, so
      # it is a to-do that regenerates itself and nobody works.
      #
      # This publishes it as ONE issue, updated in place rather than
      # re-opened, so ticking items off is durable and the thread does not
      # become weekly noise the way a new-issue-per-run would.
      - name: Publish the manual submission queue
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        id: queue
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning ::DCHUB_ADMIN_KEY not set — manual queue not fetched"
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(curl -sS --max-time 45 \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "https://dchub.cloud/api/v1/admin/outreach/mcp-registry/manual-queue?format=md" \
            || echo "")
          # ★ An empty body means the fetch FAILED. Writing an empty issue
          # would read as "nothing to do" — the endpoint says "Nothing
          # pending" out loud when the queue is genuinely clear.
          if [ -z "$BODY" ]; then
            echo "::error ::manual-queue fetch failed — queue NOT published (this is not 'nothing pending')"
            exit 1
          fi
          {
            echo "body<<QUEUE_EOF"
            echo "$BODY"
            echo "QUEUE_EOF"
          } >> "$GITHUB_OUTPUT"
          { echo "## Manual submission queue"; echo ""; echo "$BODY"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the manual-queue issue
        if: steps.queue.outputs.body != ''
        uses: actions/github-script@v7
        env:
          # ★ 2026-08-20: the queue body is passed through env, NOT interpolated
          # into the script. `${{ }}` is substituted as raw TEXT before Node
          # parses the file, so the previous version spliced markdown straight
          # into a template literal. The queue's own prose contains backticks
          # (it says: see `description` in `routes/mcp_registry_outreach.py`),
          # those backticks CLOSED the literal, and every run since 2026-07-27
          # died with `SyntaxError: Unexpected identifier 'routes'`. Four weeks
          # of a step whose entire purpose was to stop a self-regenerating
          # to-do from staying invisible.
          #
          # It was also a script-injection hole: that string is fetched over
          # HTTP from an admin endpoint and was being EXECUTED as JavaScript
          # with the GITHUB_TOKEN in scope. process.env is inert — the content
          # can never be parsed as code, whatever it contains.
          QUEUE_BODY: ${{ steps.queue.outputs.body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body  = `${process.env.QUEUE_BODY}\n\n_Refreshed by .github/workflows/mcp-registry-watch.yml. Tick an item off by setting \`outreach_state\` on the target in \`routes/mcp_registry_outreach.py\`._`;
            const title = 'MCP registry — submissions that need a human';
            const open  = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['mcp-registry-watch'],
            });
            const found = open.data.find(i => i.title === title);
            if (found) {
              // Update in place. A new issue every Monday would train
              // everyone to close it unread.
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body,
              });
              console.log(`updated #${found.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['mcp-registry-watch', 'distribution'],
              });
            }
