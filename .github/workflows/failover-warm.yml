name: Failover Cache Warm (20-min)

# Proactively refresh the DCHUB_CACHE KV read-failover for the must-survive
# endpoints, so a Railway outage during low traffic still serves recent data
# (not whatever organic traffic happened to cache hours earlier).
#
# Hits the Railway ORIGIN directly (so the warmer route itself isn't subject to
# the CF worker's ~15s proxy timeout). The route then GETs each critical path
# THROUGH the worker (api.dchub.cloud), causing the worker to (re)cache them.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: failover-warm
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm the Railway-failover KV cache
        env:
          INTERNAL_KEY: ${{ secrets.DCHUB_INTERNAL_KEY }}
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set +e
          # Authenticate with a real credential. This used to send only the
          # `X-DC-Probe: failover-warm` marker, which routes/failover_warm.py
          # accepts as auth — a header anyone can send. X-Internal-Key is what
          # the route checks first; X-Admin-Key is the fallback it also takes.
          AUTH=()
          if [ -n "${INTERNAL_KEY:-}" ]; then AUTH=(-H "X-Internal-Key: $INTERNAL_KEY")
          elif [ -n "${ADMIN_KEY:-}" ]; then AUTH=(-H "X-Admin-Key: $ADMIN_KEY")
          else echo "::error::neither DCHUB_INTERNAL_KEY nor DCHUB_ADMIN_KEY is available"; exit 1; fi
          BODY=$(curl -sS -m 90 -X POST "${AUTH[@]}" \
            -H "User-Agent: DCHub-FailoverWarmCron/1.0" \
            https://dchub-backend-production.up.railway.app/api/v1/admin/failover/warm)
          RC=$?
          # A refused credential is not a transient miss: say so, loudly, so a
          # secret that drifted from the Railway value cannot hide behind exit 0.
          if echo "$BODY" | grep -q '"admin_required"\|"unauthorized"'; then
            echo "::error::failover warm refused the credential — cache NOT warmed"
            exit 1
          fi
          echo "curl rc=$RC"
          echo "$BODY" | head -c 500
          echo ""
          WARMED=$(echo "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin).get('warmed','?'))" 2>/dev/null || echo "?")
          TOTAL=$(echo "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin).get('total','?'))" 2>/dev/null || echo "?")
          echo "warmed $WARMED/$TOTAL critical endpoints into DCHUB_CACHE"
          # Non-fatal: a warm miss is a soft signal, not an outage. Only fail if
          # the origin itself was unreachable (so we don't spam red Xs).
          if [ "$RC" -ne 0 ]; then
            echo "::warning::failover warm origin unreachable (rc=$RC) — transient"
          fi
          exit 0
