name: stripe-metered-report
# Reports each metered customer's API-call usage (from mcp_call_log) to the
# Stripe Meter (event_name=dchub_api_call, price_1TdNixJ9ey2ATcQldRAdlc7z).
#
# SAFE BY DESIGN:
#   • No-op until a metered customer is linked via POST /api/v1/billing/link-metered-key
#   • The SCHEDULED run bills LIVE as of 2026-06-04 (operator went live)
#   • To do a LIVE report: Actions → Run workflow → live = 1 (manual dispatch)
#
# GO-LIVE checklist (after the first metered customer is set up in Stripe):
#   1. POST /api/v1/billing/link-metered-key {api_key, stripe_customer_id: cus_...}
#   2. Run this workflow manually with live=1, confirm the event appears on the
#      Stripe Meter "DC Hub API Calls" (Stripe → Billing → Meters)
#   3. DONE (2026-06-04): the daily schedule now bills live.
on:
  schedule:
    - cron: '17 9 * * *'   # daily 09:17 UTC
  workflow_dispatch:
    inputs:
      live:
        description: 'Set to 1 to report LIVE to Stripe (default = dry-run)'
        required: false
        default: '0'
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report metered usage to Stripe meter
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          # r80 GO-LIVE (2026-06-04): scheduled run bills LIVE (operator confirmed
          # Meter event_name=dchub_api_call + a green live test). Manual dispatch
          # still respects 'live' (defaults dry-run) for safe re-testing.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.live }}" = "1" ]; then DRY='0'; else DRY='1'; fi
          echo "report-to-stripe dry_run=$DRY"
          resp=$(curl -sS -X POST \
            "https://dchub-backend-production.up.railway.app/api/v1/billing/report-to-stripe?dry_run=$DRY" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -w "\nHTTP %{http_code}")
          echo "$resp" | head -c 4000; echo
          # r80 (2026-06-04): fail LOUD if any customer failed to report - the
          # usual cause is the Stripe Meter event_name != dchub_api_call, which
          # silently bills $0. (Only meaningful on a live run.)
          if printf "%s" "$resp" | grep -q '"status": *"error"'; then
            echo "::error::metered-report: a customer FAILED to report to the Stripe Meter (likely event_name != dchub_api_call) - metered billing may be \$0"; exit 1
          fi
          if ! printf "%s" "$resp" | grep -q "HTTP 200"; then
            echo "::error::metered-report: report-to-stripe returned non-200"; exit 1
          fi
