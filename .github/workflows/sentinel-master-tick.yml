name: Sentinel Master Tick (health → cache → classify loop)

# The Site Sentinel "master shell": one orchestrated tick — parallel scan +
# edge/cache probe → KV + R2 persist → cache-coverage & latency-regression
# classify → human-gated tier-aware-cache digest. Kill switch:
# SENTINEL_MASTER_DISABLED=1 on Railway. Belt-and-suspenders with the
# dchub-scheduler cron (either driver is fine; the tick is idempotent + locked).

on:
  schedule:
    - cron: '25 1,5,9,13,17,21 * * *'   # every 4h at :25 (scheduler runs :20)
  workflow_dispatch: {}

jobs:
  sentinel-master-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Run one Sentinel master tick
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning ::DCHUB_ADMIN_KEY secret not set — skipping (fail-safe)"
            exit 0
          fi
          # Hit the Railway origin directly (not dchub.cloud) — CF zone/cache can
          # shadow a stale 404 on POST admin paths. Cache-buster for good measure.
          BASE="${DCHUB_BACKEND_BASE:-https://dchub-backend-production.up.railway.app}"
          URL="$BASE/api/v1/admin/sentinel/master-tick?cb=${GITHUB_RUN_ID}"
          echo "POST $URL"
          # Fire-and-forget: the endpoint 202s immediately; the cycle runs in the
          # background on the worker. Report lands at GET .../master-tick/last.
          #
          # ★ 2026-08-19: same defect and same fix as brain-master-tick.yml —
          # no status was read, so the handler's ack, main.py's relayed 202
          # ({"delegated_to": "worker", "completed": false}, returned when the
          # 15s relay budget expires) and a 500 all printed `ok: None` and
          # exited 0. Both 202s mean the cycle is running, so both exit 0; only
          # one is evidence the handler accepted it, and we now say which.
          # Also invisible to tests/test_delegated_202_crons.py until the same
          # commit taught it to resolve a path held in $URL.
          BODY=/tmp/sentinel-master-tick.json
          http=$(curl -sS --max-time 60 -o "$BODY" -w '%{http_code}' \
                   -X POST "$URL" -H "X-Admin-Key: $ADMIN_KEY") || http="000"
          echo "sentinel master-tick HTTP $http"
          case "$http" in
            000)
              echo "::error ::curl failed outright (DNS/TLS/timeout) — no HTTP response; the cycle may not have started"
              exit 1 ;;
            2*)
              python3 - "$BODY" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print("::warning ::ack body unreadable (%s) — accepted, contents UNKNOWN"
                    % type(e).__name__)
              sys.exit(0)
          if d.get("delegated_to") == "worker" and d.get("completed") is False:
              print("::warning ::relayed to dchub-worker and still running past the "
                    "relay budget — the cycle IS running, but its ack was not "
                    "observed. started is UNKNOWN for this run, not false. "
                    "Outcome: GET /api/v1/admin/sentinel/master-tick/last")
              sys.exit(0)
          print("ok:", d.get("ok"))
          print("started:", d.get("started"))
          print("note:", d.get("note") or d.get("error") or d.get("reason") or "")
          PY
              ;;
            *)
              echo "::error ::HTTP $http from the sentinel master-tick trigger — the cycle did NOT start"
              head -c 400 "$BODY" 2>/dev/null || true; echo
              exit 1 ;;
          esac
