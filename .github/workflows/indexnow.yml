name: IndexNow Submit

# 2026-06-07: instant search indexing for Bing/Yandex/Seznam. Pings IndexNow with
# the most-recent sitemap URLs every 6h so fresh /facilities/* and /news/* pages
# get indexed in minutes instead of waiting for a crawl. Needs DCHUB_ADMIN_KEY
# (repo secret) — the submit endpoint is admin-gated.

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit CHANGED facilities (cursor delta) + a small recent net to IndexNow
        run: |
          # F7 (2026-09-02): this step used to call ?facilities=1&recent=1&n=2000 —
          # the newest 2,000 facilities BY ID (not "changed") plus the 2,000
          # most-recent sitemap URLs — so the same ~4,000 unchanged URLs went to
          # Bing every 6h (~16K/day; the last 4 runs each reported submitted=4000).
          # IndexNow asks for changed URLs only and de-prioritises repeated
          # identical batches. `delta=1` is the cursor path
          # (routes/indexnow.py ping_new_facilities): facilities newer than the
          # last successfully pinged id, cursor advanced only on a 2xx, so a
          # failed submit retries next run and a quiet period submits nothing.
          # `recent=1&n=200` keeps a small belt-and-suspenders net for
          # news/press (those also ping in-process at publish time).
          # 2026-06-08: hit the Railway ORIGIN directly — the api.dchub.cloud
          # zone-worker proxy timed out on large batches (503 "backend
          # unreachable" while the backend was healthy). Retry 3x for transient
          # deploy windows.
          ORIGIN="https://dchub-backend-production.up.railway.app"
          submit() {  # $1 = label, $2 = query string
            local code=000 attempt
            for attempt in 1 2 3; do
              code=$(curl -sS -m 90 -X POST \
                -H "X-Admin-Key: ${{ secrets.DCHUB_ADMIN_KEY }}" \
                -o body.json -w "%{http_code}" \
                "$ORIGIN/api/v1/admin/indexnow?$2" || echo 000)
              echo "$1 attempt $attempt → HTTP $code"; head -c 300 body.json 2>/dev/null; echo ""
              [ "$code" = "200" ] && break
              [ "$attempt" -lt 3 ] && sleep 10
            done
            # IndexNow is best-effort (news/press also ping in-process at publish
            # time), so a persistent non-200 is a WARNING, not a hard CI failure —
            # it just retries next schedule. The real page/backend guards are
            # route-smoke + surveillance.
            if [ "$code" = "200" ]; then
              echo "✅ $1 submitted"
            else
              echo "::warning::IndexNow $1 non-200 ($code) after 3 tries — best-effort, retries next run"
            fi
          }
          submit "facility delta" "delta=1&n=5000"
          submit "recent net" "recent=1&n=200"
          exit 0

      - name: Submit key SEO pages explicitly (leaderboard, MCP standing, DCPI)
        run: |
          # 2026-06-08: explicitly re-ping the high-value structured pages every run so
          # Perplexity/Google/Bing cite the LIVE leaderboard instead of stale LinkedIn posts.
          ORIGIN="https://dchub-backend-production.up.railway.app"
          curl -sS -m 60 -X POST \
            -H "X-Admin-Key: ${{ secrets.DCHUB_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{"urls":["https://dchub.cloud/dcpi/leaderboard","https://dchub.cloud/mcp-standing","https://dchub.cloud/dcpi"]}' \
            "$ORIGIN/api/v1/admin/indexnow" | head -c 400
          echo ""
          exit 0
