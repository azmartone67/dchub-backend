name: Post-Deploy Smoke Test
# Runs after every push to main (once the origin runs the pushed commit),
# and every 30 min as a safety net. Fails the build — and pings you —
# on any gated-endpoint regression OR on a 2026-04-28 regression.

on:
  push:
    branches: [main]
  schedule:
    - cron: '15-59/30 * * * *'
  workflow_dispatch:

# Without this, GITHUB_TOKEN is read-only and the failure-notify step below
# dies with "Resource not accessible by integration (createIssue)".
permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 10 min deploy wait + the 6.5 min the smoke had inside the old 8.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet psycopg2-binary requests

      # ★ 2026-09-11 — WAS `sleep 90`. Railway's 39 most recent swaps of this
      # service took 111-202s from deployment created to previous deployment
      # removed, so the smoke below routinely started before the new build was
      # serving: for 9923d803d (#4385) it ran 06:03:40-06:04:01Z, and the
      # origin first served the new code at 06:04:22Z — a green smoke of the
      # PREVIOUS build, reported as this commit. Now the step waits for the
      # commit itself (scripts/wait_for_deployed_commit.py) and fails if it
      # never goes live, which is a post-deploy failure in its own right.
      - name: Wait until the origin runs this commit
        id: deploy_wait
        if: github.event_name == 'push'
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECT_SHA: ${{ github.sha }}
        run: python3 scripts/wait_for_deployed_commit.py --expect "$EXPECT_SHA" --timeout 600

      - name: Run main smoke test (Railway / DB / MCP)
        id: smoke
        env:
          DCHUB_API_BASE:    https://dchub-backend-production.up.railway.app
          DCHUB_ADMIN_KEY:   ${{ secrets.DCHUB_ADMIN_KEY }}
          DCHUB_API_KEY:     ${{ secrets.DCHUB_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -f tools/fixkit/dchub_qa_v2.py ]; then
            python3 tools/fixkit/dchub_qa_v2.py --base https://dchub.cloud --report report.json
          elif [ -f smoke_test.py ]; then
            python3 smoke_test.py
          elif [ -f dchub-qa.py ]; then
            python3 dchub-qa.py
          else
            echo "::error::No smoke script found"
            exit 1
          fi

      - name: Upload main smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: report.json
          if-no-files-found: ignore

      # DCHUB-REGRESSION-2026-04-28: extra checks for the 2026-04-28 fixes
      # (press-release daily brief, Explorer, MCP discovery, coord-parser,
      #  right-panel CSS, Worker version, pr_queue integrity).
      # always() so a failed main smoke does not skip it — but never after a
      # failed deploy wait, which would probe the OLD build as this commit.
      - name: Run 2026-04-28 regression smoke
        if: always() && steps.deploy_wait.outcome != 'failure'
        run: |
          if [ -f dchub-frontend/qa/smoke_regression_2026_04_28.py ]; then
            python3 dchub-frontend/qa/smoke_regression_2026_04_28.py \
              --base https://dchub.cloud \
              --report regression-report.json
          else
            echo "::warning::regression smoke not present at dchub-frontend/qa/smoke_regression_2026_04_28.py — skipped"
          fi

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression-report.json
          if-no-files-found: ignore

      # Single notify step — gated on SLACK_WEBHOOK_URL being present so we
      # never crash with "Need to provide at least one botToken or webhookUrl".
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret not set — no Slack ping."
            echo "::warning::The failure is still filed as an issue by the next step."
            echo "::warning::Add the secret at Settings → Secrets → Actions to get Slack too."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":rotating_light: DC Hub smoke FAILED — run ${{ github.run_id }}\\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notify POST failed (network/webhook invalid)"

      # Filing an issue is the only failure channel that needs no new secret,
      # so it has to actually work. It did not: the workflow declared no
      # `permissions`, GITHUB_TOKEN was read-only, `gh issue create` failed
      # with "Resource not accessible by integration" — and `|| true` ate it.
      # With Slack unset too, a CRITICAL smoke run reached nobody.
      #
      # The title is deliberately stable. This runs on every push to main AND
      # every 30 min, so a per-run title (the old `on $(date)`) would file ~48
      # issues a day once the token could actually create them.
      - name: Open / update GitHub issue on smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WAIT_OUTCOME: ${{ steps.deploy_wait.outcome }}
        run: |
          title="Post-Deploy Smoke Test failing on main"
          {
            echo "Smoke failed on \`${GITHUB_SHA:0:7}\` — [run log](${RUN_URL})."
            echo
            if [ "${WAIT_OUTCOME:-}" = "failure" ]; then
              echo "**The deploy wait failed.** The origin was never confirmed running"
              echo "this commit (the wait step's log says whether it never went live or"
              echo "could not be read), so nothing was smoke-tested against it."
              echo
            fi
            if [ -f report.json ]; then
              echo "**Failing endpoint checks**"
              echo
              # `.issue` usually already reads "HTTP 308", so only append it
              # when it says something the status code does not.
              jq -r '.checks[]? | select(.verdict == "fail")
                     | "- `\(.name)` \(.path // "") → HTTP \(.status_code // "?")"
                       + (if (.issue // "") == "" or (.issue == "HTTP \(.status_code)")
                          then "" else " — \(.issue)" end)' report.json
              echo
            fi
            if [ -f regression-report.json ]; then
              echo "**Failing regression checks**"
              echo
              jq -r '.results[]? | select(.ok == false)
                     | "- `\(.id) \(.name)` → \(.detail // "")"' regression-report.json
              echo
            fi
            echo "_Bumped on each failing run. Close by hand once smoke is green._"
          } > smoke-issue-body.md

          existing=$(gh issue list --state open --search "in:title \"$title\"" \
                       --json number --jq '.[0].number' || echo "")
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file smoke-issue-body.md
            echo "::notice::Bumped existing issue #$existing"
          else
            gh issue create --title "$title" --body-file smoke-issue-body.md \
              --label workflow-failure
          fi
