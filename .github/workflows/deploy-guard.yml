name: Deploy Guard

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # ★2026-09-06 — schedule fallback. This lane used to run only on push to
    # main, and a push made with GITHUB_TOKEN creates NO workflow run. When
    # auto-enable-automerge armed merges with that token, 17 of 24 commits
    # landed without this ever running. The token is fixed; this is the
    # belt. A post-merge gate reachable only by `push` is one bot merge away
    # from silence, whatever the token happens to be today.
    # This one was the most exposed of the five: push-only, with no
    # pull_request run and no manual escape hatch either.
    - cron: '36 */3 * * *'

# 2026-08-10: this workflow files a GitHub issue when it fails, but the repo's
# default_workflow_permissions is "read", so every attempt died with
#   GraphQL: Resource not accessible by integration (createIssue)
# and `|| true` swallowed the refusal — the alarm looked wired and filed
# nothing. Declaring ANY permission resets the rest to none, so the read scopes
# these jobs actually use (checkout, `gh run`/`gh api` against Actions) are
# listed explicitly rather than inherited.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  deploy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        # MUST match the production runtime (nixpacks.toml: python-3.13). The
        # guard ran 3.11 while prod ran 3.13, so it false-alarmed RED for days
        # on valid 3.12+ syntax (e.g. PEP 701 backslashes in f-strings that
        # prod accepts) — cry-wolf that also masked any real 3.13 break.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Syntax check all Python files
        run: |
          echo "Checking Python syntax..."
          ERRORS=0
          for f in $(find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*"); do
            if ! python -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>/dev/null; then
              echo "FAIL: $f"
              python -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>&1 || true
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "$ERRORS file(s) have syntax errors"
            exit 1
          fi
          echo "All Python files pass syntax check"

      - name: Verify railway.json healthcheck
        run: |
          python3 -c "
          import json, sys
          with open('railway.json') as f:
              config = json.load(f)
          hc = config.get('deploy', {}).get('healthcheckPath', '')
          if not hc:
              print('railway.json missing healthcheckPath')
              sys.exit(1)
          print(f'railway.json OK: healthcheck={hc}')
          "

      - name: Scan for dangerous patterns
        run: |
          # MCP deadlock check
          if grep -nE '^[^#]*DCHUB_API_BASE\s*[=:]\s*["'"'"']?[^"'"'"'#]*(127\.0\.0\.1|localhost)' dchub_mcp_server.py 2>/dev/null; then
            echo "DCHUB_API_BASE points to localhost - MCP deadlock risk"
            exit 1
          fi
          echo "No dangerous patterns found"

      - name: Notify on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R azmartone67/dchub-backend \
            --title "[workflow-failed] ${{ github.workflow }} on $(date -u +%Y-%m-%d_%H:%M)" \
            --body "Workflow run ${{ github.run_id }} failed. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label workflow-failure || true
