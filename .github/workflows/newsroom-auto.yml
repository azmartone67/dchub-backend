name: Self-Running Newsroom
on:
  schedule:
    # Phase QQQ (2026-05-16): bumped from every 6h to every 3h. Radar
    # was breaching news at 24h vs 18h SLA because a single missed run
    # at every-6h pushed us past 12h between ingests. 3h cadence means
    # one miss still leaves us under SLA.
    - cron: '25 */3 * * *'   # every 3 hours
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          # /press/scan is admin/cron-gated (it auto-publishes + emails dev-key
          # holders) — send the admin key. Skip cleanly if the secret is unset.
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::warning::DCHUB_ADMIN_KEY not set — skipping"; exit 0; fi
          curl -sS -X POST "https://dchub.cloud/api/v1/press/scan" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            | python3 -m json.tool
