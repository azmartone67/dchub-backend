# ★ 2026-09-22 — SCHEDULE RETIRED. MANUAL ONLY. (owner decision)
#
# /api/jobs/infrastructure-sync has one real leg left — fiber discovery via
# fiber_network_discovery.run_fiber_discovery — and that leg has NO SOURCE:
# PeeringDB /api/ix carries no coordinates, and on 2026-09-07 the owner ruled
# that pairing PeeringDB facilities into synthetic routes is not an acceptable
# route source. So every run was an honest 500 (fiber no_source), and this
# workflow went red every day after 2026-09-02 with nothing any PR could do
# about it. The owner chose to stop running the sourceless step rather than
# carry a red nobody can clear. Fiber routes still arrive through their real
# lanes, which this retirement does not touch — measured 2026-09-23,
# fiber_routes rows created in the prior 30 days: kmz 1,863, peeringdb 1,179
# (the fiber_integration carrier/PeeringDB syncs), osm 2.
#
# Retired in lockstep:
#   · this file's cron and its dead-man beat. The ledger row for feed
#     'daily-infra-sync' must also be removed once, by
#     POST /api/v1/admin/ingest-runs/purge {"feed":"daily-infra-sync"} —
#     otherwise its last `error` beat sits on /api/v1/ops/deadman and ages
#     into STALE with nothing left to refresh it;
#   · dchub-jobs.yml's '0 1 * * *' arm, the endpoint's other scheduled caller
#     (its dropdown entry too: that workflow judges a relayed 202 as success);
#   · brain_consistency_radar._INTENTIONAL_STALE_CRONS += 'infrastructure-sync',
#     so check_cron_freshness does not file cron_silently_dead about a job
#     nothing is supposed to fire.
#
# ★ WHY THE FILE STAYS. Deleting it would leave GitHub carrying it as
# state=deleted with a run inside 60 days — exactly the shape
# routes/ingestion_integrity_master_shell.py `workflow_present` convicts as a
# GHOST (it was built from this file's 16-day disappearance in July).
# Dispatch-only is the retirement that lane can read.
#
# ★ TO RE-SCHEDULE: only once run_fiber_discovery has a real surveyed source
# (the still-open owner item of 2026-09-07: NTIA BEAD / FCC BDC, or retuning
# the fiber SLA). Restore the cron AND a dead-man beat together — a beat with
# no cron ages to a red that means nothing, and a cron with no beat is
# invisible to /api/v1/ops/deadman.
#
# ★ A manual run does NOT beat the dead-man board. The feed is retired; a
# hand-fired beat would re-create it with a 30h cadence and it would read
# STALE two days later.
#
# ★ A 202 IS NOT A VERDICT — AND IS NO LONGER JUDGED AS ONE. The endpoint is
# in main.py's _WORKER_PROXY_POST_PATHS + _WORKER_PROXY_SYNC_PATHS: web relays
# it to dchub-worker on a 180s budget and answers 202 {"completed": false}
# when the job outlives it (measured 2026-09-23 01:16 -> 01:19, 193s). The
# previous body said "a 202 carries no verdict" in a comment and then judged
# the empty 202 body anyway — loaders_total=0, "NO loader succeeded (0/0)" —
# which is the red it printed every day. A 202 is now POLLED: the completion
# watermark is cron_last_run via GET /api/jobs/last-run (read its docstring in
# routes/jobs_routes.py). last_completed_at is stamped only by the process that
# actually RAN the handler, and last_status is that handler's own verdict
# ('ok' for a 2xx, 'http_500' for the honest no_source failure).
#
# History (2026-08-10 restore): the pre-restore body sent X-Internal-Key (a
# 401 against _require_admin_key), could not go red (`set +e`, `exit 0`),
# parsed a field the handler never returns, and went through the Cloudflare
# edge. Those four stay fixed below: X-Admin-Key, fail-closed, the handler's
# real fields, Railway origin direct.
name: daily-infra-sync (schedule retired — manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run /api/jobs/infrastructure-sync and judge the handler's own verdict
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          set -uo pipefail
          # Strip control characters: a secret stored with a trailing newline
          # makes curl refuse to send (exit 43) before any socket opens.
          RAILWAY=$(printf '%s' "${BACKEND_URL:-https://dchub-backend-production.up.railway.app}" | tr -d '\r\n[:space:]')
          ADMIN_KEY=$(printf '%s' "${ADMIN_KEY:-}" | tr -d '\r\n[:space:]')
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::DCHUB_ADMIN_KEY secret not set — the sync would 401 silently"
            exit 1
          fi
          JOB=infrastructure-sync
          T="${RUNNER_TEMP:-/tmp}"

          # Prints "<last_completed_at>|<last_status>" from cron_last_run, or
          # nothing when the watermark could not be read (UNKNOWN, never "0").
          read_watermark() {
            local code
            code=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
              -o "$T/wm.json" -w '%{http_code}' \
              "$RAILWAY/api/jobs/last-run?job=$JOB") || code="000"
            if [ "$code" != "200" ]; then
              echo "::warning::/api/jobs/last-run returned HTTP $code — watermark UNKNOWN for this read" >&2
              return 0
            fi
            python3 -c "import sys,json;r=((json.load(sys.stdin).get('jobs') or {}).get('$JOB') or {});print('%s|%s' % (r.get('last_completed_at') or '', r.get('last_status') or ''))" \
              < "$T/wm.json" 2>/dev/null || true
          }

          BEFORE=$(read_watermark)
          BEFORE_AT="${BEFORE%%|*}"
          echo "pre-run $JOB last_completed_at=${BEFORE_AT:-<none>}"
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          CODE=$(curl -sS --max-time 300 -o "$T/infra.json" -w '%{http_code}' \
            -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            "$RAILWAY/api/jobs/$JOB" || echo 000)
          echo "HTTP $CODE (sent $START)"
          head -c 2000 "$T/infra.json" || true
          echo ""

          if [ "$CODE" = "202" ]; then
            echo "::notice::$JOB delegated to dchub-worker (202, no verdict in the body) — polling /api/jobs/last-run for the completion watermark"
            DONE=""
            for i in $(seq 1 16); do
              sleep 30
              AFTER=$(read_watermark)
              AFTER_AT="${AFTER%%|*}"
              echo "poll $i/16 last_completed_at=${AFTER_AT:-<none>}"
              # A MOVED watermark is the signal. With no BEFORE (the pre-run
              # read failed) "moved" is unknowable, so fall back to "stamped
              # after we sent the POST" — otherwise the previous run's
              # timestamp would pass as this one's completion.
              if [ -n "$AFTER_AT" ]; then
                if [ -n "$BEFORE_AT" ]; then
                  [ "$AFTER_AT" != "$BEFORE_AT" ] && DONE="$AFTER"
                elif [ "$AFTER_AT" \> "$START" ]; then
                  DONE="$AFTER"
                fi
              fi
              [ -n "$DONE" ] && break
            done
            if [ -z "$DONE" ]; then
              echo "::error::$JOB was delegated (202) but cron_last_run.last_completed_at never advanced in 8 min — the run did NOT complete (or the watermark is unreadable)"
              exit 1
            fi
            STATUS="${DONE#*|}"
            echo "completed on the worker at ${DONE%%|*} with last_status=${STATUS:-<none>}"
            if [ "$STATUS" = "ok" ]; then
              echo "::notice::$JOB completed OK on dchub-worker (the handler returned 2xx, which it does only when its errors list is empty)"
              exit 0
            fi
            echo "::error::$JOB completed on dchub-worker with last_status=${STATUS:-<none>} — that is the handler's own verdict. A 500 here is the fiber leg's honest no_source (see the 'JOB infrastructure-sync' line in the dchub-worker log for the reason)."
            exit 1
          fi

          # Anything but a 202 was answered in-band (the worker finished
          # inside the relay budget, or web ran it locally): the body IS the
          # verdict. `success` is computed by the handler from its errors.
          V=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));f=((d.get('results') or {}).get('fiber') or {});print('%s|%s|%s' % (d.get('success'), f.get('status'), str(f.get('error') or '')[:200]))" "$T/infra.json" 2>/dev/null || echo "unparseable||")
          echo "success=${V%%|*} fiber=$(printf '%s' "$V" | cut -d'|' -f2)"
          if [ "$CODE" = "200" ] && [ "${V%%|*}" = "True" ]; then
            echo "::notice::$JOB ran in-band and reported success"
            exit 0
          fi
          echo "::error::$JOB returned HTTP $CODE, success=${V%%|*}, fiber status=$(printf '%s' "$V" | cut -d'|' -f2): $(printf '%s' "$V" | cut -d'|' -f3-)"
          exit 1
