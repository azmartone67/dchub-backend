name: LinkedIn engagement sync (r70 — native measure→learn)

# Pulls native LinkedIn engagement (likes/comments) onto recent posts so the
# media engine can learn from what actually performs on-platform (the on-site
# press_engagement loop already feeds generation; this is the native half).
# 2026-08-20: this job's error line used to prescribe ONE repair — 'the token
# lacks r_organization_social, re-authorize the app'. That is a GUESS, and on
# 2026-08-17 it was disproven in this repo: introspectToken showed the scope
# WAS present and the 403 was an app-level product entitlement instead. The
# Python was corrected that day to relay LinkedIn's own message; this workflow
# was not, so it kept sending the owner to re-consent — a repair that cannot
# work for this error. An alarm that names the wrong fix costs more than one
# that names none.
# Fail-soft: no-ops until the LinkedIn token has the r_organization_social
# scope. Railway-origin-direct + admin-keyed; skips cleanly if the secret is
# unset. Verify after a real run: GET /api/linkedin/status or query
# linkedin_posts.likes/comments.

on:
  schedule:
    - cron: '40 14 * * *'   # daily 14:40 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BASE: https://dchub-backend-production.up.railway.app

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sync LinkedIn engagement
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::warning::DCHUB_ADMIN_KEY not set — skipping"; exit 0; fi
          BODY=$(curl -sS --max-time 120 -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            "$RAILWAY_BASE/api/linkedin/engagement-sync?days=21")
          echo "$BODY" | head -c 1500; echo
          # 2026-08-17: the endpoint answers ok:true even when a half updated
          # NOTHING — this job piped that to `head` and stayed green for 12 days
          # while every post's impressions froze.
          #
          # 2026-08-21: it then over-corrected. `grep -q scope_or_auth` fails the
          # whole run if EITHER half is blocked, and the two halves have
          # DIFFERENT causes and different owners:
          #   impressions -> partnerApiOrganizationalEntityShareStatistics
          #   engagement  -> partnerApiSocialActions
          # A new token on 08-20 fixed impressions (checked=79 updated=78,
          # reason=null) while engagement stayed 403. The old grep called that
          # a total NO-OP and would have stayed red forever over a half that had
          # just been repaired — hiding the recovery and training everyone to
          # ignore the alarm.
          #
          # Judged per half, by the thing each half is FOR:
          #   impressions blocked -> ERROR. This is the job's purpose (the
          #                          white-glove media lane reads it) and it is
          #                          demonstrably fixable.
          #   engagement blocked  -> WARNING. Gated on a LinkedIn product
          #                          entitlement the owner cannot grant
          #                          themselves; a daily red teaches nothing.
          python3 - "$BODY" <<'PY'
          import json, sys
          try:
              d = json.loads(sys.argv[1])
          except Exception as e:
              print(f"::error::sync response was not JSON ({e}) — treating as failure, "
                    f"because an unparseable body is not evidence of success")
              sys.exit(1)

          fixes = ("If the message says 'Not enough permissions to access: partnerApi...' "
                   "this is APP-LEVEL PRODUCT ENTITLEMENT and RE-AUTHORIZING CANNOT FIX IT "
                   "(proven 2026-08-17: introspectToken showed the scope WAS present and the "
                   "403 persisted). Fix = activate/verify the product on the LinkedIn app, "
                   "then re-consent ONCE. Only an expired/missing-scope message makes "
                   "re-authorizing the right repair.")

          rc = 0
          for half, fatal in (("impressions", True), ("engagement", False)):
              h = d.get(half) or {}
              reason, updated, checked = h.get("reason"), h.get("updated"), h.get("checked")
              if reason:
                  lvl = "error" if fatal else "warning"
                  print(f"::{lvl}::LinkedIn {half} is a NO-OP (checked={checked} updated={updated}). "
                        f"LinkedIn said: {reason}. {fixes}")
                  if fatal:
                      rc = 1
              else:
                  print(f"::notice::LinkedIn {half} OK — checked={checked} updated={updated}")
          sys.exit(rc)
          PY
