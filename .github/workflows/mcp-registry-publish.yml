# Manual BACKEND FAILOVER publish to the official MCP Registry.
#
# Registry ownership: the entry `cloud.dchub/datacenter-power-grid-fiber` is OWNED by the
# dchub-mcp-server repo (PRIMARY publishers: registry-refresh.yml +
# daily-manifest-sync.yml). This workflow is the BACKEND's on-demand failover —
# a manual "force a publish now" button for when the primary path is down and you
# don't want to wait for the daily MCP Registry Daily Sync
# (.github/workflows/mcp-registry-weekly-sync.yml) to catch up. We run SPOF-free.
#
# DRIFT-PROOF: like the daily sync, this NEVER publishes the backend's own
# server.json (stale by design). It fetches the CANONICAL server.json from the
# owning repo's source of truth — the live server first (CANON_LIVE), GitHub raw
# as fallback (CANON_RAW), so neither source is a single point of failure — and
# publishes THAT, and only if the registry is behind it. The backend can only
# ever push the source-of-truth version.
#
# ONE-TIME SETUP (owner):
#   The ed25519 private key (hex) lives at ~/.mcp-publisher/dchub-registry-key.hex
#   and is the same key whose PUBLIC half is the dchub.cloud apex TXT record
#   (v=MCPv1; k=ed25519; p=ClgJ51i8...). Add it as a repo secret — once:
#
#     gh secret set MCP_REGISTRY_PRIVATE_KEY < ~/.mcp-publisher/dchub-registry-key.hex
#
#   NEVER commit the key to the repo (it was leaked once and rotated — see
#   MCP_REGISTRY_DNS_AUTH_TODO.md).
#
# NOTE: the push-on-server.json-change trigger was REMOVED (2026-08-07). The
# backend no longer publishes its own server.json, so editing it must not fire a
# registry publish. Version bumps happen in the dchub-mcp-server repo; its own
# publishers handle them, with this + the daily sync as failover.

name: Publish to MCP Registry (backend failover, manual)

on:
  workflow_dispatch: {}   # manual "Run workflow" button only

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

env:
  # Canonical sources tried in order (live server, then GitHub raw) — two
  # independent sources so neither is a single point of failure. Both serve the
  # owning repo's exact registry-schema body.
  CANON_LIVE: "https://dchub-mcp-server-production.up.railway.app/server.json"
  CANON_RAW: "https://raw.githubusercontent.com/azmartone67/dchub-mcp-server/main/server.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch + validate canonical server.json
        id: canon
        run: |
          # Try the live server first, then GitHub raw; validate each candidate
          # is the cloud.dchub entry with a version before trusting it. If BOTH
          # fail, refuse to publish (never fall back to a local copy).
          V=""; SRC="none"
          for u in "$CANON_LIVE" "$CANON_RAW"; do
            curl -s --max-time 20 "$u" -o server.json || continue
            V=$(python3 -c "import json;d=json.load(open('server.json'));assert d.get('name')=='cloud.dchub/datacenter-power-grid-fiber';v=d.get('version') or '';assert v;print(v)" 2>/dev/null)
            if [ -n "$V" ]; then SRC="$u"; break; fi
          done
          if [ -z "$V" ]; then
            echo "::error::could not fetch/validate canonical server.json from EITHER source (CANON_LIVE, CANON_RAW) — refusing to publish (will NOT fall back to a local copy)."
            exit 1
          fi
          echo "canon=$V" >> "$GITHUB_OUTPUT"
          echo "Canonical server.json version: $V (source: $SRC)"

      - name: Check what's already published
        id: live
        run: |
          # ACTUAL latest published = isLatest entry (fallback newest publishedAt),
          # NOT vs[-1] (lexicographic array order returns e.g. 2.9.3 over 2.11.1).
          LIVE=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=cloud.dchub" | python3 -c "import json,sys; d=json.load(sys.stdin).get('servers',[]); c=[x for x in d if x['server'].get('name')=='cloud.dchub/datacenter-power-grid-fiber']; m=lambda x:x.get('_meta',{}).get('io.modelcontextprotocol.registry/official',{}); l=[x for x in c if m(x).get('isLatest')]; c.sort(key=lambda x:m(x).get('publishedAt','')); print(l[0]['server']['version'] if l else (c[-1]['server']['version'] if c else 'none'))")
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "Live registry version: $LIVE"

      - name: Skip if registry already at canonical
        if: steps.canon.outputs.canon == steps.live.outputs.live
        run: echo "::notice::registry already has canonical v${{ steps.canon.outputs.canon }} — nothing to do."

      - name: Install mcp-publisher
        if: steps.canon.outputs.canon != steps.live.outputs.live
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null && echo "mcp-publisher installed"

      - name: Authenticate (DNS) + publish canonical
        if: steps.canon.outputs.canon != steps.live.outputs.live
        env:
          MCP_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY secret is not set. See the header of this workflow for one-time setup."
            exit 1
          fi
          # ./server.json is the validated canonical body from the first step.
          ./mcp-publisher login dns --domain dchub.cloud --private-key "$MCP_KEY"
          ./mcp-publisher publish

      - name: Verify live
        if: steps.canon.outputs.canon != steps.live.outputs.live
        run: |
          sleep 5
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=cloud.dchub" | python3 -c "import json,sys; data=json.load(sys.stdin).get('servers',[]); m=[x['server'] for x in data if x['server'].get('name')=='cloud.dchub/datacenter-power-grid-fiber']; print('Published versions:', [s['version'] for s in m]); assert any(s['version']=='${{ steps.canon.outputs.canon }}' for s in m), 'new version not visible yet'; print('OK: v${{ steps.canon.outputs.canon }} is live')"
