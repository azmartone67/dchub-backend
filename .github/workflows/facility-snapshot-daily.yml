name: Facility Count Daily Snapshot
# Phase HHHH (2026-05-16): writes facility_count_snapshots row daily so
# the brain detector check_facility_count_stagnant has 7+ days of
# baseline to compute the delta against. Without this, the detector
# would never fire because there's no historical baseline.
on:
  schedule:
    - cron: '19 5 * * *'   # 05:17 UTC daily — offset from DCPI/news crons
  workflow_dispatch: {}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 3 was sized for seven short POSTs. The deep-dive step can now spend up to
    # 300s on its POST plus 5 min polling the worker watermark before deciding
    # — 3 would cancel the job mid-poll and hand tools/deadman/watch.py a
    # timeout instead of the answer.
    timeout-minutes: 20
    steps:
      - name: Write daily facility count snapshot
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::DCHUB_ADMIN_KEY secret not set"; exit 1; fi
          curl -sS --max-time 30 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "https://dchub.cloud/api/v1/facilities/snapshot" \
            | python3 -m json.tool
      # Phase MMMM (2026-05-16): also snapshot the brain radar finding
      # count so /transparency sparkline has 14d of baseline. Same cron
      # to avoid sprawl; idempotent UPSERT per day.
      - name: Write daily radar finding snapshot
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          curl -sS --max-time 30 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "https://dchub.cloud/api/v1/radar/snapshot" \
            | python3 -m json.tool
      # Phase 268 (2026-05-29): snapshot today's DCPI scores into
      # dcpi_daily_snapshots so /api/v1/dcpi/movers has 7d-old rows to
      # diff against. Previously, movers tried to read week_ago from
      # market_power_scores — but every writer there is UPDATE-in-place
      # (UNIQUE on market_slug), so the CTE always returned 0 rows and
      # excess_delta_7d was always 0. Idempotent UPSERT per (date, slug).
      # Hits Railway-direct to avoid CF edge timeouts on the chunked write.
      - name: Write daily DCPI snapshot
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          curl -sS --max-time 60 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "https://dchub-backend-production.up.railway.app/api/v1/dcpi/snapshot" \
            | python3 -m json.tool || true
      # Phase TTTT (2026-05-16): daily citation-hunter probe — asks
      # Claude 5 data-center research questions, tracks DC Hub mention
      # share. Requires ANTHROPIC_API_KEY env on Railway.
      - name: Citation hunter daily probe
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          curl -sS --max-time 120 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "https://dchub.cloud/api/v1/citations/hunt?queries=5" \
            | python3 -m json.tool || true
      # Phase XXXX (2026-05-16): daily competitor snapshot.
      - name: Competitor intel scan
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          curl -sS --max-time 60 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "https://dchub.cloud/api/v1/competitors/scan" \
            | python3 -m json.tool || true
      # Phase ZZZZ (2026-05-16): refresh 5 market deep-dives nightly.
      # Rotates through stalest first — full top-100 coverage in ~3 weeks.
      - name: Market deep-dive refresh (5 markets)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          # ★ 2026-08-19: this step could not observe its own job at all. Two
          # separate reasons, both fixed here.
          #
          # 1. IT WENT THROUGH THE EDGE. dchub.cloud applies CF's
          #    ROUTE_TIMEOUTS 15s default to admin POSTs, so a rotation of up
          #    to 15 sequential Claude calls was answered with the edge's 503
          #    long before the origin finished. The DCPI-snapshot step three
          #    above already hits the Railway origin for exactly this reason
          #    ("avoid CF edge timeouts on the chunked write"); this one was
          #    missed. Both the POST and the watermark poll now go origin-
          #    direct — the poll ESPECIALLY, because CF Rule #3 caches
          #    /api/v1/* with mode: override_origin, so a watermark read
          #    through the edge can return a cached value and never move.
          #
          # 2. IT READ NO STATUS CODE. /api/v1/markets/deep-dive/cron is in
          #    main.py's _WORKER_PROXY_POST_PATHS but NOT
          #    _WORKER_PROXY_SYNC_PATHS, so the origin relays it to
          #    dchub-worker on a 15s read budget
          #    (`_read_budget = 180 if request.path in
          #    _WORKER_PROXY_SYNC_PATHS else 15`) and answers honestly when
          #    the rotation outlives it:
          #
          #      {"success": true, "delegated_to": "worker",
          #       "completed": false, "note": "job still running on dchub-worker"}
          #
          #    `curl -sS ... | python3 -m json.tool || true` printed that
          #    envelope and exited 0, indistinguishable from a completed
          #    rotation — and tools/deadman/watch.py beats this feed off the
          #    run CONCLUSION (WORKFLOWS["facility-snapshot-daily.yml"] = 30),
          #    so the public board read green either way.
          #
          # A 202 means delegated-and-running: not run, not zero, not failed.
          # UNKNOWN. So: spawn and poll (the #2886 news-ner / #2929
          # brain-autonomy pattern).
          #
          # The watermark is /deep-dive/status last_cron_run, which
          # _record_cron_run() stamps at the END of every rotation including
          # one that regenerated nothing. It is deliberately NOT
          # MAX(generated_at): generate_for_market() writes nothing on
          # market_not_found, nothing on an _ask_claude_to_write error, and
          # its brief-guard seed is INSERT ... ON CONFLICT DO NOTHING — so a
          # rotation whose five targets are all guarded completes without
          # moving that column at all, and polling it would fail a healthy
          # cron. It is stored in the DB, so web and the worker read the SAME
          # value and that GET needs no worker-proxy allowlist entry — the
          # trap #2929 hit with /autonomy/status, a module global with one
          # never-written copy per service.
          #
          # A rotation that genuinely never runs still fails: the watermark
          # does not move and the poll below exits 1 on that.
          ORIGIN="https://dchub-backend-production.up.railway.app"
          read_watermark() {
            local code
            code=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
              -o watermark.json -w '%{http_code}' \
              "$ORIGIN/api/v1/markets/deep-dive/status") || code="000"
            if [ "$code" != "200" ]; then
              echo "::warning::/markets/deep-dive/status returned HTTP $code — watermark UNKNOWN for this read" >&2
              return 0
            fi
            python3 -c "import sys,json;print(json.load(sys.stdin).get('last_cron_run') or '')" \
              < watermark.json 2>/dev/null || true
          }

          BEFORE=$(read_watermark)
          echo "pre-run last_cron_run=${BEFORE:-<none>}"

          # Sent-at, in the same ISO-8601 UTC shape _record_cron_run() stamps,
          # so the two compare lexicographically. Only used when BEFORE is
          # unknown — see the poll below.
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          echo "post sent at $START"

          # --max-time 300 exceeds BOTH relay budgets (15s here, 180s if this
          # path is ever promoted to _WORKER_PROXY_SYNC_PATHS).
          http=$(curl -sS --max-time 300 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -o deepdive.json -w '%{http_code}' \
            "$ORIGIN/api/v1/markets/deep-dive/cron?count=5") || http="000"
          echo "HTTP $http"
          # `head -c` on a FILE, not a pipe: `echo "$body" | head -c N`
          # SIGPIPEs the echo once the body exceeds N and pipefail turns that
          # into a failed pipeline that errexit kills the step on. This body
          # carries five full narrative previews.
          head -c 2000 deepdive.json || true
          echo
          if [ "$http" = "202" ]; then
            echo "::notice::deep-dive rotation delegated to dchub-worker (202) — polling /deep-dive/status for the run watermark"
            ADVANCED=0
            for i in $(seq 1 10); do
              sleep 30
              AFTER=$(read_watermark)
              echo "poll $i/10 last_cron_run=${AFTER:-<none>}"
              # A moved watermark is the signal. When the pre-run read failed
              # BEFORE is empty and "moved" is unknowable, so fall back to
              # "stamped after we sent the POST" — otherwise YESTERDAY's
              # rotation would pass as this one. Comparing to BEFORE stays
              # primary because it is immune to runner/worker clock skew.
              ADV_THIS=0
              if [ -n "$AFTER" ]; then
                if [ -n "$BEFORE" ]; then
                  if [ "$AFTER" != "$BEFORE" ]; then ADV_THIS=1; fi
                elif [ "$AFTER" \> "$START" ]; then
                  ADV_THIS=1
                else
                  echo "poll $i/10 last_cron_run predates this run — stale, not this rotation"
                fi
              fi
              if [ "$ADV_THIS" = "1" ]; then
                ADVANCED=1
                echo "::notice::deep-dive rotation completed on the worker (last_cron_run ${BEFORE:-<none>} -> $AFTER)"
                break
              fi
            done
            if [ "$ADVANCED" != "1" ]; then
              echo "::error::deep-dive rotation was delegated (202) but /deep-dive/status last_cron_run never advanced in 5 min — the rotation did NOT complete"
              exit 1
            fi
            # No counters came back with the 202 and none are invented here.
            # Absence of a counter is UNKNOWN, never zero.
            echo "::notice::deep-dive rotation: generated_count UNKNOWN (a relayed 202 carries none) — completion judged by the /deep-dive/status watermark"
            exit 0
          fi
          if [ "$http" != "200" ]; then
            echo "::error::HTTP $http from $ORIGIN/api/v1/markets/deep-dive/cron — the rotation did NOT run (was silently green before this gate)"
            exit 1
          fi
          python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          g = d.get('generated_count')
          if g is None:
              # A 200 carrying no counter is a shape we do not understand —
              # NOT a zero-generation rotation. Conflating the two is what hid
              # the relay for as long as it hid.
              print(f'::warning::deep-dive cron returned 200 in an UNRECOGNISED shape (no generated_count): {sorted(d)}')
          else:
              # An OBSERVED zero is real information and stays visible: every
              # target brief-guarded, or Anthropic refusing.
              errs = [r.get('error') for r in (d.get('results') or []) if r.get('error')]
              print(f'::notice::deep-dive rotation: generated={g} of {len(d.get(\"results\") or [])} targets'
                    + (f' errors={errs}' if errs else ''))
          " < deepdive.json
      # `if: always()` so a red deep-dive step cannot cancel this one — the
      # rotation and the mention hunt are unrelated jobs sharing a cron, and
      # before this change the deep-dive step could not fail at all.
      # Phase HHHHH (2026-05-16): external mention hunter (HN + Reddit).
      - name: External backlink + mention hunt
        if: always()
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          curl -sS --max-time 60 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            "https://dchub.cloud/api/v1/mentions/hunt" \
            | python3 -m json.tool || true
