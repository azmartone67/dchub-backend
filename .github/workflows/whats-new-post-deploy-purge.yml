name: What's New post-deploy purge

# ★ 2026-09-11 — WHY. dchub-backend#4405 merged seven What's New cards at
# 18:50:34Z. The feed served them, and https://dchub.cloud/whats-new showed the
# old fourteen for about ten more minutes. The page fetches
# /api/v1/whats-new?d=<UTC date>, and a request the OLD build answered during the
# deploy swap was stored twice: in the Pages worker's KV (fresh for 300s) and in
# the zone (rule 2, 3600s). A zone purge made while the KV copy was still fresh
# was answered from KV and stored again.
#
# This runs when a push changes what the feed publishes. It waits for the origin
# to run the commit; then scripts/purge_whats_new_after_deploy.py waits for the
# worker's copy to be current, purges the zone, and reads the URL the way the
# page does. It fails loudly, including when CLOUDFLARE_API_TOKEN is missing.

on:
  push:
    branches: [main]
    # ★★★ 2026-09-12 — THIS NAMED FOUR MODULES AND THE FEED READS EIGHTEEN.
    #
    # The comment above says this runs "when a push changes what the feed
    # publishes". It listed four files. /api/v1/whats-new is served by
    # routes/infra_growth.whats_new, and slicing that handler's import graph
    # returns 18 modules — SIXTEEN of them were absent here, including
    # util/deals, routes/dcpi, routes/claim_ledger and util/status_taxonomy.
    # A push changing one of those changed the feed, purged nothing, and left
    # dchub.cloud/whats-new serving the old copy for up to the zone TTL of
    # 3600s. Exactly the failure sitemap-snapshot.yml was fixed for in #4506,
    # found by sweeping every push paths: filter in this directory afterwards.
    #
    # ★ DERIVED, NOT REMEMBERED. scripts/workflow_trigger_modules.py holds the
    # entry point and the two escape hatches; tests/
    # test_workflow_trigger_paths_match_imports.py fails CI when this list and
    # the import graph disagree. Regenerate with:
    #     python3 scripts/workflow_trigger_modules.py --workflow whats-new-post-deploy-purge.yml
    #
    # ★ TWO ENTRIES ARE NOT IMPORTS AND CANNOT BE DERIVED:
    #   data/platform_updates.json      published_updates reads it off disk via
    #                                   STORE_PATH; editing it changes the feed
    #                                   with no code change at all.
    #   routes/capability_announcements.py  authors that JSON. The feed never
    #                                   imports it — over-broad, kept because a
    #                                   spurious purge is cheap. Stated, not hidden.
    paths:
      - '.github/workflows/whats-new-post-deploy-purge.yml'
      - 'ai_surface_canon.py'
      - 'canonical_stats.py'
      - 'data/platform_updates.json'
      - 'db_utils.py'
      - 'main.py'
      - 'monthly_quota.py'
      - 'routes/capability_announcements.py'
      - 'routes/claim_ledger.py'
      - 'routes/dcpi.py'
      - 'routes/infra_growth.py'
      - 'routes/infrastructure_data_routes.py'
      - 'routes/platform_updates.py'
      - 'scripts/purge_whats_new_after_deploy.py'
      - 'scripts/workflow_trigger_modules.py'
      - 'tier_registry.py'
      - 'util/dcpi_method.py'
      - 'util/dcpi_score_row.py'
      - 'util/deals.py'
      - 'util/deployability_rank.py'
      - 'util/dominant_source.py'
      - 'util/internal_fetch.py'
      - 'util/iso_taxonomy.py'
      - 'util/market_aliases.py'
      - 'util/status_taxonomy.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whats-new-post-deploy-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    # 10 min deploy wait, then up to 3 rounds of (worker freshness + a read).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Wait until the origin runs this commit
        if: github.event_name == 'push'
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECT_SHA: ${{ github.sha }}
        run: python3 scripts/wait_for_deployed_commit.py --expect "$EXPECT_SHA" --timeout 600

      - name: Purge the feed the page fetches, once the worker's copy is current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/purge_whats_new_after_deploy.py --edge https://dchub.cloud --origin https://dchub-backend-production.up.railway.app
