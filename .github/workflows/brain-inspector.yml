# Phase FF+25-followup-r9 (2026-05-20) — Brain Inspector cron.
# Runs every 6 hours. Reads every surface, asks Opus 4.7 to write a
# Markdown brief, persists it. Public read at /brain/brief.

name: Brain Inspector — proactive scan

on:
  schedule:
    # Every 6 hours at :07 past the hour (offset from other crons so
    # we don't dogpile the DB)
    - cron: '7 */6 * * *'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    # 5 was already tight — the deploy probe alone can burn 3 min before the
    # generate starts, and the retry below sleeps 75s. The generate step can
    # now also spend up to 300s on the POST plus 5 min polling the worker
    # watermark, so 5 would cancel the job mid-poll.
    timeout-minutes: 20
    steps:
      - name: Probe deploy readiness
        run: |
          # Phase r24: probe-first pattern. Poll the endpoint until it
          # returns 200/401/403 (i.e. the route IS deployed) before
          # firing the actual call. 404 = deploy lag, retry. Caps at
          # 6 attempts × 30s = 3 min max wait, then fails the job
          # rather than silently misfiring.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://dchub.cloud/api/v1/brain/models" \
              --max-time 10)
            if [ "$code" = "200" ]; then
              echo "deploy ready (attempt $i)"
              exit 0
            fi
            echo "  attempt $i: code=$code, waiting 30s…"
            sleep 30
          done
          echo "::error::Deploy probe failed after 6 attempts — endpoint not live"
          exit 1

      - name: Trigger Inspector
        id: gen
        run: |
          set -eo pipefail
          ADMIN_KEY="${{ secrets.DCHUB_ADMIN_KEY }}"
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::DCHUB_ADMIN_KEY secret not set"
            exit 1
          fi
          # r-inspector-retry (2026-08-17): one retry, 75s later, when the
          # first attempt yields a non-ok/unparsable response. The 06:19Z
          # failure that motivated this was Railway SIGTERMing the old
          # containers mid-request as an auto-merge deploy went live — the
          # ~48s generate died at ~21s with the edge's 502 JSON. Deploys land
          # every few minutes on busy mornings, so a single blind POST loses
          # a race it never needed to enter. Transient by evidence (prior and
          # next scheduled runs green); a second attempt after the swap
          # settles is the whole fix.
          # ★ 2026-08-19: this step read NO status code and had NO --max-time.
          # /api/v1/brain/brief/generate is in main.py's
          # _WORKER_PROXY_SYNC_PATHS, so web relays it to dchub-worker with a
          # 180s read budget (`_read_budget = 180 if request.path in
          # _WORKER_PROXY_SYNC_PATHS else 15`) and answers honestly when the
          # generate outlives it — the LLM narrative was observed at ~61s in
          # the 2026-07-11 pool audit, so this is the slow-morning case:
          #
          #   {"success": true, "delegated_to": "worker",
          #    "completed": false, "note": "job still running on dchub-worker"}
          #
          # That body parses, has no 'ok' and no 'id'. So: the retry below saw
          # ATTEMPT_OK=0 and burned its ONE retry on a generate that was
          # already running (two concurrent Opus calls, the exact thing L20
          # durability throttles); BRIEF_ID came out EMPTY; and both downstream
          # steps are `if: steps.gen.outputs.brief_id != ''`, so "Apply
          # recommendations" and "Draft PRs via L22" silently did not run. The
          # job stayed green — this cron does not beat the deadman board
          # directly, which is why it stayed quiet rather than red.
          #
          # A 202 means delegated-and-still-running: not failed, not "no
          # brief". So: spawn and poll (the #2886 news-ner / #2929
          # brain-autonomy pattern). The watermark is /brain/brief/latest id —
          # DB-backed (SELECT ... FROM brain_briefs WHERE error IS NULL), so
          # web and the worker read the SAME value and that GET needs no
          # worker-proxy allowlist entry, unlike /api/v1/brain/autonomy/status
          # in #2929 (a module global with one never-written copy per service).
          # brain_inspector deliberately does NOT persist an empty or errored
          # brief (r33-Q empty-brief-guard), so a moved id is proof a real,
          # content-bearing brief landed — and it IS the brief_id the two steps
          # below need, so they now run on the delegated path too.
          #
          # A generate that genuinely never lands still fails: the id does not
          # move and the poll exits 1 on that.
          ORIGIN="https://dchub-backend-production.up.railway.app"
          read_latest_id() {
            local code
            code=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
              -o latest.json -w '%{http_code}' \
              "$ORIGIN/api/v1/brain/brief/latest") || code="000"
            # 404 = no_brief_yet, a real and distinguishable state (the table
            # is empty), not a failed read. Empty watermark, no warning.
            if [ "$code" = "404" ]; then
              return 0
            fi
            if [ "$code" != "200" ]; then
              echo "::warning::/brain/brief/latest returned HTTP $code — watermark UNKNOWN for this read" >&2
              return 0
            fi
            python3 -c "import sys,json;print(json.load(sys.stdin).get('id') or '')" \
              < latest.json 2>/dev/null || true
          }
          BEFORE=$(read_latest_id)
          echo "pre-run latest brief id=${BEFORE:-<none>}"

          RESP=""
          CODE=""
          for ATTEMPT in 1 2; do
            # Origin-direct, and --max-time 300 exceeds the 180s relay budget
            # so the 202 can actually arrive. There was no --max-time at all
            # before, which is the opposite failure: curl would wait out a
            # wedged origin until the job timeout killed the step.
            CODE=$(curl -sS --max-time 300 -X POST \
              -H "X-Admin-Key: $ADMIN_KEY" \
              -H "User-Agent: DCHub-Inspector-Cron/1.0" \
              -o brief.json -w '%{http_code}' \
              "$ORIGIN/api/v1/brain/brief/generate") || CODE="000"
            RESP=$(cat brief.json 2>/dev/null || echo '{}')
            echo "attempt $ATTEMPT HTTP $CODE"
            # A 202 is NOT a failed attempt — retrying it would start a SECOND
            # generate while the first is still running on the worker.
            [ "$CODE" = "202" ] && break
            ATTEMPT_OK=$(echo "$RESP" | python3 -c "
          import sys, json
          try:
              print(1 if (json.load(sys.stdin) or {}).get('ok') else 0)
          except Exception:
              print(0)
          " 2>/dev/null || echo 0)
            [ "$ATTEMPT_OK" = "1" ] && break
            if [ "$ATTEMPT" = "1" ]; then
              echo "attempt 1 not ok (deploy-churn 502s are routine here) — retrying in 75s" >&2
              sleep 75
            fi
          done

          if [ "$CODE" = "202" ]; then
            echo "::notice::brief generate delegated to dchub-worker (202) — polling /brain/brief/latest for the new brief id"
            NEWID=""
            for i in $(seq 1 10); do
              sleep 30
              AFTER=$(read_latest_id)
              echo "poll $i/10 latest brief id=${AFTER:-<none>}"
              # An id that MOVED is the signal. Unlike a timestamp watermark
              # there is no stale-value ambiguity here: brain_briefs ids are a
              # BIGSERIAL, so a different id means a new row, and an id
              # appearing where there was none (the table was empty) means the
              # first brief ever. Both are this run's brief.
              if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then
                NEWID="$AFTER"
                echo "::notice::brief generated on the worker (latest id ${BEFORE:-<none>} -> $AFTER)"
                break
              fi
            done
            if [ -z "$NEWID" ]; then
              echo "::error::brief generate was delegated (202) but /brain/brief/latest id never advanced in 5 min — no brief was written"
              exit 1
            fi
            # The 202 carried no token counts, no duration and no summary, and
            # none are invented here. Absence of a counter is UNKNOWN, never
            # zero. The brief_id IS known, so the apply/draft-PR steps below
            # run exactly as they do on the synchronous path.
            echo "brief_id=$NEWID" >> "$GITHUB_OUTPUT"
            {
              echo "### Brain Brief #$NEWID"
              echo
              echo "- **Delegated to dchub-worker (202)** — the proxy returned before"
              echo "  the generate finished, so no per-run counters (model, tokens,"
              echo "  duration, summary) are available here. The brief itself landed:"
              echo "  /brain/brief/latest advanced ${BEFORE:-<none>} -> $NEWID."
              echo
              echo "Full brief: https://dchub.cloud/brain/brief"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$CODE" != "200" ]; then
            echo "::error::HTTP $CODE from $ORIGIN/api/v1/brain/brief/generate after $ATTEMPT attempt(s) — no brief was generated (this step exited 0 before this gate, and the two steps below silently skipped)"
            exit 1
          fi

          BRIEF_ID=$(echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('id') or '')
          ")
          echo "brief_id=$BRIEF_ID" >> "$GITHUB_OUTPUT"
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          ok = d.get('ok')
          if not ok:
            # 2026-08-12: FAILURE DIAGNOSTICS GO TO STDERR, NOT STDOUT.
            # This whole block's stdout is redirected to \$GITHUB_STEP_SUMMARY
            # (see the end of the command), which swallowed both the
            # ::warning:: annotation and the JSON dump. The 2026-08-12T00:36Z
            # run therefore produced ONE line of evidence — 'Process completed
            # with exit code 1' — with the actual error reachable only from the
            # run's web summary page, and absent from the annotations API.
            # stderr is not redirected, so it reaches the log.
            print(f'Inspector returned: {d.get(\"error\")}', file=sys.stderr)
            print(json.dumps(d, indent=2)[:600], file=sys.stderr)
            sys.exit(0 if d.get('error') == 'ANTHROPIC_API_KEY not set' else 1)
          print(f'### Brain Brief #{d.get(\"id\")}')
          print()
          print(f'- Model: {d.get(\"model\")}')
          print(f'- Tokens: {d.get(\"tokens_in\")} in / {d.get(\"tokens_out\")} out')
          print(f'- Duration: {d.get(\"duration_ms\")}ms')
          print(f'- Healthy: {d.get(\"healthy_count\")} · Degrading: {d.get(\"degrading_count\")} · Attention: {d.get(\"attention_count\")}')
          print()
          print(f'> {d.get(\"summary\", \"\")[:280]}')
          print()
          print(f'Full brief: https://dchub.cloud/brain/brief')
          " >> "$GITHUB_STEP_SUMMARY"

      # ── Apply the Inspector's recommendations to the autopilot.
      # Inspector recommendations fire through the same rate-limit
      # path as autonomous detector findings — Inspector can't override
      # safety. Recommendations that are already in cooldown will be
      # logged as rate_limited and not actually executed.
      - name: Apply recommendations
        if: steps.gen.outputs.brief_id != ''
        run: |
          set -eo pipefail
          ADMIN_KEY="${{ secrets.DCHUB_ADMIN_KEY }}"
          BID="${{ steps.gen.outputs.brief_id }}"
          curl -sS -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "User-Agent: DCHub-Inspector-Cron/1.0" \
            "https://dchub-backend-production.up.railway.app/api/v1/brain/brief/${BID}/apply" \
          | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'### Recommendations applied')
          print()
          print(f'- Found: {d.get(\"recommendations_found\", 0)}')
          print(f'- Fired: {d.get(\"fired\", 0)}')
          for r in (d.get('results') or [])[:10]:
              ok = '✓' if r.get('ok') else '✗'
              print(f'  - {ok} {r.get(\"pattern\")} · http {r.get(\"http_code\")}')
          " >> "$GITHUB_STEP_SUMMARY"

      # ── Hand any code-fix candidates to L22 so it can draft PRs.
      # L22 has its own safety whitelist; only 3 recipes auto-PR.
      - name: Draft PRs via L22
        if: steps.gen.outputs.brief_id != ''
        continue-on-error: true
        run: |
          set -eo pipefail
          ADMIN_KEY="${{ secrets.DCHUB_ADMIN_KEY }}"
          BID="${{ steps.gen.outputs.brief_id }}"
          curl -sS -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "User-Agent: DCHub-Inspector-Cron/1.0" \
            "https://dchub-backend-production.up.railway.app/api/v1/brain/brief/${BID}/draft-prs" \
          | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          n = d.get('candidates_found', 0)
          print(f'### Code-fix candidates: {n}')
          for c in (d.get('candidates') or [])[:10]:
              print(f'- recipe={c.get(\"recipe\")} target={c.get(\"target\")}')
          if d.get('l22_status'):
              print(f'- L22 returned HTTP {d[\"l22_status\"]}')
          " >> "$GITHUB_STEP_SUMMARY"
