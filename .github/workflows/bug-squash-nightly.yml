name: bug-squash-nightly

# r48.2 (2026-05-27) — preemptive bug-class detection.
#
# Runs scripts/bug_squash.py every night, files findings into the brain
# brain_findings table via POST /api/v1/brain/bug-squash/file, then those
# findings flow into the next inspector_brief + weekly digest so we hunt
# bug classes BEFORE users report them. Read-only — surfaces only,
# remediation left to humans (per safety boundaries in
# reference_dchub_autonomy_core.md).

on:
  schedule:
    - cron: '13 5 * * *'  # 05:13 UTC daily (staggered off dchub-jobs 0 5)
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Limit to a single pattern id (optional)'
        required: false
      file_to_brain:
        description: 'POST findings to brain (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend
        uses: actions/checkout@v5
        with:
          path: dchub-backend

      # The frontend canonical-field patterns need the PRIVATE sibling repo.
      #
      # ★ This step killed the whole job for 20+ consecutive nights. The
      # default GITHUB_TOKEN is scoped to THIS repo, so a cross-repo checkout
      # of a private repo 404s ("Not Found" from the repos API) and the job
      # died here, BEFORE bug_squash ever ran — so the nightly bug-class
      # detector filed ZERO findings for three weeks while the workflow file
      # itself looked perfectly healthy.
      #
      # ★ DCHUB_FRONTEND_RO_TOKEN no longer grants access either — verified
      # 2026-08-19: deploy-integrity.yml hits the identical "Not Found" on the
      # same secret and is green ONLY because it sets continue-on-error. The
      # secret needs rotating; that is a credential action for the owner.
      #
      # Until it is rotated: do NOT let a missing frontend throw away the
      # backend findings too. Degrade instead of dying — and bug_squash.py
      # PRINTS which frontend patterns went unscanned, so a partial run can
      # never be mistaken for a clean one.
      - name: Check out frontend (private sibling — optional)
        id: frontend
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: azmartone67/dchub-frontend
          path: dchub-frontend
          token: ${{ secrets.DCHUB_FRONTEND_RO_TOKEN || github.token }}

      - name: Flag degraded frontend coverage
        if: steps.frontend.outcome != 'success'
        run: |
          echo "::warning title=bug-squash coverage degraded::Could not check out azmartone67/dchub-frontend (DCHUB_FRONTEND_RO_TOKEN lacks access). Frontend patterns were NOT scanned; backend patterns ran normally."

      # ★ 2026-09-02 (QA sweep finding 5). The warning above is the ONLY
      # trace of the degraded run, and nobody reads step annotations. For 13+
      # nights (verified run 33473482241, 2026-09-01T05:24Z) this job was green
      # with 3 of its 5 patterns unscanned and "0 findings all-time", and the
      # dead-man board had no feed for it at all. Beat the board from here:
      # a frontend-absent night is `degraded` (outside ingest_runs._OK_STATUS,
      # so /api/v1/ops/deadman reads it RED) and a full scan is `success`.
      # Fail-OPEN on the beat itself (a 401 must not kill the scan) but never
      # silent — the code is printed, the same shape as daily-infra-sync.
      - name: Dead-man beat (degraded when the frontend was not scanned)
        if: always()
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
        run: |
          if [ "$FRONTEND_OUTCOME" = "success" ]; then
            STATUS="success"; NOTE="backend + frontend patterns scanned"
          else
            STATUS="degraded"; NOTE="frontend checkout ${FRONTEND_OUTCOME:-absent}: DCHUB_FRONTEND_RO_TOKEN lacks access — 3 of 5 patterns NOT scanned (owner: rotate the token)"
          fi
          CODE=$(curl -s -o /tmp/beat.json -w '%{http_code}' \
            -X POST "https://dchub.cloud/api/v1/admin/ingest-runs/beat" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: dchub-ingest-beat/1.0" \
            -d "{\"feed\":\"bug-squash-nightly\",\"status\":\"$STATUS\",\"cadence_hours\":30,\"note\":\"$NOTE\"}" || echo 000)
          echo "beat HTTP $CODE status=$STATUS"
          case "$CODE" in
            200|201|202|204) ;;
            *) echo "::warning::dead-man beat returned $CODE — feed bug-squash-nightly will read STALE on /api/v1/ops/deadman";;
          esac

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run bug_squash (text report)
        env:
          DCHUB_FRONTEND_ROOT: ${{ github.workspace }}/dchub-frontend
        run: |
          cd dchub-backend
          # fail-on=never — the brain digest is the right place to surface
          # these; CI failing every night would be noise.
          python3 scripts/bug_squash.py --format text --fail-on never

      - name: Run bug_squash + file to brain
        if: ${{ inputs.file_to_brain != 'false' }}
        env:
          DCHUB_FRONTEND_ROOT: ${{ github.workspace }}/dchub-frontend
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          DCHUB_BRAIN_URL: https://dchub-backend-production.up.railway.app
        run: |
          cd dchub-backend
          python3 scripts/bug_squash.py \
            --format json \
            --file-to-brain \
            --fail-on never \
            ${{ inputs.pattern && format('--pattern {0}', inputs.pattern) || '' }} \
            > squash-output.json
          echo "::group::Brain file response"
          tail -20 squash-output.json || true
          echo "::endgroup::"

      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: bug-squash-findings-${{ github.run_id }}
          path: dchub-backend/squash-output.json
          if-no-files-found: ignore
          retention-days: 30
