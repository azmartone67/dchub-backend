name: Neon → R2 nightly backup

# #4 (2026-06-08): the disaster-recovery tier. backup_neon_to_r2.py already
# existed (pg_dump → gzip → R2 dchub-backups + 30d retention) but NOTHING ran it.
# This wires it to a nightly cron. Covers the one gap the Railway/Render/KV
# failover doesn't: "Neon itself has a bad day" — a point-in-time SQL snapshot
# in R2 (zero egress) you can restore from.
#
# REQUIRES these GitHub repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT_URL
# (you already have these values on Railway — copy them in.)

on:
  schedule:
    # 2026-08-05: every 6h → DAILY. The 6h cadence drove ~415GB/mo of Neon EGRESS
    # (each full pg_dump pulls the whole DB out uncompressed, ×4/day) — the biggest
    # line on the bill. Oregon's 7-day PITR already covers fine-grained recovery
    # IN-Neon at zero egress, so R2 only needs to cover the rare "Neon itself dies"
    # case, for which a daily off-Neon dump is plenty. Cuts backup egress ~4x.
    # (Tighten to "0 */12 * * *" if a 12h off-Neon RPO is ever wanted.)
    #
    # ★ 2026-08-30: MOVED OFF 08:00 — and off the top of the hour.
    # pg_dump is a LOCK HOLDER, not just a reader: it opens one repeatable-read
    # transaction and takes AccessShareLock on EVERY table, holding all of them
    # until it commits. The 08-30 run held 08:00:28Z→08:16:12Z (15m44s), and
    # anything wanting AccessExclusive in that window blocked and died on
    # lock_timeout (55P03) — including `ALTER TABLE ... ADD COLUMN IF NOT
    # EXISTS` on a column that already exists, which still takes the lock
    # because Postgres locks the relation BEFORE evaluating the condition.
    # That produced five self_reported_failure rows across three unrelated
    # jobs on DIFFERENT tables (see #3366, #3376).
    #
    # 08:00 was the worst slot in the repo. Measured over the 35 min from the
    # start, counting only fixed-minute crons (the every-5-min heartbeat class
    # fires everywhere and is unavoidable):
    #
    #                    workflows   write/ingest   in first 5 min
    #   08:00 UTC            51            8              9
    #   09:31 UTC            31            4              2
    #
    # SEVEN workflows fire at exactly 08:00 alongside this one. The first-5-min
    # column is the one that matters most: pg_dump takes all of its table locks
    # at the START. Off the hour also dodges GitHub's own scheduler congestion
    # at :00 — the 08-25 and 08-26 runs both started ELEVEN MINUTES late.
    #
    # ★ 09:31 and not the even-quieter 10:24: restore-test.yml runs Mondays at
    # 11:00 UTC and pulls the LATEST R2 dump. A ~16 min dump from 09:31 lands
    # ~09:50, keeping ~70 min of margin; from 10:24 it would land ~10:45 and a
    # slow run (or GitHub's scheduling latency) would have Monday's restore
    # test validating YESTERDAY's dump. Keep this comfortably before 11:00 UTC
    # if you move it again.
    - cron: "31 9 * * *"       # daily 09:31 UTC (02:31 America/Phoenix)
  workflow_dispatch: {}         # manual run button

concurrency:
  group: neon-r2-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # streaming dump removed the OOM; headroom for a large dump+upload
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump (match Neon's major version) + boto3
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          # Neon runs Postgres 18 — pg_dump refuses to dump a newer server with
          # an older client, so install the v18 client (fallback: PGDG meta = latest).
          sudo apt-get install -y postgresql-client-18 || sudo apt-get install -y postgresql-client
          python -m pip install --quiet boto3

      - name: Run Neon → R2 backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: dchub-backups
          BACKUP_RETENTION_DAYS: "30"
        run: |
          # prefer the version-matched (v18) client if installed
          if [ -x /usr/lib/postgresql/18/bin/pg_dump ]; then
            export PATH="/usr/lib/postgresql/18/bin:$PATH"
          fi
          pg_dump --version
          python backup_neon_to_r2.py
