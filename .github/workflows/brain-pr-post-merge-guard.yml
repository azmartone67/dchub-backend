name: Brain PR post-merge guard (Phase GG#4)

# Phase GG#4 (2026-05-14): brain-PR-specific post-merge smoke test +
# auto-rollback.
#
# The generic auto-rollback.yml runs every 15 min against ALL of main.
# This is the brain-specific fast path: it fires the MOMENT a
# brain-authored PR (label autonomous-brain-layer5) merges, waits for
# Railway to redeploy, probes /api/health, and:
#   - if healthy  → comment ✓ on the PR + mark the proposal merged_healthy
#   - if broken   → roll Railway back to the last good deployment, open a
#                   revert PR, comment ✗ on the PR + mark merged_reverted
#
# 2026-07-28: the "broken" path used to `git push origin main`. main is
# protected and github-actions[bot] is not an admin, so that push was always
# rejected (GH006) — and because the step exited non-zero, the PR comment and
# the brain-DB callback below it were SKIPPED. Rollback is now a Railway
# operation and every reporting step runs with `!cancelled()`.
#
# The mark-merge-outcome callback is the feedback signal GG#2
# (confidence calibration) reads to tune the auto-PR threshold:
# a brain source whose merges keep getting reverted loses trust.
#
# Why brain-specific (not just relying on auto-rollback.yml):
#   1. Speed — fires on merge, not up to 15 min later
#   2. Feedback — only this path tells the brain DB what happened
#   3. Attribution — comments on the exact brain PR + proposal
#
# Required secrets:
#   DCHUB_ADMIN_KEY        — for the mark-merge-outcome callback
#   RAILWAY_TOKEN          — REQUIRED for the rollback to actually work.
#                            Without it the guard detects breakage and reports
#                            it, but cannot restore service.
#   GH_PAT (optional)      — only affects who authors the revert PR. It is NOT
#                            needed to push to main any more; nothing here does.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  guard:
    # Only run for MERGED brain-authored PRs
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'autonomous-brain-layer5')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'dchub-brain-v2'
          git config user.email 'brain@dchub.cloud'

      - name: Wait for Railway redeploy
        run: |
          echo "Waiting for Railway to pick up the merge (max 5 min)…"
          for i in $(seq 1 30); do
            UPTIME=$(curl -s --max-time 8 \
              "https://dchub-backend-production.up.railway.app/api/health?_cb=$(date +%s)" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('uptime_seconds',9999))" 2>/dev/null || echo 9999)
            if [ "$UPTIME" -lt 200 ] 2>/dev/null; then
              echo "Fresh deploy detected (uptime=${UPTIME}s)"
              # Give it another 15s to fully warm up
              sleep 15
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Did not observe a fresh deploy in 5 min — probing anyway"

      - name: Probe /api/health
        id: probe
        run: |
          set +e
          BODY=$(curl -s --max-time 15 \
            "https://dchub-backend-production.up.railway.app/api/health?_cb=$(date +%s)")
          STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unreachable")
          # Also probe a couple of representative live endpoints to catch
          # subtler breakage than the health endpoint alone would show.
          DCPI=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 \
            "https://dchub.cloud/api/v1/dcpi/scores?limit=1")
          FINDINGS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://dchub-backend-production.up.railway.app/api/v1/heal/findings")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "dcpi_code=$DCPI" >> $GITHUB_OUTPUT
          echo "findings_code=$FINDINGS" >> $GITHUB_OUTPUT
          echo "Health status: $STATUS | DCPI: $DCPI | findings: $FINDINGS"
          # Healthy = health endpoint reports ok/healthy AND both probes 2xx.
          # /api/health actually returns {"status":"ok"} — this test used to
          # compare against 'healthy' only, so it graded EVERY merge as broken
          # and tried to revert it. It never fired in practice (100/100 runs
          # skipped on the label gate), but it would have reverted healthy PRs
          # the first time a brain PR merged. Accept both spellings.
          if { [ "$STATUS" = "ok" ] || [ "$STATUS" = "healthy" ]; } && [ "$DCPI" -lt 400 ] 2>/dev/null && [ "$FINDINGS" -lt 500 ] 2>/dev/null; then
            echo "verdict=healthy" >> $GITHUB_OUTPUT
          else
            echo "verdict=broken" >> $GITHUB_OUTPUT
          fi

      # Restoring service is a deploy-platform operation, not a git operation.
      # `git push origin main` here was rejected by branch protection (GH006,
      # same as auto-rollback.yml) and, because the step then exited non-zero,
      # every following step — including the PR comment and the brain-DB
      # callback — was skipped. Railway rolls the image back instead.
      - name: Roll back Railway on breakage
        id: revert
        if: steps.probe.outputs.verdict == 'broken'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +e
          echo "::warning::Post-merge health check FAILED — rolling production back"
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN not set — cannot roll back automatically."
            echo "reverted=false" >> $GITHUB_OUTPUT
            echo "detail=RAILWAY_TOKEN not set" >> $GITHUB_OUTPUT
            exit 1
          fi
          python3 -c 'import requests' 2>/dev/null || pip install --quiet requests
          python3 scripts/railway_rollback.py --json > /tmp/rb.json 2>/tmp/rb.err
          RC=$?
          cat /tmp/rb.err
          if [ "$RC" -eq 0 ]; then
            echo "reverted=true" >> $GITHUB_OUTPUT
            echo "detail=Railway rolled back to the previous good image" >> $GITHUB_OUTPUT
          else
            echo "reverted=false" >> $GITHUB_OUTPUT
            echo "detail=railway_rollback.py exited $RC" >> $GITHUB_OUTPUT
          fi
          exit $RC

      # Land the git revert as a PR so the next deploy does not re-ship the bad
      # merge. This is a branch push + PR, which the bot IS allowed to do.
      - name: Open revert PR
        id: revertpr
        if: steps.probe.outputs.verdict == 'broken'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          BRANCH="auto-rollback/brain-revert-${MERGE_SHA:0:8}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH" || exit 1
          if ! git revert --no-edit "$MERGE_SHA"; then
            git revert --abort 2>/dev/null
            echo "::error::git revert of $MERGE_SHA conflicted — needs a human"
            echo "url=(revert conflicted)" >> $GITHUB_OUTPUT
            exit 1
          fi
          git push origin "$BRANCH" || { echo "url=(branch push failed)" >> $GITHUB_OUTPUT; exit 1; }
          # --body-file, not an inline multi-line --body: continuation lines at
          # column 0 would terminate this YAML block scalar.
          cat > /tmp/pr-body.md <<'MD'
          Automated revert opened by `brain-pr-post-merge-guard`.

          Production was rolled back on Railway; this PR removes the merge from git so the next deploy does not re-ship it.

          - Reverted merge: `__MERGE__`
          - Original PR: #__PRNUM__
          - Run: __RUN__
          MD
          # `sed -i` differs between GNU and BSD; redirect instead.
          sed "s|__MERGE__|${MERGE_SHA}|; s|__PRNUM__|${PR_NUMBER}|; s|__RUN__|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|" \
            /tmp/pr-body.md > /tmp/pr-body.final.md && mv /tmp/pr-body.final.md /tmp/pr-body.md
          # Capture rather than pipe: piping into `tail` masks gh's exit code,
          # so a failed create would still be reported as a PR URL.
          if ! OUT=$(gh pr create --base main --head "$BRANCH" \
                --title "revert: brain PR #${PR_NUMBER} failed post-merge health check" \
                --body-file /tmp/pr-body.md 2>&1); then
            # Actions is not permitted to create PRs in this repo; the revert
            # branch is pushed regardless, so hand over a compare link.
            COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::error::gh pr create failed: $OUT"
            echo "::warning::Revert branch IS pushed — open the PR here: $COMPARE"
            echo "url=$COMPARE (branch pushed; PR not opened)" >> $GITHUB_OUTPUT
            exit 1
          fi
          URL=$(printf '%s\n' "$OUT" | tail -1)
          # Best-effort label; a missing label must not block the revert PR.
          gh pr edit "$URL" --add-label auto-rollback >/dev/null 2>&1 || true
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment outcome on the brain PR
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const verdict = '${{ steps.probe.outputs.verdict }}';
            const status  = '${{ steps.probe.outputs.status }}';
            const dcpi    = '${{ steps.probe.outputs.dcpi_code }}';
            const findings= '${{ steps.probe.outputs.findings_code }}';
            const reverted= '${{ steps.revert.outputs.reverted }}';
            const detail  = '${{ steps.revert.outputs.detail }}' || '(no detail)';
            const prUrl   = '${{ steps.revertpr.outputs.url }}' || '(not opened)';
            let body;
            if (verdict === 'healthy') {
              body = `### ✅ Post-merge health check PASSED\n\n` +
                `Railway redeployed cleanly after this brain PR merged.\n\n` +
                `- \`/api/health\`: **${status}**\n` +
                `- DCPI scores endpoint: HTTP ${dcpi}\n` +
                `- heal/findings endpoint: HTTP ${findings}\n\n` +
                `The proposal is being marked \`merged_healthy\` in the brain DB — ` +
                `this raises the trust score for this proposal source ` +
                `(feeds GG#2 confidence calibration).`;
            } else {
              const rolled = reverted === 'true';
              body = `### ❌ Post-merge health check FAILED\n\n` +
                (rolled
                  ? `Railway came back unhealthy after this brain PR merged, so production was ` +
                    `**rolled back to the previous deployment**.\n\n`
                  : `Railway came back unhealthy after this brain PR merged, and the ` +
                    `**automatic rollback did not complete** — production may still be broken.\n\n`) +
                `- \`/api/health\`: **${status}**\n` +
                `- DCPI scores endpoint: HTTP ${dcpi}\n` +
                `- heal/findings endpoint: HTTP ${findings}\n` +
                `- Railway rollback: ${rolled ? '✅' : '⚠️'} ${detail}\n` +
                `- Revert PR: ${prUrl}\n\n` +
                `The proposal is being marked \`merged_reverted\` in the brain DB — ` +
                `this lowers the trust score for this proposal source. ` +
                `The brain spotted a real issue but its fix was wrong; ` +
                `a human should look at the underlying problem directly.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Mark proposal outcome in brain DB
        if: ${{ !cancelled() }}
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping brain DB callback"
            exit 0
          fi
          # Extract the proposal ID from the PR branch name:
          #   brain-v2/auto-<loop_name>-<pid>
          BRANCH="${{ github.event.pull_request.head.ref }}"
          PID=$(echo "$BRANCH" | grep -oE '[0-9]+$' || echo "")
          if [ -z "$PID" ]; then
            echo "::warning::Could not parse proposal ID from branch '$BRANCH' — skipping callback"
            exit 0
          fi
          VERDICT="${{ steps.probe.outputs.verdict }}"
          if [ "$VERDICT" = "healthy" ]; then
            OUTCOME="merged_healthy"
          else
            OUTCOME="merged_reverted"
          fi
          DETAIL="status=${{ steps.probe.outputs.status }} dcpi=${{ steps.probe.outputs.dcpi_code }} findings=${{ steps.probe.outputs.findings_code }}"
          echo "Marking proposal #$PID → $OUTCOME"
          curl -sS --max-time 30 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"outcome\": \"$OUTCOME\", \"detail\": \"$DETAIL\"}" \
            "https://dchub-backend-production.up.railway.app/api/v1/brain/proposed-code/${PID}/mark-merge-outcome" \
            | python3 -m json.tool || echo "::warning::mark-merge-outcome callback failed (non-fatal)"

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # N = 3, the endpoints this guard probes (health, dcpi, heal/findings).
          # A fixed number is honest here because the probe set is literal in
          # this file — if that changes, this must change with it.
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          bash scripts/gate_beat.sh "brain-pr-post-merge-guard:guard" "$V" 3 absent \
            "N = 3 post-deploy probes (health, dcpi, heal/findings)"
