          if grep -qi "skipped" dsr.txt; then
            echo "::error::the dcpi_scores readers SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── Canon's live reads are independent, same Postgres ───────────────
      # canonical_stats._query_live() ran its early metric reads in ONE
      # psycopg2 transaction with no rollback between them, so one failing
      # read aborted it and every read after it kept the seed, never marked
      # live. Only a real Postgres has the aborted transaction. Owns and
      # recreates discovered_facilities and market_power_scores.
      - name: Canon live reads SQL against a real Postgres
        env:
          CANON_LIVE_READS_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_canon_live_reads_independent_sql.py -v --tb=short

      - name: Prove the canon live reads SQL test actually RAN
        env:
          CANON_LIVE_READS_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_canon_live_reads_independent_sql.py \
            -q -rs --tb=no > clr.txt 2>&1 || { cat clr.txt; exit 1; }
          cat clr.txt
          if grep -qi "skipped" clr.txt; then
            echo "::error::the canon live reads SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── LinkedIn quad legacy builders with no data, same Postgres ───────
      # When the composer raises, run() falls back to a legacy builder per
      # slot. A builder's None used to reach payload["engine_error"] = ...,
      # a TypeError that 500'd and left the claim at 'claimed_in_flight'
      # (counted as abandoned). Only a real Postgres has the empty news
      # query, the missing table and the claim row. Owns and recreates news,
      # market_power_scores and linkedin_quad_posts.
      - name: LinkedIn quad legacy builders SQL against a real Postgres
        env:
          LINKEDIN_QUAD_LEGACY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_linkedin_quad_legacy_none_sql.py -v --tb=short

      - name: Prove the LinkedIn quad legacy builders SQL test actually RAN
        env:
          LINKEDIN_QUAD_LEGACY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_linkedin_quad_legacy_none_sql.py \
            -q -rs --tb=no > lql.txt 2>&1 || { cat lql.txt; exit 1; }
          cat lql.txt
          if grep -qi "skipped" lql.txt; then
            echo "::error::the LinkedIn quad legacy builders SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── LinkedIn quad legacy copy vs canon, same Postgres ───────────────
      # _canon_markets() printed canon's static seed ("300+") as a measured
      # count whenever canon had not measured markets; it is now gated on
      # stat_is_live. Only a real Postgres has canon's own query against a
      # present or missing market_power_scores. Owns and recreates
      # market_power_scores.
      - name: LinkedIn quad canon copy SQL against a real Postgres
        env:
          LINKEDIN_QUAD_CANON_COPY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_linkedin_quad_canon_copy_sql.py -v --tb=short

      - name: Prove the LinkedIn quad canon copy SQL test actually RAN
        env:
          LINKEDIN_QUAD_CANON_COPY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_linkedin_quad_canon_copy_sql.py \
            -q -rs --tb=no > lqc.txt 2>&1 || { cat lqc.txt; exit 1; }
          cat lqc.txt
          if grep -qi "skipped" lqc.txt; then
            echo "::error::the LinkedIn quad canon copy SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── agent_broadcast Pass 2 publishes PUBLISHED rows only ────────────
      # The dcpi-shifts fallback read market_power_scores with no `published`
      # filter; the column defaults to false and production holds unpublished
      # BUILD/AVOID alias twins. A NULL/false flag is a data fact no fake
      # cursor holds, so the shipped route reads a real table here. Owns and
      # recreates market_power_scores and dcpi_daily_snapshots. The citations
      # file owns ai_testimonials: approved AI rows only, never claim_quote.
      - name: agent_broadcast published-only SQL against a real Postgres
        env:
          AGENT_BROADCAST_PUBLISHED_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_agent_broadcast_published_sql.py tests/test_agent_broadcast_citations_sql.py -v --tb=short

      - name: Prove the agent_broadcast published-only SQL test actually RAN
        env:
          AGENT_BROADCAST_PUBLISHED_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_agent_broadcast_published_sql.py \
            tests/test_agent_broadcast_citations_sql.py \
            -q -rs --tb=no > abp.txt 2>&1 || { cat abp.txt; exit 1; }
          cat abp.txt
          if grep -qi "skipped" abp.txt; then
            echo "::error::the agent_broadcast published-only SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── Human customer quotes never serve as AI quotes, same Postgres ────
      # ai_testimonials holds AI quotes and HUMAN customer quotes
      # (source='claim_quote'). /api/v1/testimonials, /stats, /live, the media
      # feed and the wall-dedup job must exclude them; /api/v1/cited-by must
      # still list them. A WHERE clause over NULL-able data is a fact no fake
      # cursor holds. Owns and recreates ai_testimonials.
      - name: claim_quote fence SQL against a real Postgres
        env:
          CLAIM_QUOTE_FENCE_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_claim_quote_not_ai_feed_sql.py \
            -q -rs --tb=short > cqf.txt 2>&1 || { cat cqf.txt; exit 1; }
          cat cqf.txt
          if grep -qi "skipped" cqf.txt; then
            echo "::error::the claim_quote fence SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── users.created_at is TEXT: date-filtering readers, same Postgres ──
      # The paid activation-email sweep's candidate SQL compared the TEXT column
      # to NOW() and raised on every tick; the CRM paid-conversion backfill did
      # the same with a datetime param and swallowed it. The users table is
      # built from main.py's own DDL, so the column type is production's.
      # Owns and recreates its own schema only.
      - name: users.created_at TEXT readers against a real Postgres
        env:
          USERS_CREATED_AT_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_users_created_at_text_sql.py \
            -q -rs --tb=short > uca.txt 2>&1 || { cat uca.txt; exit 1; }
          cat uca.txt
          if grep -qi "skipped" uca.txt; then
            echo "::error::the users.created_at TEXT readers test SKIPPED — it proves nothing"; exit 1
          fi

      # ── warm-keys export consent + last wall (r-optin-consents) ───────────
      # routes/warm_key_cohort._gather's SQL, own schema, same Postgres.
      - name: warm-keys export SQL against a real Postgres
        env:
          WARM_KEYS_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_warm_key_cohort_sql.py \
            -q -rs --tb=short > wk.txt 2>&1 || { cat wk.txt; exit 1; }
          cat wk.txt
          if grep -qi "skipped" wk.txt; then
            echo "::error::the warm-keys SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Each "Prove ... actually RAN" step above writes one proof file and
          # already fails the job on a skip. N sums the SAME files those checks
          # read, so the count and the skip checks cannot disagree. A lane that
          # ran but is missing from PROOFS reports fewer tests than the job
          # proved, and when only missing lanes wrote a proof the beat sends
          # empty, which the board reads as unknown.
          # ★ ONE list, read by the presence test AND the sum, so those two
          # cannot drift apart. A new lane adds its file here:
          # scripts/gate_beat_selftest.py (run by unit-tests) reads every proof
          # file this job's steps write, and fails, naming the file, when this
          # beat does not count it exactly.
          # Same empty-vs-zero rule as unit-tests: no proof file at all => empty;
          # present but unparseable => 0.
          # History: the list was hand-copied and fell behind twice. 2026-09-12:
          # pt.txt and tg.txt ran but were never summed. er.txt (#4515) and
          # tx.txt (#4520) landed after that fix and were not summed either.
          PROOFS=(
            out.txt
            cc.txt
            pt.txt
            tg.txt
            al.txt
            lp.txt
            pk.txt
            hp.txt
            kh.txt
            er.txt
            tx.txt
            tu.txt
            ss.txt
            si.txt
            ou.txt
            ra.txt
            rc.txt
            pa.txt
            kd.txt
            cs.txt
            ar.txt
            fu.txt
            ctp.txt
            ut.txt
            cc2.txt
            fl.txt
            lm.txt
            mkp.txt
            ip.txt
            efs.txt
            osm.txt
            rsla.txt
            dsr.txt
            clr.txt
            lql.txt
            lqc.txt
            abp.txt
            pp.txt
            wk.txt
            msg.txt
            cqf.txt
            uca.txt
          )
          PRESENT=()
          for f in "${PROOFS[@]}"; do
            if [ -f "$f" ]; then PRESENT+=("$f"); fi
          done
          if [ "${#PRESENT[@]}" -gt 0 ]; then
            N=$(cat "${PRESENT[@]}" \
                | grep -oE '[0-9]+ (passed|failed)' \
                | awk '{t+=$1} END{if(NR)print t; else print 0}')
          else
            N=""
          fi
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          bash scripts/gate_beat.sh "pre-merge:db-parity" "$V" "$N" absent \
            "N = parity tests that ran"
