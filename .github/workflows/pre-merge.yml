name: pre-merge-gauntlet

# ★ 2026-09-05 — THE QUEUE FIX. This workflow had no concurrency group, so every
#   push to a PR queued ANOTHER full gauntlet and every one of them ran to
#   completion. On a busy day that is a standing queue of superseded runs, each
#   holding a runner, each making the run you actually care about wait behind
#   work whose commit is already dead.
#
#   app-contract-gate.yml has had the correct pattern all along
#   (cancel-in-progress: true) — it simply was never applied to the slow
#   workflow, which is the one where it matters most.
#
#   Grouped per REF, so pushing a new commit to a PR cancels that PR's older
#   run and nobody else's.
#
# ★ MAIN IS EXCLUDED FROM GROUPING ENTIRELY, and `cancel-in-progress: false` is
#   NOT what does it. That flag only protects a run that has already STARTED:
#   GitHub still cancels a PENDING run the moment a newer run joins the same
#   group. So grouping main pushes together means two merges landing close
#   enough leave the MIDDLE commit's gauntlet cancelled before it ever ran —
#   and the push-side backstop for a stale architecture map goes blind on
#   exactly the commit it was meant to catch (tests/test_vault_map_generator.py
#   ::test_the_push_side_backstop_still_runs_the_suite; caught this in review).
#
#   Hence github.run_id on main: every push to main lands in a group of its
#   own, so it can never queue behind or cancel another. run_id is always a
#   non-zero number, so the `&& ... ||` ternary cannot fall through to its
#   right-hand side on main — the classic trap with that idiom.
concurrency:
  group: pre-merge-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # ★2026-09-06 — a post-merge gate reachable only by `push` is one bot
    # merge away from silence: GitHub creates NO workflow run for a push made
    # with GITHUB_TOKEN, and 17 of 24 commits landed that way in the 6h after
    # auto-enable-automerge shipped. The token is fixed; this is the belt, and
    # it holds for any future bot push too.
    # DAILY, not 6-hourly: this suite runs ~20-26 minutes. Its push-to-main run
    # is the stale-main backstop that tests/test_vault_map_generator.py
    # ::test_the_push_side_backstop_still_runs_the_suite exists to protect, so it
    # must not depend on the push event alone.
    - cron: '51 7 * * *'
  workflow_dispatch: {}

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # PR merge ref + BOTH parents — the WORKER_VERSION guard diffs HEAD^1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: AST parse every .py
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! python3 -c "import ast; ast.parse(open('$f').read())" 2>/tmp/err; then
              echo "::error file=$f::syntax error"
              cat /tmp/err
              fail=1
            fi
          done < <(find . -name '*.py' -not -path './.git/*' -not -path './node_modules/*' -not -path './.venv/*')
          exit $fail
      # Runs HERE, not in tests/, on purpose. tests/test_tests_are_collectable.py
      # checks the same property with better messages, but it is a pytest test —
      # so against the very bug it targets it cannot run: a module-scope exit
      # aborts collection and takes the guard with it (verified: exit 3, "no
      # tests ran"). The two are complementary; this is the one that still fires
      # once the suite is already dead.
      # The control runs FIRST, as it does for api-response-contract: if the
      # guard has stopped being able to fail, the scan below is worthless and
      # must not get to report green.
      - name: Collection-safety must-fail control
        run: python3 scripts/check_collection_safety.py --self-test
      - name: No test module aborts collection
        run: python3 scripts/check_collection_safety.py tests
      # The gate liveness ledger's OWN must-fail control (2026-08-31). Runs
      # HERE, in the stdlib-only job, for the same reason the collection-safety
      # check does: it must still report when the suite is down, and it must not
      # be able to fail for a reason unrelated to what it controls (the script
      # stubs flask/psycopg2 so the pure predicate imports bare).
      # A board that reports every gate healthy because its own predicate broke
      # is precisely the failure the board exists to catch — and three of the
      # four measurement surfaces audited on 2026-08-17 failed in exactly that
      # direction, opposite to the bug each was built to find.
      - name: Gate ledger must-fail control (exit 2 = UNMEASURED = failure)
        run: python3 scripts/gate_runs_selftest.py
      # db_utils' PGCursorWrapper DROPS DDL when SKIP_DDL is set, and SKIP_DDL
      # defaults to '1' and is absent from prod config — so a lazy CREATE TABLE
      # written against db_utils.get_db()/safe_db() never creates anything, and
      # nothing raises or logs. That hid mcp_sessions for three months (#2196).
      # Runs in syntax-check rather than unit-tests so it still reports when
      # the suite itself is down; tests/test_ddl_through_pool.py covers the
      # same scan with better messages and pins the analyser's behaviour.
      - name: DDL-through-pool must-fail control
        run: python3 scripts/check_ddl_through_pool.py --self-test
      - name: No DDL through the pooled cursor
        run: python3 scripts/check_ddl_through_pool.py
      # CONFIG_SNAPSHOT.md carried a live Redis password + Render deploy-hook
      # key in this PUBLIC repo from 2026-06-13 to 2026-08-07 (flagged 07-24
      # "rotate then redact", never redacted). Old SHAs stay reachable forever,
      # so the fix for the CLASS is refusing the next credential at the gate.
      # --self-test runs first so a regex edit that kills a pattern fails the
      # job instead of silently passing everything (fence-dies-green class).
      # The original rules were all URL shapes, so a BARE `KEY = "<64 hex>"`
      # walked past them — six live credentials nearly landed in a test
      # fixture on 2026-08-07. Rules 4 and 5 close that; tests/
      # test_credential_scan_gate.py fences the file-selection half, which a
      # line-level self-test cannot reach.
      - name: No credential-shaped strings in tracked files
        run: |
          python3 scripts/check_no_leaked_credentials.py --self-test
          python3 scripts/check_no_leaked_credentials.py
      # worker.js is the CF ZONE worker (dchubapiproxy), deployed on merge by
      # deploy-zone-worker.yml (#5376) — live-vs-repo drift detection and that
      # workflow's refusals (live ahead / same version, different content) depend on WORKER_VERSION
      # changing with the content (2026-07-30: #1902/#1978 shipped without bumps
      # and drift had to be proven by fingerprinting). PR-only: HEAD here is the
      # merge ref, so HEAD^1 is the exact base tip this PR would land on (that's
      # what the fetch-depth: 2 above is for). Push runs to main skip it — the
      # commit already landed, there is nothing left to gate.
      - name: worker.js change requires WORKER_VERSION bump
        if: github.event_name == 'pull_request'
        run: bash scripts/check_worker_version_bump.sh HEAD^1 HEAD

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf — a second
      # writer is how tools/deadman/watch.py masked honest failures three times.
      # if: always() so a refusal reaches the board too; `fail` means the gate
      # REFUSED something and the ledger reads HEALTHY, not alarmed.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # N re-derived independently with the same find the AST step uses, so
          # the count cannot be inherited from a step that silently did nothing.
          N=$(find . -name '*.py' -not -path './.git/*' -not -path './node_modules/*' \
                -not -path './.venv/*' | wc -l | tr -d ' ')
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          # ★ selftest stays `absent` and that is deliberate. This gate is a JOB
          # of six checks; three now have must-fail controls (collection-safety,
          # DDL-through-pool, leaked-credentials) and three do not (AST parse,
          # worker-version bump, the ledger control covers gate_runs not this
          # job). Reporting `pass` because SOME of it is proven is exactly the
          # partial-truth this board exists to remove — so the ratio goes in the
          # note, where it is visible, and the verdict stays honest.
          bash scripts/gate_beat.sh "pre-merge:syntax-check" "$V" "$N" absent \
            "N = .py files; must-fail controls on 3 of 6 checks"

  regression-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history for merge-base
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch origin/main
        run: git fetch origin main
      - name: Run delta-mode regression lint
        run: python3 scripts/regression_lint.py --mode delta --base origin/main

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf — a second
      # writer is how tools/deadman/watch.py masked honest failures three times.
      # if: always() so a refusal reaches the board too; `fail` means the gate
      # REFUSED something and the ledger reads HEALTHY, not alarmed.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Delta lint only inspects CHANGED lines, so a PR touching nothing
          # legitimately examines zero. That is no_scope (an affirmative zero),
          # never a vacuous pass — same distinction as the feed board's
          # no_new_data. Without it every docs-only PR would climb the counter.
          N=$(git diff --name-only origin/main...HEAD 2>/dev/null | wc -l | tr -d ' ')
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          [ "${N:-0}" = "0" ] && [ "$V" = "pass" ] && V=no_scope
          bash scripts/gate_beat.sh "pre-merge:regression-lint" "$V" "$N" absent \
            "N = files changed vs origin/main"

  # Advisory only, and deliberately so: this probes PRODUCTION, which the PR
  # under test has not deployed to and therefore cannot have broken. Do NOT
  # make it a required check — a prod hiccup would then block unrelated merges.
  # continue-on-error stays. What changed (2026-08-19) is that the output is
  # now COMPLETE.
  smoke-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Checked out ONLY so the ledger beat below can run scripts/gate_beat.sh.
      # This job probes production over the network and needs no source
      # otherwise — which is exactly why it had no checkout and why the first
      # version of the beat died with exit 127.
      - uses: actions/checkout@v5
      - name: Probe production endpoints
        # tee'd so the ledger beat can read the real probe outcome: this job's
        # continue-on-error means job.status is success no matter what happened.
        run: |
          # GitHub runs `run:` steps under `bash -e`, so the old bare
          #   S=$(curl ... --max-time 10 ...)
          # let the FIRST non-zero curl kill the whole step. On run
          # 32292853179 the log read `/api/v1/health -> 200` and then
          # `Process completed with exit code 28` exactly 10s later — the
          # --max-time budget tripping on endpoint 2 — so endpoints 3 and 4
          # were never probed. A probe whose job is to spot production trouble
          # was stopping at the first sign of it, losing coverage precisely
          # when something was degraded.
          #
          # Capturing curl's status with `|| rc=$?` takes the failure out of
          # -e's hands (a command on the left of `||` is "tested", not fatal),
          # so every path is probed and every failure is named.
          fail=0
          exec > >(tee /tmp/smoke.log) 2>&1
          for path in \
            "/api/v1/health" \
            "/api/energy-discovery/status" \
            "/api/v1/observability/route-audit" \
            "/grid" ; do
            rc=0
            OUT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 10 "https://dchub.cloud$path") || rc=$?
            CODE=${OUT%% *}
            SECS=${OUT##* }
            INT=${SECS%%.*}
            if [ "$rc" -eq 0 ]; then
              # Surface slow-but-passing endpoints at half the timeout budget,
              # so they are visible BEFORE they start tripping --max-time.
              if [ "${INT:-0}" -ge 5 ]; then
                echo "$path -> $CODE (${SECS}s) SLOW: over half the 10s budget"
              else
                echo "$path -> $CODE (${SECS}s)"
              fi
            elif [ "$rc" -eq 28 ]; then
              echo "$path -> TIMEOUT: exceeded --max-time 10 (curl 28)"
              fail=$((fail + 1))
            else
              echo "$path -> ERROR: curl exit $rc (http_code=${CODE:-none})"
              fail=$((fail + 1))
            fi
          done
          echo "---"
          if [ "$fail" -gt 0 ]; then
            echo "advisory: $fail of 4 probes did not complete — check production, not this PR"
          else
            echo "advisory: all 4 probes completed"
          fi

      # ── Zone Cache Rule canary ───────────────────────────────────────────
      # The zone Cache Rule keeping /api/v1/mcp/tools/* out of the edge lives in
      # the Cloudflare dashboard, NOT in git, and nothing else in CI reads the
      # zone ruleset. It was silently inverted within an hour of being applied
      # (moved to first; the cache phase is LAST-match-wins, so that disabled
      # it) and took three live probes to detect. This step is the only thing
      # that would notice. Advisory like the rest of this job: it probes
      # production, so a prod outage must not block an unrelated PR.
      - name: Zone Cache Rule canary
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/probe_mcp_tools_cache_bypass.sh 2>&1 | tee /tmp/canary.log || rc=$?
          echo "canary_exit=${rc:-0}"

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          # This job carries job-level continue-on-error, so it ALWAYS reports
          # success to the PR and job.status can never say otherwise. The board
          # records it as blocking=false and takes the verdict from the probe
          # output instead — the one place the real outcome survives.
          F=$(grep -oE 'advisory: [0-9]+ of 4 probes did not complete' /tmp/smoke.log 2>/dev/null \
              | grep -oE '[0-9]+' | head -1)
          if [ -z "${F:-}" ]; then V=pass; else V=fail; fi
          bash scripts/gate_beat.sh "pre-merge:smoke-probe" "$V" 4 absent \
            "advisory job (continue-on-error) — verdict from probe output, not job.status"

  # Phase PP (2026-05-13): pure-function unit tests on the hot paths
  # that have shipped regressions this week. Tests use source-extraction
  # so they don't need Flask, the DB, or any network — sub-second on CI.
  # Adding more tests over time will shift these from a smoke-screen
  # toward a real safety net; today this covers brain v2 safety,
  # marketing topic picker, schema-aware feed query, MCP arg sanitizer,
  # and the system-loops classifier.
  #
  # ★ 2026-09-21 — SHARDED. The one serial `pytest tests/` had grown to 27-42
  #   min. main requires a PR to be up to date with it, and main moves about
  #   every 20 min, so a PR rarely got a quiet window long enough to land.
  #   `unit-tests-shard` runs the suite as parallel jobs. The `unit-tests` job
  #   below (the required check, same name as before) judges them as one suite
  #   and is the ledger's only writer. How files are split, and why every
  #   shard still collects everything: tests/_shard.py. To change the shard
  #   count, edit only the matrix list. The index and count the shards use
  #   come from strategy.job-index / job-total, never from the matrix values.
  unit-tests-shard:
    name: unit-tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one shard's failure never hides another's.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          # ★ This job installs psycopg2-binary, psycopg[binary], Pillow and
          #   feedparser on EVERY run and was the only heavy job here without a
          #   pip cache — app-contract-gate has had `cache: pip` since it was
          #   written. Same wheels, same Python, every run.
          cache: pip
      - name: Install pytest + the light deps the suite needs
        # pytest-only aborted collection: routes the tests import pull flask /
        # requests / yaml / psycopg2. Installing these light, no-DB deps lets the
        # brain auto-merge/draft/gate tests actually RUN (a real gate, not a skip).
        # Verified green: 210 passed, 8 skipped (DB tests skip w/o DATABASE_URL).
        #
        # 2026-07-28: + Unidecode. tests/test_seo_slug_and_soft404.py imports it
        # to check non-Latin facility names slug to something usable ('ドコモ').
        # It is in requirements.txt (Unidecode==1.3.8) so it was present locally
        # and on the running app, but NOT in this deliberately-light CI install —
        # so main went red the moment that test landed, and every PR inherited
        # the failure. Without it NFKD alone folds CJK to '' and two tests fail.
        #
        # ★ PINNED to the requirements.txt version on purpose. canonical_slug is
        # FROZEN set-once (routes/facility_slug_freeze.py) and is minted from
        # this library's output, so a transliteration change under an unpinned
        # bump would mean CI mints different slugs than the ones already frozen
        # in the DB and indexed by Google. The tests assert exact strings
        # ('ドコモ' -> 'dokomo'), so they would flip too. CI must install what
        # prod runs, not whatever is latest that morning.
        # Pillow: tests/test_media_card.py imports PIL HARD (no importorskip) —
        # a skipped render test is a silent green, so losing Pillow here must
        # FAIL the suite, not shrink it.
        #
        # 2026-08-26: + feedparser, PINNED to requirements.txt, and for the same
        # reason as Pillow. tests/test_feed_fetch_bounded.py proves that handing
        # feedparser BYTES instead of a URL still resolves relative links and
        # still decodes UTF-8 — a property that depends on feedparser's own
        # charset fallbacks, so it can only be checked against the real library
        # at the version production runs. importorskip there would make the
        # subtlest assertion in that file a silent green.
        #
        # 2026-09-06: + protego. Two robots guards
        # (test_robots_canon_querystrings.py, test_robots_crawl_hygiene.py) call
        # pytest.importorskip("protego"), and it was installed NOWHERE and is not
        # in requirements.txt — so both have been SKIPPING here since the day they
        # landed, reporting green while the surface they guard drifted. That is how
        # the /*? block on the advertised /api/ examples survived a month. Protego
        # is the RFC 9309 parser; the stdlib robotparser cannot see `Disallow: /*?`
        # at all and reports those paths allowed either way, so there is no
        # stdlib fallback that would make these guards real.
        # PyJWT (pinned as in requirements.txt): the pocket-listings auth wall
        # verifies the dchub_token JWT, and its request-level tests drive that
        # real decode path. Without it they abort collection — and importorskip
        # would turn them into a silent skip instead.
        # ★ Do not name a route module's file here: scripts/dataset_inventory.py
        # reads any workflow text naming a module as a LOADER of the tables it
        # writes ("workflow_loader"), which reclassifies them as foreign data.
        # 2026-09-21: + beautifulsoup4, PINNED as in requirements.txt.
        # tests/test_regex_paramstyle_sweep_restored.py hands the self-learning
        # extractor a real parsed element; importorskip would make it a silent skip.
        run: python3 -m pip install pytest requests flask pyyaml psycopg2-binary "psycopg[binary]" "Unidecode==1.3.8" "Pillow>=10.0.0" "feedparser==6.0.12" protego "PyJWT==2.12.0" "beautifulsoup4==4.14.3"
      # The beat wiring's own must-fail control. Runs BEFORE the suite so a
      # dishonest count fails fast — and it lives HERE rather than in
      # syntax-check because it reads the workflow YAML and needs pyyaml, which
      # the stdlib-only job deliberately does not install.
      - name: Gate beat wiring must-fail control (exit 2 = UNMEASURED = failure)
        run: python3 scripts/gate_beat_selftest.py
      - name: Run pure-function tests
        # pipefail so tee cannot swallow pytest's exit code, and a tee'd log so
        # the ledger beat can read the real passed/failed COUNTS. Counts, not the
        # exit code: a collection abort exits 3 with ZERO tests run, which is the
        # bug that hid an absent unit-test gate for weeks (#1797).
        # No network, for every test file: tests/_no_network/sitecustomize.py
        # refuses and logs each lookup or connect off loopback, and
        # scripts/no_network_verdict.py fails the step on a (file, host) that
        # tests/no_network_register.json does not list. See both docstrings.
        # This shard's slice is chosen by `-p tests._shard`. PARTIAL_RUN: this
        # log covers one shard's files, so the verdict skips its "registered
        # host went quiet" warning. The unit-tests job gives that warning once,
        # over every shard's log.
        env:
          DCHUB_TEST_SHARD_INDEX: ${{ strategy.job-index }}
          DCHUB_TEST_SHARD_TOTAL: ${{ strategy.job-total }}
          DCHUB_TEST_SHARD_REPORT: ${{ runner.temp }}/unit-tests-shard.json
          DCHUB_NO_NETWORK_PARTIAL_RUN: "1"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/unit-tests-no-network.jsonl"
          rm -f "$log"
          status=0
          PYTHONPATH="$PWD/tests/_no_network${PYTHONPATH:+:$PYTHONPATH}" DCHUB_NO_NETWORK_LOG="$log" python3 -m pytest tests/ -v --tb=short -p tests._shard | tee /tmp/unit-tests.log || status=$?
          python3 scripts/no_network_verdict.py "$log" || status=1
          exit $status
      - name: Hand this shard's log and report to the unit-tests job
        if: always()
        run: |
          d="$RUNNER_TEMP/unit-tests-shard"
          mkdir -p "$d"
          for f in /tmp/unit-tests.log "$RUNNER_TEMP/unit-tests-no-network.jsonl" "$RUNNER_TEMP/unit-tests-shard.json"; do
            if [ -f "$f" ]; then cp "$f" "$d/"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/unit-tests-shard/
          # Nothing to upload means the shard died early. The unit-tests job
          # reports that as UNMEASURED, so this step does not fail on it first.
          if-no-files-found: ignore
          retention-days: 3
          # Re-running a failed shard replaces its artifact instead of erroring.
          overwrite: true

  # The required check `unit-tests`: every shard's result, judged as one suite.
  # if: always() so a failed or missing shard is judged and beaten, not skipped.
  unit-tests:
    needs: unit-tests-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        # A shard that died before uploading leaves nothing to download. The
        # next step reports that as UNMEASURED, so this step does not error first.
        continue-on-error: true
        with:
          pattern: unit-tests-shard-*
          path: ${{ runner.temp }}/shards
      - name: Judge the shards as one suite
        # Fails unless every shard passed, every test file ran in exactly one
        # shard (scripts/unit_test_shards_verdict.py), and the whole run's
        # no-network log passes. /tmp/unit-tests.log is rebuilt from every
        # shard's log for the beat below, and ONLY if a shard wrote one: no log
        # at all must stay "unknown", never zero. `awk 1` so a file missing its
        # last newline cannot glue two lines together.
        env:
          SHARDS: ${{ needs.unit-tests-shard.result }}
        run: |
          status=0
          d="$RUNNER_TEMP/shards"
          if ls "$d"/*/unit-tests.log >/dev/null 2>&1; then
            awk 1 "$d"/*/unit-tests.log > /tmp/unit-tests.log
          fi
          python3 scripts/unit_test_shards_verdict.py "$d" || status=1
          if ls "$d"/*/unit-tests-no-network.jsonl >/dev/null 2>&1; then
            awk 1 "$d"/*/unit-tests-no-network.jsonl > "$RUNNER_TEMP/unit-tests-no-network.jsonl"
            python3 scripts/no_network_verdict.py "$RUNNER_TEMP/unit-tests-no-network.jsonl" || status=1
          else
            echo "::error::no unit-tests shard left a no-network log, so the rule judged nothing this run"
            status=1
          fi
          if [ "$SHARDS" != success ]; then
            echo "::error::unit-tests shards concluded '$SHARDS'; the failing 'unit-tests shard N' job has the pytest output"
            status=1
          fi
          exit $status

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf — a second
      # writer is how tools/deadman/watch.py masked honest failures three times.
      # if: always() so a refusal reaches the board too; `fail` means the gate
      # REFUSED something and the ledger reads HEALTHY, not alarmed.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      # The shards never beat, so this job stays the gate's only writer. If the
      # shards were cancelled, a newer run superseded this one: that is reported
      # unmeasured, as the single job reported its own cancellation.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ needs.unit-tests-shard.result == 'cancelled' && 'cancelled' || job.status }}
        run: |
          # N = tests that actually RAN.
          # ★ The distinction that makes G4 work: EMPTY means "unknown" and leaves
          # the vacuous counter untouched; ZERO means "ran and examined nothing"
          # and alarms. A collection abort produces a log with NO summary line —
          # if that mapped to empty, the exact bug this gate exists to catch
          # (2,285 tests, zero run, exit 3) would raise nothing. So: log present
          # but unparseable => 0. Log absent entirely => empty, and job.status
          # carries the failure instead.
          if [ -f /tmp/unit-tests.log ]; then
            N=$(grep -oE '[0-9]+ (passed|failed)' /tmp/unit-tests.log \
                | awk '{t+=$1} END{if(NR)print t; else print 0}')
          else
            N=""
          fi
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          bash scripts/gate_beat.sh "pre-merge:unit-tests" "$V" "$N" absent \
            "N = tests that ran, parsed from the pytest summary"

  # ── DB parity ───────────────────────────────────────────────────────────────
  # tests/test_fiber_provider_backfill.py's live-parity test asserts that the
  # scan's SQL prefilter and repair_provider agree on what a candidate is. It
  # needs a real Postgres (temp tables, `= ANY(%s)`, IS DISTINCT FROM, and a
  # mirror built with LIKE ... INCLUDING ALL), so it SKIPPED on every run and
  # the invariant was only ever checked by hand. #2757 is exactly what it
  # catches: a prefilter that re-selected its own output, behaviour-preserving
  # and therefore invisible to every result-only assertion, 6,158ms on prod.
  #
  # ★NOT folded into unit-tests, and NOT given DATABASE_URL. 58 test files gate
  # on that name; setting it there would wake all of them against an empty
  # database and take a REQUIRED check down. FIBER_PARITY_DSN wakes exactly one.
  #
  # ★FIBER_PARITY_REQUIRE=1 makes a missing DSN FAIL instead of skip. Without it
  # this job reports green when the service container never comes up — the
  # green-but-blind shape this repo keeps rediscovering.
  #
  # ★ A REQUIRED check on main. It began advisory, a new job with a service
  # container left to prove itself on a few PRs; branch protection has since
  # made it required, so a red lane here blocks the merge. To re-check:
  #   gh api repos/azmartone67/dchub-backend/branches/main/protection/required_status_checks --jq .contexts
  # Nothing here can touch prod — the DSN is the throwaway container, and
  # bootstrap is flagged.
  db-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIBER_PARITY_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
      FIBER_PARITY_REQUIRE: '1'
      FIBER_PARITY_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        # flask: the module under test is a blueprint, and _load executes its
        # module-level imports. psycopg2-binary: the parity test connects.
        # psycopg[binary]: the pack-expiry lane loads its instant through
        # psycopg 3 too, the driver that refuses 'infinity'. PyJWT (the
        # requirements.txt pin): the tier-gates token test mints a real JWT.
        run: python3 -m pip install pytest flask psycopg2-binary "psycopg[binary]" requests "PyJWT==2.12.0"
      - name: Fiber provider/name lane parity against a real Postgres
        run: python3 -m pytest tests/test_fiber_provider_backfill.py -v --tb=short
      - name: Prove the parity test actually RAN
        # Belt and braces beside FIBER_PARITY_REQUIRE: assert the live test
        # reports as passed, so neither a skip nor a rename can ride green.
        run: |
          python3 -m pytest tests/test_fiber_provider_backfill.py \
            -q -rs --tb=no > out.txt 2>&1 || { cat out.txt; exit 1; }
          cat out.txt
          if grep -qi "skipped" out.txt; then
            echo "::error::a parity test SKIPPED — this job proves nothing"; exit 1
          fi

      # ── The continuation-compliance QUERY, against the same Postgres ─────
      # The summariser is covered by pure-function tests; the SQL was not, and
      # the SQL is where the measurement lives. Its first real execution would
      # otherwise be production — on the one endpoint whose entire purpose is
      # not reporting a wrong number confidently.
      #
      # Safe to share the `parity` database: this test owns and recreates only
      # mcp_upgrade_signals / mcp_calls_identity, and runs after the fiber lane
      # above has already reported.
      - name: Continuation-compliance SQL against a real Postgres
        env:
          CONTINUATION_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_continuation_compliance_sql.py -v --tb=short

      - name: Prove the compliance SQL test actually RAN
        # It skips itself when no DSN is set, which is exactly how it would
        # ride green here. A skipped proof is not a proof.
        env:
          CONTINUATION_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_continuation_compliance_sql.py \
            -q -rs --tb=no > cc.txt 2>&1 || { cat cc.txt; exit 1; }
          cat cc.txt
          if grep -qi "skipped" cc.txt; then
            echo "::error::the compliance SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── OSM energy lanes: the backfill is never "+N new" ─────────────────
      # Baseline-per-state, insert-vs-refresh counting and the board's +N read
      # are SQL behaviour (ON CONFLICT ... RETURNING (xmax = 0), a partial
      # predicate on in_baseline) that no fake cursor can prove.
      - name: OSM lane baseline semantics against a real Postgres
        env:
          OSM_LANE_PG_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_osm_lane_baseline_pg.py \
            -q -rs --tb=short > osm.txt 2>&1 || { cat osm.txt; exit 1; }
          cat osm.txt
          if grep -qi "skipped" osm.txt; then
            echo "::error::the OSM lane test SKIPPED — it proves nothing"; exit 1
          fi

      # ── The three PAID-TIER grants, against the same Postgres ───────────
      # mcp_dev_keys has no user_id FK, so `email` is the only link between a
      # key and a paying account — and three statements granted paid MCP tier
      # on that link alone, from public request bodies. The fix is one WHERE
      # clause in each; a clause is exactly the kind of thing that gets dropped
      # in a refactor and never noticed, so the statements are read out of the
      # shipped source by ast and executed for real here.
      #
      # Safe to share the `parity` database: this test owns and recreates only
      # mcp_dev_keys / users, and runs after the lanes above have reported.
      - name: Paid-tier grant SQL against a real Postgres
        env:
          PAID_TIER_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_paid_tier_verification_sql.py -v --tb=short

      - name: Prove the paid-tier SQL test actually RAN
        env:
          PAID_TIER_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_paid_tier_verification_sql.py \
            -q -rs --tb=no > pt.txt 2>&1 || { cat pt.txt; exit 1; }
          cat pt.txt
          if grep -qi "skipped" pt.txt; then
            echo "::error::the paid-tier SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── The grants #4428 MISSED, against the same Postgres ──────────────
      # #4428 gated three statements that granted paid tier on an email match
      # and missed three more of the same shape — including a SECOND admin
      # reconcile endpoint. Two of the three gates sit on a SELECT rather than
      # the write, so these run the SELECT and assert which row it hands back.
      - name: Tier-grant gates + legacy backfill SQL against a real Postgres
        env:
          TIER_GATES_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_tier_grant_gates_sql.py tests/test_prefixed_key_row_sql.py tests/test_key_tier_follows_row_sql.py tests/test_tier_gate_token_users_sql.py tests/test_lifecycle_writers_tier_sql.py -v --tb=short

      - name: Prove the tier-gates SQL test actually RAN
        env:
          TIER_GATES_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_tier_grant_gates_sql.py tests/test_prefixed_key_row_sql.py \
            tests/test_key_tier_follows_row_sql.py tests/test_tier_gate_token_users_sql.py \
            tests/test_lifecycle_writers_tier_sql.py \
            -q -rs --tb=no > tg.txt 2>&1 || { cat tg.txt; exit 1; }
          cat tg.txt
          if grep -qi "skipped" tg.txt; then
            echo "::error::the tier-gates SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── The amplifier log upsert, against the same Postgres ─────────────
      # multiplatform_amplifier_log_src_tgt is a PARTIAL unique index
      # (WHERE source_post_id > 0) and _record()'s ON CONFLICT omitted the
      # predicate, so Postgres could not infer the index and EVERY write
      # raised InvalidColumnReference — swallowed by _record's own except.
      # The table held 0 rows from 2026-06-07 to 2026-09-20 while the
      # fan-out posted to Bluesky normally, and the empty log fed back as
      # "never amplified", re-publishing the same post on every sweep.
      # A planner-inference error is invisible to source inspection, so the
      # shipped DDL and the shipped INSERT are pulled out of the module and
      # executed for real here.
      #
      # Safe to share the `parity` database: this test owns and drops only
      # multiplatform_amplifier_log, and runs after the lanes above report.
      - name: Amplifier log upsert SQL against a real Postgres
        env:
          AMPLIFIER_LOG_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_amplifier_log_upsert_sql.py -v --tb=short

      - name: Prove the amplifier-log SQL test actually RAN
        env:
          AMPLIFIER_LOG_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_amplifier_log_upsert_sql.py \
            -q -rs --tb=no > al.txt 2>&1 || { cat al.txt; exit 1; }
          cat al.txt
          if grep -qi "skipped" al.txt; then
            echo "::error::the amplifier-log SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── The live-proof PLATFORM query, against the same Postgres ─────────
      # It decides the homepage line naming which platforms call MCP tools.
      # Until 2026-09-03 it counted raw mcp_tool_calls with neither the
      # is_real_external filter nor the self-traffic exclusion, so the operator's
      # own agent client sat inside the headline (Claude 1,071 vs 492 on its own
      # card). The query is read out of the route by ast and run for real here.
      - name: Live-proof platform SQL against a real Postgres
        env:
          LIVE_PROOF_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_live_proof_platform_basis_sql.py -v --tb=short

      - name: Prove the live-proof SQL test actually RAN
        env:
          LIVE_PROOF_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_live_proof_platform_basis_sql.py \
            -q -rs --tb=no > lp.txt 2>&1 || { cat lp.txt; exit 1; }
          cat lp.txt
          if grep -qi "skipped" lp.txt; then
            echo "::error::the live-proof SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── Pack credits never expire: the grant and the backfill, for real ──
      # tests/test_pack_credits_never_expire.py pins the SQL TEXT against a
      # fake cursor. Only a real Postgres can show that the backfill's
      # data-modifying CTE moves exactly the pack rows, leaves the legacy tu-
      # top-ups alone, runs idempotently at import, and that psycopg2 AND
      # psycopg 3 both load the far-future instant back ('infinity' makes
      # psycopg 3 raise). Owns and recreates only mcp_topups / mcp_trial_emails.
      - name: Pack-expiry SQL against a real Postgres
        env:
          PACK_EXPIRY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_pack_credits_never_expire_sql.py -v --tb=short

      - name: Prove the pack-expiry SQL test actually RAN
        env:
          PACK_EXPIRY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_pack_credits_never_expire_sql.py \
            -q -rs --tb=no > pk.txt 2>&1 || { cat pk.txt; exit 1; }
          cat pk.txt
          if grep -qi "skipped" pk.txt; then
            echo "::error::the pack-expiry SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── Key-hash format normalization, against the same Postgres ────────
      # The ledger's key-hash form is 32 hex chars; a key-bound grant can
      # arrive with the full 64-hex sha256. Only a real Postgres shows the
      # grant stored in the 32-char form, and a row already held in the 64-hex
      # form read and burned by the raw key through `api_key_hash = ANY(...)`.
      # Owns and recreates only mcp_topups / mcp_trial_emails.
      - name: Key-hash format SQL against a real Postgres
        env:
          PACK_EXPIRY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_key_hash_format_sql.py -v --tb=short

      - name: Prove the key-hash format SQL test actually RAN
        env:
          PACK_EXPIRY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_key_hash_format_sql.py \
            -q -rs --tb=no > kh.txt 2>&1 || { cat kh.txt; exit 1; }
          cat kh.txt
          if grep -qi "skipped" kh.txt; then
            echo "::error::the key-hash format SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── An MCP key's 'paid' tier on REST, against the same Postgres ─────
      # mcp_dev_keys.tier can only say 'paid' (production's CHECK is carried
      # here), so the plan a key bought is read from users, mcp_conversions
      # and mcp_checkout_payments. Only a real Postgres runs those lookups
      # through the four real resolvers (validate_api_key, routes/tier_gate,
      # util/tier_gate, protect_data's key tier). frontend#1534.
      # Owns and recreates only users, mcp_dev_keys, mcp_conversions and
      # mcp_checkout_payments.
      - name: MCP-key REST plan SQL against a real Postgres
        env:
          PACK_EXPIRY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_mcp_key_rest_plan_sql.py -v --tb=short

      - name: Prove the MCP-key REST plan SQL test actually RAN
        env:
          PACK_EXPIRY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_mcp_key_rest_plan_sql.py \
            -q -rs --tb=no > mkp.txt 2>&1 || { cat mkp.txt; exit 1; }
          cat mkp.txt
          if grep -qi "skipped" mkp.txt; then
            echo "::error::the MCP-key REST plan SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── had_pack reads every pack source, against the same Postgres ─────
      # tests/test_had_pack_reads_every_pack_source.py pins the SQL and binds
      # PACK_SOURCES to it against a fake cursor. Only a real Postgres shows
      # the list adapting into `= ANY(...)`, a spent pack10 buyer reading
      # had_pack true and a paid tu- top-up (source NULL) reading false — the
      # flag that picks the gateway's re-up nudge and metered-wall exemption.
      # Owns and recreates only mcp_topups / mcp_trial_emails.
      - name: had_pack SQL against a real Postgres
        env:
          HAD_PACK_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_had_pack_reads_every_pack_source_sql.py -v --tb=short

      - name: Prove the had_pack SQL test actually RAN
        env:
          HAD_PACK_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_had_pack_reads_every_pack_source_sql.py \
            -q -rs --tb=no > hp.txt 2>&1 || { cat hp.txt; exit 1; }
          cat hp.txt
          if grep -qi "skipped" hp.txt; then
            echo "::error::the had_pack SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── The exact-location meter, against the same Postgres ─────────────
      # The monthly limit, the free re-view, the month reset and — the part a
      # fake cannot show — that two reveals racing at used=9 grant exactly one
      # (without its advisory lock the month ends at 11). Also the reveal
      # endpoint's operator-withheld query against the registry's SQL
      # functions. Owns and recreates only facility_location_reveals and the
      # schema reveal_redaction_test.
      - name: Location-reveal meter SQL against a real Postgres
        env:
          LOCATION_METER_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_location_meter_sql.py -v --tb=short

      - name: Prove the location-meter SQL test actually RAN
        env:
          LOCATION_METER_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_location_meter_sql.py \
            -q -rs --tb=no > lm.txt 2>&1 || { cat lm.txt; exit 1; }
          cat lm.txt
          if grep -qi "skipped" lm.txt; then
            echo "::error::the location-meter SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── The EIA-860M retirement refresh, against the same Postgres ───────
      # Unit tests pin the gate and the fetch guards with no database. Only a
      # real Postgres shows the refresh landing as ONE transaction: a withdrawn
      # retirement deleted, every refreshed row restamped so the served-table
      # measurement reads fresh, and a refused or failed refresh leaving the
      # table exactly as it was. Owns and recreates only generator_retirements
      # and substations.
      - name: Retirement refresh SQL against a real Postgres
        env:
          EIA_RETIREMENTS_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_eia_retirements_refresh_sql.py -v --tb=short

      - name: Prove the retirement refresh SQL test actually RAN
        env:
          EIA_RETIREMENTS_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_eia_retirements_refresh_sql.py \
            -q -rs --tb=no > er.txt 2>&1 || { cat er.txt; exit 1; }
          cat er.txt
          if grep -qi "skipped" er.txt; then
            echo "::error::the retirement refresh SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── Transmission readers off the frozen March crawl, same Postgres ───
      # The site planner's transmission lookup swallows SQL errors into None, so
      # a wrong column in its repointed statement would silently drop the line
      # from the composite score and the site report. The Energy Discovery
      # export's type=all shipped a statement Postgres rejects on every request.
      # Only a real Postgres shows the lookup matching endpoint names in
      # transmission_lines and the export running. Owns and recreates only
      # transmission_lines, substations, discovered_power_plants and
      # discovered_pipelines.
      - name: Transmission readers SQL against a real Postgres
        env:
          TRANSMISSION_READERS_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_transmission_readers_sql.py -v --tb=short

      - name: Prove the transmission readers SQL test actually RAN
        env:
          TRANSMISSION_READERS_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_transmission_readers_sql.py \
            -q -rs --tb=no > tx.txt 2>&1 || { cat tx.txt; exit 1; }
          cat tx.txt
          if grep -qi "skipped" tx.txt; then
            echo "::error::the transmission readers SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── Paid legacy top-ups never expire: the redeem path, for real ──────
      # tests/test_topup_paid_credits_never_expire.py pins the UPDATE's text
      # against a fake cursor. Only a real Postgres shows a paid tu- row
      # outliving its 30-minute checkout window: the balance still full at
      # +31 minutes and a year on, a late payment worth its credits, and a
      # webhook retry changing nothing. Owns and recreates only mcp_topups /
      # mcp_trial_emails.
      - name: Top-up expiry SQL against a real Postgres
        env:
          TOPUP_EXPIRY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: python3 -m pytest tests/test_topup_paid_credits_never_expire_sql.py -v --tb=short

      - name: Prove the top-up expiry SQL test actually RAN
        env:
          TOPUP_EXPIRY_SQL_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
        run: |
          python3 -m pytest tests/test_topup_paid_credits_never_expire_sql.py \
            -q -rs --tb=no > tu.txt 2>&1 || { cat tu.txt; exit 1; }
          cat tu.txt
          if grep -qi "skipped" tu.txt; then
            echo "::error::the top-up expiry SQL test SKIPPED — it proves nothing"; exit 1
          fi

      # ── Served-slug batch: the profile page's lookups against the batch's ──
      # routes/facility_profile_page.served_slugs resolves a whole list of
      # facility links past the profile route's own 301s (a dedup twin's page
      # redirects to its keeper) with batch statements that MIRROR the page's
      # per-request lookups. tests/test_served_slugs_batch.py compares the two
      # sides' statements as text; only a real Postgres shows DISTINCT ON
      # picking the page's LIMIT 1 row, the `facilities` lookup raising in the
      # live schema shape, and the `k.id` coercions agreeing. Creates and drops
      # its own schema per shape.
      - name: Served-slug batch parity against a real Postgres
        env:
          SERVED_SLUG_PARITY_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
          SERVED_SLUG_PARITY_REQUIRE: '1'
        run: python3 -m pytest tests/test_served_slugs_sql_parity.py -v --tb=short

      - name: Prove the served-slug parity test actually RAN
        env:
          SERVED_SLUG_PARITY_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
          SERVED_SLUG_PARITY_REQUIRE: '1'
        run: |
          python3 -m pytest tests/test_served_slugs_sql_parity.py \
            -q -rs --tb=no > ss.txt 2>&1 || { cat ss.txt; exit 1; }
          cat ss.txt
          if grep -qi "skipped" ss.txt; then
            echo "::error::the served-slug parity test SKIPPED — it proves nothing"; exit 1
          fi

      # ── seo_indexing_log: the write ping_indexnow makes, for real ────────
      # seo_agent.ping_indexnow upserted on url into a table whose own DDL
      # gives url no unique constraint, so Postgres refused every write and
