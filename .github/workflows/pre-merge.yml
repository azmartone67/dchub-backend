name: pre-merge-gauntlet
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # PR merge ref + BOTH parents — the WORKER_VERSION guard diffs HEAD^1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: AST parse every .py
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! python3 -c "import ast; ast.parse(open('$f').read())" 2>/tmp/err; then
              echo "::error file=$f::syntax error"
              cat /tmp/err
              fail=1
            fi
          done < <(find . -name '*.py' -not -path './.git/*' -not -path './node_modules/*' -not -path './.venv/*')
          exit $fail
      # Runs HERE, not in tests/, on purpose. tests/test_tests_are_collectable.py
      # checks the same property with better messages, but it is a pytest test —
      # so against the very bug it targets it cannot run: a module-scope exit
      # aborts collection and takes the guard with it (verified: exit 3, "no
      # tests ran"). The two are complementary; this is the one that still fires
      # once the suite is already dead.
      - name: No test module aborts collection
        run: python3 scripts/check_collection_safety.py tests
      # The gate liveness ledger's OWN must-fail control (2026-08-31). Runs
      # HERE, in the stdlib-only job, for the same reason the collection-safety
      # check does: it must still report when the suite is down, and it must not
      # be able to fail for a reason unrelated to what it controls (the script
      # stubs flask/psycopg2 so the pure predicate imports bare).
      # A board that reports every gate healthy because its own predicate broke
      # is precisely the failure the board exists to catch — and three of the
      # four measurement surfaces audited on 2026-08-17 failed in exactly that
      # direction, opposite to the bug each was built to find.
      - name: Gate ledger must-fail control (exit 2 = UNMEASURED = failure)
        run: python3 scripts/gate_runs_selftest.py
      # db_utils' PGCursorWrapper DROPS DDL when SKIP_DDL is set, and SKIP_DDL
      # defaults to '1' and is absent from prod config — so a lazy CREATE TABLE
      # written against db_utils.get_db()/safe_db() never creates anything, and
      # nothing raises or logs. That hid mcp_sessions for three months (#2196).
      # Runs in syntax-check rather than unit-tests so it still reports when
      # the suite itself is down; tests/test_ddl_through_pool.py covers the
      # same scan with better messages and pins the analyser's behaviour.
      - name: No DDL through the pooled cursor
        run: python3 scripts/check_ddl_through_pool.py
      # CONFIG_SNAPSHOT.md carried a live Redis password + Render deploy-hook
      # key in this PUBLIC repo from 2026-06-13 to 2026-08-07 (flagged 07-24
      # "rotate then redact", never redacted). Old SHAs stay reachable forever,
      # so the fix for the CLASS is refusing the next credential at the gate.
      # --self-test runs first so a regex edit that kills a pattern fails the
      # job instead of silently passing everything (fence-dies-green class).
      # The original rules were all URL shapes, so a BARE `KEY = "<64 hex>"`
      # walked past them — six live credentials nearly landed in a test
      # fixture on 2026-08-07. Rules 4 and 5 close that; tests/
      # test_credential_scan_gate.py fences the file-selection half, which a
      # line-level self-test cannot reach.
      - name: No credential-shaped strings in tracked files
        run: |
          python3 scripts/check_no_leaked_credentials.py --self-test
          python3 scripts/check_no_leaked_credentials.py
      # worker.js is the CF ZONE worker (dchubapiproxy), deployed only by manual
      # dashboard paste — live-vs-repo drift detection depends on WORKER_VERSION
      # changing with the content (2026-07-30: #1902/#1978 shipped without bumps
      # and drift had to be proven by fingerprinting). PR-only: HEAD here is the
      # merge ref, so HEAD^1 is the exact base tip this PR would land on (that's
      # what the fetch-depth: 2 above is for). Push runs to main skip it — the
      # commit already landed, there is nothing left to gate.
      - name: worker.js change requires WORKER_VERSION bump
        if: github.event_name == 'pull_request'
        run: bash scripts/check_worker_version_bump.sh HEAD^1 HEAD

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf — a second
      # writer is how tools/deadman/watch.py masked honest failures three times.
      # if: always() so a refusal reaches the board too; `fail` means the gate
      # REFUSED something and the ledger reads HEALTHY, not alarmed.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # N re-derived independently with the same find the AST step uses, so
          # the count cannot be inherited from a step that silently did nothing.
          N=$(find . -name '*.py' -not -path './.git/*' -not -path './node_modules/*' \
                -not -path './.venv/*' | wc -l | tr -d ' ')
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          bash scripts/gate_beat.sh "pre-merge:syntax-check" "$V" "$N" absent \
            "N = .py files in the tree"

  regression-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history for merge-base
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch origin/main
        run: git fetch origin main
      - name: Run delta-mode regression lint
        run: python3 scripts/regression_lint.py --mode delta --base origin/main

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf — a second
      # writer is how tools/deadman/watch.py masked honest failures three times.
      # if: always() so a refusal reaches the board too; `fail` means the gate
      # REFUSED something and the ledger reads HEALTHY, not alarmed.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Delta lint only inspects CHANGED lines, so a PR touching nothing
          # legitimately examines zero. That is no_scope (an affirmative zero),
          # never a vacuous pass — same distinction as the feed board's
          # no_new_data. Without it every docs-only PR would climb the counter.
          N=$(git diff --name-only origin/main...HEAD 2>/dev/null | wc -l | tr -d ' ')
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          [ "${N:-0}" = "0" ] && [ "$V" = "pass" ] && V=no_scope
          bash scripts/gate_beat.sh "pre-merge:regression-lint" "$V" "$N" absent \
            "N = files changed vs origin/main"

  # Advisory only, and deliberately so: this probes PRODUCTION, which the PR
  # under test has not deployed to and therefore cannot have broken. Do NOT
  # make it a required check — a prod hiccup would then block unrelated merges.
  # continue-on-error stays. What changed (2026-08-19) is that the output is
  # now COMPLETE.
  smoke-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Probe production endpoints
        # tee'd so the ledger beat can read the real probe outcome: this job's
        # continue-on-error means job.status is success no matter what happened.
        run: |
          # GitHub runs `run:` steps under `bash -e`, so the old bare
          #   S=$(curl ... --max-time 10 ...)
          # let the FIRST non-zero curl kill the whole step. On run
          # 32292853179 the log read `/api/v1/health -> 200` and then
          # `Process completed with exit code 28` exactly 10s later — the
          # --max-time budget tripping on endpoint 2 — so endpoints 3 and 4
          # were never probed. A probe whose job is to spot production trouble
          # was stopping at the first sign of it, losing coverage precisely
          # when something was degraded.
          #
          # Capturing curl's status with `|| rc=$?` takes the failure out of
          # -e's hands (a command on the left of `||` is "tested", not fatal),
          # so every path is probed and every failure is named.
          fail=0
          exec > >(tee /tmp/smoke.log) 2>&1
          for path in \
            "/api/v1/health" \
            "/api/energy-discovery/status" \
            "/api/v1/observability/route-audit" \
            "/grid" ; do
            rc=0
            OUT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 10 "https://dchub.cloud$path") || rc=$?
            CODE=${OUT%% *}
            SECS=${OUT##* }
            INT=${SECS%%.*}
            if [ "$rc" -eq 0 ]; then
              # Surface slow-but-passing endpoints at half the timeout budget,
              # so they are visible BEFORE they start tripping --max-time.
              if [ "${INT:-0}" -ge 5 ]; then
                echo "$path -> $CODE (${SECS}s) SLOW: over half the 10s budget"
              else
                echo "$path -> $CODE (${SECS}s)"
              fi
            elif [ "$rc" -eq 28 ]; then
              echo "$path -> TIMEOUT: exceeded --max-time 10 (curl 28)"
              fail=$((fail + 1))
            else
              echo "$path -> ERROR: curl exit $rc (http_code=${CODE:-none})"
              fail=$((fail + 1))
            fi
          done
          echo "---"
          if [ "$fail" -gt 0 ]; then
            echo "advisory: $fail of 4 probes did not complete — check production, not this PR"
          else
            echo "advisory: all 4 probes completed"
          fi

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          # This job carries job-level continue-on-error, so it ALWAYS reports
          # success to the PR and job.status can never say otherwise. The board
          # records it as blocking=false and takes the verdict from the probe
          # output instead — the one place the real outcome survives.
          F=$(grep -oE 'advisory: [0-9]+ of 4 probes did not complete' /tmp/smoke.log 2>/dev/null \
              | grep -oE '[0-9]+' | head -1)
          if [ -z "${F:-}" ]; then V=pass; else V=fail; fi
          bash scripts/gate_beat.sh "pre-merge:smoke-probe" "$V" 4 absent \
            "advisory job (continue-on-error) — verdict from probe output, not job.status"

  # Phase PP (2026-05-13): pure-function unit tests on the hot paths
  # that have shipped regressions this week. Tests use source-extraction
  # so they don't need Flask, the DB, or any network — sub-second on CI.
  # Adding more tests over time will shift these from a smoke-screen
  # toward a real safety net; today this covers brain v2 safety,
  # marketing topic picker, schema-aware feed query, MCP arg sanitizer,
  # and the system-loops classifier.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pytest + the light deps the suite needs
        # pytest-only aborted collection: routes the tests import pull flask /
        # requests / yaml / psycopg2. Installing these light, no-DB deps lets the
        # brain auto-merge/draft/gate tests actually RUN (a real gate, not a skip).
        # Verified green: 210 passed, 8 skipped (DB tests skip w/o DATABASE_URL).
        #
        # 2026-07-28: + Unidecode. tests/test_seo_slug_and_soft404.py imports it
        # to check non-Latin facility names slug to something usable ('ドコモ').
        # It is in requirements.txt (Unidecode==1.3.8) so it was present locally
        # and on the running app, but NOT in this deliberately-light CI install —
        # so main went red the moment that test landed, and every PR inherited
        # the failure. Without it NFKD alone folds CJK to '' and two tests fail.
        #
        # ★ PINNED to the requirements.txt version on purpose. canonical_slug is
        # FROZEN set-once (routes/facility_slug_freeze.py) and is minted from
        # this library's output, so a transliteration change under an unpinned
        # bump would mean CI mints different slugs than the ones already frozen
        # in the DB and indexed by Google. The tests assert exact strings
        # ('ドコモ' -> 'dokomo'), so they would flip too. CI must install what
        # prod runs, not whatever is latest that morning.
        # Pillow: tests/test_media_card.py imports PIL HARD (no importorskip) —
        # a skipped render test is a silent green, so losing Pillow here must
        # FAIL the suite, not shrink it.
        #
        # 2026-08-26: + feedparser, PINNED to requirements.txt, and for the same
        # reason as Pillow. tests/test_feed_fetch_bounded.py proves that handing
        # feedparser BYTES instead of a URL still resolves relative links and
        # still decodes UTF-8 — a property that depends on feedparser's own
        # charset fallbacks, so it can only be checked against the real library
        # at the version production runs. importorskip there would make the
        # subtlest assertion in that file a silent green.
        run: python3 -m pip install pytest requests flask pyyaml psycopg2-binary "psycopg[binary]" "Unidecode==1.3.8" "Pillow>=10.0.0" "feedparser==6.0.12"
      # The beat wiring's own must-fail control. Runs BEFORE the suite so a
      # dishonest count fails fast — and it lives HERE rather than in
      # syntax-check because it reads the workflow YAML and needs pyyaml, which
      # the stdlib-only job deliberately does not install.
      - name: Gate beat wiring must-fail control (exit 2 = UNMEASURED = failure)
        run: python3 scripts/gate_beat_selftest.py
      - name: Run pure-function tests
        # pipefail so tee cannot swallow pytest's exit code, and a tee'd log so
        # the ledger beat can read the real passed/failed COUNTS. Counts, not the
        # exit code: a collection abort exits 3 with ZERO tests run, which is the
        # bug that hid an absent unit-test gate for weeks (#1797).
        run: |
          set -o pipefail
          python3 -m pytest tests/ -v --tb=short | tee /tmp/unit-tests.log

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf — a second
      # writer is how tools/deadman/watch.py masked honest failures three times.
      # if: always() so a refusal reaches the board too; `fail` means the gate
      # REFUSED something and the ledger reads HEALTHY, not alarmed.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # N = tests that actually RAN.
          # ★ The distinction that makes G4 work: EMPTY means "unknown" and leaves
          # the vacuous counter untouched; ZERO means "ran and examined nothing"
          # and alarms. A collection abort produces a log with NO summary line —
          # if that mapped to empty, the exact bug this gate exists to catch
          # (2,285 tests, zero run, exit 3) would raise nothing. So: log present
          # but unparseable => 0. Log absent entirely => empty, and job.status
          # carries the failure instead.
          if [ -f /tmp/unit-tests.log ]; then
            N=$(grep -oE '[0-9]+ (passed|failed)' /tmp/unit-tests.log \
                | awk '{t+=$1} END{if(NR)print t; else print 0}')
          else
            N=""
          fi
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          bash scripts/gate_beat.sh "pre-merge:unit-tests" "$V" "$N" absent \
            "N = tests that ran, parsed from the pytest summary"

  # ── DB parity ───────────────────────────────────────────────────────────────
  # tests/test_fiber_provider_backfill.py's live-parity test asserts that the
  # scan's SQL prefilter and repair_provider agree on what a candidate is. It
  # needs a real Postgres (temp tables, `= ANY(%s)`, IS DISTINCT FROM, and a
  # mirror built with LIKE ... INCLUDING ALL), so it SKIPPED on every run and
  # the invariant was only ever checked by hand. #2757 is exactly what it
  # catches: a prefilter that re-selected its own output, behaviour-preserving
  # and therefore invisible to every result-only assertion, 6,158ms on prod.
  #
  # ★NOT folded into unit-tests, and NOT given DATABASE_URL. 58 test files gate
  # on that name; setting it there would wake all of them against an empty
  # database and take a REQUIRED check down. FIBER_PARITY_DSN wakes exactly one.
  #
  # ★FIBER_PARITY_REQUIRE=1 makes a missing DSN FAIL instead of skip. Without it
  # this job reports green when the service container never comes up — the
  # green-but-blind shape this repo keeps rediscovering.
  #
  # Not a required check: it is a new job with a service container, so let it
  # prove itself on a few PRs before anything gates on it. Nothing here can
  # touch prod — the DSN is the throwaway container, and bootstrap is flagged.
  db-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIBER_PARITY_DSN: postgres://postgres:postgres@localhost:5432/parity?sslmode=disable
      FIBER_PARITY_REQUIRE: '1'
      FIBER_PARITY_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        # flask: the module under test is a blueprint, and _load executes its
        # module-level imports. psycopg2-binary: the parity test connects.
        run: python3 -m pip install pytest flask psycopg2-binary requests
      - name: Fiber provider/name lane parity against a real Postgres
        run: python3 -m pytest tests/test_fiber_provider_backfill.py -v --tb=short
      - name: Prove the parity test actually RAN
        # Belt and braces beside FIBER_PARITY_REQUIRE: assert the live test
        # reports as passed, so neither a skip nor a rename can ride green.
        run: |
          python3 -m pytest tests/test_fiber_provider_backfill.py \
            -q -rs --tb=no > out.txt 2>&1 || { cat out.txt; exit 1; }
          cat out.txt
          if grep -qi "skipped" out.txt; then
            echo "::error::a parity test SKIPPED — this job proves nothing"; exit 1
          fi

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # out.txt is written by the prove-it-RAN step above, which already
          # fails the job on a skip. N comes from the same file so the count and
          # the skip check cannot disagree.
          # Same empty-vs-zero rule as unit-tests: present-but-unparseable => 0.
          if [ -f out.txt ]; then
            N=$(grep -oE '[0-9]+ (passed|failed)' out.txt | awk '{t+=$1} END{if(NR)print t; else print 0}')
          else
            N=""
          fi
          case "${JOB_STATUS:-}" in
            success) V=pass ;;
            failure) V=fail ;;
            *)       V=unmeasured ;;
          esac
          bash scripts/gate_beat.sh "pre-merge:db-parity" "$V" "$N" absent \
            "N = parity tests that ran"
