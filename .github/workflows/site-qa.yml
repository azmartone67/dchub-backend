name: site-qa

on:
  schedule:
    - cron: "11-59/15 * * * *"
  workflow_dispatch: {}

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger QA run and read its result
        id: run
        env:
          # /api/v1/qa/run is gated as of 2026-09-12 (r-sec): it starts ~28
          # outbound probes, and ?sync=1 runs them ON the request. Without this
          # secret the trigger 401s and the step fails loudly below — it does
          # not silently report a healthy site.
          INTERNAL_KEY: ${{ secrets.DCHUB_INTERNAL_KEY }}
        run: |
          if [ -z "$INTERNAL_KEY" ]; then
            echo "::error title=Site QA::DCHUB_INTERNAL_KEY secret is not set — \
          the QA trigger would 401 and results would be unknown"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, time, urllib.request

          HOST = "https://dchub-backend-production.up.railway.app"
          INTERNAL_KEY = os.environ["INTERNAL_KEY"]

          def get(path, data=None, timeout=60):
              req = urllib.request.Request(
                  HOST + path, method=("POST" if data is not None else "GET"),
                  data=data, headers={"User-Agent": "dchub-site-qa-ci/1.0",
                                      "X-Internal-Key": INTERNAL_KEY})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode())

          # /api/v1/qa/run is NON-BLOCKING: it returns 202 {"started": ...} and
          # runs the suite in a daemon thread. Reading passed/failed off THIS
          # response is what silently pinned p0 to 0 and meant the "Open issue if
          # P0 regressed" step below could never fire. Trigger, then poll the
          # report until a run newer than our trigger lands.
          kick = get("/api/v1/qa/run", data=b"")
          since = kick.get("started_at") or kick.get("last_started") or ""
          print(f"trigger: {json.dumps(kick)[:300]}")

          deadline, report = time.time() + 210, None
          while time.time() < deadline:
              time.sleep(10)
              try:
                  cand = get("/api/v1/qa/report")
              except Exception as e:
                  print(f"  poll error (retrying): {type(e).__name__}: {e}")
                  continue
              results = cand.get("results") or []
              if not results:
                  continue
              newest = max(r["run_at"] for r in results)
              print(f"  newest run_at={newest} (want > {since})")
              if not since or newest > since:
                  report = cand
                  break

          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if report is None:
              # Fail loudly. Reporting 0/0/0 here is what hid the breakage before.
              print("::error title=Site QA::no fresh QA report within 210s — "
                    "results unknown, NOT assuming healthy")
              out.write("stale=1\n")
              raise SystemExit(1)

          results = report["results"]
          passed = sum(1 for r in results if r["status"] == "pass")
          failed = sum(1 for r in results if r["status"] == "fail")
          skipped = sum(1 for r in results if r["status"] == "skip")
          p0 = [r for r in results if r["status"] == "fail" and r["severity"] == "p0"]

          for r in sorted(results, key=lambda r: r["status"] != "fail"):
              if r["status"] != "pass":
                  print(f"  {r['status'].upper():4s} {r['severity']} {r['test_name']} "
                        f"{r['url']} -> {r.get('error_detail')}")

          out.write(f"passed={passed}\nfailed={failed}\np0={len(p0)}\n"
                    f"skipped={skipped}\nstale=0\n")
          out.close()

          # A skip means an unknown check kind reached the runner — the test did
          # not actually assert anything. Surface it instead of counting it green.
          if skipped:
              print(f"::warning title=Site QA::{skipped} test(s) SKIPPED "
                    "(unknown check kind) — those URLs are unverified")
          print(f"::notice title=Site QA::total={len(results)} passed={passed} "
                f"failed={failed} p0_failures={len(p0)} skipped={skipped}")
          PY


      - name: Open issue if P0 regressed
        if: steps.run.outputs.p0 != '0'
        uses: actions/github-script@v7
        env:
          # /api/v1/qa/regressions is gated as of 2026-09-12 (r-sec). This step
          # runs ONLY when a P0 has already fired, so an unauthenticated fetch
          # here would 401 at exactly the moment the signal matters — and the
          # 7-day traffic sample that motivated the gate showed 0 requests to
          # this path precisely BECAUSE no P0 fired in the window. Zero traffic
          # is not the same as no caller.
          INTERNAL_KEY: ${{ secrets.DCHUB_INTERNAL_KEY }}
        with:
          script: |
            const fs = require('fs');
            const title = `🚨 P0 site QA regression detected — ${new Date().toISOString()}`;
            const internalKey = process.env.INTERNAL_KEY;
            if (!internalKey) {
              core.setFailed('DCHUB_INTERNAL_KEY is not set — cannot read ' +
                '/api/v1/qa/regressions, so the P0 issue would be empty');
              return;
            }
            const r = await fetch(
              'https://dchub-backend-production.up.railway.app/api/v1/qa/regressions',
              { headers: { 'X-Internal-Key': internalKey } }
            );
            if (!r.ok) {
              core.setFailed(`qa/regressions returned ${r.status} — P0 detail ` +
                'unavailable; not opening an issue with no content');
              return;
            }
            const resp = await r.json();
            const body = `## P0 regressions detected\n\n` +
              resp.alerts.filter(a => a.severity === 'p0' && !a.resolved_at).map(a =>
                `- **${a.test_name}** (${a.consecutive_failures}x failures)\n` +
                `  - ${a.message}\n` +
                `  - Proposed fix: ${a.proposed_fix || '(none)'}\n`
              ).join('\n') +
              `\n\nDashboard: https://dchub.cloud/api/v1/qa/dashboard` +
              `\n(admin-gated since 2026-09-12 — send X-Internal-Key/X-Admin-Key, `+
              `or ?admin_key=. No credential is embedded here: this repo and its `+
              `issues are public.)`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['p0', 'self-heal', 'site-qa']
            });

      - name: HTML quality scan (Phase 249)
        run: |
          # Trigger the healer's HTML scan
          curl -sS -X POST "https://dchub.cloud/api/v1/heal/run?action=html_quality_scan" | tee /tmp/quality.json
          # If 0 issues, exit clean. If >0, open/update a GitHub issue.
          ISSUES=$(jq -r '.details' /tmp/quality.json 2>/dev/null | grep -oE '[0-9]+' | head -1)
          if [ "${ISSUES:-0}" -gt 0 ]; then
            echo "::warning::HTML quality scan found ${ISSUES} issues"
            # Open a GitHub issue if not already open
            gh issue list --label "html-quality" --state open | head -1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
