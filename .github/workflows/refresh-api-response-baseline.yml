# REFRESH THE API RESPONSE BASELINE — the automation the "do not hand-edit"
# header in contracts/api_response_surface.json always implied.
# ════════════════════════════════════════════════════════════════════════════
# 2026-09-20: the committed baseline had drifted 525 entries behind main. The
# drift was DETECTED the whole time — api-response-contract.yml regenerates the
# baseline on every run and prints "::notice::Baseline is behind: N added
# key(s)". A notice blocks nothing and nobody reads it, so the file sat stale
# and 63 keys plus 2 endpoints that exist on main were not protected by the
# guard. Detection without a durable action is not a control.
#
# WHY A PR AND NOT A DIRECT PUSH
# ------------------------------
# main carries 6 required status checks with enforce_admins: true. A direct
# push of a fresh commit can never satisfy them, so it is rejected. This
# follows the pattern refresh-architecture-map.yml already proves in this repo:
# regenerate, open a PR with PR_SUBMIT_TOKEN, arm auto-merge. PR_SUBMIT_TOKEN
# and not GITHUB_TOKEN because a PR opened with GITHUB_TOKEN triggers NO
# workflow run — its required checks would never report and it would sit open
# forever. api-response-contract.yml carries the scar of that same rule.
#
# ★ THE SAFETY GATE — why this cannot launder a key deletion
# ----------------------------------------------------------
# `check` runs FIRST and the refresh only happens on exit 0. `contract` IS a
# required check on main now (7 contexts, measured 2026-09-21 via
# .../protection/required_status_checks), but branch protection is
# strict:false, so a PR can still land a key removal on a green that was
# computed before main moved. If this job regenerated unconditionally it would
# then rewrite the baseline around that removal and erase the only remaining
# evidence.
#
#   exit 0  no key removed        -> regenerate, open the PR
#   exit 1  a key was removed     -> REFUSE. Leave the baseline as the record.
#   exit 2  UNMEASURED            -> REFUSE. "Could not measure" is never a pass.
#
# Removals that are deliberate are not blocked by this — they go in
# contracts/api_response_exceptions.json, which makes `check` exit 0 and lets
# the refresh proceed. Audited removals flow; silent ones jam the lane.
#
# ★ A REFRESH IS A SNAPSHOT OF ONE TREE — it must not land on another
# --------------------------------------------------------------------
# 2026-09-21: #5026 was generated on 4ef4fc37e, where GET /api/v1/markets/
# <market> still served `stats.mw_coverage`. #5022 removed that key at 02:44Z.
# #5026's checks had passed on its OLD merge ref; strict:false does not require
# an up-to-date branch and nothing re-runs a PR's checks when main moves (a
# re-run replays the stored merge SHA), so it squash-merged at 03:15Z and main's
# baseline asserted a key main did not serve. `contract` went red on main and on
# every open PR, and the gate above then refused to regenerate: main could not
# heal itself. A generated file never conflicts textually with the code change
# that invalidates it, so git gives no warning either.
#
# So every place this lane acts, it asks `verify-against`: "if this baseline
# landed on main as main is RIGHT NOW, would it be main's surface?" (the merge
# tree is built in a throwaway worktree; equality is on keys, resolution and
# open levels — `source` line churn is not staleness):
#
#   1. it builds on LIVE origin/main, not the commit that triggered the run —
#      a run queued behind this concurrency group would otherwise regenerate a
#      main that has already moved;
#   2. it CLOSES every open refresh PR that is no longer main's surface, on
#      every run (each push to main, and the schedule). Keyed on the SURFACE,
#      not the base SHA: of the first 11 refresh PRs, 9 landed on a main that
#      had moved during CI, but only 2 saw the surface move (#5020 additively,
#      #5026 the break). Closing on SHA would have starved the lane;
#   3. it re-verifies against a fresh fetch of main before pushing, and opens
#      nothing if main moved under it.
#
# api-response-contract.yml runs the same verification as part of the
# required `contract` check on any PR that changes the baseline.
#
# WHAT THIS CANNOT DO: make the merge itself conditional on main. strict:false
# lets any PR merge on a green computed before main moved, merge queue is not
# available to a user-owned repo, and this repo has mergers besides auto-merge.
# A surface-changing merge that lands after this lane's last verification and
# before the refresh merges — i.e. inside one reaction of this workflow — can
# still land stale. This shrinks that window from the refresh's whole CI run
# (~40 min) to the time between a push to main and this run closing the PR.

name: refresh-api-response-baseline

on:
  push:
    branches: [main]
  # Belt, and it is load-bearing: a push made with GITHUB_TOKEN creates NO
  # workflow run, so bot merges can land without the push trigger ever firing.
  # api-response-contract.yml recorded 17 of 24 commits landing that way.
  schedule:
    - cron: '52 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-api-response-baseline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the extractor uses `git ls-files`

      # (1) Main as it is NOW. The triggering commit can be minutes old by the
      # time a queued run starts, and a refresh built on it is stale at birth.
      - name: Move to live main
        run: |
          set -euo pipefail
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          git checkout -q --detach origin/main
          echo "building against main $(git rev-parse --short=9 HEAD) (event sha ${GITHUB_SHA::9})"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # No pip install. The extractor is stdlib-only BY DESIGN — see the
      # comment in api-response-contract.yml. A missing wheel must never be
      # able to decide whether the baseline gets refreshed.

      # The guard must be able to FAIL before its verdict is worth acting on.
      # If the self-test is broken, `check` returning 0 means nothing and the
      # safety gate below is decorative.
      - name: Self-test — the guard must be able to FAIL and to say UNMEASURED
        run: python3 scripts/api_response_contract_selftest.py

      # (2) A refresh PR that is no longer main's surface must not stay
      # mergeable. Closing is the one hold nothing in this repo re-arms:
      # disabling auto-merge is not (see auto-enable-automerge.yml, and PRs
      # here have merged after a verified disable). Runs even when the lane is
      # disabled — it only ever removes a way to break main.
      - name: Close refresh PRs whose baseline is no longer main's surface
        env:
          GH_TOKEN: ${{ secrets.PR_SUBMIT_TOKEN }}
        run: |
          # `run:` is `bash -e` by default: without +e the first STALE verdict
          # would abort the loop instead of closing the PR.
          set +e -uo pipefail
          PRS=$(gh pr list --state open --limit 100 --json number,headRefName \
                  --jq '.[] | select(.headRefName | startswith("chore/api-baseline-")) | .number') || {
            echo "::error::cannot list open PRs — cannot tell whether a stale refresh is mergeable"
            exit 1
          }
          FAILED=0
          for N in $PRS; do
            if ! git fetch -q origin "+refs/pull/$N/head:refs/remotes/pr/$N"; then
              echo "::error::cannot fetch #$N — cannot verify it"; FAILED=1; continue
            fi
            python3 scripts/api_response_contract.py verify-against \
              --main origin/main --candidate "refs/remotes/pr/$N" > "/tmp/verify-$N.txt" 2>&1
            RC=$?
            cat "/tmp/verify-$N.txt"
            if [ "$RC" = "0" ]; then
              echo "#$N is still main's surface — leaving it open"
              continue
            fi
            {
              echo "Closed by \`refresh-api-response-baseline\`: if this baseline landed on main"
              echo "now ($(git rev-parse --short=9 origin/main)) it would not be main's surface"
              echo "(\`verify-against\` exit $RC; 1 = stale, 2 = unmeasured or does not merge)."
              echo "Main moved under it after it was generated. The next run regenerates"
              echo "from current main."
              echo
              echo '```'
              tail -n 60 "/tmp/verify-$N.txt"
              echo '```'
            } > "/tmp/close-$N.md"
            gh pr merge "$N" --disable-auto >/dev/null 2>&1 || true
            gh pr comment "$N" --body-file "/tmp/close-$N.md" || true
            if gh pr close "$N" --delete-branch; then
              echo "::warning::closed stale refresh #$N (verify-against exit $RC)"
            else
              echo "::error::#$N is STALE and could not be closed — it can still land"
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: Check the contract BEFORE touching the baseline
        id: contract
        env:
          GATE: ${{ vars.API_BASELINE_AUTOHEAL_DISABLE }}
        run: |
          # +e: `run:` is `bash -e` by default, which exited on a non-zero
          # `check` before CODE=$? — the annotations below never printed and
          # `code` was never written.
          set +e -uo pipefail
          if [ "${GATE:-0}" = "1" ]; then
            echo "disabled via API_BASELINE_AUTOHEAL_DISABLE"
            echo "code=disabled" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/api_response_contract.py check
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            0) echo "::notice::contract PASS — safe to refresh the baseline" ;;
            1) echo "::error::contract FAIL on main — a public key was removed. REFUSING to refresh the baseline: regenerating now would rewrite the record around the removal. Fix the handler or add an audited entry to contracts/api_response_exceptions.json." ;;
            2) echo "::error::contract UNMEASURED on main — the key surface could not be computed. REFUSING to refresh. This is NOT a pass." ;;
            *) echo "::error::contract exited $CODE (unexpected). REFUSING to refresh." ;;
          esac
          exit "$CODE"

      - name: Regenerate, and open an auto-merge PR if the baseline drifted
        if: steps.contract.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.PR_SUBMIT_TOKEN }}
        run: |
          set -euo pipefail
          cp contracts/api_response_surface.json /tmp/committed.json
          python3 scripts/api_response_contract.py baseline >/dev/null

          if git diff --quiet -- contracts/api_response_surface.json; then
            echo "baseline matches the tree — nothing to refresh"
            exit 0
          fi

          # Report the ACTUAL key/endpoint delta. Counting '+' lines in the
          # diff also counts stat fields, which once reported "~1 added key" on
          # a run where zero keys changed. A guard must not invent numbers
          # about itself.
          python3 - <<'PY' > /tmp/delta.md
          import json
          old = json.load(open("/tmp/committed.json"))
          new = json.load(open("contracts/api_response_surface.json"))
          ks = lambda s: {(e, k) for e, r in s["endpoints"].items() for k in r["keys"]}
          added, dropped = ks(new) - ks(old), ks(old) - ks(new)
          new_eps = sorted(set(new["endpoints"]) - set(old["endpoints"]))
          gone_eps = sorted(set(old["endpoints"]) - set(new["endpoints"]))
          RANK = {"resolved": 2, "partial": 1, "opaque": 0}
          downgrades = [
              e for e in set(old["endpoints"]) & set(new["endpoints"])
              if RANK.get(new["endpoints"][e]["resolution"], 9)
                 < RANK.get(old["endpoints"][e]["resolution"], 9)
          ]
          print("Regenerated by `scripts/api_response_contract.py baseline`, "
                "opened by `.github/workflows/refresh-api-response-baseline.yml`.")
          print()
          print(f"- keys: **{old['stats']['keys_total']} -> {new['stats']['keys_total']}** "
                f"({len(added)} added, {len(dropped)} dropped)")
          print(f"- strictly protected: **{old['stats']['keys_strictly_protected']} -> "
                f"{new['stats']['keys_strictly_protected']}**")
          print(f"- endpoints added: {len(new_eps)}; removed: {len(gone_eps)}")
          print(f"- resolution downgrades (resolved/partial -> opaque): **{len(downgrades)}**")
          print()
          # These are NOT always zero, and the difference matters. `check`
          # exiting 0 means "nothing left the surface WITHOUT an audited
          # entry in contracts/api_response_exceptions.json" — not "nothing
          # left the surface". An audited removal drops a key and still
          # exits 0, which is precisely the case worth printing: it names
          # which approved removals this refresh is absorbing into the
          # baseline. (Measured 2026-09-20 on the 525-entry drift: one
          # dropped key, `public_listings`, audited in #4654.) A non-empty
          # list here is expected and fine; it is the reviewer's cue to
          # confirm each one against the exceptions file.
          for label, items in (("keys dropped", sorted(dropped)),
                               ("endpoints removed", gone_eps),
                               ("resolution downgrades", sorted(downgrades))):
              if items:
                  print(f"**{label}:**")
                  for it in items:
                      print(f"- `{it}`")
                  print()
          if new_eps:
              print("**new endpoints:**")
              for e in new_eps:
                  print(f"- `{e}` ({new['endpoints'][e]['resolution']}, "
                        f"{len(new['endpoints'][e]['keys'])} keys)")
          PY

          # One healing PR at a time. A second one would carry the same drift
          # and race the first to merge.
          OPEN=$(gh pr list --state open --limit 100 --json headRefName \
                   --jq '[.[] | select(.headRefName | startswith("chore/api-baseline-"))] | length')
          if [ "${OPEN:-0}" != "0" ]; then
            echo "a refresh PR is already open — it will carry this drift too"
            exit 0
          fi

          BR="chore/api-baseline-$(git rev-parse --short HEAD)"
          git config user.name "dchub-api-baseline"
          git config user.email "api@dchub.cloud"
          git switch -q -c "$BR"
          git add contracts/api_response_surface.json
          git commit -F - <<EOF
          contracts: refresh the API response baseline — handlers moved under it

          $(cat /tmp/delta.md)

          The contract check passed on main before this was regenerated, so no
          public response key left the surface except any listed above under
          "keys dropped" — those are removals already audited in
          contracts/api_response_exceptions.json. Everything else here is
          additive and line-shift churn.
          EOF

          # (3) Main may have moved while this ran. Open nothing that would
          # not be main's surface if it landed now; the push that moved main
          # has its own run queued, and that run regenerates from it.
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          set +e
          python3 scripts/api_response_contract.py verify-against \
            --main origin/main --candidate HEAD
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "::warning::main moved to $(git rev-parse --short=9 origin/main) while this refresh was built and it is no longer main's surface (verify-against exit $RC) — not opening it"
            exit 0
          fi

          git push -u origin HEAD
          gh pr create --fill
          gh pr merge --auto --squash
