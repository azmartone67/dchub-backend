# Phase FF+25-followup-r24 (2026-05-20) — OSM nightly crawl.
# Walks all 26 OpenStreetMap regions for data center POIs and bulk-
# inserts the missing ones. Polite — 2s sleep per region, UA identifies
# as DCHubCrawler/1.0. Disabled at the backend until DCM_CRAWL_ENABLED
# (or OSM_CRAWL_ENABLED) is set in Railway env. User confirmed
# tonight that DCM_CRAWL_ENABLED=true is set on both Railway + Render.
#
# Offset cron 23 4 * * * — runs 12 min after the DCM workflow (4:11)
# so they don't dogpile.

name: OpenStreetMap — nightly DC coverage sweep

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Single region slug (e.g. alberta). Empty = all 26.'
        required: false
      dry_run:
        description: 'Dry run (no inserts)'
        required: false
        default: 'false'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger OSM crawl
        id: crawl
        run: |
          set -eo pipefail
          ADMIN_KEY="${{ secrets.DCHUB_ADMIN_KEY }}"
          REGION="${{ github.event.inputs.region }}"
          DRY="${{ github.event.inputs.dry_run }}"
          QS=""
          if [ -n "$REGION" ]; then QS="?region=$REGION"; fi
          if [ "$DRY" = "true" ]; then
            [ -z "$QS" ] && QS="?dry_run=1" || QS="$QS&dry_run=1"
          fi
          # 2026-07-27 FIX (3 consecutive red days, 07-25→07-27): the crawl
          # takes ~3m16s, which exceeds the Cloudflare worker's subrequest
          # budget — the edge returned its own 503 envelope
          # ("Backend unreachable and no cached data available",
          # worker_version 4.55.0) and the job read that as a crawler error
          # while the BACKEND was healthy the whole time. Verified: the same
          # POST against the Railway origin returns ok:true (693 POIs seen).
          # Long-running admin jobs must bypass the edge. Public traffic is
          # unaffected — this is a cron-only, admin-keyed path.
          # ...and a 3-minute SYNCHRONOUS request survives no proxy at all:
          # the Railway edge answered 502 "Application failed to respond"
          # (and a deploy landing mid-crawl kills the request outright).
          # So: SPAWN via ?async=1 (returns 202 immediately), then poll
          # /status, which reads osm_crawl_log — the crawl persists every
          # run there, so the real numbers are never lost to a dropped HTTP
          # connection. The edge is fine for these short calls.
          ORIGIN="${DCHUB_ORIGIN_URL:-https://dchub-backend-production.up.railway.app}"
          [ -z "$QS" ] && QS="?async=1" || QS="$QS&async=1"
          BEFORE=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
            "$ORIGIN/api/v1/admin/osm-crawl/status" \
            | python3 -c "import json,sys; print((json.load(sys.stdin).get('last_run') or {}).get('started_at') or '')" 2>/dev/null || echo "")
          SPAWN=$(curl -sS --max-time 60 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "User-Agent: DCHub-OSM-Cron/1.0" \
            "$ORIGIN/api/v1/admin/osm-crawl/run$QS")
          echo "spawn: $SPAWN"
          # Poll up to ~12 min for a NEWER completed run than BEFORE.
          RESP=""
          for i in $(seq 1 48); do
            sleep 15
            S=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
              "$ORIGIN/api/v1/admin/osm-crawl/status" || echo "")
            [ -z "$S" ] && continue
            DONE=$(BEFORE="$BEFORE" S="$S" python3 - <<'PP'
          import json, os
          try:
              lr = (json.loads(os.environ["S"]).get("last_run") or {})
          except Exception:
              print(""); raise SystemExit
          st, fin = lr.get("started_at") or "", lr.get("finished_at")
          print(json.dumps(lr) if (st and st != os.environ.get("BEFORE") and fin) else "")
          PP
            )
            if [ -n "$DONE" ]; then RESP="$DONE"; break; fi
          done
          if [ -z "$RESP" ]; then
            echo "::error::OSM crawl did not report a completed run within the poll window"
            echo "beat_status=error" >> "$GITHUB_OUTPUT"
            echo "rows_inserted=0" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # /status rows carry the same keys the sync response did, plus an
          # explicit finished_at — mark ok so the classifier below reads it
          # exactly as before.
          RESP=$(RESP="$RESP" python3 -c "import json,os; d=json.loads(os.environ['RESP']); d.setdefault('ok', True); print(json.dumps(d))")
          # 2026-07-24 (zero-row triage, follows growthfix wave #26): this block
          # used to exit 0 on ok:false, so POIS_NEW fell back to 0 and the beat
          # reported a healthy run for a crawler that had ERRORED — and once
          # wave #26 mapped rows==0 to no_new_data, an error would have
          # affirmatively told the board "zero is expected here" and reset the
          # zero-row counter. Classify the outcome three ways instead, and let
          # no_new_data mean only what it says: we swept, everything was known.
          RESP="$RESP" python3 - <<'PY'
          import json, os, sys

          GH = os.environ.get("GITHUB_OUTPUT")
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")


          def out(**kv):
              if not GH:
                  return
              with open(GH, "a") as f:
                  for k, v in kv.items():
                      f.write("%s=%s\n" % (k, v))


          def summary(line):
              if SUMMARY:
                  with open(SUMMARY, "a") as f:
                      f.write(line + "\n")


          try:
              d = json.loads(os.environ["RESP"])
          except Exception as e:
              print("::error::OSM crawler returned non-JSON: %s" % str(e)[:120])
              out(beat_status="error", rows_inserted=0)
              sys.exit(1)

          seen = int(d.get("pois_seen") or 0)
          new = int(d.get("pois_new") or 0)
          dup = int(d.get("pois_dup") or 0)

          if not d.get("ok"):
              print("::error::OSM crawler returned error: %s" % d.get("error"))
              print(json.dumps(d, indent=2)[:600])
              out(beat_status="error", rows_inserted=0)
              sys.exit(1)

          summary("### OSM nightly crawl")
          summary("")
          summary("- Regions: %d swept" % len(d.get("regions", [])))
          summary("- POIs seen: %d" % seen)
          summary("- New: %d" % new)
          summary("- Duplicate (already in DB): %d" % dup)
          summary("- Errors: %s" % d.get("errors"))
          summary("")
          summary("**Sample of new additions:**")
          for ex in (d.get("examples") or [])[:15]:
              summary("- %s (%s)" % (ex.get("name", ""), ex.get("country", "")))

          if new > 0:
              status = "success"
          elif seen > 0:
              # Swept real POIs, every one already known — the NORMAL state for a
              # mature crawl, and the honest use of the affirmative status.
              status = "no_new_data"
          elif d.get("rejected"):
              # 2026-08-10: Overpass refused the CLIENT (403/406), so every bbox
              # returned nothing for one nameable reason. Say which — "swept 0
              # POIs" sent the last investigation looking for an outage when the
              # service was up and simply 406ing the User-Agent.
              print("::error::Overpass REJECTED the client (403/406) — not an "
                    "outage. Check OSM_USER_AGENT: overpass-api.de 406s any "
                    "User-Agent containing 'crawler'. stopped_reason=%s"
                    % d.get("stopped_reason"))
              status = "error"
          else:
              # Nothing fetched at all: Overpass down, crawl disabled, every bbox
              # skipped. Zero here is not "expected", it is the loop not running.
              print("::error::OSM swept 0 POIs — nothing was fetched")
              status = "error"
          out(beat_status=status, rows_inserted=new,
              beat_note="seen=%d new=%d dup=%d%s"
                        % (seen, new, dup,
                           " REJECTED" if d.get("rejected") else ""))
          # ★2026-08-08 (audit SH52-002, B1): the zero-fetch branch set
          # status="error" but the RUN concluded success, so 10 consecutive
          # zero-row crawls rode inside green runs while the deadman-watch
          # conclusion-writer overwrote the producer's error beat. The run
          # itself must go red — both sibling error branches already exit(1).
          if status == "error":
              import sys
              sys.exit(1)
          PY

      - name: beat deadman board
        # if: always() — a failed crawl must beat status=error, not skip the beat.
        if: always()
        continue-on-error: true
        env:
          BEAT_STATUS: ${{ steps.crawl.outputs.beat_status }}
          ROWS_INSERTED: ${{ steps.crawl.outputs.rows_inserted }}
          BEAT_NOTE: ${{ steps.crawl.outputs.beat_note }}
        run: |
          # No outputs at all ⇒ the crawl step died early. Not success, and
          # emphatically not no_new_data.
          STATUS="${BEAT_STATUS:-error}"
          RI="${ROWS_INSERTED:-0}"
          NOTE="${BEAT_NOTE:-beat by osm-crawl.yml}"
          curl -s -X POST "https://dchub.cloud/api/v1/admin/ingest-runs/beat" \
            -H "X-Admin-Key: ${{ secrets.DCHUB_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: dchub-ingest-beat/1.0" \
            -d "{\"feed\":\"osm-crawl\",\"status\":\"$STATUS\",\"rows_inserted\":$RI,\"cadence_hours\":24,\"note\":\"$NOTE\"}" || true
