# Story Debt → Author. Daily: measure ship-to-story debt (NEW-badged nav
# items with no published /whats-new card) and stage skeleton draft cards as
# a GitHub DRAFT PR. Merge stays the approval; drafts are invisible to the
# loader either way (status != "published").
#
# NOT in tools/deadman/watch.py's conclusion registry, on purpose — this
# producer beats its own honest status below (tests/test_alarm_reachability
# enforces single-writer: a conclusion watcher would clobber an error beat
# back to success, the news-ner/osm-crawl masking class). The producer
# therefore declares its own cadence_hours in the beat; the watcher's ledger
# fold still covers staleness.
name: Story Debt → Author (stage draft cards)

on:
  schedule:
    - cron: "41 9 * * *"   # daily 09:41 UTC — minute unused by other crons
  workflow_dispatch: {}

permissions:
  contents: write        # push the story-debt/drafts branch
  pull-requests: write   # open/close the draft PR

concurrency:
  group: story-debt-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: install requests
        run: python3 -m pip install --quiet requests

      - name: measure debt and stage drafts
        id: author
        run: python3 tools/story_debt_author.py

      - name: beat deadman board
        if: always()
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          ROWS: ${{ steps.author.outputs.staged }}
          OUTCOME: ${{ steps.author.outcome }}
          BEAT_STATUS: ${{ steps.author.outputs.beat_status }}
        run: |
          # feed name must match the shell's AUTHOR_FEED exactly. status=error
          # on a failed author run is the honest beat — the board must see the
          # writer stalled, not silence. cadence_hours rides in the beat: this
          # producer is the single writer (no conclusion watcher), so it also
          # carries the cadence authority. 30h = daily cron with slack, the
          # same threshold the shell's author_heartbeat lane doubles for RED.
          COUNT="${ROWS:-0}"
          # 2026-08-20: this used to emit only success|error, so a run that
          # correctly staged nothing beat `success` with rows=0. Three of those
          # in a row trip the board's zero-row alarm, and that false RED failed
          # "Ingestion Integrity Master Tick" every day from 08-18 while the
          # story-debt shell's own ship_vs_story lane read PASS — "every
          # NEW-badged nav item is covered by a published card". The producer
          # was working; the reporter had no vocabulary for a healthy idle.
          #
          # Precedence is one-way, most-alarming first:
          #   job failed              -> error        (never overridden)
          #   author said no_new_data -> no_new_data  (an EARNED assertion)
          #   anything else           -> success
          #
          # ★ An EMPTY BEAT_STATUS falls to `success`, NEVER to no_new_data.
          # no_new_data is an AFFIRMATIVE healthy-idle status: routes/ingest_runs
          # treats it as OK, RESETS consecutive_zero and exempts the >=3-zero
          # alarm, so asserting it without evidence disarms this feed
          # permanently. Silence is not evidence. Defaulting the unknown branch
          # toward "keep the alarm armed" is the whole point.
          if [ "$OUTCOME" != "success" ]; then
            STATUS="error"
          elif [ "${BEAT_STATUS:-}" = "no_new_data" ]; then
            STATUS="no_new_data"
          else
            STATUS="success"
          fi
          echo "beat: status=$STATUS staged=$COUNT (author said '${BEAT_STATUS:-<unset>}')"
          # Fail-open but NOT silent (tests/test_workflow_curl_guard.py): a
          # beat that 401s would leave this feed reading stale on the board
          # while the job itself stays green.
          CODE=$(curl -s -o /tmp/beat.json -w '%{http_code}' \
            -X POST "https://dchub.cloud/api/v1/admin/ingest-runs/beat" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: dchub-ingest-beat/1.0" \
            -d "{\"feed\":\"story-debt-author\",\"status\":\"$STATUS\",\"rows_inserted\":$COUNT,\"cadence_hours\":30,\"note\":\"beat by story-debt-author.yml (producer)\"}" || echo 000)
          echo "beat HTTP $CODE"
          case "$CODE" in
            200|201|202|204) ;;
            *) echo "::warning::dead-man beat returned $CODE — story-debt-author will read STALE on /api/v1/ops/deadman";;
          esac
