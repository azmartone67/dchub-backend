# Daily infra growth tracker (owner request 2026-06-13).
#
# Records one count snapshot per layer per day (substations, data centers,
# gas, fiber, power) and surfaces FLATLINE warnings — a layer that should
# be growing but hasn't changed in N days is an early signal its source
# quietly broke (exactly what happened to gas: frozen at 918 for weeks
# while the cron looked green). Pure DB counts, runs on Railway; this job
# just triggers the snapshot and echoes the trend.
name: infra-growth-tracker

on:
  schedule:
    # ★ MOVED 2026-08-07: was '9 6 * * *'. data-sync.yml's sync-infrastructure
    # job runs at 00/06/12/18 UTC, so 06:09 landed NINE MINUTES INTO a sync,
    # with the loaders mid-flight. The gas loader deletes its own source tag
    # before rewriting it, so a snapshot in that gap records a torn count and
    # publishes a dip today and a matching spike tomorrow — invented deltas on
    # a board whose whole job is to say whether a layer really grew. 05:40 sits
    # clear of every sync window. The authoritative baselines now come from the
    # re-baseline step at the END of each ingest; this daily run is the backstop
    # and the reporting surface (it is what prints the flatline warnings).
    - cron: '38 5 * * *'   # 05:38 UTC daily — staggered off data-growth-radar's `40 5` (D15, 2026-09-02)
  workflow_dispatch: {}

concurrency:
  group: infra-growth-tracker
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
      ORIGIN: https://dchub-backend-production.up.railway.app
    steps:
      - name: Snapshot + report growth
        run: |
          set -uo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping"; exit 0
          fi
          http=$(curl -sS --max-time 120 -X POST \
            "${ORIGIN}/api/v1/admin/infra-growth/snapshot" \
            -H "X-Admin-Key: ${ADMIN_KEY}" -o /tmp/g.json -w '%{http_code}')
          echo "HTTP ${http}"
          if [ "${http}" != "200" ]; then echo "::error::snapshot failed (${http})"; cat /tmp/g.json; exit 1; fi

          # One readable line per layer.
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/g.json'))
          print(f"{'LAYER':<26}{'COUNT':>12}  {'+1d':>7}  {'+7d':>8}  {'STATUS':<12}CATEGORY")
          for l in sorted(d.get('layers', []), key=lambda x: (x['category'], x['layer'])):
              d1 = '' if l['delta_1d'] is None else f"+{l['delta_1d']}"
              d7 = '' if l['delta_7d'] is None else f"+{l['delta_7d']}"
              flag = '  ⚠️ FLATLINE' if l['flatline'] else ''
              # status is the derived health word; category is only the cadence.
              # Printing the cadence alone is what made a frozen layer and an
              # on-schedule quiet one look identical on this board and on the page.
              print(f"{l['layer']:<26}{l['count']:>12,}  {d1:>7}  {d7:>8}  "
                    f"{(l.get('status') or '?'):<12}{l['category']}{flag}")
          print()
          for l in sorted(d.get('layers', []), key=lambda x: x['layer']):
              print(f"  {l['layer']}: {l.get('status_reason') or '(no reason published)'}")
              ki = l.get('known_issue')
              if ki:
                  print(f"      known issue {ki.get('ref')}: {ki.get('note')}")
          PY

          # ★ THE VERDICT IS RENDERED HERE, NEVER RE-DERIVED (2026-09-12).
          # This used to print "all layers within expected cadence" whenever
          # `flatlines` came back empty — on a run whose own detail lines, just
          # above, named a layer "unjudged" at 194 days and two layers whose
          # freshness was masked by a minor lane. A layer with no declared
          # threshold never enters the flatline test, so a summary built from
          # flatlines could not see what the detail printed. The backend now
          # publishes ONE rolled-up `verdict` (the snapshot response) and
          # this step only renders it: no second predicate lives here to drift.
          # A response without a verdict is UNMEASURED, never green.
          # Warning-level, exactly as flatlines always were — this job is the
          # reporting surface, and a held layer has an owner, not a broken cron.
          GROWTH_JSON=/tmp/g.json python3 - <<'PY'
          # growth-verdict-renderer — a test executes this exact block against fixtures
          import json, os
          d = json.load(open(os.environ.get("GROWTH_JSON", "/tmp/g.json")))
          flat = d.get("flatlines") or []
          if flat:
              print("::warning::infra layers flatlined — a source may have broken: " + "; ".join(flat))
          v = d.get("verdict")
          if not isinstance(v, dict):
              print("::warning::growth verdict not published by this deploy — UNMEASURED, not green")
          elif v.get("all_green") is True:
              print("✅ no flatlines — all layers within expected cadence")
          else:
              parts = ["%s (%s)" % (h.get("layer"), ", ".join(h.get("why") or ["?"]))
                       for h in (v.get("held") or [])]
              parts += ["%s (declared, but no snapshot record)" % m
                        for m in (v.get("not_reported") or [])]
              if parts:
                  print("⚠ %d of %s layers not judged green:" % (len(parts), v.get("declared", "?")))
                  for p in parts:
                      print("   - " + p)
                  print("::warning::growth verdict NOT green — " + "; ".join(parts))
              else:
                  print("::warning::growth verdict NOT green but names no layer — read the layer lines above")
          PY
