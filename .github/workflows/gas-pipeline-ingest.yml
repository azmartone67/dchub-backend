name: Gas Pipeline Ingest (EIA → gas_pipelines)

# Refreshes the gas_pipelines table from the EIA national Natural Gas
# Pipelines feature service (~32,892 interstate+intrastate polylines →
# representative points).
#
# ★ The fetch runs HERE on the GitHub runner, not on Railway: the old
# geo.dot.gov source died (its backend DB refused connections → 500) and
# Railway's egress to ArcGIS is unreliable, so every server-side cron run
# failed. The runner (reliable egress) fetches the live EIA service and
# POSTs the rows to the ingest endpoint, which writes to Neon. Idempotent
# (clears its own source='eia_geodot_lines' rows each run).
# Logic: tools/infra_fetch.py.

on:
  schedule:
    - cron: '30 7 * * 1'   # Mondays 07:30 UTC (EIA pipeline data is ~quarterly)
  workflow_dispatch:
    inputs:
      cap:
        # ★ 2026-08-07: was 30000. THIS is the value a manual dispatch uses —
        # `github.event.inputs.cap` is POPULATED from this default, so the
        # `|| '40000'` fallback in env below never fires on workflow_dispatch.
        # Two runs were dispatched after the env fallback was fixed and both
        # still fetched exactly 30,000. Keep this in sync with env.CAP and with
        # tools/infra_fetch.py's default_cap; all three are asserted by
        # tests/test_unfreeze_the_organism.py.
        description: 'Max features to ingest (must exceed the ~32,892 upstream)'
        required: false
        default: '40000'

concurrency:
  group: gas-pipeline-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
      DCHUB_ORIGIN: https://dchub-backend-production.up.railway.app
      # ★ 2026-08-07: was 30000 — BELOW the source, and this value WINS over
      # tools/infra_fetch.py's default_cap because it is passed as an explicit
      # argv. Raising the default alone was a no-op for every scheduled run.
      # fetch_gas_pipelines ends `return rows[:cap]`, so a cap under the
      # upstream count truncates silently; the loader then rewrites its own
      # source tag, leaving the table at EXACTLY 30,000 rows with a fresh
      # created_at and ZERO net growth for 54 days — green on every freshness
      # check while 2,892 EIA segments were dropped.
      # Live 2026-08-07 (returnCountOnly on the EIA service): 32,892 features.
      CAP: ${{ github.event.inputs.cap || '40000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch EIA gas pipelines + ingest
        run: |
          set -uo pipefail
          # ★ 2026-08-08 (audit SH52-120): a missing secret used to `exit 0`,
          # turning a deleted/renamed DCHUB_ADMIN_KEY into a green no-op — the
          # quarterly/weekly gas-pipeline refresh would silently stop while this
          # workflow stayed green (the exact class fixed in dcpi-daily.yml #1851
          # and in this file's own snapshot step below). A red run is cheap and
          # honest; the ingest is idempotent so a retry after a fix is safe.
          if [ -z "${DCHUB_ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY not set — gas-pipeline ingest cannot run; failing loudly instead of a silent green no-op"
            exit 1
          fi
          python tools/infra_fetch.py gas-pipelines "${CAP}"

      # ★ RE-BASELINE THE GROWTH SNAPSHOT — the totals on the public /whats-new
      # board are read from infra_growth_snapshot, NOT from a live COUNT(*), so
      # a table this job just rewrote keeps publishing the pre-ingest number
      # until the next daily snapshot fires.
      #
      # Measured 2026-08-07, the reason this step exists: the gas cap fix
      # (#2330-2332) landed and gas_pipelines went 30,918 -> 33,769 at 08:27
      # UTC, while the daily snapshot had already run at 06:34. The operator's
      # page under-reported gas by 2,851 rows for the rest of the day and there
      # was nothing wrong with it — the count was simply older than the fix.
      # This job is weekly and the snapshot is daily, so on the normal schedule
      # every Monday ingest was invisible for ~23h.
      #
      # Posts to the Railway ORIGIN, not dchub.cloud: the snapshot runs a
      # COUNT(*) per layer over tables up to 2.6M rows, and admin POSTs through
      # the Cloudflare edge are cut off at the 15s ROUTE_TIMEOUTS default. It
      # also checks the status code and FAILS — `| head -c 400 || true` is
      # exactly how the sibling call in gem-refresh.yml was swallowing this.
      - name: Re-baseline infra-growth snapshot
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY not set — the snapshot would 401 and /whats-new would keep serving the pre-ingest gas count"
            exit 1
          fi
          CODE=$(curl -sS --max-time 180 -o /tmp/snap.json -w '%{http_code}' \
            -X POST "https://dchub-backend-production.up.railway.app/api/v1/admin/infra-growth/snapshot" \
            -H "X-Admin-Key: ${ADMIN_KEY}" || echo 000)
          echo "HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::error::infra-growth snapshot returned ${CODE} — /whats-new keeps publishing the pre-ingest count"
            head -c 400 /tmp/snap.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/snap.json'))
          for l in d.get('layers', []):
              print(f"{l['layer']:<24}{l['count']:>12,}  {(l.get('status') or '?'):<12}"
                    f"{(l.get('status_reason') or '')[:88]}")
          PY
