name: brain-model-reachability
# r85j: keep the brain's model-reachability cache fresh so brain_model_for can
# degrade off dead models AND auto-promote one that comes back — e.g. flip
# inspector+reasoning back to claude-fable-5 the moment Anthropic approves it on
# the account (with DCHUB_BRAIN_PREFER_FABLE=1 set). The /model-probe route
# persists the reachability map to brain_meta; the resolver reads it.
on:
  schedule:
    - cron: '47 */2 * * *'   # :47 past every 2h (off-cycle from other brain crons)
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh brain model reachability
        run: |
          curl -sS --max-time 60 \
            "https://dchub-backend-production.up.railway.app/api/v1/brain/model-probe" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('best_reachable:', d.get('best_reachable')); print('results:', d.get('results'))" \
            || echo "probe failed (non-fatal — cache keeps last value)"
