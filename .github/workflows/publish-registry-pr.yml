name: Publish GitHub-Registry PR (Fri 2026-06-26 7am PDT)

# ONE-TIME scheduled publish. Flips the STAGED press release
# (slug: 2026-06-26-dchub-github-mcp-registry, currently published=false) to
# published on Friday 2026-06-26 at 14:00 UTC = 7:00 AM PDT (Pacific daylight).
#
# Idempotent: re-upserts the full payload with published=true, so multiple fires
# are harmless. The 3 cron minutes (00/07/15) absorb GitHub's scheduled-run lag;
# workflow_dispatch is the manual backstop to fire it at the exact minute.
# Safe to delete after it has run.

on:
  schedule:
    - cron: '0 14 26 6 *'    # 14:00 UTC, Jun 26 = 7:00 AM PDT
    - cron: '7 14 26 6 *'    # retries — GitHub cron can lag a few minutes
    - cron: '15 14 26 6 *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-registry-pr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flip the staged press release to published
        env:
          AK: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -e
          if [ -z "$AK" ]; then echo "::error::DCHUB_ADMIN_KEY missing"; exit 1; fi
          CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
            "https://dchub.cloud/api/admin/press-releases" \
            -H "Authorization: Bearer $AK" \
            -H "Content-Type: application/json" \
            -H "User-Agent: dchub-ci-publish/1.0" \
            --data @scripts/registry-pr-payload.json)
          echo "admin POST -> HTTP $CODE"; cat /tmp/r.json || true; echo
          case "$CODE" in 200|201) : ;; *) echo "::error::publish failed ($CODE)"; exit 1;; esac
          sleep 5
          LIVE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dchub.cloud/news/2026-06-26-dchub-github-mcp-registry")
          echo "public page -> HTTP $LIVE"
          [ "$LIVE" = "200" ] || echo "::warning::page not 200 yet (CF edge cache may lag a moment)"
