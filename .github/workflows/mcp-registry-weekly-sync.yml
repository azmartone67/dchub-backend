# DAILY MCP registry sync + coverage report — BACKEND FAILOVER PUBLISHER.
#
# Registry ownership: the official entry `cloud.dchub/datacenter-power-grid-fiber` is OWNED by the
# dchub-mcp-server repo (its server.json tracks the live server). That repo has
# its own publishers (registry-refresh.yml + daily-manifest-sync.yml) — the
# PRIMARY path. This workflow is the BACKEND's independent FAILOVER: a third,
# canonical-sourced publisher so the listing stays fresh even if the mcp-server
# repo's own publishers fail. We run SPOF-free.
#
# DRIFT-PROOF BY CONSTRUCTION (faithful "option C"): this job never publishes the
# backend's own server.json (that local copy is stale by design and used only by
# routes/ai_platform_tool_tuner.py + routes/brain_ecosystem_watch.py). Instead it
# fetches the CANONICAL server.json from the owning repo's source of truth —
# the live server first (CANON_LIVE), GitHub raw as fallback (CANON_RAW), so
# neither source is itself a single point of failure — and publishes THAT, and
# only when the official registry is BEHIND it. So the
# backend can only ever push the single source-of-truth version; it physically
# cannot drift from, or regress `isLatest` away from, the real server.
#
# What it does every day (and on-demand):
#   1. LIVE server (dchub-mcp-server .../health)      → tool count + version.
#   2. CANONICAL server.json (owning repo, raw)       → the version to publish.
#   3. OFFICIAL registry (registry.modelcontextprotocol.io) → what's published.
#   4. FAILOVER PUBLISH: only if canonical != registry, publish the canonical
#      body (mcp-publisher + MCP_REGISTRY_PRIVATE_KEY, DNS-auth on dchub.cloud —
#      the same domain key both repos use). "duplicate version" is a no-op.
#   5. SMITHERY re-scan (best-effort; needs SMITHERY_TOKEN; never fails the run).
#   6. COVERAGE REPORT: a table to the Step Summary showing every surface's
#      version + drift flags, so you SEE mirror coverage instead of guessing.
#
# Nothing here is destructive; every external step is fail-soft. If the canonical
# fetch fails or fails validation, the job publishes NOTHING (it will not fall
# back to the stale local copy) and the coverage report shows the gap.
#
# Secrets used: MCP_REGISTRY_PRIVATE_KEY (already set). Optional: SMITHERY_TOKEN.

name: MCP Registry Daily Sync

on:
  schedule:
    - cron: "44 14 * * *"   # DAILY 14:40 UTC (was Mondays; daily multi-registry refresh)
  workflow_dispatch: {}

concurrency:
  group: mcp-registry-weekly
  cancel-in-progress: false

env:
  # Canonical server.json sources, tried in order. Both serve the owning repo's
  # exact registry-schema body; using TWO independent sources means neither is a
  # single point of failure for the failover (we run SPOF-free).
  #   1. CANON_LIVE — the running server's own /server.json (source of truth;
  #      its version tracks SERVER_VERSION, so it's the freshest).
  #   2. CANON_RAW  — the repo's version-controlled copy on GitHub (fallback if
  #      the live server is unreachable).
  CANON_LIVE: "https://dchub-mcp-server-production.up.railway.app/server.json"
  CANON_RAW: "https://raw.githubusercontent.com/azmartone67/dchub-mcp-server/main/server.json"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Gather live + canonical + registry state
        id: state
        run: |
          set +e
          LIVE_JSON=$(curl -s --max-time 20 "https://dchub-mcp-server-production.up.railway.app/health")
          LIVE_TOOLS=$(echo "$LIVE_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin).get('tools','?'))" 2>/dev/null)
          LIVE_VER=$(echo "$LIVE_JSON"  | python3 -c "import json,sys;print(json.load(sys.stdin).get('version','?'))" 2>/dev/null)

          # CANONICAL: fetch server.json to ./canonical-server.json, trying the
          # live server first then GitHub raw. Validate EACH candidate IS the
          # cloud.dchub entry with a non-empty version before trusting it — a
          # failed/garbled fetch from one source falls through to the next, and if
          # BOTH fail we publish nothing (never the backend's stale local copy).
          CANON_OK=0; CANON_VER="(all sources failed)"; CANON_SRC="none"
          for u in "$CANON_LIVE" "$CANON_RAW"; do
            curl -s --max-time 20 "$u" -o canonical-server.json || continue
            V=$(python3 -c "import json;d=json.load(open('canonical-server.json'));assert d.get('name')=='cloud.dchub/datacenter-power-grid-fiber';v=d.get('version') or '';assert v;print(v)" 2>/dev/null)
            if [ -n "$V" ]; then CANON_OK=1; CANON_VER="$V"; CANON_SRC="$u"; break; fi
          done

          # ACTUAL latest published version = the entry flagged isLatest (fallback:
          # newest by publishedAt). NOT vs[-1] — the API array is lexicographically
          # ordered, so vs[-1] returns e.g. 2.9.3 over 2.11.1. That old bug made the
          # decision + coverage report claim "registry behind" every day.
          REG_VER=$(curl -s --max-time 20 "https://registry.modelcontextprotocol.io/v0/servers?search=cloud.dchub" | python3 -c "import json,sys; d=json.load(sys.stdin).get('servers',[]); c=[x for x in d if x['server'].get('name')=='cloud.dchub/datacenter-power-grid-fiber']; m=lambda x:x.get('_meta',{}).get('io.modelcontextprotocol.registry/official',{}); l=[x for x in c if m(x).get('isLatest')]; c.sort(key=lambda x:m(x).get('publishedAt','')); print(l[0]['server']['version'] if l else (c[-1]['server']['version'] if c else 'none'))" 2>/dev/null)
          SMITHERY_HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://smithery.ai/servers/azmartone67/dchub")

          # Failover fires ONLY when we have a valid canonical AND the registry is
          # behind it. Equal versions => no-op. Invalid canonical => never publish.
          if [ "$CANON_OK" = "1" ] && [ "$CANON_VER" != "$REG_VER" ]; then SHOULD_PUB=1; else SHOULD_PUB=0; fi

          echo "live_tools=$LIVE_TOOLS"       >> "$GITHUB_OUTPUT"
          echo "live_ver=$LIVE_VER"           >> "$GITHUB_OUTPUT"
          echo "canon_ver=$CANON_VER"         >> "$GITHUB_OUTPUT"
          echo "canon_ok=$CANON_OK"           >> "$GITHUB_OUTPUT"
          echo "canon_src=$CANON_SRC"         >> "$GITHUB_OUTPUT"
          echo "reg_ver=$REG_VER"             >> "$GITHUB_OUTPUT"
          echo "should_pub=$SHOULD_PUB"       >> "$GITHUB_OUTPUT"
          echo "smithery_http=$SMITHERY_HTTP" >> "$GITHUB_OUTPUT"
          echo "Live: $LIVE_TOOLS tools v$LIVE_VER | canonical v$CANON_VER (ok=$CANON_OK, src=$CANON_SRC) | official-registry v$REG_VER | publish=$SHOULD_PUB | smithery HTTP $SMITHERY_HTTP"

      - name: Failover publish canonical (only if registry is behind canonical)
        if: steps.state.outputs.should_pub == '1'
        continue-on-error: true   # a "duplicate version" (already published) is a harmless no-op; never red the daily run
        env:
          MCP_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
          EXPECT_VER: ${{ steps.state.outputs.canon_ver }}
        run: |
          if [ -z "$MCP_KEY" ]; then echo "::warning::MCP_REGISTRY_PRIVATE_KEY not set — skipping failover publish"; exit 0; fi
          # Publish the CANONICAL body fetched in the gather step (never the
          # backend's local server.json). mcp-publisher publishes ./server.json,
          # so put the canonical there.
          cp canonical-server.json server.json
          # Belt-and-suspenders: refuse to publish unless it is still the canonical
          # entry at the exact version we decided on (guards a fetch that changed
          # or a mid-run edit — no divergent/regressive publish is possible).
          python3 -c "import json,os;d=json.load(open('server.json'));assert d.get('name')=='cloud.dchub/datacenter-power-grid-fiber','wrong name';assert d.get('version')==os.environ['EXPECT_VER'],'version moved mid-run';print('canonical server.json validated: v'+d['version'])" \
            || { echo "::error::canonical server.json failed re-validation — NOT publishing"; exit 1; }
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain dchub.cloud --private-key "$MCP_KEY"
          OUT=$(./mcp-publisher publish 2>&1) || true; echo "$OUT"
          if echo "$OUT" | grep -qi "duplicate version"; then echo "::notice::official registry already has v${EXPECT_VER} — no-op"; fi
          echo "::notice::backend failover publish complete (canonical v${EXPECT_VER})"

      - name: Re-scan Smithery (best-effort)
        continue-on-error: true
        env:
          SMITHERY_TOKEN: ${{ secrets.SMITHERY_TOKEN }}
        run: |
          if [ -z "$SMITHERY_TOKEN" ]; then
            echo "::notice::SMITHERY_TOKEN not set — skipping Smithery re-scan. To enable: run 'smithery auth token' locally and add the output as the SMITHERY_TOKEN repo secret."
            exit 0
          fi
          npm install -g @smithery/cli >/dev/null 2>&1 || true
          # try a couple of non-interactive auth shapes; never fail the run
          { echo "$SMITHERY_TOKEN" | smithery auth login --token-stdin; } 2>/dev/null \
            || smithery auth login --api-key "$SMITHERY_TOKEN" 2>/dev/null \
            || SMITHERY_API_KEY="$SMITHERY_TOKEN" true
          SMITHERY_API_KEY="$SMITHERY_TOKEN" smithery mcp publish "https://dchub.cloud/mcp" -n azmartone67/dchub \
            && echo "::notice::Smithery re-scan submitted" \
            || echo "::warning::Smithery re-scan could not auth non-interactively — re-run 'smithery mcp publish' locally if the tool list changed."

      - name: Coverage report
        if: always()
        run: |
          {
            echo "## MCP Registry Coverage — $(date -u +%Y-%m-%d)"
            echo ""
            echo "_Backend = **failover** publisher. Primary owner is the dchub-mcp-server repo._"
            echo ""
            echo "| Surface | State |"
            echo "|---|---|"
            echo "| **Live server** | ${{ steps.state.outputs.live_tools }} tools, v${{ steps.state.outputs.live_ver }} |"
            echo "| **Canonical** (source of truth) | v${{ steps.state.outputs.canon_ver }} · via ${{ steps.state.outputs.canon_src }} |"
            echo "| **Official registry** (cloud.dchub/datacenter-power-grid-fiber) | v${{ steps.state.outputs.reg_ver }} · [listing](https://registry.modelcontextprotocol.io/v0/servers?search=cloud.dchub) |"
            echo "| **Smithery** | HTTP ${{ steps.state.outputs.smithery_http }} · [page](https://smithery.ai/servers/azmartone67/dchub) |"
            echo "| **Glama** | auto-crawled from glama.json · [page](https://glama.ai/mcp/servers) |"
            echo "| **PulseMCP** | mirrors official registry · [directory](https://www.pulsemcp.com/servers) |"
            echo ""
            if [ "${{ steps.state.outputs.canon_ok }}" != "1" ]; then
              echo "> ❌ Could not fetch/validate the canonical server.json from EITHER source (live \`CANON_LIVE\` or \`CANON_RAW\`). Published NOTHING this run — the backend will not fall back to its stale local copy. Check both sources."
            elif [ "${{ steps.state.outputs.reg_ver }}" != "${{ steps.state.outputs.canon_ver }}" ]; then
              echo "> ⚠️ Official registry (v${{ steps.state.outputs.reg_ver }}) is BEHIND canonical (v${{ steps.state.outputs.canon_ver }}) — the primary (mcp-server repo) publisher may have failed; the backend failover published above."
            else
              echo "> ✅ Official registry is in sync with the canonical source of truth (v${{ steps.state.outputs.canon_ver }})."
            fi
            if [ "${{ steps.state.outputs.canon_ok }}" = "1" ] && [ "${{ steps.state.outputs.live_ver }}" != "${{ steps.state.outputs.canon_ver }}" ]; then
              echo ">"
              echo "> ℹ️ Live server (v${{ steps.state.outputs.live_ver }}) ≠ canonical repo (v${{ steps.state.outputs.canon_ver }}) — the **dchub-mcp-server repo** needs a server.json bump (that's the primary owner's job, not the backend's)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
