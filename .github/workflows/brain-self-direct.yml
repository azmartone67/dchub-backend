name: brain self-direct loop

# THE SELF-DIRECTING LOOP heartbeat (2026-06-19). Every 4 hours, pokes the
# brain's self-director so it can — UNPROMPTED — ASSESS what is most worth
# thinking about (reuse work-plan + scan_opportunities), INVESTIGATE the single
# highest-leverage item (reuse the verified investigate()), and SURFACE the
# refuted recommendation to a human-facing AGENDA. The brain directs its own
# ATTENTION.
#
# IT SHIPS DARK. This cron only provides the HEARTBEAT — every safety cap is
# enforced SERVER-SIDE inside self_direct_tick(), NOT here:
#   · BRAIN_SELF_DIRECT_ENABLED defaults OFF → a tick returns
#     {ran:false, skipped_reason:"disabled"} and makes ZERO model calls.
#   · at most 1 investigation per tick + a daily cap
#     (BRAIN_SELF_DIRECT_DAILY_CAP, default 4) → cost can't explode even if the
#     cron fires more often than expected.
#   · no ANTHROPIC_API_KEY → {ran:false, skipped_reason:"no_api_key"} (no-op).
#
# THE HARD SAFETY LINE: this rung gains NO authority to ACT. self_direct_tick is
# strictly PROPOSE-ONLY — the most it ever does is store ONE agenda row. It NEVER
# merges/sends/opens-a-PR/triggers-the-automerge. It is strictly WEAKER than the
# automerge loop (the only autonomous actor, on allowlisted mechanical fixes).
#
# Auth mirrors brain-autonomy.yml: the DCHUB_ADMIN_KEY repo secret sent as the
# X-Admin-Key header (the same gate every brain admin endpoint accepts), against
# the Railway origin directly (CF edge-cache + the 15s edge timeout don't apply
# to the origin).

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BASE: https://dchub-backend-production.up.railway.app

jobs:
  self-direct:
    runs-on: ubuntu-latest
    # 8 was sized for one POST that could not outlive --max-time 180. The step
    # can now spend up to 300s on the POST plus 5 min polling the worker
    # watermark before deciding — 8 would cancel the job mid-poll and hand
    # deadman-watch a timeout instead of the answer.
    timeout-minutes: 20
    steps:
      - name: Self-direct — tick (assess → investigate → surface agenda; ships dark)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping self-direct tick"
            exit 0
          fi
          # ★ 2026-08-19: this step read NO status code, so it could not tell a
          # finished tick from one that had merely been ACCEPTED.
          # /api/v1/brain/self-direct/tick is in main.py's
          # _WORKER_PROXY_POST_PATHS but NOT _WORKER_PROXY_SYNC_PATHS, so web
          # relays it to dchub-worker on a 15s read budget
          # (`_read_budget = 180 if request.path in _WORKER_PROXY_SYNC_PATHS
          # else 15`) and answers honestly when the tick outlives it — which is
          # the normal case here, the handler having been observed at 121.3s on
          # 2026-07-11:
          #
          #   {"success": true, "delegated_to": "worker",
          #    "completed": false, "note": "job still running on dchub-worker"}
          #
          # That body parses, has no 'ran' key, and fell straight into the
          # else-branch below as
          # `NO-OP (skipped_reason=None) — propose-only, no writes`:
          # a still-running investigation rendered as a healthy no-op. The step
          # exited 0 and tools/deadman/watch.py beats this feed off the run
          # CONCLUSION (WORKFLOWS["brain-self-direct.yml"] = 16), so the public
          # board read green either way. A 202 means delegated-and-running:
          # never a no-op, never a failure. UNKNOWN.
          #
          # So: spawn and poll (the #2886 news-ner / #2929 brain-autonomy
          # pattern). The watermark is /self-direct/status last_tick, which
          # _record_tick() stamps at the END of every tick INCLUDING the
          # dark/capped/no-candidate skips — with a default cap of 4
          # investigations/day against this 6-tick/day cron those skips are the
          # normal state, so a watermark that only moved on a full
          # investigation (brain_self_agenda MAX(created_at)) would fail a
          # perfectly healthy run. It is stored in brain_state, i.e. in the DB,
          # so web and the worker read the SAME value and that GET does NOT
          # need a worker-proxy allowlist entry — the trap #2929 hit with
          # /autonomy/status, whose watermark was a module global with one
          # never-written copy per service.
          #
          # A tick that genuinely never runs still fails: the watermark does
          # not move, and the poll below exits 1 on that.
          #
          # /self-direct/status can itself fail. Capture its status code too
          # and say the watermark was UNKNOWN for that read — treating a failed
          # read as "no progress" is the identical false-zero one level down.
          # It still fails closed; it just no longer lies about why.
          read_watermark() {
            local code
            code=$(curl -sS --max-time 30 -H "X-Admin-Key: $ADMIN_KEY" \
              -o watermark.json -w '%{http_code}' \
              "$RAILWAY_BASE/api/v1/brain/self-direct/status") || code="000"
            if [ "$code" != "200" ]; then
              echo "::warning::/self-direct/status returned HTTP $code — watermark UNKNOWN for this read" >&2
              return 0
            fi
            python3 -c "import sys,json;print(json.load(sys.stdin).get('last_tick') or '')" \
              < watermark.json 2>/dev/null || true
          }

          BEFORE=$(read_watermark)
          echo "pre-run last_tick=${BEFORE:-<none>}"

          # Sent-at, in the same ISO-8601 UTC shape _record_tick() stamps, so
          # the two compare lexicographically. Only used when BEFORE is
          # unknown — see the poll below.
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          echo "post sent at $START"

          # --max-time 300 exceeds BOTH relay budgets (15s here, 180s if this
          # path is ever promoted to _WORKER_PROXY_SYNC_PATHS), so the 202 can
          # always arrive before curl gives up. It was 180 — equal to the sync
          # budget and the exact defect that made L16 and layer5 unable to
          # observe the very status they needed.
          http=$(curl -sS --max-time 300 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -o response.json -w '%{http_code}' \
            "$RAILWAY_BASE/api/v1/brain/self-direct/tick") || http="000"
          echo "HTTP $http"
          # `head -c` on a FILE, not a pipe: `echo "$body" | head -c N`
          # SIGPIPEs the echo once the body exceeds N and pipefail turns that
          # into a failed pipeline that errexit kills the step on.
          head -c 4000 response.json || true
          echo
          if [ "$http" = "202" ]; then
            echo "::notice::self-direct tick delegated to dchub-worker (202) — polling /self-direct/status for the tick watermark"
            ADVANCED=0
            for i in $(seq 1 10); do
              sleep 30
              AFTER=$(read_watermark)
              echo "poll $i/10 last_tick=${AFTER:-<none>}"
              # A moved watermark is the signal. When the pre-run read failed
              # BEFORE is empty and "moved" is unknowable, so fall back to
              # "stamped after we sent the POST" — otherwise the PREVIOUS
              # tick's timestamp, up to 4h old, would pass as this tick's
              # completion. Comparing to BEFORE stays primary because it is
              # immune to runner/worker clock skew; the START comparison is
              # only reached when there is nothing better.
              ADV_THIS=0
              if [ -n "$AFTER" ]; then
                if [ -n "$BEFORE" ]; then
                  if [ "$AFTER" != "$BEFORE" ]; then ADV_THIS=1; fi
                elif [ "$AFTER" \> "$START" ]; then
                  ADV_THIS=1
                else
                  echo "poll $i/10 last_tick predates this run — stale, not this tick"
                fi
              fi
              if [ "$ADV_THIS" = "1" ]; then
                ADVANCED=1
                echo "::notice::self-direct tick completed on the worker (last_tick ${BEFORE:-<none>} -> $AFTER)"
                break
              fi
            done
            if [ "$ADVANCED" != "1" ]; then
              echo "::error::self-direct tick was delegated (202) but /self-direct/status last_tick never advanced in 5 min — the tick did NOT complete"
              exit 1
            fi
            # The 202 body carries no 'ran' / 'skipped_reason' and none are
            # invented here. Absence of an outcome is UNKNOWN, never a no-op.
            echo "::notice::self-direct tick: outcome UNKNOWN (a relayed 202 carries none) — completion judged by the /self-direct/status watermark"
            exit 0
          fi
          if [ "$http" != "200" ]; then
            echo "::error::HTTP $http from $RAILWAY_BASE/api/v1/brain/self-direct/tick — the tick did NOT run (was silently green before this gate)"
            exit 1
          fi
          python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              if d.get('ran'):
                  print('::notice::self-direct tick: SURFACED agenda item '
                        f\"id={d.get('agenda_id')} area={d.get('area')} \"
                        f\"kind={d.get('kind')} confidence={d.get('confidence')}\")
              elif d.get('skipped_reason'):
                  print('::notice::self-direct tick: NO-OP '
                        f\"(skipped_reason={d.get('skipped_reason')}) — propose-only, no writes\")
              else:
                  # A 200 with neither key is a shape we do not understand —
                  # NOT a no-op. Conflating the two is what hid the 202 relay.
                  print('::warning::self-direct tick returned 200 in an '
                        f\"UNRECOGNISED shape (no ran/skipped_reason): {sorted(d)}\")
          except Exception as e:
              print(f'::warning::self-direct tick parse failed: {e}')
          " < response.json
