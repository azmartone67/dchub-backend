# MCP Dividend — weekly tracker email to the founder (2026-06-29).
# Answers two questions every Monday: is REACH growing per channel, and is the
# trial→email bridge TURNING (the bind metric that was ~0). Self-contained:
# queries Neon directly + emails via Resend. Read-only. Manual run: Actions →
# "MCP Dividend Weekly" → Run workflow.
name: MCP Dividend Weekly
on:
  schedule:
    - cron: '40 15 * * 1'   # Mondays 15:40 UTC — offset from the 15:25 agent-digest
  workflow_dispatch: {}
jobs:
  dividend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet psycopg2-binary
      - name: Build report + email
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, psycopg2
          c=psycopg2.connect(os.environ["DATABASE_URL"], sslmode="require", connect_timeout=15)
          c.autocommit=True; cur=c.cursor()
          REAL=('claude','chatgpt','gemini','perplexity','grok','copilot','meta',
                'smitheryconnect','glama','cursor','opencode','deepseek','anthropicapi','openai-mcp')
          cur.execute("""WITH b AS (SELECT lower(platform) p, session_id,
              timestamp>NOW()-INTERVAL '7 days' cur,
              timestamp BETWEEN NOW()-INTERVAL '14 days' AND NOW()-INTERVAL '7 days' prev
              FROM mcp_call_log WHERE timestamp>NOW()-INTERVAL '14 days' AND lower(platform)=ANY(%s))
            SELECT p, COUNT(DISTINCT session_id) FILTER(WHERE cur),
                      COUNT(DISTINCT session_id) FILTER(WHERE prev)
              FROM b GROUP BY p ORDER BY 2 DESC""", (list(REAL),))
          rows=cur.fetchall()
          def sc(q):
              cur.execute(q); r=cur.fetchone(); return (r[0] if r else 0) or 0
          minted7  = sc("SELECT COUNT(*) FROM auto_trial_keys WHERE minted_at>NOW()-INTERVAL '7 days'")
          active   = sc("SELECT COUNT(*) FROM auto_trial_keys WHERE call_count>0")
          # Exclude test/QA addresses so the metric is HONEST (the prior version
          # counted example./test/deleteme/qa- binds and reported "5" when REAL=0).
          TEST = r"(example\.|test|deleteme|invalid|qa-|funnel|bridge|@dchub\.cloud)"
          bound    = sc(f"SELECT COUNT(*) FROM auto_trial_keys WHERE ((signed_up_email IS NOT NULL AND signed_up_email<>'') OR (operator_email IS NOT NULL AND operator_email<>'')) AND COALESCE(signed_up_email,operator_email) !~* '{TEST}'")
          emails30 = sc(f"SELECT COUNT(*) FROM mcp_email_capture WHERE created_at>NOW()-INTERVAL '30 days' AND COALESCE(email,'') !~* '{TEST}'")
          paid30   = sc("SELECT COUNT(*) FROM mcp_conversions WHERE created_at>NOW()-INTERVAL '30 days'")
          # web/direct experiment: WHERE conversions came from (30d) — watch
          # web:pricing-page / stripe_webhook_pack5 / stripe_webhook_mcp climb.
          cur.execute("SELECT COALESCE(source,'?'), COUNT(*), COALESCE(SUM(mrr_cents),0)/100 FROM mcp_conversions WHERE created_at>NOW()-INTERVAL '30 days' GROUP BY 1 ORDER BY 2 DESC")
          by_src=cur.fetchall()
          # web/direct experiment: VISITS to the free-web CTA (playground?ref=mcp-<tool>) — the
          # intermediate signal above conversion. Table created lazily by /api/v1/web/ref.
          try:
              cur.execute("SELECT ref, COUNT(*), COUNT(DISTINCT ip_hash) FROM web_ref_visits WHERE created_at>NOW()-INTERVAL '7 days' GROUP BY 1 ORDER BY 2 DESC LIMIT 12")
              by_ref=cur.fetchall()
          except Exception:
              by_ref=[]
          L=["<b>Reach by channel — 7d vs prior 7d (distinct sessions)</b>"]
          for p,s7,sp in rows:
              s7,sp=s7 or 0, sp or 0
              a="&#8593;" if s7>sp else ("&#8595;" if s7<sp else "&#8594;")
              L.append(f"&nbsp;&nbsp;{p}: <b>{s7}</b> (was {sp}) {a}")
          if not rows: L.append("&nbsp;&nbsp;(no named-platform sessions in window)")
          L += ["<br><b>Trial &#8594; email bridge (the dividend)</b>",
                f"&nbsp;&nbsp;trial keys minted (7d): {minted7}",
                f"&nbsp;&nbsp;trial keys ever used: {active}",
                f"&nbsp;&nbsp;<b>trial keys email-bound: {bound}</b> &#8592; the metric to watch (was ~0)",
                f"&nbsp;&nbsp;emails captured (30d): {emails30}",
                f"&nbsp;&nbsp;paid conversions (30d): {paid30}",
                "<br><i>Bridge is converting when email-bound climbs. If it stays flat while reach grows, tighten the gate (TRIAL_FREE_CALLS_UNBOUND) / CTA.</i>"]
          L += ["<br><b>Where conversions came from (30d) — the web/direct experiment</b>"]
          if by_src:
              for src,n,usd in by_src: L.append(f"&nbsp;&nbsp;{src}: <b>{n}</b> (${usd}/mo)")
          else: L.append("&nbsp;&nbsp;(no conversions in window)")
          L.append("<br><i>Doubling down on web: watch web:pricing-page + stripe_webhook_pack5 ($10) + stripe_webhook_mcp climb as the free-web CTA + registry hook drive humans to checkout.</i>")
          L += ["<br><b>Free-web CTA visits — playground?ref=&lt;src&gt; (7d)</b>"]
          if by_ref:
              for ref,n,ips in by_ref: L.append(f"&nbsp;&nbsp;{ref}: <b>{n}</b> visits ({ips} distinct)")
          else: L.append("&nbsp;&nbsp;(no ?ref visits yet — the funnel above conversion; agents are surfacing the link, watch this fill)")
          html="<div style='font-family:ui-monospace,monospace;font-size:14px;line-height:1.6'>"+"<br>".join(L)+"</div>"
          payload=json.dumps({"from":"DC Hub <jonathan@dchub.cloud>","to":["azmartone@gmail.com"],
                              "subject":"DC Hub · MCP Dividend (weekly)","html":html}).encode()
          req=urllib.request.Request("https://api.resend.com/emails", data=payload,
              headers={"Authorization":"Bearer "+os.environ["RESEND_API_KEY"],
                       "Content-Type":"application/json","User-Agent":"dchub-dividend/1.0"})
          with urllib.request.urlopen(req, timeout=25) as r:
              print("Resend", r.status, r.read().decode()[:120])
          PY
