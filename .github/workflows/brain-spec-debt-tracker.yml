# brain-spec-debt-tracker.yml — 2026-08-13
#
# WHY: 60 of 60 merged [brain-spec] PRs carry an UNCHECKED human checklist.
# Not one has ever been completed. Measured 2026-08-13 across every merged
# brain-spec PR in the repo.
#
# The substance gate is NOT the hole. It classifies these correctly: they
# declare **SPEC-ONLY**, they say in their own words "changes no running code
# and is not a fix", and the gate returns `neutral` — which is right. Making
# the gate block them would re-break the exact thing r-spec-honesty
# (2026-07-18) fixed, when honest spec PRs were blocked as fix-claims and had
# to be bypassed by hand.
#
# The hole is MERGE. A spec PR is a proposal with a to-do list attached:
#
#     - [ ] Confirm this is still worth doing
#     - [ ] Scope it to a concrete change (file(s) + approach)
#     - [ ] Implement + verify
#     - [ ] Or discard this PR if superseded / not worth it
#
# Merging closes the PR, so the list stops being anywhere a human looks, and
# the obligation evaporates. That is how inv #100046 ended: the brain honestly
# said "no mechanical fix, do a 15-minute diagnostic first", the spec merged,
# the diagnostic never happened, and the finding sat untouched for five days.
# (The finding itself turned out to be a false alarm — the freshness probe
# watched an abandoned table, fixed in #2631 — which is exactly the diagnostic
# the spec asked for and nobody ran.)
#
# So: on merge, re-file the obligation as an issue. The merge stops being a
# disappearance. This creates NO new judgement — it moves an existing,
# human-authored checklist somewhere it survives.
#
# NOT retroactive on purpose: the 60 already merged would arrive as 60 issues
# in one burst and be closed as noise. The backlog number is reported instead.
#
# ★ 2026-08-31 — THE GATE WATCHED ONE PRODUCER OF THREE.
#
# This fired on startsWith(title, '[brain-spec]'), which is ONE of the three
# paths that open brain scaffold PRs:
#
#   [brain-spec]                 routes/brain_pr_opener.py           TRACKED
#   [brain-l6 strategic-draft]   routes/brain_strategic_planner.py   missed
#   [brain-l5 draft]             routes/brain_backlog_admin.py       missed
#
# 9 [brain-l6 strategic-draft] PRs had merged, 0 of 9 tracked. Their severity is
# HIGHER than the case this was built for: a merged spec PR at least lands a
# doc, while a merged strategic draft lands a doc plus a routes/_proposed_*
# stub main.py never imports — it ships literally nothing. Measured live on
# 08-31 at 19:14, one minute apart: brain-spec/inv-100399 -> success (filed),
# brain-l6/strategic-pre-merge-metric-... -> skipped (nothing filed).
#
# The gate is now '[brain-' so the NEXT producer someone adds is covered by
# default rather than silently unwatched. That default is the actual fix; the
# two namespaces are just today's instance of it.
#
# There were TWO independent misses and widening this alone would not have been
# enough: the strategic body also used a NUMBERED list, so the `^- [ ]` grep
# below found nothing and the step exited 0 logging "spec was completed before
# merge" — a false negative that reports as success. The planner now emits a
# real checklist (routes/brain_strategic_planner.py::_scaffold_pr_body).
#
# NOT retroactive, unchanged: this triggers on pull_request[closed] only, so the
# 9 already-merged drafts stay unfiled by construction, per the reasoning above.
#
# Kill switch: repo variable BRAIN_SPEC_DEBT_DISABLE=1.

name: brain-spec-debt-tracker

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  file-spec-debt:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, '[brain-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-file the unchecked checklist as tracked debt
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GATE_DISABLE: ${{ vars.BRAIN_SPEC_DEBT_DISABLE }}
        run: |
          set -euo pipefail
          if [ "${GATE_DISABLE:-0}" = "1" ]; then
            echo "spec-debt tracker disabled via BRAIN_SPEC_DEBT_DISABLE"; exit 0
          fi

          # An implemented spec has no unchecked boxes left. Nothing to track.
          if ! printf '%s' "$PR_BODY" | grep -q '^- \[ \]'; then
            echo "No unchecked checklist items — spec was completed before merge. Nothing to file."
            exit 0
          fi

          # Idempotent by PR number, not by fingerprint: a re-merge of the same
          # PR must not open a second issue, and the PR number is the one
          # identifier that cannot drift.
          MARKER="spec-debt-for-pr-${PR_NUMBER}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
                       --search "\"$MARKER\" in:body" --limit 1 --json number \
                       --jq '.[0].number // ""')
          if [ -n "$EXISTING" ]; then
            echo "Already tracked as issue #$EXISTING — nothing to do."; exit 0
          fi

          # The label must exist or `gh issue create --label` fails. Creating it
          # is idempotent; a pre-existing label makes gh exit non-zero, which is
          # fine and expected here — hence the guard rather than `|| true` on the
          # create itself.
          gh label create spec-debt --repo "$GITHUB_REPOSITORY" \
            --color "d93f0b" \
            --description "Merged brain-spec whose human checklist was never completed" \
            2>/dev/null || echo "label spec-debt already exists"

          CHECKLIST=$(printf '%s' "$PR_BODY" | grep '^- \[ \]' || true)

          {
            printf '%s\n\n' "Merged spec **$PR_URL** left its human checklist unchecked, so the work it describes has no other home."
            printf '%s\n\n' "$CHECKLIST"
            printf '%s\n' "---"
            printf '%s\n\n' "Filed automatically because merging a \`[brain-*]\` PR closes it, and a closed PR is not a backlog. This issue IS the backlog entry — close it when the spec is implemented, or when it is genuinely not worth doing."
            printf '%s\n\n' "Measured on 2026-08-13: 60 of 60 merged brain-spec PRs had an unchecked checklist and none was ever completed. This tracker exists so that number can go down instead of being invisible."
            printf '<sub>%s · brain-spec-debt-tracker</sub>\n' "$MARKER"
          } > /tmp/spec-debt-body.md

          # Deliberately NOT `|| true`. This repo lost 147 hours to a step that
          # swallowed a 401 and stayed green (see data-sync.yml). A tracker that
          # silently fails to track is worse than none — fail loudly instead.
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[spec-debt] ${PR_TITLE#\[*\] }" \
            --body-file /tmp/spec-debt-body.md \
            --label spec-debt

          echo "Filed spec-debt issue for PR #$PR_NUMBER"

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
          GATE_DISABLE: ${{ vars.BRAIN_SPEC_DEBT_DISABLE }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Two legitimate zero-work outcomes, and only one is healthy silence.
          # Disabled is UNMEASURED (the tracker is OFF). No unchecked boxes is
          # no_scope — it ran and there was genuinely nothing, the same
          # distinction the feed board draws with no_new_data, without which
          # every clean PR would climb the vacuous counter.
          #
          # Both read from the authoritative env, not from the step's log: the
          # disabled and nothing-to-file paths exit immediately, so a tee'd log
          # is not reliably flushed before this step runs.
          N=$(printf '%s' "${PR_BODY:-}" | grep -c '^- \[ \]' || true)
          if [ "${GATE_DISABLE:-0}" = "1" ]; then
            # N is blanked, not zero: a disabled tracker did not examine zero
            # things, it did not run. Zero would climb the vacuous counter and
            # attribute work to a gate that was switched off.
            V=unmeasured; N=""; NOTE="BRAIN_SPEC_DEBT_DISABLE=1 — tracker is OFF"
          elif [ "${N:-0}" = "0" ]; then
            V=no_scope; NOTE="ran, no unchecked checklist items to file"
          else
            case "${JOB_STATUS:-}" in
              success) V=pass ;;
              failure) V=fail ;;
              *)       V=unmeasured ;;
            esac
            NOTE="N = unchecked checklist items"
          fi
          bash scripts/gate_beat.sh "brain-spec-debt-tracker:file-spec-debt" "$V" "$N" absent "$NOTE"
