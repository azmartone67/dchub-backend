# main-branch-health.yml — 2026-08-30
#
# WHY: main went RED TWICE on 2026-08-30 and both were found cold, by hand,
# while watching unrelated PRs. 11 of 12 pre-merge runs on main failed that day.
# A red main blocks EVERY open PR in the repo, including other people's, and
# nothing said so anywhere a human or the brain would see it.
#
# ★ WHY NOT JUST ADD pre-merge.yml TO tools/deadman/watch.py. That watcher calls
#   `gh run list --workflow <wf>` with NO BRANCH FILTER, so it would see PR runs
#   too and a single failing feature branch would redden the board while main
#   was perfectly healthy. Branch matters here, so this job asks the question
#   properly and beats its own feed — the same shape iso-lmp-ingest uses.
#
# ★ THIS REPORTS THE BRANCH, NOT THE JOB. It beats `main-ci`, and a non-OK
#   status makes the feed overdue on /api/v1/ops/deadman, which is the surface
#   that already gets read. ci-triage (extended in the same PR) explains WHY a
#   run failed; this says THAT main is currently broken. Different questions.
#
# ★2026-08-31 — IT NOW JUDGES HEAD, NOT "THE NEWEST COMPLETED RUN". Those are
#   different questions and the difference beat a false RED to the board:
#   f5b191c8b failed at 22:20:56, #3473 (the FIX) started 22:23:28, this job ran
#   at 22:33:01 and answered with the SUPERSEDED commit — "Every open PR is
#   blocked" — while HEAD went on to pass at 22:46:02. A red nobody can clear is
#   how a board stops being read, and this is the same feed a real red main uses.
#   The verdict logic moved to tools/deadman/main_branch_verdict.py so it can be
#   TESTED (tests/test_main_branch_verdict.py replays that exact reading).
#
# ★ A `pending` verdict does NOT beat. The main-ci feed has a 2h cadence, which
#   covers a ~25 min run comfortably, so a normal in-flight window passes quietly
#   while CI that is genuinely STUCK stops beating and goes overdue on its own.
#   Silence that expires is honest; a verdict copied off the wrong commit is not.
#
# Kill switch: repo variable MAIN_BRANCH_HEALTH_DISABLE=1.

name: main-branch-health

on:
  schedule:
    - cron: '*/30 * * * *'     # every 30 min — a red main blocks everyone
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Is main's HEAD green?
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE: ${{ vars.MAIN_BRANCH_HEALTH_DISABLE }}
        run: |
          set -euo pipefail
          if [ "${GATE:-0}" = "1" ]; then
            echo "disabled via MAIN_BRANCH_HEALTH_DISABLE"
            echo "status=disabled" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/deadman/main_branch_verdict.py

      - name: Beat the board
        # ★ Only when we actually know. `pending` deliberately writes nothing —
        # see the header. Never beat a verdict we could not measure as measured.
        if: steps.verdict.outputs.status != 'pending' && steps.verdict.outputs.status != 'disabled'
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          STATUS: ${{ steps.verdict.outputs.status }}
          NOTE: ${{ steps.verdict.outputs.note }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY is not set — cannot beat the board. Failing rather than reporting a silent green."
            exit 1
          fi
          # `main_red` and `unmeasured` are both OUTSIDE the ledger's _OK_STATUS
          # set, so either one makes the feed overdue and visible.
          jq -nc --arg s "$STATUS" --arg n "$NOTE" \
            '{feed:"main-ci",status:$s,cadence_hours:2,note:$n}' \
          | curl --fail-with-body -sS --max-time 30 -X POST \
              "https://dchub.cloud/api/v1/admin/ingest-runs/beat" \
              -H "X-Admin-Key: $ADMIN_KEY" \
              -H "Content-Type: application/json" \
              -H "User-Agent: dchub-main-health/1.0" \
              --data-binary @-
          echo

      - name: Fail loudly if main is broken
        # The beat is for the board; a red job is for the person scrolling
        # Actions. Both, because main being red is the state that stops everyone.
        if: steps.verdict.outputs.status == 'main_red' || steps.verdict.outputs.status == 'unmeasured'
        run: |
          echo "::error::main is not green (${{ steps.verdict.outputs.status }}: ${{ steps.verdict.outputs.note }}). Every open PR is blocked until this is fixed."
          exit 1
