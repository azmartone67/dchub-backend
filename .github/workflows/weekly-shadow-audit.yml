name: weekly-shadow-audit
on:
  workflow_dispatch:
  schedule:
    - cron: '22 12 * * 1'   # Mon 12:22 UTC (staggered off dchub-qa 0 12)

# 2026-07-28: this used to `git push origin main || true`. main is protected
# (substance-gate / syntax-check / unit-tests) and github-actions[bot] is not an
# admin, so every push was rejected with GH006 — and `|| true` swallowed it, so
# the job reported success while writing nothing. docs/SHADOWED-ROUTES.md last
# landed 2026-07-13; the 07-20 and 07-27 runs were green and empty.
#
# The refresh now lands as a PR, which is a path the bot is actually allowed to
# take. One long-lived branch is reused so this does not open a new PR a week.
concurrency:
  group: weekly-shadow-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the audit branch (never main)
      pull-requests: write   # open/refresh the PR
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Dump shadows
        run: python3 scripts/dump_shadows.py
      - name: Open/refresh the shadow-inventory PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.email "azmartone@gmail.com"
          git config user.name "Shadow Audit Bot"

          if git diff --quiet -- docs/SHADOWED-ROUTES.md; then
            echo "no changes to docs/SHADOWED-ROUTES.md"
            echo "- shadow inventory: no change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH=chore/shadow-audit
          git checkout -b "$BRANCH"
          git add docs/SHADOWED-ROUTES.md
          git commit -m "chore: weekly shadow route inventory refresh"
          # Force-with-lease is wrong here: the branch is a throwaway mirror of
          # the newest audit, and the previous week's commit is intentionally
          # discarded. Plain --force against our own bot branch is correct.
          git push --force origin "$BRANCH"

          # Built here, at the run-block's base indentation, NOT inside the
          # `else` below. A heredoc terminator must sit at column 0 of the
          # generated script; YAML strips only this block's own indent, so a
          # heredoc nested one level deeper keeps 2 extra spaces, never matches
          # `MD`, and the step dies with "unexpected end of file". (It did.)
          cat > /tmp/pr-body.md <<'MD'
          Automated weekly refresh of `docs/SHADOWED-ROUTES.md` by `weekly-shadow-audit`.

          This used to be a direct push to `main`, which branch protection rejected (GH006) while `|| true` hid the failure — the file had not actually been updated since 2026-07-13.

          Merge or close; the branch is force-refreshed each week.
          MD

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "refreshed existing PR #$EXISTING"
            echo "- shadow inventory: refreshed [PR #$EXISTING]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$EXISTING)" >> "$GITHUB_STEP_SUMMARY"
          else
            # No --label: `gh pr create --label` fails outright if the label
            # does not exist in the repo, which is how this step failed after
            # the heredoc was fixed. Label afterwards, best-effort.
            if OUT=$(gh pr create --base main --head "$BRANCH" \
                  --title "chore: weekly shadow route inventory refresh" \
                  --body-file /tmp/pr-body.md 2>&1); then
              URL=$(printf '%s\n' "$OUT" | tail -1)
              gh pr edit "$URL" --add-label chore >/dev/null 2>&1 || true
              echo "opened $URL"
              echo "- shadow inventory: opened $URL" >> "$GITHUB_STEP_SUMMARY"
            else
              # "Allow GitHub Actions to create and approve pull requests" is
              # off, so GITHUB_TOKEN cannot open the PR. The refreshed
              # inventory IS committed and pushed to the branch; surface a
              # one-click compare link instead of losing it. Deliberately still
              # fails the run — a silent green here is what hid this for two
              # weeks in the first place.
              COMPARE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
              echo "::error::gh pr create failed: $OUT"
              echo "::warning::Inventory IS committed on '$BRANCH' — open the PR: $COMPARE"
              echo "- shadow inventory: branch pushed, **PR not opened** — [open it]($COMPARE)" >> "$GITHUB_STEP_SUMMARY"
              echo "- cause: Settings → Actions → General → \"Allow GitHub Actions to create and approve pull requests\" is off" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
