name: ISO real-time LMP ingest (6 ISOs, 5-min feeds)

# 2026-07-02: routes/iso_lmp_ingest.py shipped (PR #1387) with POST ingest
# endpoints but NO scheduled trigger — the snapshot sat 3.75h stale on day one
# (single manual ingest at deploy). Same gap class as iso-queue-ingest.yml
# (r70). This cron keeps /api/v1/iso-lmp/snapshot + /api/v1/lmp/prices live.
#
# Railway-origin-direct (same posture as iso-queue): the endpoint is open
# (public-data ingest) + idempotent (insert_or_update upsert). Full 6-ISO run
# measured at ~9s. Nominal */10 — GitHub cron drift means ~15-25 min real
# cadence, fine for a feed whose consumers tolerate stale flags past 20 min.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

env:
  RAILWAY_BASE: https://dchub-backend-production.up.railway.app

concurrency:
  group: iso-lmp-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run LMP ingest (all ISOs)
        id: ingest
        run: |
          set -euo pipefail
          resp=$(curl -sS --max-time 240 -X POST "$RAILWAY_BASE/api/v1/iso-lmp/ingest" || echo '{"error":"curl_fail"}')
          echo "$resp" | python3 -c "
          import sys, json, os
          d = json.load(sys.stdin)
          ok, total = d.get('isos_ok'), d.get('isos_total')
          print(f'isos_ok {ok}/{total} | failed {d.get(\"isos_failed\")} | {d.get(\"elapsed_ms\")}ms')
          rows_total = 0
          for r in d.get('results', []):
              rr = r.get('rows')
              if isinstance(rr, int):
                  rows_total += rr
              print(' ', r.get('iso'), 'rows=' + str(r.get('rows')), r.get('debug', '')[:80])
          gh = os.environ.get('GITHUB_OUTPUT')
          if gh:
              with open(gh, 'a') as f:
                  print('rows=%d' % rows_total, file=f)
          sys.exit(0 if ok and ok >= 4 else 1)  # tolerate <=2 flaky sources, fail on worse
          " || { echo "$resp" | head -c 800; exit 1; }

      # Fail-open heartbeat to the deadman board with the REAL inserted-row count
      # (summed across ISOs above). Only runs when the ingest step succeeded, so a
      # 'success' beat is truthful. || true + continue-on-error => a beat failure
      # can never fail the ingest job. No cadence_hours/max_content_date sent —
      # watch.py stays the cadence authority; the endpoint COALESCEs those.
      - name: beat deadman board
        continue-on-error: true
        run: |
          curl -s -X POST "https://dchub.cloud/api/v1/admin/ingest-runs/beat" \
            -H "X-Admin-Key: ${{ secrets.DCHUB_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: dchub-ingest-beat/1.0" \
            -d "{\"feed\":\"iso-lmp-ingest\",\"status\":\"success\",\"rows_inserted\":${{ steps.ingest.outputs.rows }}}" || true
