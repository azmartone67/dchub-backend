# issue-triage.yml — 2026-09-23
#
# WHY: 197 open issues and nothing owned the list as a whole. Each closer owns
# its own labels (brain_issue_janitor: brain-l15/l22/l23 · issue-autoclose:
# workflow-failure/STATUS · spec-debt-reconcile: spec-debt), and the squasher
# agent lane works its DB queue, never GitHub issues. 88 of the 197 were one
# watchdog alarm re-filed hourly.
#
# Daily, tools/issue_triage.py sweep:
#   1. closes older copies of a bot-filed issue whose title matches once dates
#      and times are removed (newest stays open; keep/pinned/needs-* never);
#   2. rewrites ONE "[triage] Needs you" issue, assigned to the owner, listing
#      decisions nobody owns, alarms still red, and machine findings nobody has
#      touched in 14 days. Assignment is the notification.
# It never closes a finding on age alone — that needs evidence the owning loop has.
#
# Kill switch: repo variable ISSUE_TRIAGE_DISABLE=1.

name: issue-triage

on:
  schedule:
    - cron: '43 13 * * *'   # daily 13:43 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — print the plan, change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.ISSUE_TRIAGE_DISABLE != '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/issue_triage.py
          sparse-checkout-cone-mode: false
      - name: Close duplicates and refresh the Needs-you issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=""
          if [ "${DRY:-false}" = "true" ]; then args="--dry-run"; fi
          python3 tools/issue_triage.py sweep $args | tee /tmp/triage.json
          { echo "## Issue triage"; echo; echo '```json'; cat /tmp/triage.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
