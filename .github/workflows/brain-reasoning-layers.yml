name: brain reasoning layers (L7 / L14 / L16 — r70 wake)

# r70 (2026-06-03): L7 (propose NEW detectors), L14 (causal analysis), and L16
# (self-critique / prediction calibration) were written but never SCHEDULED — so
# the brain's LLM reasoning sat dormant, firing only on manual trigger.
# /api/v1/brain/self-model confirms reasoning_online=True (ANTHROPIC_API_KEY is
# set), so all they needed was a cron. All three are human-gated — they propose
# to tables / log predictions and NEVER auto-apply — so running them on a cadence
# just keeps the reasoning + calibration fresh for human review.
#
# Hits the Railway ORIGIN direct (not dchub.cloud): these are 10-30s Claude calls
# and the CF edge ~15s timeout would kill them (same reason as brain-layer5.yml).

on:
  schedule:
    - cron: '25 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BASE: https://dchub-backend-production.up.railway.app

jobs:
  reason:
    runs-on: ubuntu-latest
    # 15, not 12: L16's --max-time went 180 -> 240 so the relay's 202 is
    # actually observable, and the three local steps below still budget 180s
    # each (240 + 3*180 = 780s > the old 12-minute cap).
    timeout-minutes: 15
    steps:
      - name: L16 — self-critique / prediction calibration
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::warning::DCHUB_ADMIN_KEY not set — skipping L16"; exit 0; fi
          # ★ 2026-08-18: /api/v1/brain/self-critique/run is in main.py's
          # _WORKER_PROXY_SYNC_PATHS, so web relays it to dchub-worker with a
          # 180s read budget. When the LLM re-verify outlives that budget the
          # proxy answers honestly with 202:
          #
          #   {"success": true, "delegated_to": "worker", "completed": false,
          #    "note": "job still running on dchub-worker; check worker logs"}
          #
          # That body parses and carries none of the run's counters, and the old
          # `| head -c 2000` printed it as though it were a result. Unlike
          # news-ner (#2886) this cron does NOT beat the deadman board, so a 202
          # could not raise a false red — it produced a false SILENCE instead: a
          # green step that observed nothing.
          #
          # --max-time was ALSO 180, exactly the relay budget, so the 202 landed
          # after curl had already given up (curl's clock starts first and
          # includes the edge round-trip). The step could therefore only ever
          # see curl_fail, never the 202 it needed to report. 240 leaves
          # headroom for the relay to answer.
          BODY=/tmp/l16-self-critique.json
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 240 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$RAILWAY_BASE/api/v1/brain/self-critique/run" || echo 000)
          # curl prints %{http_code} (000) on a failed transfer AND the `|| echo`
          # fires, so take the last line rather than the whole capture.
          CODE=$(printf '%s\n' "$CODE" | tail -n1)
          echo "L16 self-critique HTTP $CODE"
          head -c 2000 "$BODY" 2>/dev/null || true
          echo
          if [ "$CODE" = "202" ]; then
            echo "::warning::L16 self-critique was delegated to dchub-worker (202) and is still running past the 180s relay budget — this step observed NO counters for the run. Absence of counters is UNKNOWN, not zero; check the worker logs for the outcome."
          elif [ "$CODE" = "000" ]; then
            echo "::warning::L16 self-critique: no HTTP status (curl failed or timed out) — run outcome UNKNOWN"
          elif [ "$CODE" != "200" ]; then
            echo "::warning::L16 self-critique returned HTTP $CODE"
          fi

      - name: L18 — memory consolidation (distill verified outcomes into lessons)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::warning::DCHUB_ADMIN_KEY not set — skipping L18"; exit 0; fi
          # r89f (2026-06-15): runs L18 via this admin-gated GH cron (the proven
          # background pattern) — NOT the in-process scheduler entry
          # brain_memory_consolidate_DISABLED, which is left off (it caused the
          # 2026-05-19 crash-loop). Reads verified prediction outcomes + the now-
          # unblocked brain_finding_outcomes → writes brain_consolidated_lessons.
          curl -sS --max-time 180 -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$RAILWAY_BASE/api/v1/brain/lessons/consolidate" | head -c 2000 || echo '{"ok":false,"error":"curl_fail"}'
          echo

      - name: L14 — causal analysis
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::warning::DCHUB_ADMIN_KEY not set — skipping L14"; exit 0; fi
          curl -sS --max-time 180 -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$RAILWAY_BASE/api/v1/brain/causal/analyze" | head -c 2000 || echo '{"ok":false,"error":"curl_fail"}'
          echo

      - name: L7 — propose new detectors (self-limits to 3/day internally)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::warning::DCHUB_ADMIN_KEY not set — skipping L7"; exit 0; fi
          curl -sS --max-time 180 -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$RAILWAY_BASE/api/v1/brain/propose-detector" | head -c 2000 || echo '{"ok":false,"error":"curl_fail"}'
          echo
