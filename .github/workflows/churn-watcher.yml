name: churn watcher (weekly at-risk customer email)

on:
  schedule:
    - cron: '27 14 * * MON'  # Mon 14:27 UTC (staggered off the 14:00 herd)
  workflow_dispatch:

# 2026-08-10: this workflow files a GitHub issue when it fails, but the repo's
# default_workflow_permissions is "read", so every attempt died with
#   GraphQL: Resource not accessible by integration (createIssue)
# and `|| true` swallowed the refusal — the alarm looked wired and filed
# nothing. Declaring ANY permission resets the rest to none, so the read scopes
# these jobs actually use (checkout, `gh run`/`gh api` against Actions) are
# listed explicitly rather than inherited.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 2026-09-25: both admin routes 401 a keyless read, so this job had been
      # reading {"error": ...} as total_at_risk=0 every week and reporting
      # success. It now sends the admin key and fails when either read is
      # refused. Both routes read ONLY X-Admin-Key (or ?admin_key=) and compare
      # it to the server's DCHUB_ADMIN_KEY — X-Internal-Key is ignored there, so
      # the first keyed run (2026-09-25, run 36079690197) still got 401.
      #
      # This repo is PUBLIC: the run log and the issue must never carry a
      # customer email, nor anything derived from one (an unsalted hash lets
      # anyone confirm a guessed address). Rows are shown by position in the
      # admin route's own order, with plan and risk only; the full list is the
      # admin route itself, read with a key.
      - name: Fetch churn-risk + welcome lists
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::error::DCHUB_ADMIN_KEY is not set"; exit 1; fi
          AUTH=(-H "X-Admin-Key: $ADMIN_KEY")
          for pair in "churn:churn-risk" "welcome:welcome-sequence"; do
            name=${pair%%:*}; route=${pair#*:}
            code=$(curl -sS -o "/tmp/$name.json" -w '%{http_code}' "${AUTH[@]}" \
              "https://dchub.cloud/api/v1/admin/$route?days=7")
            if [ "$code" != "200" ]; then
              echo "::error::/api/v1/admin/$route returned HTTP $code — refusing to read it as zero at-risk"
              # The error string only (never the body: a 200-shaped body carries emails).
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('error:', str(d.get('error') if isinstance(d, dict) else '')[:300])" "/tmp/$name.json" 2>/dev/null || echo "error: (non-JSON body)"
              exit 1
            fi
          done

          python3 <<'PYEOF'
          import json
          churn = json.load(open('/tmp/churn.json'))
          welcome = json.load(open('/tmp/welcome.json'))
          if 'total_at_risk' not in churn or 'still_zero_calls_count' not in welcome:
              raise SystemExit('::error::admin response is missing total_at_risk / still_zero_calls_count')
          at_risk = churn['total_at_risk']
          need_welcome = welcome['still_zero_calls_count']
          print(f"::notice::AT_RISK={at_risk} NEW_NEEDS_WELCOME={need_welcome}")
          lines = ["DC Hub Churn Watcher — Weekly Summary (emails redacted; full list: GET /api/v1/admin/churn-risk with a key)\n"]
          lines.append(f"## {at_risk} customers at churn risk (>7d inactive or zero calls):\n")
          body = []
          for n, c in enumerate(churn.get('customers', [])[:10], 1):
              row = f"#{n} ({c.get('plan')}) — risk {c.get('risk_score')}, reasons: {', '.join(c.get('risk_reasons') or [])}"
              lines.append('  • ' + row)
              body.append('- ' + row)
          lines.append(f"\n## {need_welcome} new customers need welcome:\n")
          for n, c in enumerate(welcome.get('still_zero_calls', [])[:10], 1):
              lines.append(f"  • #{n} ({c.get('plan')}) — signed up {(c.get('user_created') or '?')[:10]}")
          print('\n'.join(lines))
          open('/tmp/at_risk', 'w').write(str(int(at_risk or 0)))
          open('/tmp/issue_body.md', 'w').write(
              '\n'.join(body) + '\n\nEmails are redacted (public repo); #N is the row position in the admin route. '
              'Full list: `GET /api/v1/admin/churn-risk?days=7` with an admin or viewer key.\n')
          PYEOF
          rm -f /tmp/churn.json /tmp/welcome.json

      - name: Open GitHub issue if action needed
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AT_RISK=$(cat /tmp/at_risk)
          if [ "${AT_RISK:-0}" -gt 0 ]; then
            # Only open if no open issue exists
            # No checkout in this job, so every gh call names the repo; and the
            # label did not exist — the first run that got this far (2026-09-25,
            # 36087906484) failed here, since no earlier run ever read a count.
            gh label create churn-watch --repo "$GITHUB_REPOSITORY" --color d93f0b \
              --description "Weekly churn-watcher summary" 2>/dev/null || true
            EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "churn-watch" --state open --json number --jq 'length')
            if [ "${EXISTING:-0}" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Churn watch: ${AT_RISK} customers at risk this week" \
                --label "churn-watch" \
                --body-file /tmp/issue_body.md
            fi
          fi
