# mcp-facts-export.yml — 2026-08-13
#
# WHY: canonical/mcp_facts.json in dchub-mcp-server is the CROSS-LANGUAGE
# BRIDGE — the Node repo cannot import tier_registry / canonical_stats, so those
# Python sources of truth are exported to JSON and every registry surface is
# checked against it. mcp_facts_export.py has existed since 2026-07-30 and
# NOTHING EVER RAN IT. Measured 2026-08-13: the committed file was 14 days old
# and still published `facilities: 15,300+` against a live 17,600+, and
# `deals: 1,600+` against 1,800+.
#
# The consequence is specific, not cosmetic: sync-tools-manifest.mjs CHECKS the
# registry surfaces against this file and FAILS CI on drift, deliberately
# without auto-fixing (prose rewriting is fragile). So a stale facts file does
# not merely age — it holds every listing at the old number and makes the
# correct number look like the error.
#
# This is the other half of the batch upgrade. sync-tools-manifest.mjs --fix
# already rewrites 30 registry surfaces in one run; it was starved of a current
# input.
#
# DESIGN NOTES, all of them scar tissue from this repo:
#   · NO `|| true` anywhere. A facts exporter that silently no-ops is the exact
#     failure class that cost 147 hours in data-sync.yml — green while doing
#     nothing. Every step here is allowed to fail the job.
#   · The exporter FAILS AND WRITES NOTHING on incomplete data, by design. That
#     is correct: a stale-but-honest file ages visibly through `generated_at`,
#     which server.mjs gates on. So a non-zero exit must NOT be swallowed.
#   · "Nothing changed" is a legitimate outcome (numbers are floors that round
#     DOWN and move slowly) and is NOT an error. But "the file was never
#     written" IS — the two are distinguished explicitly below rather than both
#     landing as a quiet success.
#
# Kill switch: repo variable MCP_FACTS_EXPORT_DISABLE=1.

name: mcp-facts-export

on:
  schedule:
    - cron: '17 5 * * *'      # daily 05:17 UTC — ahead of dchub-mcp-server's
                              # daily-manifest-sync at 13:41, so the sync always
                              # reads facts generated earlier the same day.
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-facts]

# 2026-08-20: `contents: read` made every push below a guaranteed 403. The job
# has run 7 times since it was added on 08-14 and FAILED ALL 7 — it has never
# once succeeded, so canonical/mcp_facts.json is still the 2026-07-30 copy a
# human committed. The workflow written because "NOTHING EVER RAN IT" did not
# run it either.
permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout backend (source of truth)
        uses: actions/checkout@v5
        with:
          path: dchub-backend

      # The exporter writes to ../dchub-mcp-server/canonical/mcp_facts.json and
      # SKIPS that target when the sibling repo is absent — so a missing
      # checkout would look like a clean run that updated nothing.
      - name: Checkout dchub-mcp-server as a sibling
        uses: actions/checkout@v5
        with:
          repository: azmartone67/dchub-mcp-server
          path: dchub-mcp-server
          token: ${{ secrets.PR_SUBMIT_TOKEN || secrets.GH_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # sync-tools-manifest.mjs imports node builtins only (plus a local
      # scripts/dxt-bundle.mjs), so the heal below needs Node and NOT npm ci.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install what the exporter imports
        run: pip install --quiet requests psycopg2-binary

      - name: Export canonical facts
        working-directory: dchub-backend
        env:
          DCHUB_BASE_URL: https://dchub.cloud
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GATE_DISABLE: ${{ vars.MCP_FACTS_EXPORT_DISABLE }}
        run: |
          set -euo pipefail
          if [ "${GATE_DISABLE:-0}" = "1" ]; then
            echo "mcp-facts-export disabled via MCP_FACTS_EXPORT_DISABLE"; exit 0
          fi
          BEFORE=$(sha256sum ../dchub-mcp-server/canonical/mcp_facts.json | cut -d' ' -f1)
          echo "before: $BEFORE"

          # Deliberately unguarded: a non-zero exit means the exporter refused
          # to write incomplete facts, which must fail the job, not pass it.
          python3 mcp_facts_export.py

          AFTER=$(sha256sum ../dchub-mcp-server/canonical/mcp_facts.json | cut -d' ' -f1)
          echo "after:  $AFTER"

          # generated_at changes on every successful run, so an identical hash
          # means the file was NOT written — the sibling target was skipped, or
          # the exporter returned 0 without reaching it. That is not "no news".
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::mcp_facts.json is byte-identical after the export."
            echo "::error::generated_at should have moved, so the file was never written —"
            echo "::error::most likely the sibling checkout was missing and the target was skipped."
            exit 1
          fi
          echo "✓ facts regenerated"

      # ★ ORDER IS LOAD-BEARING (2026-08-20). This step used to run SECOND,
      # behind the backend copy. `set -euo pipefail` plus a backend push that
      # can never succeed meant the job died before it ever got here, so the
      # ONE surface that actually feeds anything was starved by a cosmetic one.
      # dchub-mcp-server/main is unprotected, so this push lands; the backend's
      # main requires 6 status checks, so a `[skip ci]` bot push to it CANNOT.
      # Critical target first, known-fragile target second.
      # ★2026-09-04 — THE 8h24m DAILY RED WINDOW, and why the heal moved HERE.
      # This step used to commit canonical/mcp_facts.json ALONE and rely on
      # dchub-mcp-server's daily-manifest-sync to heal the derived surfaces from
      # it. That companion cron is at 13:41 UTC and this job is at 05:17, so for
      # 8 hours 24 minutes every day the facts file disagreed with the prose it
      # is checked against:
      #
      #     server.mjs: "64k fiber routes" — stale fiber-route count (canonical 66k)
      #
      # sync-tools-manifest.mjs exits 1 on that, and MCP smoke tests' Unit gate
      # runs smithery-canon-guard, so BOTH checks go red — on main AND on every
      # open PR in the repo, none of which have anything to do with the number.
      # Measured 2026-09-04: cda25fd landed 05:25:46Z and dchub-mcp-server #333,
      # a test-only change, inherited two red checks from it within the hour.
      # The old design was not wrong about the healer existing; it was wrong
      # that an 8-hour gap between a number changing and its prose following is
      # a detail. Facts and everything derived from them move in ONE commit now.
      - name: Heal the derived surfaces from the facts just written
        working-directory: dchub-mcp-server
        run: |
          set -euo pipefail
          node scripts/sync-tools-manifest.mjs --fix

      # ★ Prove the tree is SELF-CONSISTENT before pushing it. This is the exact
      # command dchub-mcp-server's manifest-consistency check runs, so a non-zero
      # exit here is a red main caught BEFORE it happens rather than after. No
      # `|| true`: a heal that cannot satisfy the guard must fail this job, not
      # ship and hand the failure to the next unrelated PR.
      - name: The tree about to be pushed must satisfy the drift guard
        working-directory: dchub-mcp-server
        run: |
          set -euo pipefail
          node scripts/sync-tools-manifest.mjs

      - name: Commit + push into dchub-mcp-server
        working-directory: dchub-mcp-server
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            # Legitimate: the numbers are floors that round DOWN and move slowly.
            echo "facts unchanged since the last run — nothing to push"
            exit 0
          fi
          git --no-pager diff --stat
          # ★ `-u` stages every MODIFIED TRACKED file and no untracked one. The
          # heal rewrites existing surfaces and creates none, so this covers it
          # exactly. Deliberately NOT a hand-written file list: daily-manifest-
          # sync.yml carries two long comments (2026-07-30 and 2026-08-05) about
          # its OWNED list drifting from what --fix actually writes, which twice
          # produced a green log for a heal that was discarded unstaged. One
          # derived list beats two hand-kept ones.
          git add -u
          # ★ NO CI-SKIP MARKER — that was the root cause. The old commit
          # carried one, so the guard that exists to catch exactly this
          # divergence never ran on the only commit that could create it, and
          # the drift stayed invisible until an unrelated PR tripped over it
          # hours later. Now that facts and surfaces land together the tree is
          # self-consistent, so letting CI run is both affordable and the whole
          # point. Do not reintroduce the marker here or in a commit message:
          # dchub-mcp-server squash-merges, which concatenates commit bodies, so
          # the literal token would ride into main's head commit and skip CI
          # there too.
          git commit -m "chore(facts): regenerate from canonical_stats + heal the derived surfaces"
          git push
          echo "✓ pushed facts AND every surface derived from them, in ONE commit"

      # ★2026-08-30 — THE "WEAKER CLAIM" COMMENT WAS TRUE WHEN WRITTEN AND
      # FALSE TEN DAYS LATER. It read "NOTHING SERVES IT ... returned 404 when
      # measured on 2026-08-20". On that SAME DAY a surface sweep added
      # /.well-known/mcp_facts.json to the served allowlist in main.py's
      # before_request handler. The two changes crossed: one concluded the file
      # was cosmetic, the other made it a live AI-discovery surface. Measured
      # 2026-08-30, cache-busted, cf-cache-status: DYNAMIC — the URL serves 200
      # with numbers 30 days old:
      #     facilities  15,300+   live 19,500+   (27% under)
      #     deals        1,600+   live  2,000+   (25% under)
      #     fiber_routes    55k   live     64k   (16% under)
      #   ...nine figures in all. Every honest-numbers fence passed them,
      #   because those fences ban OVER-claims and these are all UNDER-claims.
      #
      # ★ ROOT CAUSE OF 17 DAYS OF DAILY RED: `git push` to a protected main.
      # GH006 rejects it — "6 of 6 required status checks are expected" — and a
      # `[skip ci]` commit reports none of them, so it can never succeed. This
      # repo's rule is PR, never push. The step now opens one.
      #
      # ★ The old remediation text told the reader the file "is not served by
      # any route anyway", so 17 red runs read as cosmetic and were ignored.
      # A wrong remediation is worse than none: it converts a real alarm into
      # a known-ignorable one.
      - name: Open a PR for the backend's servable copy
        id: backendcopy
        working-directory: dchub-backend
        env:
          GH_TOKEN: ${{ secrets.PR_SUBMIT_TOKEN || secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if git diff --quiet -- static/.well-known/mcp_facts.json; then
            # Legitimate: the numbers are floors that round DOWN and move slowly.
            echo "backend copy unchanged — no PR needed"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="chore/mcp-facts-$(date -u +%Y%m%d)"
          git checkout -b "$BR"
          git --no-pager diff --stat -- static/.well-known/mcp_facts.json
          git add static/.well-known/mcp_facts.json
          git commit -m "chore(facts): refresh the servable mcp_facts.json surface"
          # force-with-lease: a same-day re-run reuses the branch name, and the
          # only thing it can overwrite is this same bot's earlier attempt.
          git push --force-with-lease -u origin "$BR"
          if gh pr view "$BR" --json number >/dev/null 2>&1; then
            echo "PR already open for $BR — the push above updated it"
          else
            gh pr create --base main --head "$BR" \
              --title "chore(facts): refresh the servable mcp_facts.json surface" \
              --body "Automated by mcp-facts-export.yml. \
          static/.well-known/mcp_facts.json is SERVED at https://dchub.cloud/.well-known/mcp_facts.json \
          (main.py before_request allowlist, added 2026-08-20), so a stale copy is a stale public \
          AI-discovery surface — not a cosmetic artifact. These numbers are floors that round DOWN, \
          derived from canonical_stats via mcp_facts_export.py."
          fi
          # Auto-merge so the surface heals without a human in the loop; the 6
          # required checks still gate it, which is exactly why push failed.
          gh pr merge "$BR" --auto --squash || \
            echo "::warning::could not arm auto-merge — the PR is open and needs a human"
          echo "✓ backend copy is in a PR"

      # ★ The unobserved branch, in BOTH directions: a skipped or failed copy
      # step must be reported as red, and a genuine success must be reported as
      # green. Defaulting the unknown to success is the trap this repo keeps
      # paying for.
      - name: The backend copy must not fail silently
        if: ${{ !cancelled() }}
        env:
          COPY: ${{ steps.backendcopy.outcome }}
        run: |
          set -euo pipefail
          echo "backend copy step outcome: ${COPY}"
          if [ "${COPY}" != "success" ]; then
            echo "::error::the backend servable copy did not land (outcome=${COPY}). The dchub-mcp-server push DID run, so the 30 registry surfaces are current — but static/.well-known/mcp_facts.json IS SERVED at https://dchub.cloud/.well-known/mcp_facts.json and a stale copy is a stale public surface. Fix the PR step; do not drop it and do not ignore this."
            exit 1
          fi
