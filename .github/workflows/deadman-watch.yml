name: deadman-watch — alarm when a loop stops SUCCEEDING

# The independent, off-worker dead-man sentinel (loop audit 2026-07-19 linchpin).
# Runs on GitHub Actions, NOT the Railway APScheduler thread — so it still fires if
# the worker or Railway is wedged. Watches last-SUCCESS of every critical loop.

on:
  schedule:
    # ★ THE WATCHER MUST RUN WELL INSIDE THE TIGHTEST THRESHOLD IT POLICES.
    # Was '43 */6' (every 6h). Seven feeds are registered at cadence 3h, and a feed
    # goes overdue at 2x cadence = 6h — so the watcher's own interval EQUALED the
    # threshold it was checking. Zero margin. GitHub cron drift is routine (observed
    # runs: 01:09, 07:38, 13:18, 19:07Z — 25-35 min late every time), so all seven
    # flipped red together on 2026-07-28 and again on 2026-07-30 while every one of
    # the underlying workflows was succeeding minutes earlier.
    # The tell: iso-lmp-ingest is ALSO cadence 3h and stayed GREEN throughout —
    # because it beats itself from its own workflow instead of relying on this one.
    # Every 2h gives a 3x margin against the 6h floor. See _assert_watch_margin().
    - cron: '43 */2 * * *'   # every 2h, offset from the ingestion watchdog (:10)
  workflow_dispatch: {}

permissions:
  actions: read      # read other workflows' run history via the Actions API
  issues: write      # open/update the dedup'd 'deadman' issue
  contents: read

concurrency:
  group: deadman-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Ensure 'deadman' label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create deadman -R ${{ github.repository }} \
            --color b60205 --description "off-worker dead-man: a loop stopped succeeding" \
            2>/dev/null || echo "label exists"
      - name: Run dead-man watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          API_BASE: https://dchub.cloud
        run: python3 tools/deadman/watch.py

      - name: Notify on watcher failure (watch the watcher)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R ${{ github.repository }} \
            --title "[workflow-failed] deadman-watch on $(date -u +%Y-%m-%d_%H:%M)" \
            --body "The dead-man watcher itself failed — the sentinel is blind until fixed. Run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label workflow-failure || true
