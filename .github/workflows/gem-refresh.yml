name: GEM refresh — re-ingest Global Energy Monitor bundle from R2
# GEM's site is gated (410 direct) so a runner can't fetch it — but it CAN reach R2.
# Owner drops a fresh gem-data.zip at r2://dchub-backups/gem/gem-data.zip each release;
# this job reloads it (idempotent). Runs monthly to catch new quarterly releases within
# ~4 weeks, plus on-demand. The infra_growth stale flag says when a refresh is due.
on:
  schedule:
    - cron: '17 9 1 * *'   # 1st of each month, 09:17 UTC (off-peak)
  workflow_dispatch: {}
concurrency:
  group: gem-refresh
  cancel-in-progress: false
jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet openpyxl psycopg2-binary boto3
      - name: Re-ingest GEM from R2 (idempotent full-replace by source)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEM_R2_BUCKET: dchub-backups
          GEM_R2_KEY: gem/gem-data.zip
        run: python tools/gem/reload_gem.py
      # ★ REWRITTEN 2026-08-07. This step was `curl ... | head -c 400 || true`
      # against dchub.cloud — two independent swallows on the one call that
      # tells the public board GEM was refreshed. The edge cuts admin POSTs off
      # at the 15s ROUTE_TIMEOUTS default while this snapshot COUNT(*)s tables
      # up to 2.6M rows, so the likely outcome was a timeout; `|| true` then
      # made it green, and the stale flag this step exists to clear stayed set
      # with nothing anywhere saying so. Same class as weekly-shadow-audit,
      # which reported success for two weeks with its push rejected.
      - name: Baseline the fresh counts in infra_growth (clears the stale flag)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY not set — the GEM stale flag cannot be cleared"
            exit 1
          fi
          CODE=$(curl -sS --max-time 180 -o /tmp/snap.json -w '%{http_code}' \
            -X POST "https://dchub-backend-production.up.railway.app/api/v1/admin/infra-growth/snapshot" \
            -H "X-Admin-Key: ${ADMIN_KEY}" || echo 000)
          echo "HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::error::infra-growth snapshot returned ${CODE} — GEM layers keep publishing the pre-refresh count"
            head -c 400 /tmp/snap.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/snap.json'))
          for l in d.get('layers', []):
              if l['layer'].startswith('gem_'):
                  print(f"{l['layer']:<24}{l['count']:>12,}  {(l.get('status') or '?'):<12}"
                        f"{(l.get('status_reason') or '')[:88]}")
          PY
