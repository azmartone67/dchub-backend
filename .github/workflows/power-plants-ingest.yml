name: Power Plants Ingest (EIA → power_plants_eia)

# Revives the FROZEN Land & Power "power plants" layer. The power_plants_eia
# table held a stale EIA-860 snapshot (~13,446 rows) with no refresh path.
#
# ★ The fetch runs HERE on the GitHub runner, not on Railway: Railway's egress
# to ArcGIS is unreliable, so a server-side cron would fail. The runner
# (reliable egress) fetches the live EIA Power_Plants_in_the_US service
# (~13,446 plants with point geometry, FiaPA4ga0iQKduv3 org — same reliable org
# as the gas ingest) and POSTs the rows to the ingest endpoint, which writes to
# Neon. Idempotent full-replace inside one transaction (clears the prior EIA
# snapshot + runner rows each run → refreshed, not duplicated).
# Logic: tools/infra_fetch.py.

on:
  schedule:
    - cron: '39 6 * * 1'   # Mondays 06:37 UTC (off-peak; staggered from other layers)
  workflow_dispatch:
    inputs:
      cap:
        description: 'Max features to ingest'
        required: false
        default: '20000'

concurrency:
  group: power-plants-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
      DCHUB_ORIGIN: https://dchub-backend-production.up.railway.app
      CAP: ${{ github.event.inputs.cap || '20000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch EIA power plants + ingest
        run: |
          set -uo pipefail
          # ★ 2026-09-02: see gas-pipeline-ingest.yml (2026-08-08, SH52-120).
          # A missing secret must not read as a completed refresh.
          if [ -z "${DCHUB_ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY not set — power-plants ingest cannot run; failing loudly instead of a silent green no-op"
            exit 1
          fi
          python tools/infra_fetch.py power-plants "${CAP}"
