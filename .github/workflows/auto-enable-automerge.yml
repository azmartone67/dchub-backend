name: auto-enable-automerge

# Turn on GitHub's native auto-merge (SQUASH) the moment a PR opens, so nobody
# has to come back and click merge once the gauntlet finally goes green.
#
# ★ THIS DOES NOT BYPASS ANY CHECK. GitHub auto-merge waits for every REQUIRED
#   status and every required review, exactly as a human clicking Merge would.
#   It only removes the waiting-and-clicking, which on this repo means waiting
#   ~20-26 minutes for unit-tests and then remembering to come back.
#
# ★ WHY A WORKFLOW RATHER THAN A REPO SETTING: "Allow auto-merge" is already ON
#   for this repo (verified 2026-09-05 via the API: allow_auto_merge=true). That
#   setting only makes the button AVAILABLE — it does not enable auto-merge on
#   any individual PR. Every PR still needed the click. This closes that gap.
#
# ★ DRAFTS ARE SKIPPED, and here that guard is load-bearing rather than tidy.
#   This repo already has a second merger: brain_automerge, scoped to autofix
#   PRs (brain_pr_janitor reuses its list_autofix_prs filter). Its companion
#   autonomy lane auto-opens DRAFT PRs. Arming native auto-merge on a draft
#   would land brain's proposals the instant anyone marked one ready for
#   review — turning a propose-only lane into a merging one. Skipping drafts
#   keeps the two systems in their own lanes.
#
#   The two cannot double-merge: brain merges via the API, and a PR already
#   merged simply leaves the native auto-merge moot.
on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge (squash)
        env:
          # ★2026-09-06 — NOT GITHUB_TOKEN, and this is the whole point.
          #
          # GitHub does not create workflow runs for pushes made with
          # GITHUB_TOKEN. Arming auto-merge with it made GitHub perform the
          # merge as app/github-actions, so the push to main that followed
          # TRIGGERED NOTHING. Measured over the 24 commits that landed in the
          # 6 hours after this workflow shipped:
          #
          #     merged by azmartone67        7 commits   14-15 push workflows each
          #     merged by app/github-actions 17 commits   ZERO push workflows each
          #
          # Not one exception. Five post-merge lanes have no schedule fallback
          # and so ran on none of those 17: API Response Contract, route-tables
          # coherence, dataset-inventory, Deploy Guard, refresh-architecture-map.
          # (They now have one — added in the same change as this line.) The
          # rest — auto-rollback, Post-Deploy Smoke, QA Health, Link Check,
          # sitemap-snapshot-rebuild — were delayed to their crons rather than
          # lost, which is why this stayed invisible: main still healed, just
          # up to 15 minutes or 4 hours later.
          #
          # PR_SUBMIT_TOKEN is proven for exactly this operation in this repo:
          # refresh-architecture-map.yml arms auto-merge with it, and its merge
          # (PR #3964) was attributed to azmartone67 and fired 14 push workflows.
          #
          # NO FALLBACK TO GITHUB_TOKEN. That is the broken state, and falling
          # back to it would restore this bug silently. If neither PAT is set the
          # mutation fails, the step warns and exits 0, auto-merge is simply not
          # armed, and a human merges — which triggers everything. Failing
          # towards "a person clicks merge" is the safe direction.
          GH_TOKEN: ${{ secrets.PR_SUBMIT_TOKEN || secrets.GH_PAT }}
          #
          # ── HOW TO TELL THIS IS STILL WORKING ────────────────────────────
          # The failure mode is silent by construction: if the PAT lapses or
          # loses scope, arming fails, the step exits 0 (by design — see above),
          # a human merges instead, and everything still works. Nothing goes
          # red. What changes is WHO merged, and that is the only tell.
          #
          #     gh pr view <N> --json mergedBy --jq .mergedBy.login
          #       azmartone67          -> armed with the PAT, push lanes fire
          #       app/github-actions   -> armed with GITHUB_TOKEN, push lanes
          #                               are silent and nobody will notice
          #
          # And to count what actually ran on that merge commit — PAGINATE, a
          # busy SHA has more than 100 runs and a truncated query reports 0:
          #
          #     gh api --paginate \
          #       "repos/$O/$R/actions/runs?head_sha=$SHA&event=push&per_page=100" \
          #       --jq '[.workflow_runs[]]|length'
          #
          # 14-15 is healthy. 0 means this line has regressed.
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # enablePullRequestAutoMerge is GraphQL-only; there is no REST verb.
          # Failure here must NOT fail the PR — a PR that cannot auto-merge is
          # merely one a human merges, which is today's behaviour anyway. So the
          # step reports and exits 0 rather than painting the PR red.
          RESP=$(gh api graphql -f query='
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                pullRequest { number autoMergeRequest { enabledAt mergeMethod } }
              }
            }' -f id="$PR_ID" 2>&1) || true
          if echo "$RESP" | grep -q '"enabledAt"'; then
            echo "::notice::auto-merge (squash) enabled on #${PR_NUM}"
          elif echo "$RESP" | grep -qi 'clean status\|not mergeable\|already'; then
            # Already enabled, or the PR is in a state GitHub will not arm yet
            # (e.g. no required checks configured). Neither is an error.
            echo "::notice::auto-merge not armed on #${PR_NUM} — $(echo "$RESP" | head -c 200)"
          else
            echo "::warning::could not enable auto-merge on #${PR_NUM} — $(echo "$RESP" | head -c 300)"
          fi
