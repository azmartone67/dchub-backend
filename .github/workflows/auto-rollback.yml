name: auto-rollback
#
# BACKSTOP, not the primary detector. The primary is the worker-side sentinel
# (routes/slo_rollback_sentinel.py), which samples every 60s.
#
# This job's `*/5` cron is aspirational: GitHub throttles scheduled workflows in
# this repo to a MEASURED median gap of 29.7 min (p90 72.6, max 84.1, never
# under 22, over 100 runs 2026-07-25→07-28). It is kept because it is the only
# detector in a SEPARATE failure domain — dchub-worker deploys from this same
# repo, so a bad commit can take the sentinel down with the backend, and then
# this is all that is left.
#
# ⚠️ Arm ONE of them. If `RAILWAY_TOKEN` is set here AND the worker sentinel is
# armed (SLO_SENTINEL_ROLLBACK=1), both can roll back the same incident; the
# second one runs after the first already restored the good image, so it would
# skip that image as "same commit as current" and roll back TOO FAR.
# Recommended: arm the sentinel, leave RAILWAY_TOKEN unset here so this stays
# alert-only. See docs/ROLLBACK-RUNBOOK.md.
on:
  push:
    branches: [main]   # run 5 min after every deploy
  workflow_dispatch:
    inputs:
      force_rollback:
        description: 'Skip SLO sampling and roll back immediately (break-glass)'
        type: boolean
        default: false
      drill:
        description: 'Rehearse the remediation path without changing production'
        type: boolean
        default: false
  schedule:
    - cron: '4-59/5 * * * *'   # safety net ~every 5 min — staggered to :04,:09… so it no
                               # longer collides with health-check.yml (:02,:07…) or
                               # uptime-probe (:00,:05…). Fixes brain-l22 #1247.

# r71-stabilize: prevent run-stacking (the 5-min sample loop overlapped the next
# */5 trigger → continuous self-probe of the single replica). Latest run wins.
#
# 2026-07-28: split the group by trigger. Previously every run shared ONE group,
# so the */5 cron cancelled the post-deploy (push) run — the single most
# important check — before it finished: 73 of the last 100 runs ended
# `cancelled`. Two lanes fix that without letting runs pile up.
#
# Both lanes keep cancel-in-progress. Keying the push lane per-SHA instead was
# tempting, but main takes up to 34 commits/hour against an ~8-minute job, so
# ~5 runs would overlap — and during a real burn each one would independently
# issue a Railway rollback and open its own issue and revert PR. A rollback
# storm is worse than a missed sample.
#
# Superseding a push check is safe: the SLO endpoint reports global CURRENT
# state, so a newer deploy's check subsumes an older one. And the cron lane
# still gives continuous coverage every 5 minutes — the sample loop was trimmed
# to ~4m05s so it finishes inside that interval instead of being cancelled.
# ★ workflow_dispatch GETS ITS OWN LANE. It used to fall into the 'scheduled'
# bucket, so a manual drill shared a cancel-in-progress group with a cron that
# fires every 5 minutes while the drill itself needs ~4m05s of SLO sampling.
# The cron reliably killed it mid-sample: measured 2026-07-28, a drill dispatched
# at 18:53:41 was cancelled by the scheduled run at 18:53:55, and the retry only
# completed because the cron happened to go quiet for 15 minutes. A rehearsal you
# can only run by winning a race is not a rehearsal — and this is the workflow
# whose whole job is proving the rollback works BEFORE an outage needs it.
#
# Cost of the extra lane: a manual drill can now sample concurrently with a
# scheduled run, so the SLO endpoint sees two probes for ~4 minutes. That is
# rare and deliberate (a human ran it), and far cheaper than a drill that cannot
# finish. The stacking this guard was added to stop was the AUTOMATIC cadence
# overlapping itself, which the cron lane still prevents.
concurrency:
  group: auto-rollback-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write        # push the revert BRANCH (never main — main is protected)
      pull-requests: write   # open the revert PR
      issues: write          # alert
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 5
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Railway to settle
        if: github.event_name == 'push'
        run: sleep 240   # 4 min — Railway rebuild + warmup

      - name: Sample SLO 5x over ~4min
        id: probe
        run: |
          set +e
          HARD=0
          BURN_DETAIL=""
          LAST_BODY=""
          for i in 1 2 3 4 5; do
            BODY=$(curl -s --max-time 12 https://dchub.cloud/api/v1/slo/error-budget)
            LAST_BODY="$BODY"
            VERDICT=$(echo "$BODY" | python3 -c 'import sys,json;d=json.loads(sys.stdin.read() or "{}");print(d.get("verdict","unknown"))' 2>/dev/null || echo unknown)
            PCT=$(echo "$BODY" | python3 -c 'import sys,json;d=json.loads(sys.stdin.read() or "{}");print(d.get("global_err_pct",-1))' 2>/dev/null || echo -1)
            WORST=$(echo "$BODY" | python3 -c 'import sys,json;d=json.loads(sys.stdin.read() or "{}");p=(d.get("top_5xx_paths") or [{}])[0];print(p.get("pattern","-"))' 2>/dev/null || echo -)
            echo "sample $i: verdict=$VERDICT  err_pct=$PCT  worst_path=$WORST"
            if [ "$VERDICT" = "hard_burn" ]; then
              HARD=$((HARD+1))
              BURN_DETAIL="err_pct=$PCT worst=$WORST"
            fi
            # No trailing sleep after the final sample: the extra 60s pushed the
            # job past the 5-minute cron interval, so the next trigger cancelled
            # it mid-flight. 4 sleeps, not 5.
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
          echo "hard_burn_count=$HARD" >> $GITHUB_OUTPUT
          echo "burn_detail=$BURN_DETAIL" >> $GITHUB_OUTPUT
          {
            echo "slo_body<<SLOEOF"
            echo "$LAST_BODY"
            echo "SLOEOF"
          } >> $GITHUB_OUTPUT

      - name: Decide (rollback only if 3+/5 samples hard_burn)
        id: decide
        run: |
          HARD='${{ steps.probe.outputs.hard_burn_count }}'
          FORCED='${{ inputs.force_rollback }}'
          if [ "$FORCED" = "true" ]; then
            echo "::warning::force_rollback requested — bypassing SLO sampling"
            echo "rollback=true" >> $GITHUB_OUTPUT
          elif [ "$HARD" -ge 3 ]; then
            echo "rollback=true" >> $GITHUB_OUTPUT
          else
            echo "rollback=false" >> $GITHUB_OUTPUT
          fi

      # ── Remediation 1 (primary): roll production back on the deploy platform ──
      # A git push to main CANNOT work here: main requires substance-gate /
      # syntax-check / unit-tests and github-actions[bot] is not an admin, so
      # GitHub rejects it with GH006. Worse, a rollback that waits for green CI
      # deadlocks precisely when production is broken. Railway re-runs the
      # previous image directly — branch protection cannot veto it.
      - name: Roll back Railway to last good deployment
        id: railway
        if: steps.decide.outputs.rollback == 'true'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DRILL: ${{ inputs.drill }}
        run: |
          set +e
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN not set — production CANNOT be rolled back automatically."
            echo "outcome=no-token" >> $GITHUB_OUTPUT
            exit 1
          fi
          # Do not rely on the runner image preinstalling requests — this path
          # only ever runs while production is broken.
          python3 -c 'import requests' 2>/dev/null || pip install --quiet requests
          MODE=""
          if [ "$DRILL" = "true" ]; then MODE="--dry-run"; fi
          python3 scripts/railway_rollback.py $MODE --json > /tmp/rb.json 2>/tmp/rb.err
          RC=$?
          cat /tmp/rb.err
          echo "--- result ---"; cat /tmp/rb.json
          TARGET=$(python3 -c 'import json;d=json.load(open("/tmp/rb.json"));t=d.get("target") or {};print((t.get("sha") or t.get("id") or "")[:8])' 2>/dev/null || echo "")
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          if [ "$RC" -eq 0 ]; then
            echo "outcome=rolled-back" >> $GITHUB_OUTPUT
          else
            echo "outcome=failed-rc$RC" >> $GITHUB_OUTPUT
          fi
          exit $RC

      # ── Remediation 2: land the git revert as a PR, never as a push to main ──
      # Pushing a BRANCH is allowed (protection only covers main), so the revert
      # always gets written down somewhere a human can merge it, even when the
      # platform rollback already restored service.
      - name: Open revert PR
        id: revertpr
        if: steps.decide.outputs.rollback == 'true' && inputs.drill != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RW_OUTCOME: ${{ steps.railway.outputs.outcome }}
        run: |
          set +e
          git config user.email "azmartone@gmail.com"
          git config user.name "SLO-Gate Bot"
          SHA=$(git rev-parse --short HEAD)
          BRANCH="auto-rollback/revert-${SHA}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH" || { echo "outcome=branch-failed" >> $GITHUB_OUTPUT; exit 1; }
          if ! git revert --no-edit HEAD; then
            git revert --abort 2>/dev/null
            echo "::error::git revert of $SHA conflicted — needs a human"
            echo "outcome=revert-conflict" >> $GITHUB_OUTPUT
            exit 1
          fi
          if ! git push origin "$BRANCH"; then
            echo "::error::could not push revert branch"
            echo "outcome=push-failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          # Body via --body-file: an inline multi-line --body would need its
          # continuation lines at column 0, which terminates this YAML block
          # scalar and makes the whole workflow unparseable.
          cat > /tmp/pr-body.md <<'MD'
          Opened automatically by `auto-rollback`: 3+ of 5 post-deploy SLO samples reported `hard_burn`.

          Production is restored by the **Railway rollback**, not by this PR. This PR reverts the offending commit in git so the next deploy does not re-ship it.

          - Offending commit: `__SHA__`
          - Railway rollback outcome: `__RW__`
          - Run: __RUN__

          Merging this needs the usual green checks. **Do not wait on it to restore service.**
          MD
          # `sed -i` differs between GNU and BSD; redirect instead so this runs
          # identically on the runner and on a laptop (it is tested locally).
          sed "s|__SHA__|${SHA}|; s|__RW__|${RW_OUTCOME:-unknown}|; s|__RUN__|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|" \
            /tmp/pr-body.md > /tmp/pr-body.final.md && mv /tmp/pr-body.final.md /tmp/pr-body.md
          # No pipe into `tail` here: that masks gh's exit code, so a failed
          # `gh pr create` would still record outcome=opened and the alert
          # would claim a revert PR exists when none does. Capture, then test.
          if ! OUT=$(gh pr create \
                --base main --head "$BRANCH" \
                --title "revert: auto-rollback of ${SHA} (SLO hard_burn)" \
                --body-file /tmp/pr-body.md 2>&1); then
            # Expected today: the repo has "Allow GitHub Actions to create and
            # approve pull requests" OFF, so GITHUB_TOKEN gets
            #   GraphQL: GitHub Actions is not permitted to create ... pull requests
            # The revert BRANCH is pushed regardless, which is the part that
            # matters — hand the human a one-click compare link rather than
            # losing the work.
            COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::error::gh pr create failed: $OUT"
            echo "::warning::Revert branch IS pushed — open the PR here: $COMPARE"
            echo "url=$COMPARE" >> $GITHUB_OUTPUT
            echo "outcome=branch-pushed-no-pr" >> $GITHUB_OUTPUT
            exit 1
          fi
          URL=$(printf '%s\n' "$OUT" | tail -1)
          echo "PR: $URL"
          # Labelling is best-effort and must never block the revert PR: a
          # missing label makes `gh pr create --label` fail outright.
          gh pr edit "$URL" --add-label auto-rollback >/dev/null 2>&1 \
            || echo "::warning::could not label $URL (missing label?) — PR is open regardless"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "outcome=opened" >> $GITHUB_OUTPUT

      # ── Alert: must fire whatever happened above ──
      # The old version had no `if: always()`. When the push to main failed the
      # job died at that step and this one was SKIPPED, so a real burn produced
      # no rollback AND no alert. That silent-failure mode is the reason this
      # whole change exists; keep the condition permissive.
      - name: Open issue
        if: ${{ !cancelled() && (steps.decide.outputs.rollback == 'true' || failure()) }}
        uses: actions/github-script@v7
        env:
          RAILWAY_STEP:   ${{ steps.railway.outcome }}
          RAILWAY_RESULT: ${{ steps.railway.outputs.outcome }}
          RAILWAY_TARGET: ${{ steps.railway.outputs.target }}
          PR_RESULT:      ${{ steps.revertpr.outputs.outcome }}
          PR_URL:         ${{ steps.revertpr.outputs.url }}
          BURN_DETAIL:    ${{ steps.probe.outputs.burn_detail }}
          HARD_COUNT:     ${{ steps.probe.outputs.hard_burn_count }}
          SLO_BODY:       ${{ steps.probe.outputs.slo_body }}
          DRILL:          ${{ inputs.drill }}
        with:
          script: |
            const rw     = process.env.RAILWAY_RESULT || '(step did not run)';
            const rwStep = process.env.RAILWAY_STEP || 'skipped';
            const target = process.env.RAILWAY_TARGET || '?';
            const pr     = process.env.PR_RESULT || '(step did not run)';
            const prUrl  = process.env.PR_URL || '';
            const burn   = process.env.BURN_DETAIL || '(none captured)';
            const hard   = process.env.HARD_COUNT || '?';
            const drill  = process.env.DRILL === 'true';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const restored = rw === 'rolled-back';
            const icon = drill ? '🧪' : (restored ? '✅' : '🚨');
            const head = drill
              ? 'auto-rollback drill'
              : (restored
                  ? 'slo-gate: production rolled back'
                  : 'slo-gate: ROLLBACK FAILED — production may still be broken');

            const manual = [
              '**Automatic rollback did not complete.** Roll back by hand:',
              '',
              '```bash',
              'RAILWAY_TOKEN=… python3 scripts/railway_rollback.py --dry-run   # check the target',
              'RAILWAY_TOKEN=… python3 scripts/railway_rollback.py            # do it',
              '```',
              '',
              rw === 'no-token'
                ? '> The `RAILWAY_TOKEN` repository secret is **not set**, so the automated path is disabled. See `docs/ROLLBACK-RUNBOOK.md`.'
                : '> Or: Railway dashboard → dchub-backend → Deployments → ⋯ → Rollback.',
            ].join('\n');

            const body = [
              `### ${icon} ${head}`,
              ``,
              `${hard} of 5 SLO samples reported \`hard_burn\` at \`/api/v1/slo/error-budget\`.`,
              `Burn detail: \`${burn}\``,
              ``,
              `| remediation | result |`,
              `|---|---|`,
              `| Railway rollback — restores service | \`${rw}\` (step: ${rwStep}), target \`${target}\` |`,
              `| Revert PR — stops a re-ship | \`${pr}\` ${prUrl} |`,
              ``,
              pr === 'branch-pushed-no-pr'
                ? `> The revert branch is pushed but the PR could not be opened: this repo has\n` +
                  `> **Settings → Actions → General → "Allow GitHub Actions to create and approve\n` +
                  `> pull requests"** turned off. Open it in one click: ${prUrl}`
                : ``,
              ``,
              restored
                ? `Production was rolled back to the previous Railway image. **Merge the revert PR** so the next deploy does not re-ship the bad commit.`
                : manual,
              ``,
              `<details><summary>Last SLO response</summary>`,
              ``,
              '```json',
              (process.env.SLO_BODY || '').slice(0, 3000),
              '```',
              `</details>`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `> This gate no longer pushes to \`main\`: \`main\` is protected and`,
              `> \`github-actions[bot]\` cannot push to it (GH006), and a rollback that`,
              `> waits for green CI deadlocks exactly when production is broken.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: drill
                ? `slo-gate: rollback drill (${new Date().toISOString().slice(0, 16)})`
                : `slo-gate: ${restored ? 'rolled back' : 'ROLLBACK FAILED'} (${burn})`,
              body,
              labels: drill ? ['slo-gate', 'drill'] : ['slo-gate', 'auto-rollback'],
            });

      # Make the run visibly red when a rollback was needed but nothing worked,
      # so it cannot pass as a healthy green run in the history.
      #
      # ★ A DRILL MUST BE ABLE TO FAIL. This used to carry `inputs.drill != true`,
      # which exempted drills entirely — so a rehearsal that PROVED the rollback
      # could not authenticate still reported success. Measured 2026-07-28: the
      # Railway step returned `Not Authorized`, and the run was green. A drill
      # that cannot fail verifies nothing; it is the same silent-green class as
      # the shadow audit that reported success for two weeks while its push was
      # rejected. The drill exemption belongs on the steps that would CHANGE
      # something (the revert PR above), not on the check that reports truth.
      #
      # Still cannot fire when no rollback was attempted: the first clause
      # requires decide==true, so an ordinary healthy run stays green.
      - name: Fail if remediation did not complete
        if: ${{ steps.decide.outputs.rollback == 'true' && steps.railway.outputs.outcome != 'rolled-back' }}
        env:
          DRILL: ${{ inputs.drill }}
          RW_OUTCOME: ${{ steps.railway.outputs.outcome }}
        run: |
          if [ "$DRILL" = "true" ]; then
            echo "::error::DRILL FAILED — the rollback path did not complete (outcome=${RW_OUTCOME:-none}). Production was NOT touched, but this is proof that an automatic rollback would NOT work during a real burn. Fix it before relying on it."
          else
            echo "::error::SLO hard_burn detected but automatic rollback did not complete (outcome=${RW_OUTCOME:-none}). See the issue just opened."
          fi
          exit 1
