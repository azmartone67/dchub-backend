name: auto-rollback
on:
  push:
    branches: [main]   # run 5 min after every deploy
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'   # safety net every 5 min
# r71-stabilize: prevent run-stacking (the 5-min sample loop overlapped the next
# */5 trigger → continuous self-probe of the single replica). Latest run wins.
concurrency:
  group: auto-rollback
  cancel-in-progress: true
jobs:
  check-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 5
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for Railway to settle
        if: github.event_name == 'push'
        run: sleep 240   # 4 min — Railway rebuild + warmup
      - name: Sample SLO 5x over 5min
        id: probe
        run: |
          set +e
          HARD=0
          BURN_DETAIL=""
          for i in 1 2 3 4 5; do
            BODY=$(curl -s --max-time 12 https://dchub.cloud/api/v1/slo/error-budget)
            VERDICT=$(echo "$BODY" | python3 -c 'import sys,json;d=json.loads(sys.stdin.read() or "{}");print(d.get("verdict","unknown"))' 2>/dev/null || echo unknown)
            PCT=$(echo "$BODY" | python3 -c 'import sys,json;d=json.loads(sys.stdin.read() or "{}");print(d.get("global_err_pct",-1))' 2>/dev/null || echo -1)
            WORST=$(echo "$BODY" | python3 -c 'import sys,json;d=json.loads(sys.stdin.read() or "{}");p=(d.get("top_5xx_paths") or [{}])[0];print(p.get("pattern","-"))' 2>/dev/null || echo -)
            echo "sample $i: verdict=$VERDICT  err_pct=$PCT  worst_path=$WORST"
            if [ "$VERDICT" = "hard_burn" ]; then
              HARD=$((HARD+1))
              BURN_DETAIL="err_pct=$PCT worst=$WORST"
            fi
            sleep 60
          done
          echo "hard_burn_count=$HARD" >> $GITHUB_OUTPUT
          echo "burn_detail=$BURN_DETAIL" >> $GITHUB_OUTPUT
      - name: Decide (rollback only if 3+/5 samples hard_burn)
        id: decide
        run: |
          HARD='${{ steps.probe.outputs.hard_burn_count }}'
          if [ "$HARD" -ge 3 ]; then
            echo "rollback=true" >> $GITHUB_OUTPUT
          else
            echo "rollback=false" >> $GITHUB_OUTPUT
          fi
      - name: Auto-revert HEAD
        if: steps.decide.outputs.rollback == 'true'
        run: |
          git config user.email "azmartone@gmail.com"
          git config user.name "SLO-Gate Bot"
          git revert --no-edit HEAD || { echo "revert failed"; exit 1; }
          git push origin main
      - name: Open issue
        if: steps.decide.outputs.rollback == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `slo-gate: HEAD reverted (${{ steps.probe.outputs.burn_detail }})`,
              body:  'SLO gate: 3+ of 5 post-deploy samples reported hard_burn at /api/v1/slo/error-budget (global 5xx >10% OR any pattern >100 5xx/5min). HEAD reverted automatically. Investigate top_5xx_paths in the SLO endpoint to find the regressing path.',
              labels: ['slo-gate','auto-rollback']
            })
