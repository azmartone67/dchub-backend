name: Monthly MCP Tool-Description Eval
on:
  schedule:
    - cron: '33 13 1 * *'   # 1st 13:33 UTC (staggered off evolve-cron 0 13)
  workflow_dispatch:
# 2026-08-10: this workflow files a GitHub issue when it fails, but the repo's
# default_workflow_permissions is "read", so every attempt died with
#   GraphQL: Resource not accessible by integration (createIssue)
# and `|| true` swallowed the refusal — the alarm looked wired and filed
# nothing. Declaring ANY permission resets the rest to none, so the read scopes
# these jobs actually use (checkout, `gh run`/`gh api` against Actions) are
# listed explicitly rather than inherited.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install anthropic requests
      - name: Run golden eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DCHUB_API_KEY: ${{ secrets.DCHUB_API_KEY }}
          # eval-fix (2026-07-19): July's run failed 100% with MCP auth errors
          # against the stale DCHUB_MCP_URL secret (set 2026-04-19) and no
          # token. Pin the canonical public endpoint (verified: accepts anon
          # initialize AND Bearer api-keys) and pass the key as the token.
          DCHUB_MCP_URL: https://dchub.cloud/mcp
          DCHUB_MCP_TOKEN: ${{ secrets.DCHUB_API_KEY }}
        run: |
          if [ -f eval_runner.py ] && [ -f dchub-mcp-golden-eval.jsonl ]; then
            python eval_runner.py --golden dchub-mcp-golden-eval.jsonl --report eval-report.md
          else
            echo "::warning::eval_runner.py or golden file not in repo — commit them to activate this job"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-${{ github.run_number }}
          path: eval-report.md
          if-no-files-found: ignore

      - name: Notify on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R azmartone67/dchub-backend \
            --title "[workflow-failed] ${{ github.workflow }} on $(date -u +%Y-%m-%d_%H:%M)" \
            --body "Workflow run ${{ github.run_id }} failed. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label workflow-failure || true
