# refresh-architecture-map.yml — heal the one generated file that reds main.
#
# WHY: docs/architecture/Architecture Map.md is GENERATED from the tree, and
# tests/test_vault_map_generator.py::test_the_in_repo_copy_is_current fails when
# the committed copy stops matching. Adding one route module is enough — #3473
# was a ONE LINE refresh, "route modules 787 -> 788", opened by hand because
# main was red.
#
# ★ IT IS A RACE, NOT CARELESSNESS. main's protection has strict:false, so a PR
#   need not be up to date to merge. PR A regenerates the map against its own
#   tree, PR B lands a new route module first, and A merges a map that was true
#   when written and is stale by the time it arrives. No amount of care in A
#   prevents that — only rebasing every PR (which would serialise merges in a
#   repo that lands dozens a day) or healing after the fact.
#
#   It has cost two red mains in four days (#3275 on 08-28, #3473 on 08-31) plus
#   merge conflicts on #3268 and #3294, each one a human noticing and a full CI
#   cycle. Regeneration is deterministic and takes 0.4s, so nobody should be
#   spending attention on it.
#
# CI never pushes main (repo rule) — the refresh lands as an auto-merge PR
# through the same required checks as any other change, exactly like
# refresh-meta-replays.yml.
#
# No loop: the healing PR only touches docs/architecture/, so when IT merges
# this job runs once more, finds no drift, and stops.
#
# Kill switch: repo variable ARCH_MAP_AUTOHEAL_DISABLE=1.
name: refresh-architecture-map

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Never two healing PRs at once; let the in-flight one finish and re-check.
  group: refresh-architecture-map
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the deps the generator imports through
        # ★2026-08-31 — THE FIRST LIVE RUN OF THIS JOB OPENED A BAD PR (#3483).
        # generate_vault_map.py imports routes/graph_master_shell.py to read
        # LOOP_EDGES / LOOP_SOURCE_PRODUCERS. Without flask that import failed,
        # the old generator degraded to an EMPTY loop graph, and this job
        # proposed deleting 4 declared edges and the whole producer/consumer
        # table — a smaller map that reads as valid.
        #
        # The generator now REFUSES rather than degrading (exit 2), so this job
        # would fail loudly instead of proposing damage. Installing the deps is
        # what actually lets it do its job. Mirrors pre-merge.yml's unit-tests
        # install so the map is generated in the same environment that verifies
        # it — a healer running in a different environment than the gate is how
        # this went wrong in the first place.
        run: python3 -m pip install --quiet flask pyyaml requests psycopg2-binary "psycopg[binary]" "Unidecode==1.3.8" "Pillow>=10.0.0" "feedparser==6.0.12"

      - name: Regenerate the map (no vault on a runner — in-repo copy is the point)
        env:
          GATE: ${{ vars.ARCH_MAP_AUTOHEAL_DISABLE }}
        run: |
          set -euo pipefail
          if [ "${GATE:-0}" = "1" ]; then
            echo "disabled via ARCH_MAP_AUTOHEAL_DISABLE"; exit 0
          fi
          python3 scripts/generate_vault_map.py

      - name: Open an auto-merge PR if the committed map drifted
        env:
          GH_TOKEN: ${{ secrets.PR_SUBMIT_TOKEN }}
          GATE: ${{ vars.ARCH_MAP_AUTOHEAL_DISABLE }}
        run: |
          set -euo pipefail
          if [ "${GATE:-0}" = "1" ]; then
            echo "disabled via ARCH_MAP_AUTOHEAL_DISABLE"; exit 0
          fi

          if git diff --quiet -- docs/architecture/; then
            echo "map matches the tree — nothing to heal"
            exit 0
          fi
          echo "drift detected:"
          git --no-pager diff --stat -- docs/architecture/

          # One healing PR at a time. A second would carry the same regeneration
          # and race the first through the merge queue for no benefit; whichever
          # PR is open picks up ALL drift when its own CI regenerates.
          # `gh pr list` has --head (EXACT branch) and no prefix filter, so the
          # prefix match is done in jq. Deliberately NOT wrapped in `|| echo 0`:
          # a guard that swallows its own failure and returns "none open" is a
          # guard that enforces nothing, which is the trap this repo keeps
          # hitting. set -e makes a broken query loud instead.
          OPEN=$(gh pr list --state open --limit 100 --json headRefName \
                   --jq '[.[] | select(.headRefName | startswith("chore/arch-map-"))] | length')
          if [ "${OPEN:-0}" != "0" ]; then
            echo "a healing PR is already open — it will carry this drift too"
            exit 0
          fi

          BR="chore/arch-map-$(git rev-parse --short HEAD)"
          git config user.name "dchub-arch-map"
          git config user.email "api@dchub.cloud"
          git switch -c "$BR"
          git add docs/architecture/
          git commit \
            -m "chore(architecture-map): regenerate — the tree moved under the committed copy" \
            -m "Generated by scripts/generate_vault_map.py. The committed copy is asserted by tests/test_vault_map_generator.py::test_the_in_repo_copy_is_current, so drift here reds main for every open PR."
          git push -u origin HEAD
          gh pr create --fill
          gh pr merge --auto --squash
