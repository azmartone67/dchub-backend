name: AI surface audit + MCP partner sync (daily)

# ★CORRECTION (2026-08-06). The first version of this file claimed neither half
# was "ever SCHEDULED". That was WRONG, and wrong because the search behind it
# was too narrow: it covered .github/workflows/ and dchub-scheduler.py and never
# looked at crawler_scheduler.py, which is where the in-worker slot table lives.
#
#   · crawler_scheduler.py:177 — (12, 12, "ai_surface_sentinel",
#     "_run_ai_surface_sentinel"). SCHEDULED, but gated off behind
#     AI_SURFACE_SENTINEL_ENABLED=1, so in practice it does not run. The
#     conclusion "nothing audits our surfaces" was right; the stated reason was
#     not. It is a disabled flag, not a missing cron.
#   · crawler_scheduler.py:3619 — run_white_glove_propagation(dry_run=False).
#     SCHEDULED AND RUNNING: 11 real runs between 07-19 and 08-04. It was
#     missing ~4 days in 7 for the reasons #2283 diagnosed — a five-minute
#     firing window plus an in-process last-run dict a redeploy wipes — and
#     #2283 fixed that at the source with a durable ran_today() guard and a
#     23:00 catch-up slot.
#
# So this workflow NO LONGER triggers propagation. Doing so would be a duplicate
# trigger against a job already fixed where it lives, and worse: the dry run it
# used to fire wrote a white_glove_runs row every day, which held the
# white-glove `partners_told` check green while REAL propagation could be a week
# stale. The lane now filters to non-dry runs, and this file stops manufacturing
# the row that made the mask possible.
#
# WHAT REMAINS TRUE, and why the audit leg still earns a cron: measured
# 2026-08-06, one live `why_dchub` response claimed 15,700+ / 15,000+ / 21,900+
# facilities and both "82+ tools" and "40+ tools" IN THE SAME PAYLOAD, while
# REGISTRY_SUBMISSIONS.md — the copy handed to registries — still said 21,000+
# facilities and 29 tools against a real 82. Nothing was checking, because the
# only thing that would have is gated off.
#
# ★NO `|| true` ON ANY STEP THAT DECIDES SUCCESS. weekly-shadow-audit reported
# success for two weeks while its push was rejected and the failure swallowed by
# `|| true`. An auth or routing failure here MUST go red: a sync job that cannot
# reach its endpoint and exits 0 is worse than no sync job, because it
# manufactures the belief that partners are current.
#   The two `|| true` in this file are both on `head` calls that only PRINT the
#   response body. They are deliberate: under `set -euo pipefail` a `head` on a
#   file curl never created would abort the step BEFORE the explicit status-code
#   check below it, replacing a precise "returned 403 — ADMIN_KEY drift" with a
#   bare non-zero exit. Every verdict is decided by an explicit `exit 1`.
#
# ★THE AUDIT STEP CHECKS `recorded`, NOT JUST HTTP 200. The audit can compute a
# perfect scorecard and still fail to persist it (no DATABASE_URL on the web
# replica, a permissions drift). Unrecorded means the white-glove AI-surface
# lane still reads "never ran" — green here with no row is exactly the shape
# this workflow exists to make impossible.
#
# READ-ONLY THROUGHOUT. The audit leg computes and records a scorecard; the
# partner leg is now a GET of /white-glove/status, which reads run history and
# writes nothing. Neither step submits to a registry or mutates a listing.

on:
  schedule:
    - cron: '23 15 * * *'   # 15:23 UTC daily — off the :17/:19/:43 herd
  workflow_dispatch: {}   # no inputs — this workflow no longer triggers propagation

permissions:
  contents: read

env:
  BASE: https://dchub-backend-production.up.railway.app

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Audit our own agent-facing surfaces against canon
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY not set — cannot audit. Failing loudly rather than reporting a green no-op."
            exit 1
          fi
          code=$(curl -sS --max-time 120 \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -o /tmp/audit.json -w "%{http_code}" \
            "$BASE/api/v1/admin/ai-surface/audit?cb=${GITHUB_RUN_ID}")
          echo "HTTP $code"
          head -c 3000 /tmp/audit.json || true
          echo
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::ai-surface/audit returned $code — DCHUB_ADMIN_KEY drift"
            exit 1
          fi
          if [ "$code" = "404" ]; then
            echo "::error::ai-surface/audit returned 404 — blueprint not serving (late-line registration?)"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::ai-surface/audit returned $code"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/audit.json'))
          s = d.get('summary') or {}
          major = int(s.get('major-drift') or 0)
          minor = int(s.get('minor-drift') or 0)
          unreach = int(s.get('unreachable') or 0)
          total = int(d.get('total_drifts') or 0)
          recorded = bool(d.get('recorded'))
          print(f"::notice::AI surface — major={major} minor={minor} "
                f"unreachable={unreach} drifted_fields={total} recorded={recorded}")
          if not recorded:
              print("::error::audit ran but was NOT recorded — the white-glove lane "
                    "will still read 'never ran'. Green here with no row is the "
                    "exact failure this job exists to prevent.")
              sys.exit(1)
          for r in (d.get('surfaces') or []):
              if r.get('verdict') in ('major-drift', 'unreachable'):
                  fields = ', '.join(x.get('field', '?') for x in (r.get('drifts') or []))
                  print(f"::warning::{r.get('surface')} [{r.get('verdict')}] {fields}")
          PY

      - name: Partner-listing freshness (READ-ONLY — does not trigger propagation)
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::DCHUB_ADMIN_KEY not set — cannot read propagation status"
            exit 1
          fi
          # GET /status, NOT POST /propagate. crawler_scheduler.py:3619 already
          # runs the real (dry_run=False) propagation daily, and #2283 gave it a
          # durable ran_today() guard plus a 23:00 catch-up. Firing it again here
          # would be a duplicate trigger — and the dry run this step used to send
          # wrote a white_glove_runs row daily, which held the white-glove
          # `partners_told` check green while REAL propagation could be a week
          # stale. Reading is the whole job here.
          #
          # It still catches the failure that motivated the original step: an
          # HTTP 404 means the blueprint is not serving. crawler_scheduler calls
          # run_white_glove_propagation IN-PROCESS, so it would never notice a
          # broken route; this GET would.
          code=$(curl -sS --max-time 60 \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -o /tmp/prop.json -w "%{http_code}" \
            "$BASE/api/v1/admin/white-glove/status?cb=${GITHUB_RUN_ID}")
          echo "HTTP $code"
          head -c 3000 /tmp/prop.json || true
          echo
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::white-glove/status returned $code — DCHUB_ADMIN_KEY drift"
            exit 1
          fi
          if [ "$code" = "404" ]; then
            echo "::error::white-glove/status returned 404 — blueprint not serving. It was registered late-line until 2026-08-06; see main.py:1949 on why that silently 404s."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::white-glove/status returned $code"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys, datetime as dt

          # ★ THIS STEP IS NAMED "freshness" AND UNTIL 2026-08-18 IT NEVER READ
          # A CLOCK. It printed last-run as a ::notice:: and passed regardless of
          # age, so the only way it could fail was ZERO non-dry runs ever. A lane
          # that ran once in July and never again stayed green forever.
          #
          # Measured 2026-08-18: white_glove_runs showed 18 runs in 30 days —
          # 12 missed days (40%), including 08-17 where BOTH the 20:20 primary
          # and the 23:23 catch-up missed — while this job was green every day.
          # Existence is not freshness. Compare to the clock or delete the word.
          #
          # Threshold: the lane is daily (20:20 UTC, catch-up 23:23) and this
          # auditor runs at 15:23 UTC, so a healthy last-run is at most ~19.5h
          # old when we read it (yesterday 20:00 -> today 15:23). One fully
          # missed day puts it at ~43h. 30h sits cleanly between the two: it
          # cannot fire on a healthy day and cannot miss a skipped one.
          STALE_HOURS = 30

          d = json.load(open('/tmp/prop.json'))
          runs = [r for r in (d.get('runs') or []) if not r.get('dry_run')]
          if not runs:
              print("::error::no NON-DRY propagation run on record — partner "
                    "listings have not actually been pushed. A dry run probes "
                    "but submits nothing, so it does not count.")
              sys.exit(1)

          last = runs[0]
          raw = str(last.get('created_at') or '')
          print(f"::notice::last REAL propagation {raw} — "
                f"checked={last.get('checked')} drifted={last.get('drifted')} "
                f"issue={last.get('issue_url')}")

          try:
              ts = dt.datetime.fromisoformat(raw.replace('Z', '+00:00'))
          except ValueError:
              # Unparseable is a FAILURE, not a pass. Skipping the check on a
              # format change is how a freshness gate silently stops gating.
              print(f"::error::could not parse created_at {raw!r} — freshness "
                    f"UNCHECKED, which is not the same as fresh")
              sys.exit(1)
          if ts.tzinfo is None:
              ts = ts.replace(tzinfo=dt.timezone.utc)

          age_h = (dt.datetime.now(dt.timezone.utc) - ts).total_seconds() / 3600.0
          print(f"::notice::last real propagation is {age_h:.1f}h old "
                f"(threshold {STALE_HOURS}h)")

          if int(last.get('drifted') or 0) > 0:
              print(f"::warning::{last.get('drifted')} listing(s) still carry "
                    f"numbers that disagree with canon")

          if age_h > STALE_HOURS:
              print(f"::error::white-glove propagation is {age_h:.1f}h stale "
                    f"(> {STALE_HOURS}h) — the daily lane did not run. The "
                    f"in-process scheduler slot only fires while now.minute < 5 "
                    f"and its already-ran memory is a plain dict, so a redeploy "
                    f"inside 20:00-20:04 loses the whole day; see "
                    f"routes/white_glove_propagation.ran_today.__doc__. Registry "
                    f"listings are NOT being corrected while this is red.")
              sys.exit(1)
          PY

      - name: Where to read the verdict
        if: always()
        run: |
          echo "White-glove lane 6 reads both legs:"
          echo "  GET $BASE/api/v1/admin/white-glove-loop/master-tick"
          echo "It stays RED until an audit row AND a propagation row exist and both are clean."
