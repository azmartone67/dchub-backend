name: Web image build

# Builds Dockerfile.web — the image railway.toml deploys for dchub-backend (web)
# and dchub-worker — and checks, inside the built container, the things that
# broke under Railpack: the venv interpreter resolves, gunicorn starts, the
# start scripts' system binaries exist, and weasyprint can render a PDF.
# Railway only finds these out after the build, on a failed healthcheck.

# ★2026-09-25 — REQUIRED CHECK (context `web-image-build`). No `paths:`
# filters, on purpose: a required check that a PR never starts sits at
# "Expected — waiting" forever and blocks the merge. And main-branch-health
# judges this on every push to main (GATING in tools/deadman/
# main_branch_verdict.py), so a filtered push would read as "no run for HEAD".
# Layer caching (type=gha) keeps an unchanged requirements.txt from reinstalling.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # type=gha layer cache read/write

jobs:
  web-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          tags: dchub-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max

      - name: Interpreter, venv and system binaries
        run: |
          docker run --rm dchub-web:ci bash -euc '
            want="$(sed "s/^python-//" runtime.txt)"
            got="$(/app/.venv/bin/python -c "import platform; print(platform.python_version())")"
            echo "runtime.txt=$want venv python=$got -> $(readlink -f /app/.venv/bin/python)"
            [ "$want" = "$got" ]
            [ "$(command -v gunicorn)" = /app/.venv/bin/gunicorn ]
            gunicorn --version
            for b in curl pkill fuser bash; do command -v "$b"; done
          '

      - name: Third-party imports and a real PDF render
        run: |
          docker run --rm dchub-web:ci python -c '
          import flask, gunicorn, psycopg2, psycopg, lxml, reportlab, matplotlib
          import weasyprint
          pdf = weasyprint.HTML(string="<h1>DC Hub</h1><p>smoke</p>").write_pdf()
          assert pdf[:5] == b"%PDF-", pdf[:16]
          print("weasyprint", weasyprint.__version__, "pdf bytes", len(pdf))
          '

      - name: start_web.sh boots gunicorn past the venv guard
        # No database here, so the app may fail after import; what this proves
        # is the part Railpack broke: start_web.sh reaches gunicorn and gunicorn
        # binds. The VENV INTERPRETER UNRESOLVABLE line must never appear.
        run: |
          docker run -d --name web -e PORT=8080 -e DCHUB_ROLE=worker dchub-web:ci
          for i in $(seq 1 30); do
            if docker logs web 2>&1 | grep -q "Listening at: http://\[::\]:8080"; then break; fi
            sleep 2
          done
          docker logs web 2>&1 | tail -40
          ! docker logs web 2>&1 | grep -q "VENV INTERPRETER UNRESOLVABLE"
          docker logs web 2>&1 | grep -q "Listening at: http://\[::\]:8080"
