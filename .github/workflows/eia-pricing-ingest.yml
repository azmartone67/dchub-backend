name: EIA Pricing Ingest — electricity rates + natural gas + gas storage

# Phase LL+4 (2026-05-14): switched from running the extraction script
# directly in GitHub Actions to triggering a Railway endpoint.
#
# Why: the old workflow ran scripts/eia_pricing_discovery.py here, but
# the DATABASE_URL + EIA_API_KEY secrets were never set in GitHub
# Actions — so the script always died with "ERROR: Set DATABASE_URL".
# (An orphaned dchub-mcp-server gitlink ALSO broke checkout — fixed in
# PR #93 — but the missing secrets were the deeper issue.) The daily
# power + natural gas + gas-storage refresh was dead for weeks.
#
# Railway HAS those env vars. So we POST to a Railway endpoint instead
# — same fix pattern as PR #62 (brain_learn) + PR #83 (dcpi cron).
# The endpoint /api/v1/energy/eia-ingest/run is admin-gated and calls
# the script's fetch_* functions directly.
#
# 2026-07-24 (zero-row triage, follows growthfix wave #26) — the run count
# read here was NEVER obtainable. /api/v1/energy/eia-ingest/run has
# defaulted to ASYNC since 2026-05-23 (Phase ZZZZZ-round5-eia-async): it
# returns 202 {ok, task_id, status:"running"} and NO total_records — that
# key only exists on the TASK RESULT (main.py:17588), served by
# /eia-ingest/status?id=<task_id>. Reading total_records off the 202 made
# rows_inserted 0 on EVERY run since, and the task was never polled at all,
# so an ingest that FAILED on the background thread still reported a clean
# run. Wave #26 then mapped rows==0 to the affirmative no_new_data status —
# which, on top of a structurally-impossible count, would have marked this
# feed permanently healthy and unable to ever alarm. We now poll the task
# and report no_new_data only when a COMPLETED run genuinely returned zero.

on:
  schedule:
    - cron: "24 6 * * *"      # daily 06:23 UTC (off-peak)
  workflow_dispatch: {}
  repository_dispatch:
    types: [iso-ingest, brain-v2-stale-iso, eia-pricing]

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # was 5 — the async ingest runs ~60-90s and we now wait for its real result
    timeout-minutes: 12
    steps:
      - name: Trigger EIA pricing ingest on Railway
        id: ingest
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          BASE_URL: https://dchub-backend-production.up.railway.app
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::DCHUB_ADMIN_KEY secret not set"
            exit 1
          fi
          echo "Triggering EIA pricing ingest (electricity + gas + storage)…"
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          BASE = os.environ["BASE_URL"].rstrip("/")
          HDRS = {"X-Admin-Key": os.environ["ADMIN_KEY"],
                  "User-Agent": "dchub-eia-cron/1.0"}
          GH = os.environ.get("GITHUB_OUTPUT")


          def clean(s):
              # The beat body is assembled as JSON in shell — a quote, backslash
              # or newline from an exception string would corrupt it.
              return "".join(c for c in str(s) if c not in '"\\\n\r')[:180]


          def out(**kv):
              if not GH:
                  return
              with open(GH, "a") as f:
                  for k, v in kv.items():
                      f.write("%s=%s\n" % (k, clean(v) if k == "beat_note" else v))


          def call(url, method="GET", timeout=60):
              req = urllib.request.Request(url, headers=HDRS, method=method)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read())


          def fail(msg):
              print("::error::EIA ingest — %s" % msg)
              # The beat step runs with if: always() and reads these outputs, so
              # a failure BEATS status=error instead of going silent. It must
              # NEVER fall through to no_new_data — that status asserts zero is
              # EXPECTED and resets the board's zero-row counter.
              out(beat_status="error", rows_inserted=0, beat_note=msg[:180])
              sys.exit(1)


          try:
              d = call(BASE + "/api/v1/energy/eia-ingest/run", "POST", timeout=120)
          except Exception as e:
              fail("trigger failed: %s: %s" % (type(e).__name__, str(e)[:150]))

          # ASYNC by default since 2026-05-23: the 202 ack carries no counts.
          # Poll the task to a terminal state and use THAT as the result.
          task_id = d.get("task_id")
          if task_id:
              print("async task %s — polling for the real result…" % task_id)
              poll_url = BASE + "/api/v1/energy/eia-ingest/status?id=" + task_id
              deadline = time.time() + 420
              d = None
              while time.time() < deadline:
                  time.sleep(10)
                  try:
                      s = call(poll_url)
                  except Exception as e:
                      print("::warning::poll hiccup — %s" % str(e)[:120])
                      continue
                  if s.get("status") and s.get("status") != "running":
                      d = s.get("result") or {}
                      print("task finished in %ss" % s.get("elapsed_seconds"))
                      break
              if d is None:
                  fail("still running after 420s (task=%s)" % task_id)

          if not d.get("ok"):
              fail("ingest reported failure — %s" % str(d.get("error", "unknown"))[:150])

          total = int(d.get("total_records") or 0)
          elec = d.get("electricity_rates")
          gas = d.get("natural_gas_prices")
          stor = d.get("gas_storage")
          errs = d.get("errors") or []
          note = "electricity=%s gas=%s storage=%s src_errors=%d" % (
              elec, gas, stor, len(errs))
          for e in errs:
              print("::warning::partial source failure — %s" % e)
          print("::notice::EIA ingest OK — %d records (%s)" % (total, note))

          # EIA retail pricing is MONTHLY data — most daily runs legitimately
          # insert 0, so no_new_data is the right status (wave #26). It is only
          # honest because we got here from a COMPLETED task result: the run
          # finished and genuinely had nothing new.
          out(beat_status=("success" if total > 0 else "no_new_data"),
              rows_inserted=total, beat_note=note)
          PY

      - name: Beat deadman board
        # if: always() — a FAILED ingest must beat status=error. Skipping the beat
        # is silence, and silence reads as healthy until the cadence expires.
        if: always()
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          BEAT_STATUS: ${{ steps.ingest.outputs.beat_status }}
          ROWS_INSERTED: ${{ steps.ingest.outputs.rows_inserted }}
          BEAT_NOTE: ${{ steps.ingest.outputs.beat_note }}
        run: |
          # Fail-open: a failed beat must NEVER fail the ingest job.
          # No outputs at all ⇒ the ingest step died early. That is not success,
          # and it is emphatically not no_new_data.
          STATUS="${BEAT_STATUS:-error}"
          COUNT="${ROWS_INSERTED:-0}"
          NOTE="${BEAT_NOTE:-beat by eia-pricing-ingest.yml}"
          curl -s -X POST "https://dchub.cloud/api/v1/admin/ingest-runs/beat" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: dchub-ingest-beat/1.0" \
            -d "{\"feed\":\"eia-pricing-ingest\",\"status\":\"$STATUS\",\"rows_inserted\":$COUNT,\"cadence_hours\":30,\"note\":\"$NOTE\"}" || true
