name: Cloudflare cache purge

# Purge from Cloudflare's edge cache. Built because a stale 404 got cached for
# /dcpi/leaderboard before the route existed (origin 200, edge 404), and there
# was no token in the dev environment to purge it. Reusable for any future
# "the edge is serving a stale page" situation.
#
# Set EXACTLY ONE of urls / prefixes / hosts — Cloudflare takes one kind of
# target per purge request. scripts/cf_purge_body.py builds and validates the
# body; its docstring has the formats.
#
# ★ 2026-09-24: prefixes + hosts added. api.dchub.cloud/api/v1/stats is cached
# under the zone worker's ORIGIN subrequest URL on the Railway host, and a
# single-file purge of that URL (and of the public one) returned success and
# did NOT evict it — only purge_everything did. A prefix or host purge is the
# narrower thing to try first. `hosts` evicts EVERYTHING under each host: on
# dchub-backend-production.up.railway.app that is every worker→Railway API
# response, so expect a cache-miss spike on the API.
#
# Requires GitHub secret: CLOUDFLARE_API_TOKEN (zone Cache Purge permission).
# Optional secret: CLOUDFLARE_ZONE_ID (falls back to the dchub.cloud zone).

on:
  workflow_dispatch:
    inputs:
      # Every default is EMPTY on purpose: dispatch fills unspecified inputs
      # with their defaults, so a non-empty default here would ride along with
      # a prefixes/hosts run and trip the one-kind rule.
      urls:
        description: "Space-separated absolute URLs (single-file purge)"
        required: false
        default: ""
      prefixes:
        description: "Space-separated host/path prefixes, NO scheme (e.g. dchub-backend-production.up.railway.app/api/v1/stats)"
        required: false
        default: ""
      hosts:
        description: "Space-separated hostnames — evicts EVERYTHING cached under each"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Purge from Cloudflare edge
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_SECRET: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          URLS: ${{ github.event.inputs.urls }}
          PREFIXES: ${{ github.event.inputs.prefixes }}
          HOSTS: ${{ github.event.inputs.hosts }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it (zone Cache Purge perm) and re-run, or purge in the CF dashboard."
            exit 1
          fi
          # Cloudflare ZONE ID, not a credential — it is in the path of
          # every CF API call and is useless without CF_API_TOKEN.
          ZONE="${ZONE_SECRET:-1cb22dda8d50546d6edf0c09a8be5128}"  # secretscan:allow
          python3 scripts/cf_purge_body.py /tmp/purge-body.json
          CODE=$(curl -sS -m 30 -o /tmp/purge.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/purge-body.json || echo 000)
          python3 -m json.tool /tmp/purge.json || cat /tmp/purge.json
          # success=true says the request was accepted, not that a given object
          # left the edge — re-read the URL and require MISS or a fresh age.
          if [ "$CODE" = "200" ] && python3 -c "import json,sys;sys.exit(0 if json.load(open('/tmp/purge.json')).get('success') else 1)"; then
            echo "✅ purge accepted (HTTP $CODE)"
          else
            echo "::error::CF purge failed (HTTP $CODE) — see the response above: token permission, zone id, or a purge type this plan does not allow"
            exit 1
          fi
