name: Submit DC Hub to awesome-mcp-servers (Manual)

# Phase r39 (2026-05-25): Closes one of the 7 pending registry_presence
# findings from the L23 lifecycle audit by opening an actual PR against
# punkpeye/awesome-mcp-servers. This is the only one of the 7 pending
# registries with a programmatic submission path — the rest are forms.
#
# Manual trigger only (workflow_dispatch). Running it forks the repo
# (or updates an existing fork), adds our entry to the appropriate
# section in README.md, and opens a PR. If a PR already exists the
# script no-ops cleanly.
#
# Requires: secret PR_SUBMIT_TOKEN — a fine-grained PAT with
# `contents:read,write` on the bot's fork + `pull_requests:write`.
# Set this in repo Settings → Secrets → Actions.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set true to skip the PR open step (just prints diff)"
        required: false
        default: "false"
      target_repo:
        description: "owner/repo of the README-list to submit to"
        required: false
        default: "punkpeye/awesome-mcp-servers"
  schedule:
    # r40 (2026-05-25): weekly auto-attempt. The workflow's first step
    # no-ops if PR_SUBMIT_TOKEN secret is absent, and the clone step
    # no-ops if dchub.cloud is already in the README. So this cron is
    # safe to run every week even before the secret is provisioned —
    # once added, the next Sunday-04:17 UTC tick auto-opens the PR.
    - cron: '17 4 * * 0'

permissions:
  contents: read

jobs:
  submit_pr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check token presence
        id: tok
        env:
          T: ${{ secrets.PR_SUBMIT_TOKEN }}
        run: |
          if [ -z "${T:-}" ]; then
            echo "::warning::PR_SUBMIT_TOKEN secret not set — emitting draft only"
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute our README entry
        id: entry
        run: |
          # The exact line format the README expects. punkpeye/awesome-mcp-servers
          # REQUIRES a github.com repo link (NOT a hosted URL like dchub.cloud/mcp —
          # the maintainer bot auto-rejects non-GitHub links) plus a Glama score badge
          # after the link. Format mirrors neighboring entries:
          #   - [name](github-url) [![name MCP server](glama badge)](glama link) 📇 ☁️ - desc
          cat > /tmp/entry.md <<'EOF'
          - [DC Hub](https://github.com/azmartone67/dchub-mcp-server) [![DC Hub MCP server](https://glama.ai/mcp/servers/azmartone67/dchub-mcp-server/badges/score.svg)](https://glama.ai/mcp/servers/azmartone67/dchub-mcp-server) 📇 ☁️ - Data-center, power & gas intelligence MCP server. 38 tools covering 21,000+ data-center facilities (170+ countries), 232 US power markets scored by the DC Hub Power Index (DCPI), 2,000+ tracked M&A deals, ISO grid telemetry (PJM, ERCOT, CAISO, MISO, SPP, NYISO), fiber routes, and energy pricing. Free to cite (CC-BY-4.0).
          EOF
          echo "::notice::Entry drafted:"
          cat /tmp/entry.md

      - name: Clone awesome-mcp-servers + craft branch
        if: steps.tok.outputs.have_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_SUBMIT_TOKEN }}
          TARGET_INPUT: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          # GitHub CLI is preinstalled on ubuntu-latest.
          # Param: which README-list to target (default punkpeye on the cron).
          TARGET="${TARGET_INPUT:-punkpeye/awesome-mcp-servers}"
          FORK_NAME="$(echo "$TARGET" | tr '/' '-')"   # unique fork per upstream
          echo "TARGET=$TARGET"       >> "$GITHUB_ENV"
          echo "FORK_NAME=$FORK_NAME" >> "$GITHUB_ENV"
          echo "::notice::target=$TARGET fork=$FORK_NAME"
          # Step 1: clone upstream (read-only).
          git clone --depth 1 "https://github.com/$TARGET" /tmp/amcp
          cd /tmp/amcp

          # Step 2: skip if our entry is already there.
          if grep -q "dchub.cloud" README.md; then
            echo "::notice::dchub.cloud already present in README.md — no PR needed."
            echo "ALREADY_PRESENT=1" >> "$GITHUB_ENV"
            exit 0
          fi

          # Step 3: find a sensible insertion section. The README has
          # category headings like "## 🔬 Data Science". DC Hub fits
          # under "Data Platforms" / "Research" / "Marketplaces".
          # Use a robust grep that doesn't depend on emoji.
          SECTION=$(grep -nE '^##.*(Marketplace|Data|Research|Research and Data)' README.md \
                    | head -1 | cut -d: -f1)
          if [ -z "$SECTION" ]; then
            echo "::warning::Could not find target section; appending at EOF"
            echo "" >> README.md
            cat /tmp/entry.md >> README.md
          else
            # Insert our entry before the first bullet after the heading; if the
            # section has no bullet before the next heading, insert right after the
            # heading; else at EOF. (Prior version only fired when line N+1 was
            # already a bullet, so it usually inserted nothing -> "nothing to commit".)
            awk -v ln="$SECTION" '
              NR <= ln { print; next }
              !ins && /^- / { while ((getline e < "/tmp/entry.md") > 0) print e; ins=1; print; next }
              !ins && /^#/  { while ((getline e < "/tmp/entry.md") > 0) print e; print ""; ins=1; print; next }
              { print }
              END { if (!ins) while ((getline e < "/tmp/entry.md") > 0) print e }
            ' README.md > README.md.new
            mv README.md.new README.md
          # Belt-and-suspenders: fail loudly if nothing actually changed.
          if git diff --quiet README.md; then
            echo "::error::entry insertion produced no change to README.md"; exit 1
          fi
          fi

          # Step 4: configure git, commit, push to OUR fork (the token's account).
          git config user.name  "dchub-cloud-bot"
          git config user.email "bot@dchub.cloud"
          gh auth setup-git
          # Fork to whatever account owns PR_SUBMIT_TOKEN — don't assume a bot
          # account exists. (Prior bug: hardcoded dchub-cloud-bot + the now-removed
          # `--remote=false`, which gh rejects when a repo arg is given.)
          FORK_OWNER="$(gh api user -q .login)"
          echo "::notice::fork owner (token account) = $FORK_OWNER"
          # Idempotent fork; pass no flags (gh rejects --remote with a repo arg,
          # and --clone defaults off). Add the remote ourselves + wait for the
          # fork to materialize before pushing.
          gh repo fork "$TARGET" --fork-name "$FORK_NAME" >/dev/null 2>&1 || true
          for _i in 1 2 3 4 5 6; do
            gh repo view "$FORK_OWNER/$FORK_NAME" >/dev/null 2>&1 && break
            sleep 3
          done
          BR="add-dchub-mcp-$(date +%Y%m%d-%H%M)"
          git remote add fork "https://github.com/$FORK_OWNER/$FORK_NAME.git"
          git checkout -b "$BR"
          git add README.md
          git commit -m "Add DC Hub — data-center intelligence MCP server"
          git push -u fork "$BR"
          echo "BRANCH=$BR" >> "$GITHUB_ENV"
          echo "FORK_OWNER=$FORK_OWNER" >> "$GITHUB_ENV"

      - name: Open PR (skip if already_present or dry_run)
        if: steps.tok.outputs.have_token == 'true' && env.ALREADY_PRESENT != '1' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_SUBMIT_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/amcp
          gh pr create \
            --repo "$TARGET" \
            --head "${FORK_OWNER}:${BRANCH}" \
            --title "Add DC Hub — data-center intelligence MCP server" \
            --body "$(cat <<'EOF'
          ## What
          Adds DC Hub to the awesome-mcp-servers list.

          ## Server
          - **Name:** DC Hub
          - **URL:** https://dchub.cloud/mcp
          - **Server card:** https://dchub.cloud/.well-known/mcp/server-card.json
          - **Description:** Data-center, power & gas intelligence MCP server. 38 tools covering 21,000+ data-center facilities (170+ countries), 232 US power markets scored by the DC Hub Power Index (DCPI), 2,000+ tracked M&A deals, ISO grid telemetry (PJM, ERCOT, CAISO, MISO, SPP, NYISO), fiber routes, energy pricing.
          - **License:** Free to cite (CC-BY-4.0).
          - **Existing distribution:** In the official MCP registry; indexed by mcp.so, Glama, PulseMCP. Compatible with Claude, Cursor, Cline, and other MCP clients.

          ## Why this list
          Closes a real gap — there is no other MCP server covering data-center / power-market intelligence at this scope. Existing entries cover finance, dev tools, search, and general data, but not infrastructure.

          Generated by https://github.com/azmartone67/dchub-backend/.github/workflows/awesome-mcp-pr.yml
          EOF
          )"

      - name: Show what would have been submitted
        if: steps.tok.outputs.have_token != 'true' || inputs.dry_run == 'true'
        run: |
          echo "::notice::DRY-RUN MODE — would have opened PR with the following entry:"
          cat /tmp/entry.md
