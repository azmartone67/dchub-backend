# =============================================================================
# DC Hub External Job Scheduler
# =============================================================================
# Triggers jobs_api.py endpoints on Railway for jobs NOT covered by
# crawler_scheduler.py (which handles: news, knowledge_sync, deals. Its legacy
# "energy_discovery" slot was removed 2026-08-21 together with the
# /api/jobs/energy-discovery cron below — both targeted the dead HIFLD host.)
#
# This workflow covers:
#   - discovery (facility discovery from PeeringDB/OSM/DatacenterMap)
#   - auto-approve (merge discovered facilities)
#   - evolution (evolution engine suggestions)
#   - market-report (daily market report generation)
#   - infrastructure-sync (infrastructure data sync)
#   - capacity-headroom (capacity headroom calculation)
#   - ambassador (agentic ambassador cycle)
#   - backup (Neon → R2 nightly backup)
#   - simple-alerts (alert condition checks)
#   - alert-emails (alert email notifications, 6x/day — ported 2026-08-07)
#   - energy-discovery (MANUAL ONLY since 2026-08-21 — scheduled runs retired,
#     HIFLD sources dead; kept in the dropdown so it can be fired by hand)
#
# Auth: All endpoints require DCHUB_ADMIN_KEY via X-API-Key header.
# Set DCHUB_ADMIN_KEY and RAILWAY_BACKEND_URL as GitHub repo secrets.
# =============================================================================

name: DC Hub Job Scheduler

on:
  schedule:
    # ── Twice daily jobs ──────────────────────────────────────────────
    # (2026-08-08 audit SH52-114: the '0 7,19' outreach cron was removed — its
    # only arm dispatched JOBS="outreach", a route that does not exist (/api/
    # jobs/outreach → 404 live), so every fire was a 404 riding inside a green
    # run. No keeper was ported: the ai-wars-era outreach agent is retired.)
    # Ambassador: 08:30 UTC and 20:30 UTC
    - cron: '30 8,20 * * *'

    # ── Every 6 hours ─────────────────────────────────────────────────
    # Discovery + auto-approve: 03:00, 09:00, 15:00, 21:00 UTC
    - cron: '0 3,9,15,21 * * *'
    # Capacity headroom: 04:00, 10:00, 16:00, 22:00 UTC
    - cron: '0 4,10,16,22 * * *'
    # Simple alerts check: 05:00, 11:00, 17:00, 23:00 UTC
    - cron: '0 5,11,17,23 * * *'

    # ── Ported 2026-08-07 from the decommissioned heroic-reprieve project ─
    # Its frozen dchub-scheduler-v4 'worker' was the ONLY driver of these two
    # jobs, and every call it made 401'd after the 07-31 admin-key rotation —
    # so both were dead for a week while its 401s kept refreshing their
    # cron_last_run completion stamps. Cadences preserved from that
    # scheduler's JOBS dict.
    # Alert emails: every 4h at :15 (01,05,09,13,17,21 UTC)
    - cron: '15 1,5,9,13,17,21 * * *'
    # (2026-08-21: the '10 10,18' energy-discovery cron was RETIRED. All five
    # HIFLD ArcGIS sources behind energy_auto_discovery_pg.run_full_sync are
    # dead (400/499), so every fire 500'd after #3026 made the job honest.
    # Plants/substations/transmission come from the canonical loaders
    # (land-power-sync, *-ingest.yml). /api/jobs/energy-discovery stays
    # callable by hand via the dropdown below.)

    # ── Daily jobs ────────────────────────────────────────────────────
    # Evolution engine: 12:30 UTC
    - cron: '30 12 * * *'
    # ai-wars: 13:05 UTC (2026-08-08 audit SH52-114: 'promotion' dropped from
    # this arm — /api/jobs/promotion → 404 live; ai-wars is a real route)
    - cron: '5 13 * * *'
    # Market report: 14:30 UTC
    - cron: '52 14 * * *'
    # Infrastructure sync: 01:00 UTC
    - cron: '0 1 * * *'

    # Land+Power infrastructure sync (EIA plants, HIFLD substations +
    # transmission, EIA gas pipelines): 04:30 UTC.
    # ★ This is the slot dchub-scheduler.py's JOBS dict has declared since
    # 2026-05-20 and never fired — nothing invokes that file, so the feeds last
    # ran 2026-03-30. Moved onto THIS dispatcher because it demonstrably runs
    # (hourly, succeeding). The ":30 avoids the HOUR:00 case-match" rationale
    # this comment used to give died with #2132 — dispatch keys on the
    # triggering cron now, so no slot collides regardless of minute and a late
    # start no longer loses the job.
    - cron: '30 4 * * *'

    # ── Nightly ───────────────────────────────────────────────────────
    # Backup (Neon → R2): 02:00 UTC
    - cron: '0 2 * * *'

    # ── Weekly ────────────────────────────────────────────────────────
    # Gas infra refresh (pipelines/compressors/processings) + site-score
    # percentile baseline (rank_sites "better than X%" reference, ~40 internal
    # site-score calls): Sunday 06:30 UTC. Both were dispatcher-less orphans
    # (#1768/#1770 follow-ups, 2026-07-26).
    - cron: '30 6 * * 0'

  workflow_dispatch:
    inputs:
      job:
        # ★ Pick one. "Leave empty" used to mean "run whatever the wall clock
        # says"; #2132 keys dispatch on the triggering cron, and a manual run
        # has none — so an empty choice now fails fast with an explicit error
        # rather than silently running the wrong hour's job.
        # ★★ This list must stay in step with the dispatch arms below. It had
        # drifted: land-power-sync, gas-refresh, site-baseline,
        # db-health-snapshot and ai-wars are all dispatched on a cron but were
        # absent here, so the ONE job this file exists to keep alive could not
        # be run by hand at all — exactly when you need it, to backfill a
        # missed slot. tests/test_dchub_jobs_dispatch_coverage.py pins it now.
        description: 'Job to run (required — manual runs have no cron to key on)'
        required: false
        type: choice
        options:
          - ''
          - discovery
          - auto-approve
          - evolution
          - market-report
          - infrastructure-sync
          - capacity-headroom
          - ambassador
          - backup
          - simple-alerts
          - alert-emails
          - energy-discovery
          - land-power-sync
          - gas-refresh
          - site-baseline
          - db-health-snapshot
          - ai-wars
          - keep-alive

env:
  BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
  ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}

# 2026-08-10: this workflow files a GitHub issue when it fails, but the repo's
# default_workflow_permissions is "read", so every attempt died with
#   GraphQL: Resource not accessible by integration (createIssue)
# and `|| true` swallowed the refusal — the alarm looked wired and filed
# nothing. Declaring ANY permission resets the rest to none, so the read scopes
# these jobs actually use (checkout, `gh run`/`gh api` against Actions) are
# listed explicitly rather than inherited.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  trigger-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Determine which jobs to run
        id: schedule
        env:
          # ★★ THE cron expression GitHub matched to start this run. This is the
          # ONLY delay-proof dispatch signal. The previous logic read the WALL
          # CLOCK (date -u) and matched half-hour jobs on MINUTE in 30-39, but
          # GitHub routinely starts scheduled runs late under load -- measured
          # 2026-08-02: the 12:30 evolution slot started 12:46 and dispatched
          # "keep-alive" (i.e. NOTHING), and the run reported SUCCESS. Every
          # half-hour job silently degraded that way, which is why the deadman
          # only ever caught it downstream as cron_last_run staleness:
          # gas-refresh 6.3d, site-baseline 5.5d, evolution + market-report.
          # Hour jobs were immune purely by accident -- their case compares
          # "${HOUR}:00", hardcoding the minute, so drift within the hour is
          # invisible to them.
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          # Manual dispatch with specific job
          if [ -n "${{ inputs.job }}" ]; then
            echo "jobs=${{ inputs.job }}" >> $GITHUB_OUTPUT
            echo "Manual trigger: ${{ inputs.job }}"
            exit 0
          fi

          echo "Wall clock: $(date -u +%H:%M) UTC | trigger cron: '${TRIGGER_CRON}'"

          # ★ A MANUAL run with no job selected has no cron to key on.
          # github.event.schedule only exists on `schedule` events, so
          # TRIGGER_CRON is empty here. Under the wall-clock dispatcher "leave
          # empty" meant "run whatever this hour's job is"; #2132 removed the
          # clock, so there is nothing left to infer from. Without this branch
          # the run dies on the unmapped-cron error below, which blames a cron
          # that was never involved — say what actually happened instead.
          if [ -z "${TRIGGER_CRON}" ]; then
            echo "::error::Manual run with no job selected. Dispatch keys on the triggering cron (github.event.schedule), which is empty for workflow_dispatch — choose a specific job from the dropdown."
            exit 1
          fi

          # Dispatch keyed on the TRIGGERING CRON, never the clock. Each arm
          # must correspond 1:1 to a `- cron:` in the schedule block above;
          # tests/test_dchub_jobs_dispatch_coverage.py fails the build if a
          # cron is added without an arm (or an arm without a cron), which is
          # the second bug this replaces: market-report's cron was changed to
          # '52 14 * * *' while the dispatcher still matched "14:3"*, so it
          # could never fire at all -- not even on a perfectly punctual run.
          JOBS=""
          case "${TRIGGER_CRON}" in
            "0 1 * * *")          JOBS="infrastructure-sync" ;;
            "0 2 * * *")          JOBS="backup" ;;
            "0 3,9,15,21 * * *")  JOBS="discovery,auto-approve,db-health-snapshot" ;;
            "30 4 * * *")         JOBS="land-power-sync" ;;
            "0 4,10,16,22 * * *") JOBS="capacity-headroom" ;;
            "0 5,11,17,23 * * *") JOBS="simple-alerts" ;;
            "15 1,5,9,13,17,21 * * *") JOBS="alert-emails" ;;
            "30 6 * * 0")         JOBS="gas-refresh,site-baseline" ;;
            "30 8,20 * * *")      JOBS="ambassador" ;;
            "30 12 * * *")        JOBS="evolution" ;;
            "5 13 * * *")         JOBS="ai-wars" ;;
            "52 14 * * *")        JOBS="market-report" ;;
          esac

          # ★ FAIL LOUD on an unmapped schedule. The old code fell back to
          # keep-alive here, which is exactly how a dead job looked identical to
          # a healthy idle tick for weeks. A cron with no arm is a bug, not a
          # quiet no-op.
          if [ -z "$JOBS" ]; then
            echo "::error::No dispatch arm for trigger cron [${TRIGGER_CRON}] - add one to dchub-jobs.yml"
            exit 1
          fi

          echo "jobs=$JOBS" >> $GITHUB_OUTPUT
          echo "Jobs to run: $JOBS"

      # ★ Land+Power runs ONE SOURCE PER CALL, synchronously. The web service
      # redeploys ~every 5 minutes (12 in 63 minutes, measured 2026-07-31), so a
      # spawned background crawl is killed before it commits — that is why this
      # feed produced nothing for four months. Each source finishes in well under
      # the 300s budget; a killed one just retries next cycle and /status shows
      # it stale meanwhile. Sources run in their own step so one failure does not
      # mask the others, and the response carries the REAL row counts.
      - name: Land+Power sync (per-source)
        if: steps.schedule.outputs.jobs == 'land-power-sync'
        run: |
          FAILED=0
          AUTH_FAILED=0
          for SRC in eia-860-plants hifld-substations hifld-transmission eia-ng-pipelines; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗺️  $SRC"
            CODE=$(curl -s -o /tmp/lp.json -w "%{http_code}" -X POST \
              -H "X-API-Key: ${ADMIN_KEY}" --max-time 300 \
              "${BACKEND_URL}/api/jobs/land-power-sync?source=${SRC}")
            echo "HTTP ${CODE}"
            cat /tmp/lp.json 2>/dev/null | python3 -m json.tool 2>/dev/null || cat /tmp/lp.json
            [ "$CODE" = "200" ] || FAILED=$((FAILED + 1))
            case "$CODE" in 401|403) AUTH_FAILED=$((AUTH_FAILED + 1)) ;; esac
            sleep 5
          done
          echo ""
          echo "🩺 verdict:"
          curl -s --max-time 60 "${BACKEND_URL}/api/land-power/status" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('status:', d.get('status')); [print(' ', s['source'], s['verdict'], s['last_success_age_days']) for s in d.get('latest_syncs',[])]" || true
          # Non-fatal: a source killed by a deploy is expected and retries next
          # cycle. /status is the authority on whether the data is stale.
          # ★ Except auth: a 401/403 is a broken DCHUB_ADMIN_KEY that will fail
          # every source and every future run until someone acts — that class
          # rode green for a week after the 07-31 rotation. Fail the run so the
          # issue-filing step below fires.
          if [ "$AUTH_FAILED" -gt 0 ]; then
            echo "❌ ${AUTH_FAILED} source call(s) rejected with 401/403 — DCHUB_ADMIN_KEY is broken"
            exit 1
          fi
          echo "sources failing this run: ${FAILED}"

      - name: Run scheduled jobs
        # land-power-sync has its own per-source step above
        if: steps.schedule.outputs.jobs != 'land-power-sync'
        run: |
          JOBS="${{ steps.schedule.outputs.jobs }}"
          IFS=',' read -ra JOB_ARRAY <<< "$JOBS"

          FAILED=0
          for JOB in "${JOB_ARRAY[@]}"; do
            JOB=$(echo "$JOB" | xargs)  # trim whitespace
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Triggering: $JOB"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              -X POST \
              -H "X-API-Key: ${ADMIN_KEY}" \
              -H "Content-Type: application/json" \
              --max-time 300 \
              "${BACKEND_URL}/api/jobs/${JOB}")

            echo "HTTP Status: ${HTTP_CODE}"
            cat /tmp/response.json 2>/dev/null | python3 -m json.tool 2>/dev/null || cat /tmp/response.json 2>/dev/null
            echo ""

            # ★ 2026-08-14: anything but 2xx/3xx fails the run. 4xx used to
            # print "CLIENT ERROR" and ride green — the 08-09 weekly run 401'd
            # on BOTH its jobs (stale DCHUB_ADMIN_KEY after the 07-31 rotation)
            # and reported success; the miss only surfaced as cron_last_run
            # staleness days later. Same hole for 000: curl reports 000 when it
            # never got an HTTP status (connect failure / timeout), which
            # satisfied neither -ge branch and printed ✅ SUCCESS for a backend
            # that was never reached.
            if [ "$HTTP_CODE" -ge 500 ]; then
              echo "❌ FAILED: $JOB (HTTP $HTTP_CODE)"
              FAILED=$((FAILED + 1))
            elif [ "$HTTP_CODE" -ge 400 ]; then
              echo "❌ CLIENT ERROR: $JOB (HTTP $HTTP_CODE) — auth or route broken, failing the run"
              FAILED=$((FAILED + 1))
            elif [ "$HTTP_CODE" -lt 200 ]; then
              echo "❌ NO RESPONSE: $JOB (HTTP $HTTP_CODE) — curl never reached the backend, failing the run"
              FAILED=$((FAILED + 1))
            else
              echo "✅ SUCCESS: $JOB"
            fi

            # Stagger between jobs to avoid overloading
            sleep 5
          done

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ $FAILED job(s) failed (5xx, 4xx, or no HTTP response)"
            exit 1
          fi

      - name: Notify on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R azmartone67/dchub-backend \
            --title "[workflow-failed] ${{ github.workflow }} on $(date -u +%Y-%m-%d_%H:%M)" \
            --body "Workflow run ${{ github.run_id }} failed. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label workflow-failure || true
