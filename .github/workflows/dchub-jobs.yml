# =============================================================================
# DC Hub External Job Scheduler
# =============================================================================
# Triggers jobs_api.py endpoints on Railway for jobs NOT covered by
# crawler_scheduler.py (which handles: news, energy_discovery, knowledge_sync, deals)
#
# This workflow covers:
#   - discovery (facility discovery from PeeringDB/OSM/DatacenterMap)
#   - auto-approve (merge discovered facilities)
#   - outreach (AI outreach agent - 2x/day)
#   - promotion (enhanced promotion - 1x/day)
#   - evolution (evolution engine suggestions)
#   - market-report (daily market report generation)
#   - infrastructure-sync (infrastructure data sync)
#   - capacity-headroom (capacity headroom calculation)
#   - ambassador (agentic ambassador cycle)
#   - backup (Neon → R2 nightly backup)
#   - simple-alerts (alert condition checks)
#
# Auth: All endpoints require DCHUB_ADMIN_KEY via X-API-Key header.
# Set DCHUB_ADMIN_KEY and RAILWAY_BACKEND_URL as GitHub repo secrets.
# =============================================================================

name: DC Hub Job Scheduler

on:
  schedule:
    # ── Twice daily jobs ──────────────────────────────────────────────
    # Outreach agent: 07:00 UTC and 19:00 UTC
    - cron: '0 7,19 * * *'
    # Ambassador: 08:30 UTC and 20:30 UTC
    - cron: '30 8,20 * * *'

    # ── Every 6 hours ─────────────────────────────────────────────────
    # Discovery + auto-approve: 03:00, 09:00, 15:00, 21:00 UTC
    - cron: '0 3,9,15,21 * * *'
    # Capacity headroom: 04:00, 10:00, 16:00, 22:00 UTC
    - cron: '0 4,10,16,22 * * *'
    # Simple alerts check: 05:00, 11:00, 17:00, 23:00 UTC
    - cron: '0 5,11,17,23 * * *'

    # ── Daily jobs ────────────────────────────────────────────────────
    # Evolution engine: 12:30 UTC
    - cron: '30 12 * * *'
    # Promotion: 13:00 UTC
    - cron: '5 13 * * *'
    # Market report: 14:30 UTC
    - cron: '52 14 * * *'
    # Infrastructure sync: 01:00 UTC
    - cron: '0 1 * * *'

    # Land+Power infrastructure sync (EIA plants, HIFLD substations +
    # transmission, EIA gas pipelines): 04:30 UTC.
    # ★ This is the slot dchub-scheduler.py's JOBS dict has declared since
    # 2026-05-20 and never fired — nothing invokes that file, so the feeds last
    # ran 2026-03-30. Moved onto THIS dispatcher because it demonstrably runs
    # (hourly, succeeding). :30 deliberately, so it cannot collide with the
    # HOUR:00 case-match the step below uses for every other job.
    - cron: '30 4 * * *'

    # ── Nightly ───────────────────────────────────────────────────────
    # Backup (Neon → R2): 02:00 UTC
    - cron: '0 2 * * *'

    # ── Weekly ────────────────────────────────────────────────────────
    # Gas infra refresh (pipelines/compressors/processings) + site-score
    # percentile baseline (rank_sites "better than X%" reference, ~40 internal
    # site-score calls): Sunday 06:30 UTC. Both were dispatcher-less orphans
    # (#1768/#1770 follow-ups, 2026-07-26).
    - cron: '30 6 * * 0'

  workflow_dispatch:
    inputs:
      job:
        description: 'Specific job to run (leave empty for scheduled dispatch)'
        required: false
        type: choice
        options:
          - ''
          - discovery
          - auto-approve
          - outreach
          - promotion
          - evolution
          - market-report
          - infrastructure-sync
          - capacity-headroom
          - ambassador
          - backup
          - simple-alerts
          - keep-alive

env:
  BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
  ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}

jobs:
  trigger-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Determine which jobs to run
        id: schedule
        run: |
          # Manual dispatch with specific job
          if [ -n "${{ inputs.job }}" ]; then
            echo "jobs=${{ inputs.job }}" >> $GITHUB_OUTPUT
            echo "🔧 Manual trigger: ${{ inputs.job }}"
            exit 0
          fi

          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          echo "⏰ Current UTC: ${HOUR}:${MINUTE}"

          JOBS=""

          # ★ The :30 land-power slot is matched BEFORE the HOUR:00 map below,
          # which only ever compares "${HOUR}:00" and therefore cannot express a
          # half-hour job. Checked explicitly rather than by widening that map.
          if [ "${HOUR}:${MINUTE}" = "04:30" ] || [ "${MINUTE}" = "30" -a "${HOUR}" = "04" ]; then
            echo "jobs=land-power-sync" >> $GITHUB_OUTPUT
            echo "🗺️  Land+Power sync slot (04:30 UTC) — per-source, synchronous"
            exit 0
          fi

          case "${HOUR}:00" in
            "01:00") JOBS="infrastructure-sync" ;;
            "02:00") JOBS="backup" ;;
            "03:00") JOBS="discovery,auto-approve,db-health-snapshot" ;;
            "04:00") JOBS="capacity-headroom" ;;
            "05:00") JOBS="simple-alerts" ;;
            "07:00") JOBS="outreach" ;;
            "09:00") JOBS="discovery,auto-approve,db-health-snapshot" ;;
            "10:00") JOBS="capacity-headroom" ;;
            "11:00") JOBS="simple-alerts" ;;
            # ai-wars rides the single-fire 13:05 slot — a dedicated 06:00 cron
            # would double-fire on Sundays via the 06:30 run's HOUR:00 match
            # (same quirk the 20:00 ambassador comment documents). Daily tick:
            # drains stuck battles + one fresh auto-battle (#1770 follow-up).
            "13:00") JOBS="promotion,ai-wars" ;;
            "15:00") JOBS="discovery,auto-approve,db-health-snapshot" ;;
            "16:00") JOBS="capacity-headroom" ;;
            "17:00") JOBS="simple-alerts" ;;
            "19:00") JOBS="outreach" ;;
            "20:00") JOBS="ambassador" ;; # 20:30 cron rounds to 20:00 check
            "21:00") JOBS="discovery,auto-approve,db-health-snapshot" ;;
            "22:00") JOBS="capacity-headroom" ;;
            "23:00") JOBS="simple-alerts" ;;
          esac

          # Half-hour jobs
          case "${HOUR}:${MINUTE}" in
            "06:30"|"06:3"*) JOBS="${JOBS:+$JOBS,}gas-refresh,site-baseline" ;;
            "08:30"|"08:3"*) JOBS="${JOBS:+$JOBS,}ambassador" ;;
            "12:30"|"12:3"*) JOBS="${JOBS:+$JOBS,}evolution" ;;
            "14:30"|"14:3"*) JOBS="${JOBS:+$JOBS,}market-report" ;;
            "20:30"|"20:3"*) JOBS="${JOBS:+$JOBS,}ambassador" ;;
          esac

          if [ -z "$JOBS" ]; then
            echo "⏭️ No jobs scheduled for ${HOUR}:${MINUTE} UTC"
            JOBS="keep-alive"
          fi

          echo "jobs=$JOBS" >> $GITHUB_OUTPUT
          echo "📋 Jobs to run: $JOBS"

      # ★ Land+Power runs ONE SOURCE PER CALL, synchronously. The web service
      # redeploys ~every 5 minutes (12 in 63 minutes, measured 2026-07-31), so a
      # spawned background crawl is killed before it commits — that is why this
      # feed produced nothing for four months. Each source finishes in well under
      # the 300s budget; a killed one just retries next cycle and /status shows
      # it stale meanwhile. Sources run in their own step so one failure does not
      # mask the others, and the response carries the REAL row counts.
      - name: Land+Power sync (per-source)
        if: steps.schedule.outputs.jobs == 'land-power-sync'
        run: |
          FAILED=0
          for SRC in eia-860-plants hifld-substations hifld-transmission eia-ng-pipelines; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗺️  $SRC"
            CODE=$(curl -s -o /tmp/lp.json -w "%{http_code}" -X POST \
              -H "X-API-Key: ${ADMIN_KEY}" --max-time 300 \
              "${BACKEND_URL}/api/jobs/land-power-sync?source=${SRC}")
            echo "HTTP ${CODE}"
            cat /tmp/lp.json 2>/dev/null | python3 -m json.tool 2>/dev/null || cat /tmp/lp.json
            [ "$CODE" = "200" ] || FAILED=$((FAILED + 1))
            sleep 5
          done
          echo ""
          echo "🩺 verdict:"
          curl -s --max-time 60 "${BACKEND_URL}/api/land-power/status" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('status:', d.get('status')); [print(' ', s['source'], s['verdict'], s['last_success_age_days']) for s in d.get('latest_syncs',[])]" || true
          # Non-fatal: a source killed by a deploy is expected and retries next
          # cycle. /status is the authority on whether the data is stale.
          echo "sources failing this run: ${FAILED}"

      - name: Run scheduled jobs
        # land-power-sync has its own per-source step above
        if: steps.schedule.outputs.jobs != 'land-power-sync'
        run: |
          JOBS="${{ steps.schedule.outputs.jobs }}"
          IFS=',' read -ra JOB_ARRAY <<< "$JOBS"

          FAILED=0
          for JOB in "${JOB_ARRAY[@]}"; do
            JOB=$(echo "$JOB" | xargs)  # trim whitespace
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Triggering: $JOB"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              -X POST \
              -H "X-API-Key: ${ADMIN_KEY}" \
              -H "Content-Type: application/json" \
              --max-time 300 \
              "${BACKEND_URL}/api/jobs/${JOB}")

            echo "HTTP Status: ${HTTP_CODE}"
            cat /tmp/response.json 2>/dev/null | python3 -m json.tool 2>/dev/null || cat /tmp/response.json 2>/dev/null
            echo ""

            if [ "$HTTP_CODE" -ge 500 ]; then
              echo "❌ FAILED: $JOB (HTTP $HTTP_CODE)"
              FAILED=$((FAILED + 1))
            elif [ "$HTTP_CODE" -ge 400 ]; then
              echo "⚠️ CLIENT ERROR: $JOB (HTTP $HTTP_CODE)"
            else
              echo "✅ SUCCESS: $JOB"
            fi

            # Stagger between jobs to avoid overloading
            sleep 5
          done

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ $FAILED job(s) failed with 5xx errors"
            exit 1
          fi

      - name: Notify on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R azmartone67/dchub-backend \
            --title "[workflow-failed] ${{ github.workflow }} on $(date -u +%Y-%m-%d_%H:%M)" \
            --body "Workflow run ${{ github.run_id }} failed. View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label workflow-failure || true
