name: MCP Tool-Tuner Re-seed (keep per-platform descriptions fresh)

# 2026-06-20 — the MISSING trigger for the tool_quality / train actuator.
#
# The per-platform tool-description tuner (routes/ai_platform_tool_tuner.py)
# is CONSUMED live by the MCP server (server.mjs reads /api/v1/mcp/
# tool-descriptions every 30 min and substitutes per-platform copy), but the
# GENERATOR was only ever seeded ONCE manually (2026-06-07) — there was no
# cron, so the variants froze for weeks. This workflow re-seeds weekly so the
# "tool_quality optimization" the dashboard advertises actually executes on a
# cadence instead of sitting in cosmetic shadow.
#
# Endpoint: POST /api/v1/admin/mcp/tool-tuner/seed?force=1  (X-Admin-Key)
#   - idempotent + bounded (TUNED_TOOLS × TUNED_PLATFORMS; 132 cells at
#     11 tools × 12 platforms as of 2026-09-06 — NOT the 50 this line
#     claimed, which was the top-10 × top-5 shape retired in July)
#   - force=1 regenerates so descriptions stay current as tools/positioning change
#   - no-ops cleanly if AI_AGENT_EXPANSION_DISABLE=1 or the key is unset

on:
  schedule:
    - cron: '23 14 * * 1'   # Mondays 14:23 UTC — distinct minute (cron-collision guard)
  workflow_dispatch:        # manual trigger from the Actions tab
    inputs:
      force:
        description: >-
          1 = REGENERATE every cell (rewrites copy that is currently working).
          0 = fill-only: write just the cells that do not exist yet.
        required: false
        default: '0'
        type: choice
        options: ['0', '1']

permissions:
  contents: read

env:
  RAILWAY_BASE: https://dchub-backend-production.up.railway.app

jobs:
  reseed:
    runs-on: ubuntu-latest
    # 2026-07-04: the seed makes up to 50 sequential Claude calls and now that it
    # actually WORKS it takes ~4 min end-to-end (before the model fix it "failed
    # fast" on 404s and returned in seconds). Give the job enough headroom so a
    # healthy-but-slow seed isn't killed mid-run.
    timeout-minutes: 8
    steps:
      - name: Re-seed per-platform tool descriptions
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          # The weekly cron keeps its original force=1 regeneration. Only a manual
          # dispatch can ask for fill-only, and that is what it defaults to.
          FORCE: ${{ github.event_name == 'schedule' && '1' || inputs.force || '0' }}
        run: |
          set -euo pipefail
          echo "::notice::force=$FORCE (event=${{ github.event_name }})"
          if [ -z "$ADMIN_KEY" ]; then
            echo "::warning::DCHUB_ADMIN_KEY not set — skipping tuner re-seed"
            exit 0
          fi
          # --max-time 420: the working seed takes ~4 min (50 sequential Claude
          # calls). The old 180s ceiling fired a FALSE curl_fail RED while the
          # seed completed fine server-side. 420s covers it with margin yet still
          # reds out a genuinely stuck seed (well under the 8-min job cap).
          response=$(curl -sS --max-time 420 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            "$RAILWAY_BASE/api/v1/admin/mcp/tool-tuner/seed?force=$FORCE" \
            || echo '{"ok":false,"error":"curl_fail"}')
          echo "$response" | head -c 4000 || true
          echo
          echo "$response" | FORCE="$FORCE" python3 -c "
          import json, os, sys
          force = os.environ.get('FORCE', '1')
          # 2026-07-04 FIX: the seed endpoint returns INTEGER counts
          # (written/skipped/failed). The old parser did len(d.get('written')),
          # which raised TypeError on an int and — because the bare except only
          # printed a ::warning:: and never exited non-zero — the step stayed
          # GREEN while the tuner was failing 100%. Parse ints and FAIL RED on an
          # unhealthy run or a parse failure.
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print(f'::error::tuner re-seed: could not parse response: {e}')
              sys.exit(1)
          def _n(v):
              if isinstance(v, bool):
                  return 0
              if isinstance(v, (int, float)):
                  return int(v)
              if isinstance(v, (list, dict)):
                  return len(v)
              try:
                  return int(str(v).strip())
              except Exception:
                  return 0
          w, s, f = _n(d.get('written')), _n(d.get('skipped')), _n(d.get('failed'))
          ok = bool(d.get('ok', False))
          print(f'::notice::tool-tuner re-seed: written={w} skipped={s} failed={f} ok={ok}')
          # Kill-switch on (AI_AGENT_EXPANSION_DISABLE=1) — intentional no-op, green.
          if d.get('skipped') is True:
              print('::warning::tuner re-seed skipped (AI_AGENT_EXPANSION_DISABLE=1)')
              sys.exit(0)
          # Fail RED: endpoint said not-ok, or produced no writes despite failures.
          if (not ok) or (w == 0 and f > 0):
              print(f'::error::tuner re-seed UNHEALTHY: {str(d)[:300]}')
              sys.exit(1)
          # ★ A FILL-ONLY RUN THAT WROTE NOTHING IS NOT SUCCESS. The endpoint
          # skips cells that already exist, so if the running build does not yet
          # carry a newly-added tool, every cell is 'already_exists' and the run
          # returns a healthy 200 with written=0 — a silent no-op that looks
          # exactly like a good outcome. Fill-only is REQUESTED because there is
          # something new to fill; zero writes means it was not there.
          if force == '0' and w == 0:
              print('::error::fill-only re-seed wrote 0 cells '
                    f'(skipped={s}). The deployed build is missing the tool, '
                    'or every cell already exists and no fill was needed.')
              sys.exit(1)
          print('::notice::tuner re-seed healthy')
          "
