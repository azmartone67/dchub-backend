name: ISO interconnection-queue ingest (daily — aggregate GW + per-project, 7 ISOs)

# r70 (2026-06-03): the iso_queue_ingest parsers (ERCOT/PJM/NYISO/MISO/CAISO/SPP)
# had NO scheduled trigger — so the /interconnection-queue/snapshot sat stale
# (as_of 2026-03-31) and the 4 new real parsers never produced live data. This
# daily cron runs the ingest so the queue snapshot stays fresh across all 6 ISOs.
#
# Railway-origin-direct: the ingest runs 6 synchronous source fetches + parses
# (ERCOT PDF / PJM,NYISO,CAISO XLSX / MISO JSON / SPP CSV) and exceeds CF's ~15s
# edge timeout. The endpoint is open (public-data ingest) + idempotent (_upsert
# touches, never inserts NULL rows), so no key is needed.

on:
  schedule:
    - cron: '50 5 * * *'   # daily 05:50 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RAILWAY_BASE: https://dchub-backend-production.up.railway.app

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (for the per-project runner-fallback loader)
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ISO-queue AGGREGATE ingest (iso_queue_snapshots — GW totals)
        run: |
          set -euo pipefail
          resp=$(curl -sS --max-time 240 -X POST "$RAILWAY_BASE/api/v1/iso-queue/ingest" || echo '{"error":"curl_fail"}')
          echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print('fetched', d.get('isos_fetched'), 'of', d.get('isos_total'), '| with_data', d.get('isos_with_new_data'), '| as_of', d.get('as_of'))" 2>/dev/null || { echo "$resp" | head -c 600; }
      - name: Run per-PROJECT interconnect_queue ingest (named projects)
        run: |
          set -uo pipefail
          # r-queue-projects-cron (2026-06-20): refresh the per-PROJECT interconnect_queue
          # table (5,300+ named ISO queue projects) on the SAME daily schedule as the
          # aggregate step above. Per-ISO so each request stays short for the single
          # backend replica; the /ingest-projects route self-fetches on Railway (all 7
          # ISO feeds verified reachable from Railway egress 2026-06-20). Any ISO that
          # fails on Railway egress is re-fetched on THIS runner (open egress, no DB)
          # via load_interconnect_queue_live.py --emit-json and POSTed back for upsert.
          fail=""
          inserted=0
          for iso in NYISO CAISO MISO PJM SPP ERCOT ISO-NE; do
            resp=$(curl -sS --max-time 200 -X POST "$RAILWAY_BASE/api/v1/iso-queue/ingest-projects/$iso" || echo '{}')
            status=$(echo "$resp" | python3 -c "import sys,json;print((json.load(sys.stdin).get('by_iso') or {}).get('$iso',{}).get('status','no_status'))" 2>/dev/null || echo parse_fail)
            rows=$(echo "$resp" | python3 -c "import sys,json;print((json.load(sys.stdin).get('by_iso') or {}).get('$iso',{}).get('rows',''))" 2>/dev/null || echo '')
            ev=$(echo "$resp" | python3 -c "import sys,json;d=(json.load(sys.stdin).get('by_iso') or {}).get('$iso',{}).get('delta') or {};print(d.get('events_written','-'), d.get('parse_ok','-'), sep='/')" 2>/dev/null || echo '-/-')
            echo "$iso -> $status rows=$rows delta(events/parse_ok)=$ev"
            [ "$status" = "ok" ] || fail="$fail $iso"
            # accumulate the per-ISO upserted-row count (blank/non-numeric -> skip) so
            # the deadman beat below can report a real per-run rows_inserted, not null.
            case "$rows" in ''|*[!0-9]*) : ;; *) inserted=$((inserted + rows)) ;; esac
          done
          if [ -n "$fail" ]; then
            echo "Railway egress failed for:$fail — runner fetch+POST fallback"
            python3 -m pip install --quiet openpyxl lxml || true
            for iso in $fail; do
              python3 load_interconnect_queue_live.py --emit-json "$iso" > /tmp/all.json 2>/tmp/err.txt || { echo "  $iso runner parse failed"; head -c 300 /tmp/err.txt; continue; }
              python3 -c "import json;d=json.load(open('/tmp/all.json'));r=d.get('$iso');open('/tmp/post.json','w').write(json.dumps({'iso':'$iso','rows':r if isinstance(r,list) else []}))"
              code=$(curl -sS --max-time 120 -o /tmp/resp.json -w '%{http_code}' -X POST "$RAILWAY_BASE/api/v1/iso-queue/ingest-projects" -H 'Content-Type: application/json' --data @/tmp/post.json || echo 000)
              echo "  $iso runner-POST -> http $code: $(head -c 200 /tmp/resp.json)"
            done
          fi
          echo "=== final interconnect_queue count ==="
          curl -sS --max-time 30 -X POST "$RAILWAY_BASE/api/v1/iso-queue/ingest-projects/ISO-NE" | python3 -c "import sys,json;d=json.load(sys.stdin);print('total =',d.get('interconnect_queue_total'),'| by_iso =',d.get('interconnect_queue_by_iso'))" 2>/dev/null || true
          # hand the real per-run inserted-row count to the deadman-beat step below
          echo "INSERTED_ROWS=$inserted" >> "$GITHUB_ENV"
          echo "captured INSERTED_ROWS=$inserted for deadman beat"
      - name: beat deadman board (fail-open — report real rows_inserted)
        continue-on-error: true
        run: |
          # Fail-open heartbeat: POST the real per-run inserted-row count to the deadman
          # board so this feed stops showing rows_inserted=null. A beat failure must NEVER
          # fail the ingestion job (continue-on-error + trailing '|| true'). feed name must
          # match the board exactly. No cadence_hours/max_content_date — watch.py stays the
          # cadence authority and the endpoint COALESCEs those fields.
          curl -s -X POST "https://dchub.cloud/api/v1/admin/ingest-runs/beat" \
            -H "X-Admin-Key: ${{ secrets.DCHUB_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: dchub-ingest-beat/1.0" \
            -d "{\"feed\":\"iso-queue-ingest\",\"status\":\"success\",\"rows_inserted\":${INSERTED_ROWS:-0}}" || true
