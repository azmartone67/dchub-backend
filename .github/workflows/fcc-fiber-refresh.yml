# Weekly FCC BDC provider-fiber refresh (auto, owner-approved 2026-06-13).
#
# The provider-fiber map layer is backed by Neon table fcc_fiber_hex,
# loaded from the FCC Broadband Data Collection. The FCC republishes the
# availability set ~twice a year (June-30 + Dec-31 vintages, released ~5
# months later). This job checks weekly and, when a NEW vintage appears,
# loads every state — so the map stays current with zero manual work.
#
# ★ The download + parse runs HERE on the GitHub runner, not on Railway:
# Railway's egress to the FCC drops large downloads intermittently (TX/CA
# fail). The runner (reliable egress) downloads each state, aggregates it,
# and POSTs a small gzipped result to /api/v1/admin/fcc-fiber/ingest, which
# writes it to Neon. tools/fcc_fiber_fetch.py holds the logic.
#
# Cheap by design: most weeks /status reports needs_refresh=false and the
# script exits in seconds. The full ~52-state load runs only the 1-2 weeks
# a year FCC drops new data. Self-healing: only states still missing at the
# target vintage are loaded, so a partial run finishes next week.
name: fcc-fiber-refresh-weekly

on:
  schedule:
    - cron: '26 8 * * 3'   # Wednesdays 08:23 UTC (off-peak, clear of other crons)
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Reload ALL 52 states even if status says current'
        type: boolean
        default: false
      states:
        description: 'Specific state FIPS to load (space-separated, e.g. "48 06"); blank = auto'
        type: string
        default: ''

concurrency:
  group: fcc-fiber-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
      FCC_BDC_USERNAME: ${{ secrets.FCC_BDC_USERNAME }}
      FCC_BDC_TOKEN: ${{ secrets.FCC_BDC_TOKEN }}
      DCHUB_ORIGIN: https://dchub-backend-production.up.railway.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh FCC provider fiber
        run: |
          set -uo pipefail
          # ★ 2026-09-02: see gas-pipeline-ingest.yml (2026-08-08, SH52-120).
          # This lane is idle by design most weeks (FCC republishes ~2x/year and
          # the script exits early when already current), which makes a missing
          # secret indistinguishable from a normal quiet run — the one lane where
          # a silent green is hardest to notice.
          if [ -z "${DCHUB_ADMIN_KEY:-}" ] || [ -z "${FCC_BDC_USERNAME:-}" ] || [ -z "${FCC_BDC_TOKEN:-}" ]; then
            echo "::error::missing DCHUB_ADMIN_KEY / FCC_BDC_USERNAME / FCC_BDC_TOKEN — FCC fiber refresh cannot run; failing loudly instead of a silent green no-op"
            exit 1
          fi
          ARGS=""
          if [ "${{ github.event.inputs.force_all }}" = "true" ]; then ARGS="--force-all"; fi
          if [ -n "${{ github.event.inputs.states }}" ]; then ARGS="${{ github.event.inputs.states }}"; fi
          echo "running: python tools/fcc_fiber_fetch.py ${ARGS}"
          python tools/fcc_fiber_fetch.py ${ARGS}
