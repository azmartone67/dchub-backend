name: neon-ephemeral-db

# ADVISORY, DELIBERATELY. Nothing here is a required check yet.
#
# `db-parity` (pre-merge.yml) is REQUIRED on main and runs 19 SQL lanes against
# a postgres:16 service container. This workflow runs the SAME 19 lanes against
# a schema-only Neon branch — prod's schema and extensions, zero rows — so the
# two can be compared on real PRs before anything is cut over. Repointing a
# required check at a mechanism that has never run is how you take main's merge
# path down; the container stays until this lane has a track record.
#
# ★ ROOT-BRANCH CAP IS THE BINDING CONSTRAINT, not cost.
#   `init_source: schema-only` produces an independent ROOT branch, and roots
#   are capped per project (3 Free / 5 Launch / 25 Scale). So this workflow
#   creates ONE branch per job, never one per matrix leg — a 19-way matrix
#   would exhaust the cap from a single PR and every later PR would fail to get
#   a database. Three defences, because one is not enough when the symptom
#   surfaces hours after the cause:
#     1. `destroy` under `if: always()`      — the normal path
#     2. `expires_at` set at creation        — survives a killed runner
#     3. the scheduled `sweep` job below     — catches whatever still leaks
#
# ★ PUBLIC REPO. Branches carry SCHEMA ONLY — never prod rows. Fork PRs get no
#   secrets from GitHub, so the jobs below skip on forks rather than failing;
#   `pull_request_target` would hand fork-authored code a live branch and is
#   never the fix for that.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'      # sweeper
    - cron: '41 6 * * *'        # daily full-suite measurement (phase 3)
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Run the phase-3 full-suite measurement'
        type: boolean
        default: false

concurrency:
  # Same shape as pre-merge: main pushes never share a group (a cancelled
  # PENDING run would skip cleanup), PR pushes supersede their predecessor.
  group: neon-db-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── PHASES 1 + 2 — one branch, both workloads ────────────────────────────
  # Folded into a single job ON PURPOSE: they want the identical thing (a
  # stamped schema-only branch), and two jobs would mean two root branches per
  # PR against a cap of 25.
  ephemeral-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Two gates, both at JOB level so a non-run shows as "skipped" in the UI
    # rather than as a green job that quietly did nothing:
    #   * vars.NEON_CI_ENABLED — the on switch. Repository VARIABLES are usable
    #     in a job-level `if:`; secrets are not, which is the whole reason the
    #     usual "check the secret inside a step and exit 0" idiom exists. That
    #     idiom is a green no-op, tests/test_asset_ingest_secret_guards_are_loud
    #     .py ratchets against it, and it would be actively harmful HERE: this
    #     lane's purpose is to build a track record before it is promoted to a
    #     required check, and a silently-skipping job builds a FAKE one.
    #   * fork PRs get no secrets from GitHub, so they are excluded explicitly.
    # With the switch on and a secret missing or rotated away, the job goes RED.
    # That is the intended behaviour — it is a real misconfiguration.
    if: >-
      vars.NEON_CI_ENABLED == '1' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip


      - name: Install deps
        # Mirrors db-parity's install so a lane that passes there and fails
        # here is a database difference, not a dependency difference.
        run: python3 -m pip install pytest flask psycopg2-binary "psycopg[binary]" requests

      - name: Create the ephemeral branch
        id: neon
        run: |
          python3 scripts/neon_ci_branch.py create \
            --name "ci-${{ github.run_id }}-${{ github.run_attempt }}-parity" \
            --ttl-hours 3

      - name: Stamp it as disposable
        env:
          NEON_CI_DSN: ${{ steps.neon.outputs.dsn }}
          NEON_CI_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: |
          python3 scripts/neon_ci_branch.py stamp \
            --dsn "$NEON_CI_DSN" --branch-id "$NEON_CI_BRANCH"

      - name: Point every lane at the branch
        # 18 env names, one database. They exist because the container could
        # not be prod-shaped and each lane had to bootstrap itself; this is the
        # step that becomes unnecessary once the names are collapsed.
        env:
          NEON_CI_DSN: ${{ steps.neon.outputs.dsn }}
        run: |
          DSN="$NEON_CI_DSN"
          for v in FIBER_PARITY_DSN CONTINUATION_SQL_DSN PAID_TIER_SQL_DSN \
                   TIER_GATES_SQL_DSN LIVE_PROOF_SQL_DSN PACK_EXPIRY_SQL_DSN \
                   HAD_PACK_SQL_DSN EIA_RETIREMENTS_SQL_DSN \
                   TRANSMISSION_READERS_SQL_DSN TOPUP_EXPIRY_SQL_DSN \
                   SERVED_SLUG_PARITY_DSN SEO_INDEXING_LOG_SQL_DSN \
                   ONE_URL_REPAIR_DSN RESOLVE_ARMS_SQL_DSN \
                   RELAYED_CHECKOUT_SQL_DSN PAID_ATTRIBUTED_SQL_DSN \
                   CONNECT_STATS_SQL_DSN CAPACITY_SOURCE_SQL_DSN \
                   DCHUB_PG_TEST_DSN; do
            echo "$v=$DSN" >> "$GITHUB_ENV"
          done
          # Every *_REQUIRE flag these lanes support. Only 3 of the 19 have
          # one; the other 16 skip silently if their DSN never arrives, which
          # is the green-no-op shape. Setting the 3 that exist is the most this
          # can do without touching the tests themselves.
          for r in FIBER_PARITY_REQUIRE SERVED_SLUG_PARITY_REQUIRE \
                   ONE_URL_REPAIR_REQUIRE; do
            echo "$r=1" >> "$GITHUB_ENV"
          done

      - name: What did the branch actually come with?
        # `public.fiber_routes is missing` on the first green run, while 229
        # other tests passed against the same branch. That is not a connection
        # problem, so it is worth knowing exactly what schema-only copied
        # before drawing any conclusion about the lane that failed.
        # Names and counts only — no credentials.
        env:
          NEON_CI_DSN: ${{ steps.neon.outputs.dsn }}
        run: |
          python3 - <<'PY'
          import os, psycopg2
          c = psycopg2.connect(os.environ["NEON_CI_DSN"]); c.autocommit = True
          with c.cursor() as cur:
              cur.execute("SELECT current_database(), current_user")
              db, user = cur.fetchone()
              cur.execute("SELECT count(*) FROM pg_tables "
                          "WHERE schemaname NOT IN ('pg_catalog','information_schema')")
              tables = cur.fetchone()[0]
              cur.execute("SELECT count(*) FROM pg_views "
                          "WHERE schemaname NOT IN ('pg_catalog','information_schema')")
              views = cur.fetchone()[0]
              cur.execute("SELECT count(*) FROM pg_matviews")
              matviews = cur.fetchone()[0]
              cur.execute("SELECT extname FROM pg_extension ORDER BY 1")
              exts = ", ".join(r[0] for r in cur.fetchall())
              cur.execute("SELECT to_regclass('public.fiber_routes')")
              fiber = cur.fetchone()[0]
          print(f"database={db} role={user}")
          print(f"tables={tables} views={views} matviews={matviews}")
          print(f"extensions={exts}")
          print(f"public.fiber_routes -> {fiber}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### Branch contents\n- database `{db}`, role `{user}`\n"
                       f"- {tables} tables, {views} views, {matviews} matviews\n"
                       f"- extensions: {exts}\n"
                       f"- `public.fiber_routes`: {fiber}\n")
          PY

      - name: Guard mutation — prove the sentinel can refuse
        # Runs FIRST and un-stamps/restores the branch. If the guard cannot
        # refuse, every "safe to DROP tables" claim below is decoration.
        run: python3 -m pytest tests/test_ephemeral_db_guard.py -v --tb=short

      - name: Phase 1 — the two opt-in files that have never run in CI
        run: |
          python3 -m pytest \
            tests/test_enterprise_contact_request_level.py \
            tests/test_enterprise_inquiries_heal_on_postgres.py \
            -v --tb=short -rs

      - name: Prove phase 1 did not silently skip
        # The same anti-skip belt db-parity uses. A DSN that fails to reach the
        # tests turns this job green while proving nothing — the exact shape
        # this repo keeps rediscovering.
        run: |
          set -o pipefail
          python3 -m pytest \
            tests/test_enterprise_contact_request_level.py \
            tests/test_enterprise_inquiries_heal_on_postgres.py \
            -q -rs --tb=no > out.txt 2>&1 || { cat out.txt; exit 1; }
          cat out.txt
          if grep -qiE "^SKIPPED|skipped" out.txt; then
            echo "::error::a phase-1 test SKIPPED — the branch never reached it"
            exit 1
          fi

      - name: Phase 2 — the 19 db-parity lanes against a prod-shaped branch
        # ADVISORY: `|| true` on purpose. These lanes have only ever seen an
        # empty postgres:16; the whole point of this run is to LEARN which of
        # them depend on that emptiness. Failures are the output, not an
        # outage. This is also what must be removed to promote the lane.
        run: |
          set -o pipefail
          python3 -m pytest \
            tests/test_fiber_provider_backfill.py \
            tests/test_continuation_compliance_sql.py \
            tests/test_paid_tier_verification_sql.py \
            tests/test_tier_grant_gates_sql.py \
            tests/test_live_proof_platform_basis_sql.py \
            tests/test_pack_credits_never_expire_sql.py \
            tests/test_key_hash_format_sql.py \
            tests/test_had_pack_reads_every_pack_source_sql.py \
            tests/test_eia_retirements_refresh_sql.py \
            tests/test_transmission_readers_sql.py \
            tests/test_topup_paid_credits_never_expire_sql.py \
            tests/test_served_slugs_sql_parity.py \
            tests/test_seo_indexing_log_write_sql.py \
            tests/test_one_url_many_rows_repair_sql.py \
            tests/test_radar_resolve_arms_sql.py \
            tests/test_human_acted_relayed_checkout_sql.py \
            tests/test_paid_attributed_relayed_checkout_sql.py \
            tests/test_connect_keys_used_day2_sql.py \
            tests/test_capacity_source_search_sql.py \
            -v --tb=short -rs 2>&1 | tee parity.log || true
          echo "### Phase 2 — 19 lanes on a Neon branch" >> "$GITHUB_STEP_SUMMARY"
          tail -1 parity.log >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy the branch
        if: always() && steps.neon.outputs.branch_id != ''
        env:
          NEON_CI_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: |
          python3 scripts/neon_ci_branch.py destroy --branch-id "$NEON_CI_BRANCH"

  # ── PHASE 3 — measure what DATABASE_URL does to the wider suite ──────────
  # NOT on every PR. It costs a second root branch and answers a question that
  # changes slowly, so it runs daily and on demand.
  #
  # pre-merge.yml says "58 test files gate on that name; setting it there would
  # wake all of them against an empty database and take a REQUIRED check down."
  # The current count is 154 files REFERENCING DATABASE_URL and exactly 1 using
  # a skipif on it, so that comment is stale and its conclusion is unmeasured.
  # This job measures it instead of arguing with it.
  full-suite-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: vars.NEON_CI_ENABLED == '1' && (github.event_name == 'schedule' || inputs.run_full_suite)
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install deps
        run: python3 -m pip install pytest requests flask pyyaml psycopg2-binary "psycopg[binary]" "Unidecode==1.3.8" "Pillow>=10.0.0" "feedparser==6.0.12" protego "PyJWT==2.12.0"
      - name: Create the ephemeral branch
        id: neon
        run: |
          python3 scripts/neon_ci_branch.py create \
            --name "ci-${{ github.run_id }}-${{ github.run_attempt }}-fullsuite" \
            --ttl-hours 3
      - name: Stamp it
        env:
          NEON_CI_DSN: ${{ steps.neon.outputs.dsn }}
          NEON_CI_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: |
          python3 scripts/neon_ci_branch.py stamp \
            --dsn "$NEON_CI_DSN" --branch-id "$NEON_CI_BRANCH"
      - name: Baseline — the suite with NO database, same commit
        # ★ The comparison is worthless without this side. A with-DB pass/fail
        #   count means nothing on its own: this repo's suite already has
        #   pre-existing failures, so the only honest signal is the DIFF in
        #   failing test NAMES between the two runs at the same SHA.
        run: |
          set -o pipefail
          python3 -m pytest tests/ -q --tb=no -rf 2>&1 | tee base.log || true
          grep -E "^FAILED" base.log | awk '{print $2}' | sort > base.failures || true
          wc -l < base.failures
      - name: Measured — the same suite with DATABASE_URL on the branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.dsn }}
        run: |
          set -o pipefail
          python3 -m pytest tests/ -q --tb=no -rf 2>&1 | tee with.log || true
          grep -E "^FAILED" with.log | awk '{print $2}' | sort > with.failures || true
          {
            echo "### Phase 3 — what DATABASE_URL wakes up"
            echo '```'
            echo "no-DB baseline failures : $(wc -l < base.failures)"
            echo "with-branch failures    : $(wc -l < with.failures)"
            echo
            echo "NEWLY failing with a database (these are the blockers):"
            comm -13 base.failures with.failures || true
            echo
            echo "FIXED by having a database:"
            comm -23 base.failures with.failures || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy the branch
        if: always() && steps.neon.outputs.branch_id != ''
        env:
          NEON_CI_BRANCH: ${{ steps.neon.outputs.branch_id }}
        run: |
          python3 scripts/neon_ci_branch.py destroy --branch-id "$NEON_CI_BRANCH"

  # ── Leaked-branch sweeper ────────────────────────────────────────────────
  sweep:
    runs-on: ubuntu-latest
    if: vars.NEON_CI_ENABLED == '1' && github.event_name == 'schedule'
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - name: Install deps
        # neon_ci_branch.py imports requests at module scope, so the sweep job
        # needs it too — it is the only job here that runs no tests.
        run: python3 -m pip install requests
      - name: Sweep ci-* branches older than 6h
        run: python3 scripts/neon_ci_branch.py sweep --prefix ci- --ttl-hours 6
