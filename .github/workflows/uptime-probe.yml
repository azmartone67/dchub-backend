name: uptime-probe

# External outage detector. Runs OUTSIDE the backend (GitHub's runners) so it
# still fires when the backend is so dead it can't send its own alert — the one
# case the in-process health_alerter can't cover. Probes a DYNAMIC,
# backend-dependent endpoint (NOT the CF-cached homepage, which served 200 from
# cache during the 2026-06-19 outage while the origin was 502), retries to avoid
# flapping on a transient blip, and emails the admin on confirmed-down.
#
# Requires repo secrets: SENDGRID_API_KEY (or RESEND_API_KEY) + ALERT_EMAIL.
# Note: GitHub cron can be delayed several minutes under load — this is a
# backstop for total-down, not the primary fast path (that's health_alerter).

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub's floor)
  workflow_dispatch: {}      # manual run / test button

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe origin health (dynamic, backend-dependent) with retries
        id: probe
        run: |
          ORIGIN="https://dchub-backend-production.up.railway.app/healthz"
          EDGE="https://dchub.cloud/api/v1/engines/trend"   # dynamic, no-store — not the cached homepage
          ok=0
          for i in 1 2 3; do
            oc=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "$ORIGIN" || echo 000)
            ec=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "$EDGE" || echo 000)
            echo "attempt $i: origin=$oc edge=$ec"
            # healthy if the origin health endpoint is 200 (edge is secondary)
            if [ "$oc" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          echo "origin_last=$oc" >> "$GITHUB_OUTPUT"
          echo "edge_last=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ok" = "1" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "✅ backend healthy"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "❌ backend DOWN after 3 attempts (origin=$oc)"
          fi

      - name: Email on confirmed-down
        if: steps.probe.outputs.healthy == 'false'
        env:
          SG: ${{ secrets.SENDGRID_API_KEY }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
          TO: ${{ secrets.ALERT_EMAIL }}
          ORIGIN_CODE: ${{ steps.probe.outputs.origin_last }}
          EDGE_CODE: ${{ steps.probe.outputs.edge_last }}
        run: |
          TO="${TO:-azmartone@gmail.com}"
          SUBJECT="🚨 DC Hub is DOWN — backend origin not responding"
          BODY="External uptime probe could not reach the backend origin /healthz after 3 attempts (last HTTP ${ORIGIN_CODE}; edge dynamic path ${EDGE_CODE}). The site is likely returning 502/404. Check Railway (dchub-backend) deploy + logs; the in-app health_alerter may already have emailed if it was alive. This probe re-checks every 5 min."
          sent=0
          if [ -n "$SG" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.sendgrid.com/v3/mail/send" \
              -H "Authorization: Bearer $SG" -H "Content-Type: application/json" \
              -d "{\"personalizations\":[{\"to\":[{\"email\":\"$TO\"}]}],\"from\":{\"email\":\"alerts@dchub.cloud\",\"name\":\"DC Hub Uptime Probe\"},\"subject\":\"$SUBJECT\",\"content\":[{\"type\":\"text/plain\",\"value\":\"$BODY\"}]}")
            echo "SendGrid HTTP $code"; [ "$code" = "202" ] && sent=1
          fi
          if [ "$sent" = "0" ] && [ -n "$RESEND" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND" -H "Content-Type: application/json" -A "dchub-uptime-probe/1.0" \
              -d "{\"from\":\"DC Hub Uptime Probe <alerts@dchub.cloud>\",\"to\":[\"$TO\"],\"subject\":\"$SUBJECT\",\"text\":\"$BODY\"}")
            echo "Resend HTTP $code"; [ "$code" = "200" ] && sent=1
          fi
          if [ "$sent" = "0" ]; then echo "::warning::no email channel sent (check SENDGRID_API_KEY / RESEND_API_KEY secrets)"; fi
          # fail the run so it's visible in the Actions tab too
          exit 1
