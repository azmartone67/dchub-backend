# Phase ZZZZZ (2026-05-23): kill the recurring routing-footgun class.
#
# /pockets/<slug> 404'd today even though Flask had the handler, because
# the same path needed to be in BOTH dchub-frontend/_routes.json `include`
# AND dchub-frontend/_worker.js's PHASE_282 tables. Two pages today, four
# before that — same root cause every time.
#
# ★ 2026-09-05 — THIS IS NOW A RATCHET AND IT BLOCKS.
#
# It shipped advisory with a note saying "flip to required once warnings are
# clean for a week". They never got clean: it reported 385 of 496 routes (78%)
# as missing on every PR, so it was a constant-red non-signal nobody could act
# on and nobody could turn on. Two things were wrong with that number and both
# are fixed in this change:
#
#   1. The route extractor was a line regex that recorded the DECORATOR path,
#      not the SERVED path — it never resolved blueprint url_prefix. A route
#      declared @redeem_tracking_bp.route("/click") under
#      url_prefix="/api/v1/redeem" read as an uncovered HTML route "/click".
#      It also matched ".route(" inside strings and comments. Now an AST walk.
#   2. The worker-table parser used `\[([^\]]+)\]`, which stops at the first
#      `]` in the source — one that happens to sit inside a trailing comment
#      twelve lines into the array. It read 6 of 36 PHASE_282_PREFIXES, and
#      pulled multi-line comment blobs into the exact-path Set via apostrophes
#      in words like "didn't". /team, /upgrade, /markets and 23 more real
#      entries were invisible to it.
#
# The honest number is 130, not 385. Those 130 are enumerated in
# scripts/route_table_baseline.json and anything NEW fails the PR. Same shape
# as dchub-frontend/scripts/check-edge-caps.mjs and
# tests/test_canonical_counts_drift.py's KNOWN_STALE_COUNT_DEBT: shrink, never
# grow.
#
# All the logic lives in scripts/check_route_table_coherence.py rather than in
# heredocs here, so the ratchet can be RUN — and mutation-tested — locally:
#
#     python3 scripts/check_route_table_coherence.py flask-routes
#     python3 scripts/check_route_table_coherence.py route-tables
#     python3 scripts/check_route_table_coherence.py diff
#
# Lints, doesn't deploy — safe.
name: route-tables coherence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # ★2026-09-06 — schedule fallback. This lane used to run only on push to
    # main, and a push made with GITHUB_TOKEN creates NO workflow run. When
    # auto-enable-automerge armed merges with that token, 17 of 24 commits
    # landed without this ever running. The token is fixed; this is the
    # belt. A post-merge gate reachable only by `push` is one bot merge away
    # from silence, whatever the token happens to be today.
    - cron: '28 */6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    # ★ NO job-level continue-on-error any more. It was here because the
    # untuned check fired on every PR, including the brain's mechanical
    # autofixes, which never touch routes. With the baseline in place the job
    # only goes red when a PR ADDS mis-registration, so it is safe to block on.
    # The frontend-checkout step below keeps ITS OWN continue-on-error — that
    # one is deliberate and stays: "could not check" and "coherent" must not
    # collapse into the same green.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # ★ 2026-09-05 — READ THE ROUTING TABLES THAT ARE ACTUALLY DEPLOYED.
      # _routes.json and _worker.js belong to the dchub-frontend repo. Until
      # #3871 this job read them out of a vendored mirror committed into THIS
      # repo, last touched 2026-09-02. That mirror was not merely stale — its
      # _routes.json was a different GENERATION of the file (83 exact-path
      # includes and zero excludes, against the real 82 wildcard includes and 15
      # excludes, with almost no overlap). So the coherence check — whose entire
      # job is catching the /pockets 404 class — was diffing live Flask routes
      # against a fiction. A route added to the real _routes.json read as
      # missing; one removed from it read as present. Wrong in both directions,
      # quietly. ★ Every reading of this gate before 2026-09-05 is therefore
      # UNMEASURED, including the "385 of 496 missing" that kept it advisory.
      - name: Check out the canonical frontend (routing tables live there)
        id: frontend
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: azmartone67/dchub-frontend
          path: dchub-frontend
          token: ${{ secrets.DCHUB_FRONTEND_RO_TOKEN || github.token }}

      # ★ AND SAY SO WHEN THEY ARE NOT THERE. The checkout above is
      # continue-on-error. This comment used to add that the token "has been
      # failing since 2026-08-19" — I wrote that hours earlier by quoting
      # deploy-integrity.yml instead of measuring, and it was already false:
      # the secret was rotated 2026-09-02 and this job's own runs check the
      # frontend out successfully (33954259437 — steps 2 and 3 ran, and they
      # are gated on the tables being present). The gate below is still worth
      # having for the day it expires again. Without
      # this gate, absent tables mean an empty include set and every Flask route
      # reads as uncovered — or, under this ratchet, every route reads as
      # already-baselined and the job goes GREEN on no measurement at all. That
      # is the dangerous direction, so this step checks the checkout's OWN
      # OUTCOME as well as file presence: a leftover directory must never be
      # mistaken for a fresh clone. Steps 1-3 are skipped instead and the ledger
      # below records `unmeasured`, because neither verdict line ever prints.
      # Not-run is a state this board can already represent.
      - name: 0 — are the canonical routing tables present?
        id: tables
        env:
          CHECKOUT_OUTCOME: ${{ steps.frontend.outcome }}
        run: |
          if [ "$CHECKOUT_OUTCOME" = "success" ] \
             && [ -f dchub-frontend/_routes.json ] \
             && [ -f dchub-frontend/_worker.js ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "✅ canonical routing tables checked out"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Route-table coherence NOT checked::dchub-frontend was not checked out (checkout outcome: ${CHECKOUT_OUTCOME}; private repo — rotate DCHUB_FRONTEND_RO_TOKEN). Flask routes were NOT diffed against _routes.json / _worker.js this run. This is 'could not check', NOT 'coherent'."
          fi

      - name: 1 — extract Flask HTML routes
        if: steps.tables.outputs.available == 'true'
        # tee'd: this step — not step 3 — prints "discovered N Flask HTML
        # routes", which is the POPULATION the ledger beat reports. The first
        # version tee'd only step 3 and sent checked=empty, so G4 could never
        # fire for this gate. The live board is what surfaced that.
        env:
          ROUTE_COHERENCE_FRONTEND: dchub-frontend
        run: |
          set -o pipefail
          python3 scripts/check_route_table_coherence.py flask-routes 2>&1 | tee /tmp/crt1.log

      - name: 2 — extract _routes.json include + _worker.js PHASE_282 tables
        if: steps.tables.outputs.available == 'true'
        env:
          ROUTE_COHERENCE_FRONTEND: dchub-frontend
        run: python3 scripts/check_route_table_coherence.py route-tables

      - name: 3 — ratchet — fail on any NEW uncovered route
        if: steps.tables.outputs.available == 'true'
        # Piped through tee (not exec+process-substitution) so the log is fully
        # flushed when the step ends: the ledger beat reads it in the NEXT step.
        # pipefail keeps python's exit code, which is now what fails the job.
        env:
          ROUTE_COHERENCE_FRONTEND: dchub-frontend
        run: |
          set -o pipefail
          python3 scripts/check_route_table_coherence.py diff 2>&1 | tee /tmp/crt.log

      # ── Gate liveness ledger ─────────────────────────────────────────────
      # This job beats for ITSELF. Nothing beats on its behalf.
      # Values go through env, never inlined into run: — ${{ }} is raw TEXT.
      #
      # ★ The three strings grepped below are PRINTED BY
      # scripts/check_route_table_coherence.py. Change the wording there and
      # this records `unmeasured` forever, silently. Both files, one commit.
      # ★ THE MUST-FAIL CONTROL, RUN IN THE GATE ITSELF. gate_beat.sh's 4th
      # argument asks "did this gate's must-fail control run and pass?" and this
      # gate answered `absent` for its whole life, because it had none. It now
      # has one: tests/test_route_table_coherence.py mutates the extractor back
      # toward the two parsers that made it report 385-of-496 and asserts the
      # checker notices. Running it HERE — not only in the unit-test job — means
      # the answer on this gate's own board is measured rather than assumed.
      # ★ The control's OWN dependencies, installed here. The first run of this
      # step reported selftest=fail on a green gate — not because the control
      # failed but because the runner had no pytest ("No module named pytest").
      # "Could not run" and "ran and failed" are different states and
      # gate_beat.sh has a word for each; conflating them is the same class of
      # error as letting a missing checkout read as `coherent`.
      - name: Install the must-fail control's deps
        id: selftest_deps
        if: always()
        continue-on-error: true
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Must-fail control for this gate
        id: selftest
        if: always() && steps.selftest_deps.outcome == 'success'
        continue-on-error: true
        run: python3 -m pytest tests/test_route_table_coherence.py -q

      - name: Beat the gate liveness ledger
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
          SELFTEST_OUTCOME: ${{ steps.selftest.outcome }}
        run: |
          # Population comes from step 1's log, verdict from step 3's — they are
          # printed by different steps and there is no single file with both.
          N=$(grep -hoE 'discovered [0-9]+ Flask HTML routes' /tmp/crt1.log /tmp/crt.log 2>/dev/null \
              | grep -oE '[0-9]+' | head -1)
          # ★ The two strings are MUTUALLY EXCLUSIVE by construction: the
          # checker returns 1 immediately after printing ADVISORY, so the
          # 'covered by both tables' line is unreachable on a failing run, and
          # ADVISORY is printed ONLY for NEW entries — never for baselined
          # drift. Before the ratchet, ADVISORY printed on every run and this
          # branch would have recorded `fail` forever.
          if grep -q 'route-table coherence ADVISORY' /tmp/crt.log 2>/dev/null; then
            V=fail            # a PR added mis-registration — the gate did its job
          elif grep -q 'covered by both tables' /tmp/crt.log 2>/dev/null; then
            V=pass
          else
            V=unmeasured      # neither line printed: the step did not conclude
          fi
          # ★ The 4th argument is SELFTEST (pass|fail|absent), not blocking —
          # a closed vocabulary that routes/gate_runs.py enforces. Anything else
          # is not a value this board can represent.
          # ★ `absent` covers BOTH "skipped" and the empty string a step that
          # never ran emits — the deps step is gated, so an install failure
          # leaves this unset. Only a real pytest exit code maps to fail.
          case "$SELFTEST_OUTCOME" in
            success) ST=pass ;;
            failure) ST=fail ;;
            *)       ST=absent ;;   # skipped, or its deps never installed
          esac
          bash scripts/gate_beat.sh "check-route-tables:check" "$V" "$N" "$ST" \
            "ratchet on scripts/route_table_baseline.json — BLOCKING, so job.status is the PR verdict"
