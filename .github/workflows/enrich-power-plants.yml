name: Power-plant enrichment (EIA/NASA → discovered_power_plants)

# Manual trigger for the owner-approved EIA/NASA → discovered_power_plants write.
# Uses the DCHUB_ADMIN_KEY secret (the /trigger + /status endpoints are
# @require_admin_key). ALWAYS dry-run first (preview the real would-write count);
# set dry_run=false to actually write. Writes are tagged source='eia_nccs_enrichment'
# and are reversible: DELETE FROM discovered_power_plants WHERE source='eia_nccs_enrichment'.
# state_filter bounds the run (default VA = the #1 DC market) so the first real
# write is small + reversible; empty = all states.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = preview (no writes), false = WRITE'
        default: 'true'
      state_filter:
        description: 'optional 2-letter state (e.g. VA); empty = all states'
        default: 'VA'
      sources:
        description: 'comma-sep: nccs (light, NASA FeatureServer) and/or eia_860m (heavy Excel). Default nccs.'
        default: 'nccs'

permissions:
  contents: read

env:
  RAILWAY_BASE: https://dchub-backend-production.up.railway.app

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger + poll enrichment
        env:
          ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
          STATE: ${{ github.event.inputs.state_filter }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY:-}" ]; then echo "::warning::DCHUB_ADMIN_KEY not set — skipping"; exit 0; fi
          DRYVAL=$([ "$DRY" = "false" ] && echo false || echo true)
          # Build a JSON array from the comma-separated SOURCES input (default nccs).
          SRC="${SOURCES:-nccs}"
          SRC_JSON=$(printf '%s' "$SRC" | python3 -c "import sys;print('[' + ','.join('\"%s\"'%s.strip() for s in sys.stdin.read().split(',') if s.strip()) + ']')")
          BODY="{\"sources\":$SRC_JSON,\"dry_run\":$DRYVAL"
          if [ -n "${STATE:-}" ]; then BODY="$BODY,\"state_filter\":\"$STATE\""; fi
          BODY="$BODY}"
          FEED="$RAILWAY_BASE/api/v1/brain/notifications?limit=200"
          # The enrichment runs in a background thread and its /status is an
          # in-memory dict that is PER-GUNICORN-WORKER: the POST lands on worker
          # A, but /status GETs round-robin to B/C/D that never saw the job, so
          # /status reports "not found" forever and the old poll loop always
          # timed out (the long-standing "errors before completing" symptom —
          # the job actually completed fine on worker A). So we DON'T poll
          # /status. The job mirrors its outcome (success OR failure) into the
          # cross-worker-durable brain feed via log_notification(kind=
          # power_plant_enrichment); we poll THAT and detect a new record by
          # count (skew-proof — no clock comparison needed).
          before=$(curl -sS --max-time 30 "$FEED" | python3 -c "import sys,json;print(sum(1 for i in json.load(sys.stdin).get('items',[]) if i.get('kind')=='power_plant_enrichment'))" 2>/dev/null || echo 0)
          echo "power_plant_enrichment records before trigger: $before"
          echo "POST $RAILWAY_BASE/api/enrichment/trigger  body=$BODY"
          resp=$(curl -sS --max-time 60 -X POST -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$RAILWAY_BASE/api/enrichment/trigger")
          echo "trigger: $resp"
          job=$(printf '%s' "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('job_id',''))" 2>/dev/null || echo "")
          [ -z "$job" ] && { echo "::error::no job_id returned (trigger rejected? check DCHUB_ADMIN_KEY)"; exit 1; }
          echo "job=$job — polling the brain feed for the durable result (cross-worker)…"
          for i in $(seq 1 40); do
            sleep 12
            found=$(curl -sS --max-time 30 "$FEED" | BEFORE="$before" python3 -c "import sys,os,json;d=json.load(sys.stdin);items=[i for i in d.get('items',[]) if i.get('kind')=='power_plant_enrichment'];n=items[0] if len(items)>int(os.environ.get('BEFORE','0')) else None;print(json.dumps({'severity':n.get('severity'),'summary':n.get('summary'),'detail':n.get('detail')},indent=2) if n else '')" 2>/dev/null || echo "")
            if [ -n "$found" ]; then echo "=== ENRICHMENT RESULT (from brain feed) ==="; echo "$found"; exit 0; fi
            echo "[$i] no new power_plant_enrichment record yet…"
          done
          echo "::warning::timed out waiting for enrichment result in brain feed"
